<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қорытынды емтихан</title>
<meta name="description" content="Жалпы психология: қорытынды емтиханға дайындық — 30 билет, 90 сұрақ, жауап жоспарлары">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap">
<style>
:root{
  --page:#F4F3EF; --sheet:#FFFFFF; --ink:#1D1D1B; --ink-2:#55544F; --ink-3:#86847C; --rule:#DEDBD2; --tint:#ECEAE3;
  --acc:#2F5DA8; --acc-ink:#FFFFFF; --acc-tint:#E6EEFA;
  --e-bg:#E1F5EE; --e-bd:#1D9E75; --e-ink:#085041;
  --m-bg:#FAEEDA; --m-bd:#BA7517; --m-ink:#633806;
  --h-bg:#FAECE7; --h-bd:#D85A30; --h-ink:#712B13;
  --ok:#1F7A4C; --ok-tint:#E3F3EA; --bad:#B3261E; --bad-tint:#FBE7E5;
  --f-d:"Montserrat",Arial,system-ui,sans-serif; --f-u:"IBM Plex Sans","PT Sans",system-ui,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#161615; --sheet:#1F1F1D; --ink:#ECEAE3; --ink-2:#B9B7AE; --ink-3:#8C8A82; --rule:#34332F; --tint:#2A2A27;
  --acc:#8FB3F0; --acc-ink:#0E1A2E; --acc-tint:#1C2638;
  --e-bg:#0B3A30; --e-bd:#1D9E75; --e-ink:#BFEEDD; --m-bg:#45290A; --m-bd:#BA7517; --m-ink:#FBE0B0; --h-bg:#4F2212; --h-bd:#D85A30; --h-ink:#FBD5C6;
  --ok:#5FD39B; --ok-tint:#14301F; --bad:#FF8A80; --bad-tint:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#161615; --sheet:#1F1F1D; --ink:#ECEAE3; --ink-2:#B9B7AE; --ink-3:#8C8A82; --rule:#34332F; --tint:#2A2A27;
  --acc:#8FB3F0; --acc-ink:#0E1A2E; --acc-tint:#1C2638;
  --e-bg:#0B3A30; --e-bd:#1D9E75; --e-ink:#BFEEDD; --m-bg:#45290A; --m-bd:#BA7517; --m-ink:#FBE0B0; --h-bg:#4F2212; --h-bd:#D85A30; --h-ink:#FBD5C6;
  --ok:#5FD39B; --ok-tint:#14301F; --bad:#FF8A80; --bad-tint:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.6 var(--f-u)}
a{color:var(--acc)}
button{font:inherit;color:inherit;touch-action:manipulation}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 16px/1.2 var(--f-d);text-decoration:none;color:var(--ink);margin-right:auto}
.brand small{display:block;font:500 11px/1.3 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:4px}
.nav a{min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:500}
.nav a.on{background:var(--acc-tint);color:var(--acc)}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:880px;margin:0 auto;padding:24px 16px 72px}
h1{font:700 clamp(26px,5vw,36px)/1.15 var(--f-d);margin:0 0 10px}
h2{font:600 19px/1.3 var(--f-d);margin:28px 0 12px}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:64ch}
.eyebrow{font:500 12px/1.4 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:600 24px/1.2 var(--f-d)}
.stat span{font-size:13.5px;color:var(--ink-2)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv{border-radius:12px;padding:12px 14px;border:1px solid}
.lv b{display:block;font-weight:600}
.lv span{font-size:14px}
.L-easy{background:var(--e-bg);border-color:var(--e-bd);color:var(--e-ink)}
.L-medium{background:var(--m-bg);border-color:var(--m-bd);color:var(--m-ink)}
.L-hard{background:var(--h-bg);border-color:var(--h-bd);color:var(--h-ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none;color:var(--ink);font:600 17px/1 var(--f-d)}
.tile small{font:500 11px/1 var(--f-m);color:var(--ink-3);letter-spacing:.05em}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.k{background:var(--ok)} .dots i.r{background:var(--bad)}
.tlist{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none;color:var(--ink);min-height:54px}
.trow .n{font:500 12px/1 var(--f-m);color:var(--ink-3);min-width:26px}
.trow .tt{flex:1;font-weight:500}
.trow .pg{font-size:13px;color:var(--ink-2);white-space:nowrap}
.mini{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;width:70px}
.mini i{display:block;height:100%;background:var(--ok)}
.thead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);padding:4px 4px 4px 12px}
.timer b{font:600 18px/1 var(--f-m);min-width:58px}
.timer b.low{color:var(--bad)}
.timer button{min-height:38px;padding:0 12px;border-radius:9px;border:0;background:var(--tint);cursor:pointer;font-size:14px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;margin:0 0 14px}
.qtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.badge{font:500 12px/1 var(--f-m);letter-spacing:.04em;padding:5px 8px;border-radius:7px;border:1px solid}
.topic{font-size:13.5px;color:var(--ink-2);text-decoration:none}
.qtext{font:500 17px/1.5 var(--f-u);margin:0}
.ans{margin-top:12px;border-top:1px dashed var(--rule);padding-top:12px}
.ans ol{margin:0 0 10px;padding-left:22px}
.ans li{margin:0 0 7px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.terms span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--ink-2)}
.tip{background:var(--acc-tint);border-radius:10px;padding:9px 12px;font-size:14.5px;margin:0 0 10px}
.tip b{color:var(--acc)}
.src{font-size:13px;color:var(--ink-3);margin:0}
.qact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qact .btn{min-height:42px;font-size:14.5px;padding:0 14px}
.mk.k.on{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.mk.r.on{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.empty{color:var(--ink-2);background:var(--sheet);border:1px dashed var(--rule);border-radius:12px;padding:14px}
.foot{margin-top:36px;font-size:13px;color:var(--ink-3)}
@media (max-width:620px){.bar-in{flex-wrap:wrap;row-gap:6px;padding:8px 12px}.nav{order:3;width:100%}.nav a{flex:1;justify-content:center;padding:0 6px;font-size:14px}.q{padding:14px}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#home">Емтихан<small>Жалпы психология</small></a>
  <nav class="nav" aria-label="Бөлімдер">
    <a href="#list" data-r="list">Сұрақтар</a>
    <a href="#tickets" data-r="tickets">Билеттер</a>
    <a href="#topics" data-r="topics">Тақырыптар</a>
    <a href="#review" data-r="review">Қайталау</a>
  </nav>
  <button class="ibtn" id="themeBtn" type="button" aria-label="Түнгі/күндізгі режим"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
</div></header>
<main id="app" aria-live="polite"></main>
<script>window.EXAM={"titles": {"1": "Психология ғылым ретінде", "2": "Зерттеу әдістері", "3": "Психика және сана", "4": "Іс-әрекет психологиясы", "5": "Тұлға және қарым-қатынас", "6": "Түйсік және қабылдау", "7": "Ес", "8": "Зейін", "9": "Ойлау және сөйлеу", "10": "Қиял", "11": "Эмоция және сезім", "12": "Ерік", "13": "Темперамент", "14": "Мінез", "15": "Қабілет"}, "questions": {"Q01": {"n": 1, "id": "Q01", "level": "easy", "topic": 1, "q": "Психология ғылымының пәні мен міндеттері.", "plan": ["«Психология» сөзі грек тілінен шыққан: <i>психе<\/i> — жан, <i>логос<\/i> — ілім. Бүгінгі мағынасы — психика мен психикалық құбылыстар туралы ғылым.", "<b>Психологияның пәні<\/b> — психиканың деректері, заңдылықтары және механизмдері. Психология құбылысты сипаттап қана қоймайды, оны басқаратын заңды ашып, түсіндіреді.", "Психикалық құбылыстар үш топқа бөлінеді. <b>Психикалық процестер<\/b> (түйсік, қабылдау, ес, ойлау, қиял, зейін, эмоция, ерік) тез өтеді, <b>психикалық қалыптар<\/b> (сергектік, жабырқау, қорқыныш) біраз уақыт сақталады, <b>психикалық қасиеттер<\/b> (бағыттылық, темперамент, мінез, қабілет) тұрақты болады.", "<b>Негізгі міндеті<\/b> — психикалық іс-әрекеттің заңдарын оның дамуымен бірге ашу: сыртқы дүние мида қалай бейнеленеді, ол бейне адам әрекетін қалай реттейді, тұлғаның қасиеттері қалай қалыптасады.", "Психология заңдылықпен бірге оның <b>механизмдерін<\/b> де анықтайды. Бұл механизмдер ми жұмысына байланысты, сондықтан психология оларды физиологиямен бірге зерттейді. Рубинштейн бойынша психология психиканы тікелей емес, жанама таниды: оның маңызды, объективті байланыстарын ашады.", "<b>Практикалық міндеттері:<\/b> білім беру, медицина, өндіріс, спорт психологияның көмегіне сүйенеді. Мысалы, психология оқу мен тәрбиенің ең тиімді әдістерін және әр жастағы баланың даму мүмкіндігін анықтайды."], "terms": ["психология пәні", "психикалық процестер", "психикалық қалыптар", "психикалық қасиеттер", "психология міндеттері"], "tip": "Пән мен міндетті шатастырмаңыз: пән — психология нені зерттейді (деректер, заңдылықтар, механизмдер), міндет — не істеуі керек (заңды ашу, механизмді табу, практикаға көмектесу).", "src": "Бабаев, 1-дәрісбаян; Маклаков, 1-тарау (1.3)", "link": null}, "Q02": {"n": 2, "id": "Q02", "level": "easy", "topic": 3, "q": "Психика түсінігі және оның негізгі функциялары.", "plan": ["Маклаков бойынша, <b>психика<\/b> — жоғары ұйымдасқан тірі материяның қасиеті. Адам психика арқылы сыртқы дүниені белсенді бейнелейді, дүниенің өзіне ғана тән бейнесін құрады. Сосын сол бейнеге сүйеніп, мінез-құлқын, іс-әрекетін реттейді.", "Қарапайым тілмен айтқанда, психика кез келген заттың емес, тек тірі ағзаның қасиеті, ал ағза неғұрлым күрделі болса, психикасы да соғұрлым күрделі. Адамда психиканың мүшесі — ми, сондықтан Тәжібаев психиканы мидың қасиеті дейді.", "<b>Бейнелеу функциясы:<\/b> психика сыртқы дүниенің заттары мен құбылыстарын бейне түрінде көрсетеді. Бұл бейне — айнадағы көшірме емес, адамның өз тәжірибесіне, қажетіне қарай белсенді құрылған сурет.", "<b>Ағзаның тұтастығын сақтау функциясы:<\/b> психика ағзаның барлық жүйесінің жұмысын бір-бірімен байланыстырып, оны біртұтас етіп ұстайды. Мысалы, қауіпті көрген адамның жүрегі жиі соғып, тынысы жиілейді, бұлшық еті қимылға дайын тұрады: психика бүкіл ағзаны бір мақсатқа жұмылдырады.", "<b>Мінез-құлықты реттеу функциясы:<\/b> бейнеге сүйеніп, адам не істеу керегін шешеді, әрекетін бағыттайды және бақылайды. Мысалы, жолда келе жатқан көлікті көрген адам жүрісін тоқтатады.", "Маклаков үш функцияның бәрі бір мақсатқа — ағзаның ортаға <b>бейімделуіне<\/b> қызмет етеді дейді. Бірақ ол психиканың барлық көрінісін бейімделумен түсіндіру қиын екенін де ескертеді: мысалы, шығармашылық пен өнерден алатын әсер."], "terms": ["психика", "бейнелеу", "мінез-құлықты реттеу", "ағзаның тұтастығы", "бейімделу"], "tip": "Үш функцияны «бейнелейді — біріктіреді — басқарады» деп есте сақтап, соңында үшеуі де бейімделуге бағытталғанын айтыңыз.", "src": "Маклаков, 3-тарау (3.1, 3.1-сурет); «Психика, ми, сана» сайты, 1-тақырып (Тәжібаев, III тарау)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#psikhika", "label": "Психика және ми · сайттың 1-тақырыбы"}}, "Q03": {"n": 3, "id": "Q03", "level": "easy", "topic": 2, "q": "Психологиядағы бақылау әдісі.", "plan": ["<b>Бақылау<\/b> — психологиядағы ең көне әрі қарапайым көрінетін әдіс. Зерттеуші адамның іс-әрекетін күнделікті өмір жағдайында, жоспар бойынша қадағалайды. Әдетте ол болып жатқан оқиғаға араласпайды. Мақсаты — көрген әрекеттің артындағы психологиялық мазмұнды ашу.", "<b>Ғылыми бақылаудың<\/b> тұрмыстық бақылаудан айырмасы: ол жүйелі, алдын ала жасалған жоспарға сүйенеді және объективті сурет алуға бағытталады. Сондықтан бақылаушы арнайы дайындықтан өтуі керек.", "<b>Түрлері<\/b> (Маклаков): <i>өзін-өзі бақылау<\/i> және <i>сыртқы бақылау<\/i>; <i>еркін<\/i> және <i>стандартталған<\/i> бақылау; <i>қатысушы бақылау<\/i>, мұнда психолог оқиғаның өзіне араласады, және <i>сырттай бақылау<\/i>.", "<b>Табиғи бақылау<\/b> — мінез-құлықты табиғи ортасында, адамдарға байқатпай бақылау. Адамдар өзін бақылап тұрғанын білсе, әдеттегідей әрекет етпейді. Мысалы, зерттеушілер балабақшадағы балалардың ойын алаңындағы мінез-құлқын алыстан бақылап, жазып отырған.", "<b>Күшті жағы:<\/b> деректер шынайы өмірге жақын, экологиялық валидтілігі жоғары. <b>Әлсіз жағы:<\/b> қажет мінез-құлықтың қашан болатынын бақылаушы басқара алмайды, уақыт көп кетеді, ал себеп-салдарды бақылау ашпайды.", "<b>Бақылаушының біржақтылығы<\/b> — бақылаушы өзі күткенді көріп қалуы мүмкін. Одан қорғану үшін нені тіркейтінін алдын ала нақты белгілейді және бір оқиғаны бірнеше адам бақылайды; олардың келісімі бағалаушылар арасындағы сенімділікті көрсетеді."], "terms": ["бақылау", "қатысушы бақылау", "табиғи бақылау", "стандартталған бақылау", "бақылаушының біржақтылығы"], "tip": "Бақылауды экспериментпен шатастырмаңыз: бақылаушы жағдайға араласпайды, сондықтан себеп-салдарды дәлелдей алмайды.", "src": "Маклаков, 1-тарау (1.4, 1.9-сурет); «Психологиялық зерттеу әдістері» сайты, 2.2 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s22-nat", "label": "Табиғи бақылау · сайттың 2.2-бөлімі"}}, "Q04": {"n": 4, "id": "Q04", "level": "easy", "topic": 2, "q": "Эксперимент әдісі және оның түрлері.", "plan": ["<b>Эксперимент<\/b> — зерттеуші зерттелетін қасиет айқын көрінетіндей жасанды жағдай құратын әдіс. Маклаков бойынша оның басты артықшылығы — себеп-салдар туралы басқа әдістерден сенімдірек қорытынды жасауға мүмкіндік береді.", "<b>Тәуелсіз айнымалыны<\/b> зерттеуші өзі өзгертеді, ал оның әсерін <b>тәуелді айнымалы<\/b> арқылы өлшейді. Қарапайым жобада екі топ болады: эксперименттік топ әсерді алады, бақылау тобы алмайды, басқа жағынан екеуі бірдей.", "<b>Зертханалық эксперимент<\/b> арнайы жасалған жағдайда өтеді. Ол дәлірек, өйткені зерттеуші бөгде әсерлерді бақылайды. Бірақ жағдайы өмірге онша ұқсамайды.", "<b>Табиғи эксперимент<\/b> күнделікті өмір жағдайында, мысалы, сабақта өтеді, ал зерттеуші оқиғаның барысына араласпай, оны сол күйінде тіркейді. Оны алғаш қолданған — А.Ф. Лазурский. Бақылаудан айырмасы — зерттеуші зерттеуді алдын ала жоспарлап, сыналушылардың әдеттегі іс-әрекетінің ішінде өзіне керек жағдайды ұйымдастырады, ал сыналушылар эксперимент жүріп жатқанын білмейді. Нәтижесі өмірге жақын, бірақ бөгде әсерлерді толық бақылау қиын.", "Бабаев эксперименттің тағы бір түрін атайды — <b>қалыптастырушы эксперимент<\/b>. Мұнда зерттеуші психикалық қасиетті өлшеп қана қоймай, оны оқыту арқылы дамытып, қалай өзгергенін зерттейді.", "<b>Мысал:<\/b> студенттерді екі топқа кездейсоқ бөліп, біреуі ноутбукпен, екіншісі қолмен конспект жазады, соңында бірдей тест тапсырады. Тест нәтижесінің айырмасы жазу тәсілінің әсерін көрсетеді."], "terms": ["эксперимент", "тәуелсіз айнымалы", "тәуелді айнымалы", "зертханалық эксперимент", "табиғи эксперимент", "қалыптастырушы эксперимент"], "tip": "Эксперименттің бақылаудан айырмасын бір сөйлеммен айтыңыз: зерттеуші жағдайды өзі жасайды, сондықтан себепті ашады.", "src": "Маклаков, 1-тарау (1.4); Бабаев, 2-дәрісбаян (психология әдістері); «Психологиялық зерттеу әдістері» сайты, 2.3", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s23-exp", "label": "Эксперимент жүргізу · сайттың 2.3-бөлімі"}}, "Q05": {"n": 5, "id": "Q05", "level": "easy", "topic": 3, "q": "Сана дегеніміз не?", "plan": ["Немов пен Романова бойынша, <b>сана<\/b> — адамның өзін және айналасын танудың ең жоғары деңгейі. Адамның ақылға қонымды, ерікті әрекеттері соған сүйенеді. Сана тек адамға тән, ол еңбек пен тіл арқылы пайда болған.", "Петровский бойынша, сананың төрт сипаты бар. Біріншісі — <b>білім жиынтығы:<\/b> оған түйсік, қабылдау, ес, ойлау, қиял арқылы жиналған білім кіреді.", "Екіншісі — <b>субъект пен объектіні ажырату:<\/b> адам өзін дүниеден және басқа адамдардан бөліп, өзін танып біле алады. Үшіншісі — <b>мақсат қою:<\/b> адам әрекетінің нәтижесін алдын ала ойлап, жолын белгілейді. Төртіншісі — <b>эмоциялық баға<\/b>: адам дүниені біліп қана қоймай, оған өз қатынасын білдіреді.", "Сана — психиканың бір бөлігі ғана: адам оны ерікпен бақылай алады және сөзбен айта алады. Сананың маңызды қасиеті — <b>рефлексия<\/b>, яғни сананың өзіне бұрылып, өзін тануы. Сананың адамның өзіне бағытталған бөлігін <b>өзіндік сана<\/b> дейді.", "<b>Сананың түрлері:<\/b> жеке сана, топтық сана (мысалы, отбасылық сана) және бұқаралық сана.", "<b>Мысал:<\/b> студент емтиханға дайындалып отырып, қай тақырыпты білмейтінін байқап, жоспарын өзгертеді. Мұнда ол өзін бағалап, мақсат қойып, мінез-құлқын басқарып отыр — бұл сананың белгілері."], "terms": ["сана", "рефлексия", "өзіндік сана", "жеке сана", "бұқаралық сана"], "tip": "Сананы бүкіл психикамен теңестірмеңіз: сана — психиканың адам ерікпен бақылай алатын және сөзбен айта алатын бөлігі.", "src": "Бабаев, 4-дәрісбаян (Сана, А.В. Петровский бойынша сананың төрт сипаты); «Психика, ми, сана» сайты, 16-тақырып (Немов, 5.1)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana", "label": "Сана ұғымы · сайттың 16-тақырыбы"}}, "Q06": {"n": 6, "id": "Q06", "level": "easy", "topic": 6, "q": "Түйсік анықтамасы.", "plan": ["<b>Түйсік<\/b> — сезім мүшелерімізге дәл қазір әсер етіп тұрған заттың немесе құбылыстың жеке қасиетін (түсін, дыбысын, иісін, жылуын) санада бейнелейтін психикалық процесс (Крысько, Маклаков). Бабаев түйсікті дүние туралы барлық біліміміздің бастау көзі дейді.", "Анықтамада үш белгі бар: <b>тікелей әсер<\/b> (әсер тоқтаса, түйсік те біраздан соң тоқтайды), <b>жеке қасиет<\/b> (зат тұтас емес, бір қасиеті ғана бейнеленеді), <b>шын бар дүниенің бейнесі<\/b> (қардың суықтығы — қиял емес, қардың өз қасиеті).", "Түйсіктің физиологиялық негізі — <b>анализатор<\/b> (Бабаевта — талдағыш). Оның үш бөлігі бар: рецептор, өткізгіш жүйке жолдары және ми қыртысындағы орталық бөлім. Түйсік — белсенді процесс: тітіркендіргіш әсер еткенде көз затқа бұрылады, қол затты сипалайды, рецептор бейімделеді.", "Түйсік сыртқы дүниені ғана емес, ағзаның өз күйін де бейнелейді. Сондықтан түйсіктер экстероцептивті, интероцептивті және проприоцептивті болып бөлінеді.", "Мысал: Маклаковтың масасы. Біз масаның ызыңын естиміз, шаққанын сеземіз, бірақ түйсік бұл екеуін бір-бірімен де, масамен де байланыстырмайды. Оларды «маса» деген бір затқа біріктіру — қабылдаудың ісі.", "Түйсіктің маңызы: Немов оларды ең қарапайым психикалық құбылыстар деп атайды. Олар қабылдау, ес, ойлау, қиял үшін «алғашқы құрылыс материалы»; түйсіктен айырылған адамның психикасы бұзылады."], "terms": ["түйсік", "тітіркендіргіш", "анализатор (талдағыш)", "рецептор", "жеке қасиет"], "tip": "Анықтаманың үш белгісін («тікелей», «жеке қасиет», «шын бар дүние») атаңыз да, түйсікті қабылдаудан бір мысалмен ажыратыңыз.", "src": "Түйсік және қабылдау сайты, 1–3-тараулар; Бабаев, 10-дәрісбаян; Маклаков, Крысько, Немов (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s02-def", "label": "Түйсік және қабылдау · 2-тарау «Түйсіктің анықтамасы»"}}, "Q07": {"n": 7, "id": "Q07", "level": "easy", "topic": 6, "q": "Қабылдау (перцепция) анықтамасы.", "plan": ["<b>Қабылдау<\/b> — сезім мүшелеріне тікелей әсер ететін заттар мен құбылыстардың санада тұтас бейнеленуі (Крысько, Маклаков). Бабаев: қабылдау — заттар мен құбылыстардың өз қасиеттері мен бөлшектерімен бірге тұтас бейнеленуі.", "Түйсік пен қабылдаудың айырмасы: түйсікте зат жеке қасиеттері арқылы, қабылдауда тұтас күйінде бейнеленеді. «Қараңғы дақ, сыбдыр» — түйсік, ал «бұл ит» не «бұл бұта» — қабылдау.", "Қабылдау түйсіктердің жай қосындысы емес. Оған бірнеше сезім мүшесі бірге қатысады, ал ақпаратты өңдеуге ес, ойлау, сөйлеу қосылады: біз затты танып, оны сөзбен атаймыз (Бабаевтың мысалы — «сағат»).", "Қабылдау — <b>белсенді іс-әрекет<\/b>: көз заттың контурымен жүреді, қол затты сипалайды. Немов Гусев пен Леонтьевтің анықтамасын келтіреді: қабылдау — адамның өз санасында дүниенің бейнесін, яғни оның <b>субъективті моделін<\/b> құруы. Бейне — көшірме емес, адамның өзі құрастыратын нәрсе.", "Физиологиялық негізі — мидың <b>талдау-жинақтау<\/b> әрекеті және уақытша жүйке байланыстары: бір анализатордың ішіндегі және бірнеше анализатор арасындағы байланыстар.", "Қабылдаудың негізгі қасиеттері: <b>заттылық, тұтастық, құрылымдылық, константтылық, мағыналылық<\/b>; оған адамның бұрынғы тәжірибесі де әсер етеді (<b>апперцепция<\/b>)."], "terms": ["қабылдау", "тұтас бейне", "талдау-жинақтау", "перцептивтік іс-әрекет", "апперцепция"], "tip": "«Қабылдау — түйсіктердің қосындысы» деп айтпаңыз: тұтас бейнеге тәжірибе, ес және ойлау қосылады.", "src": "Түйсік және қабылдау сайты, 13-тарау; Бабаев, 11-дәрісбаян; Маклаков, Крысько, Немов (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s13-definition", "label": "Түйсік және қабылдау · 13-тарау «Қабылдау дегеніміз не?»"}}, "Q08": {"n": 8, "id": "Q08", "level": "easy", "topic": 7, "q": "Ес процесстерінің анықтамасы.", "plan": ["<b>Ес<\/b> — өткен тәжірибені есте қалдыратын, сақтайтын және кейін қайта жаңғыртатын психикалық процесс. Бабаев бойынша ес бір-бірімен ұштасқан бөліктерден құралған күрделі процесс: оның арқасында адам өз тәжірибесін жинап, сақтап, кейін пайдаланады.", "Ес процестері бір тізбектің буындары: <b>есте қалдыру → сақтау → қайта жаңғырту немесе тану<\/b>. Бұл тізбекке <b>ұмыту<\/b> да қосылады.", "<b>Есте қалдыру<\/b> — қабылданған ақпаратты бекітіп, сақтауға дайындау. Ол ықтиярсыз (мақсатсыз) және ықтиярлы (мақсат қойып), механикалық және мағыналы болады.", "<b>Сақтау<\/b> — алынған білімді ұзақ уақыт есте ұстап тұру; ақпарат жүйке жүйесінде із ретінде қалады.", "<b>Қайта жаңғырту<\/b> — бұрын қабылданған, бірақ қазір көз алдында жоқ нәрсенің бейнесін қайта жасау. <b>Тану<\/b> — затты қайта көргенде оның бұрын қабылданғанын сезу. Эссе жазғанда еске түсіреміз, ал тестте дұрыс нұсқаны танимыз.", "<b>Ұмыту<\/b> — бұрын есте қалғанды қайта жаңғыртудың қиындауы немесе бұрмалануы. Ұмыту тек кемшілік емес: ол миды керексіз ақпараттан арылтады."], "terms": ["ес", "есте қалдыру", "сақтау", "қайта жаңғырту", "тану", "ұмыту"], "tip": "Процестерді жай атамаңыз: әрқайсысына бір сөйлем анықтама мен бір мысал беріп, олардың бір тізбек екенін көрсетіңіз.", "src": "Ес сайты, 1-тарау; Бабаев, 12-дәрісбаян; Маклаков, 10-тарау", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s01-processes", "label": "Ес · 1-тарау «Естің процестері: бір тізбектің буындары»"}}, "Q09": {"n": 9, "id": "Q09", "level": "easy", "topic": 8, "q": "Зейіннің негізгі анықтамасы.", "plan": ["<b>Зейін<\/b> — санамыздың бір нысанға бағытталып, соған шоғырлануы (Маклаков, Бабаев, Крысько). Мысалы, сурет салуға беріліп кеткен бала ата-анасының дауысын естімей қалады.", "Анықтамада екі белгі бар. <b>Бағытталу<\/b> — керек нысанды таңдап алып, сол таңдауды біраз уақыт ұстап тұру. <b>Шоғырлану<\/b> — іске терең беріліп, бөгде нәрседен ойды аулақ ұстау. Екеуі бірінсіз бірі болмайды, бірақ бір ұғым емес.", "Лурия зейінді қысқа анықтайды: зейін — психикалық процестердің <b>таңдамалылығы<\/b>. Адамға толассыз ақпарат ағып келеді, ал санаға оның аз ғана бөлігі жетеді: сол бөлікті зейін іріктейді.", "Зейіннің <b>өз өнімі жоқ<\/b>: ол жаңа бейне не ой тудырмайды, бірақ қабылдауға, еске, ойлауға қатысып, олардың сапасын арттырады. Оны адамның ісінен, бет-әлпетінен, дене қалпынан байқаймыз.", "Зейін дербес процесс пе — бұл әлі даулы: Немов оны дербес процесс деп санайды, Бабаев басқа процестерге қызмет етеді дейді. Бір нәрсеге екеуі де келіседі: зейіннің өз <b>қасиеттері<\/b> бар — тұрақтылық, шоғырлану, бөліну, ауысу, көлем.", "Зейіннің негізгі түрлері — <b>ырықсыз<\/b> және <b>ырықты<\/b> зейін; Маклаков пен Бабаев оларға <b>үйреншікті<\/b> зейінді қосады."], "terms": ["зейін", "бағытталу", "шоғырлану", "таңдамалылық", "зейін қасиеттері"], "tip": "Анықтамадағы екі сөзді — бағытталу мен шоғырлануды — міндетті түрде атап, әрқайсысын бір мысалмен ашыңыз.", "src": "Зейін сайты, 1-тарау; Маклаков, 14-тарау; Бабаев, 9-дәрісбаян; Лурия, «Нейропсихология негіздері», III бөлім, «Зейін» тарауы", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s01-definition", "label": "Зейін · 1-тарау: Анықтама — бағытталу және шоғырлану"}}, "Q10": {"n": 10, "id": "Q10", "level": "easy", "topic": 9, "q": "Ойлау процесінің маңызы.", "plan": ["<b>Ойлау<\/b> — тұлғаның шындықты жалпылама және жанама бейнелеуге бағытталған танымдық әрекеті (Бабаев). Оның маңызы осы екі сөзден көрінеді.", "Түйсік пен қабылдау тек дәл қазір әсер етіп тұрған нәрсені береді. Ойлау сол деректен бастап, <b>тікелей көрінбейтінді<\/b> ашады: термометрге қарап, далаға шықпай-ақ аяз екенін білеміз.", "Ойлаудың басты міндеті — заттар арасындағы байланыстарды ашу, <b>кездейсоқ сәйкестікті мәнді байланыстан ажырату<\/b>. Кит суда жүзсе де, балық емес, сүтқоректі — мұны тек ойлау арқылы білеміз.", "Ойлау <b>проблемалық жағдайда<\/b> оянады және міндетті шешуге көмектеседі. Бір мәселенің шешімі көп мәселенің жалпы шешіміне айналып, алдын ала <b>жоспар<\/b> құруға жол ашады: шебер үй салмай тұрып, оның жобасын сызады.", "Ойлаудың нәтижесі оның түріне қарай әртүрлі (Немов): теориялық ойлау жаңа ой, идея береді, тәжірибелік ойлау нақты жағдайды өзгертеді, шығармашыл ойлау жаңа нәрсе туғызады.", "Ойлау әрекеттен туады, кейін сол әрекетті басқарады; іс-тәжірибе ойдың дұрыстығының әрі негізі, әрі тексерушісі. Немов ойлауды басты танымдық процестің бірі дейді: баланың оқуы мен тәрбиесінің табысы көп жағынан соған байланысты."], "terms": ["ойлау", "жалпылама бейнелеу", "жанама бейнелеу", "проблемалық жағдай", "мәнді байланыс"], "tip": "Маңызын сұрағанда анықтамамен тоқтап қалмаңыз: ойлау сезімдік танымға не қосатынын — көрінбейтінді ашу мен жоспар құруды — мысалмен көрсетіңіз.", "src": "Ойлау және сөйлеу сайты, 1 және 16-тараулар; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s01", "label": "Ойлау және сөйлеу · 1-тарау: Ойлау деген не?"}}, "Q11": {"n": 11, "id": "Q11", "level": "easy", "topic": 9, "q": "Сөйлеудің психологиялық анықтамасы.", "plan": ["<b>Сөйлеу<\/b> — тіл арқылы мағына білдіру, ықпал жасау, ақпарат беру әрекеті; онда адамның санасы мен ойы іс үстінде көрінеді (Бабаев). Бұл — адамға ғана тән, тілдесудің ең жетілген түрі.", "Сөйлеуді тілмен шатастырмаймыз. <b>Тіл<\/b> — сөйлесу құралдарының қатаң қалыпқа келтірілген, бәріне ортақ жүйесі. Сөйлеу — адамның ойы мен сезімін жеткізу үшін тілді басқа адаммен қатынаста іс жүзінде қолдануы. Немов айтқандай, тіл — бүкіл халықтікі, ал сөйлеу — әр адамның өзінікі.", "Сөйлеуде екі жақ бар. <b>Айтушы<\/b> сөз таңдап, оларды байланыстырып, дыбыстайды — ойын таңбаға айналдырады (таңбалау). <b>Тыңдаушы<\/b> таңбадан ойды қайта шығарып алады (шешу). Тыңдаушы естігенін өз сөзімен айтып бергенде ғана хабар жеткенін білеміз (Бабаев).", "Сөйлеу ойлаумен тегі жағынан байланысты: екеуі де адамзаттың бірлескен еңбегі мен тарихи дамуында бірге қалыптасқан. Психологтар сөйлеуді ойды ретке келтіретін құрал әрі ой нәтижесін басқаға жеткізетін тәсіл деп санайды.", "Сөйлеу <b>сыртқы<\/b> (ауызша және жазбаша; диалог және монолог) және <b>ішкі<\/b> болып бөлінеді. Бабаев сөздің екі негізгі қызметін атайды: <b>коммуникативтік<\/b> (тілдесу) және <b>сигнификативтік<\/b> (затты атау, белгілеу)."], "terms": ["сөйлеу", "тіл", "таңбалау және шешу", "ішкі сөйлеу", "коммуникативтік қызмет"], "tip": "Анықтамада тіл мен сөйлеуді синоним етпеңіз: психолог үшін сөйлеу — бәріне ортақ тілді нақты адамның іс жүзінде қолдануы.", "src": "Ойлау және сөйлеу сайты, 10–11-тараулар; Бабаев, 8 және 13-дәрісбаяндар; Немов, II бөлім, 14-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s10-lang", "label": "Ойлау және сөйлеу · 10-тарау: Тіл деген не, сөйлеу деген не?"}}, "Q12": {"n": 12, "id": "Q12", "level": "easy", "topic": 10, "q": "Қиял процесі және анықтамасы.", "plan": ["<b>Қиял<\/b> — адамның бұрын көрген-білгеніне сүйеніп, санасында жаңа бейне, идея немесе жоба жасауы. Қысқа формуласы: тәжірибе + қайта өңдеу = жаңа бейне.", "Қиял жоқтан бар жасамайды. Оның материалы — бұрын қабылдаған нәрселеріміздің <b>елестері<\/b>: қиял оларды бөлшектеп, басқаша қиыстырады. Көк түйенің әр бөлшегі таныс, жаңасы — тек тіркесі.", "<b>Ес пен қиялдың айырмасы<\/b>: ес бұрынғы ізді мүмкіндігінше өзгертпей қайта жаңғыртады, ал қиял сол іздерді өзгертіп, жаңаша құрастырады. Сондықтан қиял бейнесі шындықтың дәл көшірмесі емес (Немов).", "Қиял болашаққа бағытталған: жағдай әлі анық болмағанда ол істің нәтижесін алдын ала көріп, әрекет бағдарламасын құруға көмектеседі (Бабаев).", "Крысько қиялдың бес қызметін атайды: шындықты бейнемен көрсету, эмоциялық күйді реттеу, басқа психикалық процестерді басқару, әрекеттің ішкі жоспарын құру, іс-әрекетті жоспарлау.", "Мысал: сәулетші әлі салынбаған үйді ойша көреді, ал оқушы «Алпамыс батыр» жырын тыңдап, батырдың бейнесін көз алдына келтіреді."], "terms": ["қиял", "елес", "бейне", "тәжірибе", "әрекеттің ішкі жоспары"], "tip": "«Қиял — шындықта жоқ нәрсе» деп қана қоймаңыз: оның материалы әрқашан тәжірибеден алынатынын және ес пен қиялдың айырмасын міндетті түрде айтыңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.1; Немов, 12.1; Крысько, 2.19–2.20", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s01-def", "label": "Қиял · 1-тарау: анықтама"}}, "Q13": {"n": 13, "id": "Q13", "level": "easy", "topic": 11, "q": "Эмоция түсінігі.", "plan": ["<b>Эмоция<\/b> — адамның дүниеге және өзіне қатынасын толғаныс түрінде бейнелеуі. Маклаков бойынша ол жағдайдың адам үшін жеке маңызын көрсетеді, басты белгісі — субъективтілігі.", "Түйсік пен қабылдау заттың өз қасиетін бейнелейді, ал эмоция сол затқа деген <b>қатынасымызды<\/b> бейнелейді. «Бұл — қызыл» деу түйсік, «бұл түс маған ұнайды» деу эмоция.", "Эмоция <b>қажеттіліктен<\/b> туады: қажеттілік қанағаттанса, жағымды эмоция, қанағаттанбаса, жағымсыз эмоция пайда болады. Сондықтан эмоцияның әрқашан таңбасы болады.", "Эмоция үш қабаттан көрінеді: ішкі толғаныс («қуанып тұрмын»), дене өзгерістері (жүректің дүрсілдеуі, беттің қызаруы) және экспрессия (бет-әлпет, қимыл, дауыс).", "Негізгі қызметтері: бағалау (әсердің пайдалы не зиянды екенін тез аңғарту), әрекетке итермелеу, бейімделу және <b>коммуникативтік<\/b> қызмет — толғанысты басқаға білдіру.", "Мысал: емтихан нәтижесін күтіп тұрған студенттің қобалжуы оған бағаның қаншалықты маңызды екенін көрсетеді. Нәтиже бәрібір адамда мұндай толғаныс тумайды."], "terms": ["эмоция", "толғаныс", "қатынас", "қажеттілік", "жағымды және жағымсыз эмоция"], "tip": "Анықтамада «толғаныс» пен «қатынас» деген екі сөзді міндетті түрде айтыңыз: эмоция заттың өзін емес, оған қатынасымызды бейнелейді.", "src": "Бабаев, 17-дәрісбаян; Маклаков, 16.1; Немов, 24-тарау", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s01-def", "label": "Эмоция және сезім · 1-тарау: анықтамалар"}}, "Q14": {"n": 14, "id": "Q14", "level": "easy", "topic": 11, "q": "Сезімдер мен эмоциялар.", "plan": ["<b>Эмоция<\/b> (тар мағынада) — нақты жағдайға деген тікелей, уақытша толғаныс. Бабаев оны «сезім шарпуы» дейді: айтыста тапқыр сөзге бүкіл зал бір сәтте ду қол соғады.", "<b>Сезім<\/b> — нақты нысанға бағытталған, тұрақты, тек адамға тән күрделі толғаныс. Ол көп эмоциялардан құралып, өмір бойы қалыптасады (Немов).", "Айырмасы: эмоция қысқа, сезім ұзақ; эмоция жағдайға, сезім нысанға (адамға, іске, Отанға) бағытталады. Қарапайым эмоциялар жануарда да бар, ал сезімнің табиғаты әлеуметтік (Маклаков).", "Байланысы: қайталанған эмоциялардан сезім туады, ал сезім эмоциялар арқылы көрінеді. Ананың балаға деген махаббаты бірде қуаныш, бірде уайым, бірде ренжу болып білінеді.", "<b>Жоғары сезімдердің<\/b> үш тобы бар: адамгершілік (ұят, ұждан, борыш), ақыл-ой (таңдану, ізденіс, сенім) және эстетикалық сезімдер (Құрманғазының күйін тыңдағандағы толғаныс).", "Ұқсастығы: екеуі де субъективті, қажеттілікпен байланысты және ортақ физиологиялық негізге сүйенеді."], "terms": ["эмоция", "сезім", "сезім шарпуы", "жоғары сезімдер", "толғаныс"], "tip": "Айырмашылықты кемінде үш белгімен (ұзақтығы, бағыты, табиғаты) айтып, соңында байланысын міндетті түрде қосыңыз: сезім эмоциялар арқылы көрінеді.", "src": "Бабаев, 17-дәрісбаян; Маклаков, 16.1, 16.3; Немов, 24.1, 24.3", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s03-diff", "label": "Эмоция және сезім · 3-тарау (жоғары сезімдер — 11-тарауда)"}}, "Q15": {"n": 15, "id": "Q15", "level": "easy", "topic": 12, "q": "Ерік процесінің анықтамасы.", "plan": ["<b>Ерік<\/b> — адамның мақсатқа жету жолында кезіккен сыртқы және ішкі кедергілерді жеңіп, өз әрекеті мен қылығын саналы түрде реттей білуі (Бабаев; Маклаков).", "Бабаев еріктің екі қызметін атайды: <b>ынталандыру<\/b> — белсенділікті іске қосады, <b>реттеу<\/b> — керексіз әрекетті тежейді. Олардың негізінде жүйке жүйесіндегі қозу мен тежелудің өзара байланысы жатыр.", "<b>Ырықсыз әрекет<\/b> санадан тыс, өздігінен жүреді: көзді жыпылықтау, түшкіру, ыстыққа тиген қолды тартып алу, шуға бас бұру.", "<b>Ырықты (еріктік) әрекет<\/b> саналы мақсатқа бағытталады және күш салуды талап етеді. Ол ырықсыз қимылдардың негізінде дамиды.", "Еріктік әрекеттің белгісі — «мен қалаймын» емес, «мен міндеттімін» деген толғаныс. Кейде екеуі қосылады: «Мен өз борышымды орындауды қалаймын».", "Мысал: шаршап келген студенттің ұйықтағысы келсе де, ертеңгі семинарға дайындалып отыруы — еріктік әрекет. Ал иттен қорқып дуалдан секіріп кеткен бала ерік көрсеткен жоқ: оны сыртқы қауіп айдады."], "terms": ["ерік", "ырықты әрекет", "ырықсыз әрекет", "ішкі және сыртқы кедергі", "саналы реттеу"], "tip": "Ерікті кез келген белсенділікпен шатастырмаңыз: оның басты белгісі — саналы мақсат пен кедергіні жеңу.", "src": "Бабаев, 16-дәрісбаян, 1-бөлім; Маклаков, 15.1; Немов, 23.1", "link": null}, "Q16": {"n": 16, "id": "Q16", "level": "easy", "topic": 5, "q": "Индивид, тұлға, даралық ұғымдары.", "plan": ["<b>Индивид<\/b> — адамзат тегінің жеке өкілі ретіндегі адам (Бабаевта — <i>дара адам<\/i>). Бұл ұғымға оның туа біткен, биологиялық қасиеттері кіреді. Латынша <i>individuum<\/i> сөзі «бөлінбейтін» дегенді білдіреді.", "<b>Тұлға<\/b> — адамды өзгелерден ажырататын, оның әрекеттері мен қылықтарын айқындайтын ең тұрақты психологиялық қасиеттерінің жиынтығы (Бабаевта — <i>жеке адам<\/i>). Тұлға қоғамда, адамдармен қарым-қатынас пен іс-әрекет арқылы қалыптасады. Негізгі ой: «Индивид болып туады, тұлға болып қалыптасады».", "<b>Даралық<\/b> — нақты адамның табиғи және әлеуметтік жолмен алған қайталанбас ерекшеліктері мен қасиеттерінің өзіндік үйлесімі (Бабаев). Әр адам дара, бірақ біреудің даралығы айқын, біреудікі байқала бермейді.", "Үш ұғымның көлемі әртүрлі. «Адам» ұғымы ең кең: оған психологиялық емес қасиеттер де кіреді. Индивид пен тұлға бір-бірін қайталамайды: бірі — табиғи негіз, екіншісі — қоғамда пайда болған қасиеттер. Даралық тұлғамен ішінара қиылысады: ол адамның өзгелерге ұқсамайтын жағын көрсетеді.", "Мысал: жаңа туған егіз бала — екі индивид, олардың туа біткен ерекшеліктері бар. Өсе келе біреуі музыкаға, біреуі спортқа әуес болып, әрқайсысы өз көзқарасы мен мінезі бар тұлғаға айналады. Ал олардың бір-біріне ұқсамайтын қасиеттерінің үйлесімі — даралық."], "terms": ["индивид (дара адам)", "тұлға (жеке адам)", "даралық", "«индивид болып туады, тұлға болып қалыптасады»"], "tip": "Үш ұғымды бір қатарға қойып айтыңыз: индивид — табиғи негіз, тұлға — қоғамда қалыптасқан қасиеттер, даралық — қайталанбас үйлесім.", "src": "Тұлға сайты, «Тұлға ұғымы» бөлімі (Немов, 102–104 б.); Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#ugym", "label": "Тұлға · «Тұлға ұғымы» бөлімі"}}, "Q17": {"n": 17, "id": "Q17", "level": "easy", "topic": 13, "q": "Темперамент анықтамасы.", "plan": ["<b>Темперамент<\/b> — адамның психикалық әрекетінің динамикасын айқындайтын дара қасиеттердің жиынтығы (Бабаев). Ол адамның не істейтінін емес, қалай әрекет ететінін көрсетеді: қаншалықты жылдам, күшті, ұстамды.", "Темперамент қасиеттері іс-әрекеттің мазмұны мен мақсатына қарамай бірдей көрінеді және ересек шақта аз өзгереді. Бабаев темпераментті тұлға қалыптасуының табиғи ірге тасы дейді.", "<b>Физиологиялық негізі<\/b> — жүйке жүйесінің типі: қозу мен тежелудің күші, теңгерімділігі, қозғалғыштығы (Павлов). Темперамент — осы типтің психикадағы көрінісі.", "Темпераменттің қасиеттері (Бабаев): <b>сезімталдық<\/b>, реактивтілік, белсенділік, икемділік, әрекет қарқыны, экстраверсия не интроверсия, эмоциялық қозғыштық.", "Төрт түрі: сангвиник, холерик, флегматик, меланхолик. Мысалы, бір тапсырманы сангвиник тез бастап, тез ауысады, ал флегматик баяу кіріседі, бірақ ұзақ, тиянақты істейді.", "Жақсы не жаман темперамент жоқ: әр түрдің күшті және әлсіз жағы бар. Сондықтан оны түзетуге емес, күшті жағын пайдалануға назар аударған жөн."], "terms": ["темперамент", "психикалық әрекеттің динамикасы", "жүйке жүйесінің типі", "сезімталдық, реактивтілік, белсенділік", "сангвиник, холерик, флегматик, меланхолик"], "tip": "Темперамент «қалай?» деген сұраққа жауап береді: жылдамдық пен күш туралы, ал адамның ниеті мен құндылығы туралы емес.", "src": "Бабаев, 18-дәрісбаян (1, 3-бөлім); Маклаков, 24.1; Крысько, 150–153 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}}, "Q18": {"n": 18, "id": "Q18", "level": "easy", "topic": 14, "q": "Мінез анықтамасы.", "plan": ["<b>Мінез<\/b> — адамның қылық-әрекетінде, қарым-қатынасында тұрақты қалыптасатын дара ерекшеліктерінің жиынтығы (Бабаев). Ол адамның әлемге, іске, басқа адамдарға және өзіне қатынасынан көрінеді.", "Мінез туа берілмейді: ол отбасында, сыныпта, достар арасында, еңбек ұжымында қалыптасады. Мінезін білсек, адамның түрлі жағдайда қалай әрекет ететінін алдын ала болжай аламыз.", "<b>Мінез бітісі<\/b> — адамның әдеттегі жағдайдағы қылығының тұрақты түрі. Бабаев айтқандай, жанжалда бір рет дөрекілік көрсеткен адамды дөрекі мінезді деу дұрыс емес.", "Қатынастар бойынша бітістер: адамдарға (шыншыл — өтірікші), іске (еңбекқор — еріншек), өзіне (өзін сынай білетін — өзімшіл), заттарға (ұқыпты — салақ). Психикалық салалар бойынша: ерік, эмоциялық және зияткерлік бітістер.", "Мінез бітістердің жай қосындысы емес: бітістер өзара байланысып, тұтас құрылым түзеді, олардың ішінде <b>жетекші<\/b> және <b>қосалқы<\/b> бітістер болады. Мысалы, батылсыздық пен қорқақтық жетекші болса, адамның қайырымдылығы да іске аспай қалады."], "terms": ["мінез", "мінез бітісі", "қатынастар жүйесі", "ерік, эмоциялық, зияткерлік бітістер", "жетекші және қосалқы бітістер"], "tip": "Бір реткі қылықты мінез бітісі деп атамаңыз: бітіс — тұрақты қайталанатын қылық.", "src": "Бабаев, 19-дәрісбаян (1, 3–4-бөлім); Маклаков, 25.1; Крысько, 154–155 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}}, "Q19": {"n": 19, "id": "Q19", "level": "easy", "topic": 15, "q": "Қабілет анықтамасы.", "plan": ["<b>Қабілет<\/b> — бір немесе бірнеше іс-әрекет түрімен табысты айналысуға және оларды меңгеруге мүмкіндік беретін тұлғаның психикалық қасиеті. Бірдей жағдайда біреу білімді «лезде қағып алады», екіншісіне көп уақыт пен күш керек.", "Теплов қабілеттің үш белгісін атады: біріншіден, ол бір адамды екіншісінен ажырататын дара ерекшелік; екіншіден, ол іс-әрекеттің табысты орындалуына қатысты; үшіншіден, ол білім, ептілік, дағдыға теңестірілмейді.", "Қабілет білім мен дағдының өзінде емес, оларды қаншалықты тез әрі жеңіл меңгеретінімізде көрінеді. Бабаев қабілетті жерге тастаған дәнге теңейді: қолайлы жағдай болса өнеді, болмаса көрінбей-ақ жойылады.", "Түрлері: <b>жалпы<\/b> қабілеттер көп іс-әрекетке қажет (ойлау, ес, сөйлеу), <b>арнайы<\/b> қабілеттер нақты іске керек (музыкалық, математикалық, мұғалімнің педагогикалық зейінділігі).", "Даму деңгейлері: нышан → қабілет → дарындылық → шеберлік → талант → данышпандық. Мысалы, математиканы оқымаған адамның математикалық қабілеті ешқашан ашылмайды: ол есеп шығару барысында ғана қалыптасады."], "terms": ["қабілет", "Теплов белгілері", "білім, ептілік, дағды", "жалпы және арнайы қабілеттер", "нышан"], "tip": "Қабілет пен дағдыны шатастырмаңыз: дағды — меңгерілген әрекет, ал қабілет — оны тез әрі жеңіл меңгеру мүмкіндігі.", "src": "Бабаев, 20-дәрісбаян (1-бөлім); Маклаков, 23.1; Крысько, 162–163 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}}, "Q20": {"n": 20, "id": "Q20", "level": "easy", "topic": 15, "q": "Нышан түсінігі.", "plan": ["<b>Нышандар<\/b> — қабілеттердің дамуын жеңілдететін ағзаның туа біткен анатомиялық-физиологиялық ерекшеліктері: ми құрылымының, сезім мүшелері мен қозғалыс мүшелерінің ерекшеліктері.", "Бабаев айтқандай, адамдардың табиғи айырмашылығы дайын қабілетте емес, нышанда. Қабілет нышаннан басталатын даму процесінің нәтижесі және ол тек іс-әрекетте қалыптасады.", "Мысалы, нәзік есту — болашақ музыканттың, түсті жақсы ажырату — суретшінің нышаны. Жүйке жүйесінің ерекшеліктері де (күші, қозғалғыштығы) нышанға жатады.", "Нышандар <b>көпмәнді<\/b>: бір нышан негізінде әртүрлі қабілеттер дамуы мүмкін. Жақсы есту мен ырғақ сезімі бар адам орындаушы, дирижер, әнші, биші не музыка педагогы болуы мүмкін.", "Нышанның дамуы қоғамдық жағдайға тәуелді: қоғамда сол кәсіпке сұраныс болса, адамның нышаны тез әрі жоғары деңгейдегі қабілетке айналады. Ал іс-әрекет болмаса, нышан дамымай қалады."], "terms": ["нышандар", "анатомиялық-физиологиялық ерекшеліктер", "көпмәнділік", "қабілет", "іс-әрекет"], "tip": "Нышан мен қабілетті шатастырмаңыз: туа берілетін — нышан, ал қабілет іс-әрекетте дамиды.", "src": "Бабаев, 20-дәрісбаян (3-бөлім); Маклаков, 23.2; Крысько, 162–163 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі (нышандар)"}}, "Q21": {"n": 21, "id": "Q21", "level": "easy", "topic": 8, "q": "Ықтиярсыз зейін деген не?", "plan": ["<b>Ырықсыз (ықтиярсыз) зейін<\/b> адамның мақсатына қарамай, өздігінен туады, оған ерік күші қатыспайды. Бабаев оны енжар, еріксіз зейін деп те атайды. Мысалы, кенет шыққан дыбыс бәрімізді елең еткізеді.", "Себептердің бірінші тобы — <b>тітіркендіргіштің өзі<\/b>: күші мен қарқындылығы, контрасы, ұзақтығы, көлемі мен пішіні, жаңалығы мен әдеттен тыс болуы, қозғалмалылығы. Мұнда абсолютті емес, <b>салыстырмалы күш<\/b> маңызды: тып-тыныш бөлмеде сыбырдың өзі зейінді тартады.", "Екінші топ — <b>ішкі себептер<\/b>: тітіркендіргіштің адамның қажеттілігі мен көңіл-күйіне сай келуі, тұлғаның бағыт-бағдары мен тәжірибесі, ол оятатын сезім. Қарны ашқан адамның көзіне алдымен тамақ түседі.", "Физиологиялық негізі — <b>бағдарлау рефлексі<\/b> (Павловтың «немене?» рефлексі) және Ухтомскийдің <b>доминантасы<\/b>. Тітіркендіргіш өзгеріссіз қайталана берсе, бағдарлау рефлексі сөнеді.", "Ырықсыз зейін нәрестеде алғашқы апталарда-ақ байқалады. Оның пайдасы — күш салуды керек етпейді, айналадағы өзгерісті тез байқатады. Кемшілігі — бізге бағынбайды, бір қалыпты, ұзақ істе зейінді ұстап тұра алмайды."], "terms": ["ырықсыз зейін", "бағдарлау рефлексі", "доминанта", "салыстырмалы күш", "ішкі себептер"], "tip": "«Ықтиярсыз» мен «ырықсыз» — бір ұғым; себептерді екі топқа — тітіркендіргіштің өзіне және адамның ішкі күйіне — бөліп айтыңыз.", "src": "Зейін сайты, 2 және 8-тараулар; Бабаев, 9-дәрісбаян; Маклаков, 14-тарау; Немов, I бөлім, 10-тарау", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s08-def", "label": "Зейін · 8-тарау: Ырықсыз зейін дегеніміз не?"}}, "Q22": {"n": 22, "id": "Q22", "level": "easy", "topic": 8, "q": "Ықтиярлы зейін деген не?", "plan": ["<b>Ырықты (ықтиярлы) зейінді<\/b> адамның саналы мақсаты басқарады, оған ерік күші қатысады. Оны ерікті, белсенді, ниеттелген зейін деп те атайды. Тарау қызықсыз болса да, студент оны емтиханға керек болғандықтан оқиды.", "Оның басты қызметі — психикалық процестердің ағымын <b>белсенді түрде реттеп<\/b> отыру. Крысько бойынша оған мақсаттылық, ұйымдасқандық және жоғары тұрақтылық тән; тұрақтылық жұмысты жоспарлаумен байланысты.", "Ырықты зейінге <b>қызығу<\/b> жанама әсер етеді: бұл істің өзіне емес, мақсат пен нәтижеге деген қызығу. Ерік күшін салу адамды шаршатады, сондықтан ырықты зейінді ұзақ ұстау қиын.", "Ырықты зейіннің <b>шығу тегі әлеуметтік<\/b> (Выготский): алғашында ересек баланың зейінін сөзбен, ым-ишарамен бағыттайды, кейін бала сол тәсілді сөз арқылы меңгеріп, өзінің ішкі тәсіліне айналдырады.", "Физиология ырықты зейінді толық түсіндіре алмайды: мұнда мақсат қою мен сөз, яғни <b>екінші сигнал жүйесі<\/b> шешуші. Лурия бойынша ырықты зейінді сөйлеу нұсқауы бойынша мидың маңдай бөліктері ұйымдастырады.", "Іс қызықты бола бастаса, ырықты зейін <b>үйреншікті зейінге<\/b> ауысады (Добрынин): мақсат сақталады, бірақ ерік күші керек болмай қалады."], "terms": ["ырықты зейін", "ерік күші", "жанама қызығу", "екінші сигнал жүйесі", "үйреншікті зейін"], "tip": "Ырықты зейінді ырықсыздан ажырататын екі белгіні — мақсаттың болуы мен ерік күшінің қажеттігін — анық айтыңыз.", "src": "Зейін сайты, 3 және 9-тараулар; Бабаев, 9-дәрісбаян; Маклаков, 14-тарау; Крысько, 2.12–2.15-схемалар; Лурия, «Нейропсихология негіздері», III бөлім, «Зейін» тарауы", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s09-def", "label": "Зейін · 9-тарау: Ырықты зейін — мақсат басқарады"}}, "Q23": {"n": 23, "id": "Q23", "level": "easy", "topic": 7, "q": "Қысқа мерзімді ес.", "plan": ["<b>Қысқа мерзімді ес<\/b> — қабылданған ақпаратты өте қысқа уақыт сақтайтын ес (Маклаков). Крысько бойынша — бір рет, өте қысқа қабылдағаннан кейін ақпаратты қысқа мерзімге есте қалдыру.", "Ұзақтығы — шамамен <b>15–30 секунд<\/b>; ақпаратты іштей қайталамасақ, ол жоғалады. Мысалы, жаңа естіген телефон нөмірін теріп болған соң бірден ұмытамыз.", "Көлемі шектеулі: Немов пен OpenStax бойынша ересек адамда орташа <b>7 ± 2 бірлік<\/b> (Миллердің «сиқырлы саны»). Бабаев әдетте материалдың ең мәнді 3–4 бірлігі немесе соңғы бөліктері ғана қалады дейді.", "Көлемді <b>топтастыру<\/b> арқылы ұлғайтуға болады: 87771234567 деген он бір цифрды 8 777 123 45 67 деп бес топқа бөлсек, олар оңай есте қалады.", "Маклаков бойынша қысқа мерзімді ес — ұзақ мерзімді еске тек керекті, іріктелген ақпаратты өткізетін <b>буфер<\/b>. Ұзақ мерзімді еске бұрын қысқа мерзімді есте болған нәрсе ғана түседі (Немов).", "Ақпарат одан екі себеппен жоғалады: <b>іздің ыдырауы<\/b> (Петерсондардың тәжірибесінде 18 секундтан кейін әріп тіркестерінің шамамен 10%-ы ғана есте қалған) және <b>интерференция<\/b>."], "terms": ["қысқа мерзімді ес", "ес көлемі (7 ± 2)", "топтастыру", "іздің ыдырауы", "интерференция"], "tip": "Үш сипаттаманы міндетті түрде атаңыз: ұзақтығы (15–30 с), көлемі (7 ± 2) және ұзақ мерзімді еске тек іріктелген ақпаратты өткізетін буфер екені.", "src": "Ес сайты, 4-тарау; Бабаев, 12-дәрісбаян; Маклаков, 10-тарау; Немов (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s04-stm", "label": "Ес · 4-тарау «Қысқа мерзімді ес»"}}, "Q24": {"n": 24, "id": "Q24", "level": "easy", "topic": 7, "q": "Ұзақ мерзімді ес.", "plan": ["<b>Ұзақ мерзімді ес<\/b> — ақпаратты айлар мен жылдар бойы, кейде өмір бойы сақтайтын ес. Немов оны адамның бүкіл өмір тәжірибесі — білімі, іскерлігі, дағдылары жиналған негізгі қойма дейді.", "Көлемі соншалық үлкен, сондықтан оны іс жүзінде шексіз дейді; бірнеше минуттан артық сақталғанның бәрі ұзақ мерзімді еске кіреді. Дегенмен Бабаев ес миға байланысты болғандықтан, оның да шегі бар екенін ескертеді.", "Басты қиындығы — сақтау емес, <b>еске түсіру<\/b>: көп ақпараттың ішінен керегін іздеп табу. Немов себептерін атайды: ақпаратты ұзақ пайдаланбау, оған апаратын «кілттің» жоғалуы, қолайсыз күй, психологиялық қорғаныс т.б.", "Ақпарат ұзақ мерзімді еске <b>қайталау<\/b> және мағыналы өңдеу арқылы өтеді; ізі біртіндеп бекиді, мұны <b>консолидация<\/b> дейді. Жаңа ізді бекіту үшін мидағы <b>гиппокамп<\/b> ерекше маңызды, бірақ ескі естеліктер одан тыс, ми қыртысында сақталады: гиппокамптары алынған Г. М. отаға дейінгі өмірін есіне алған.", "Ұзақ мерзімді естің жүйелері: <b>эксплициттік<\/b> (эпизодтық — өмірдегі оқиғалар, семантикалық — дүние туралы білім) және <b>имплициттік<\/b> (процедуралық — «қалай істеу керегін» білу, мысалы, велосипед тебу).", "Мысал: мектепке алғаш барған күніңіз, сізді кім қарсы алғаны (эпизодтық), Қазақстанның астанасы (семантикалық), пернетақтада теру дағдысы (процедуралық)."], "terms": ["ұзақ мерзімді ес", "консолидация", "эпизодтық ес", "семантикалық ес", "процедуралық ес"], "tip": "Қысқа мерзімді еспен салыстырып айтыңыз: көлемі шексіз, сақтау мерзімі ұзақ, ал қиындығы — еске түсіруде.", "src": "Ес сайты, 4- және 9-тараулар; Бабаев, 12-дәрісбаян; Немов, Крысько (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s04-ltm", "label": "Ес · 4-тарау «Ұзақ мерзімді ес»"}}, "Q25": {"n": 25, "id": "Q25", "level": "easy", "topic": 9, "q": "Анализ және синтез операциялары.", "plan": ["<b>Талдау (анализ)<\/b> — бүтінді ойша бөліктерге жіктеу немесе бүтіннен оның бір қырын, әрекетін, қатынасын бөліп алу (Бабаев). Тәрбиеші балаларға өсімдіктің тамырын, сабағын, жапырағын бөлек көрсетеді.", "Талдау екі түрлі болады. <b>Тәжірибелік<\/b> талдауда адам затпен тікелей жұмыс істейді: бұзылған су сорғысын бұрап ашып, бөлшектерін қарайды. <b>Ақылдық (теориялық)<\/b> талдауда бәрі ойша жүреді: оқушы сөйлемді талдап, бастауыш пен баяндауышты табады.", "<b>Біріктіру (синтез)<\/b> — әртүрлі бөлшектерді, қасиеттерді, әрекеттерді бір тұтас бүтінге жинау (Бабаев). Бұл бөлшектерді жай үйіп қою емес: кереге, уық, шаңырақ өз орнына қойылғанда ғана киіз үй шығады; оттегі мен сутегінен оларға ұқсамайтын жаңа зат — су пайда болады.", "Екеуі <b>ажырамас бірлікте<\/b> жүреді: тек бүтінді талдай аламыз, ал біріктіру талдауға сүйенеді. Бала оқуды үйренгенде алдымен әріптерді жеке таниды (талдау), сосын буын, сөз, сөйлем құрайды (біріктіру). Қайсысы көбірек керек екені іске, жағдайға және адамның қабілетіне байланысты.", "Басқа ой қызметтерімен ұштаспаған талдау жай бұзуға айналады — Бабаев оны <b>механистік талдау<\/b> дейді: ойыншығын бұзған бала бөлшектерді салыстырмайды, қайта жинамайды, қорытынды шығармайды."], "terms": ["талдау", "біріктіру", "тәжірибелік және ақылдық талдау", "механистік талдау", "ой қызметтері"], "tip": "Біріктіруді бөліктердің жай қосындысы деп айтпаңыз: бүтінде бөліктерде жоқ жаңа сапа туатынын мысалмен көрсетіңіз.", "src": "Ойлау және сөйлеу сайты, 3-тарау; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау (терминдер)", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s03-analysis", "label": "Ойлау және сөйлеу · 3-тарау: Талдау — бүтінді бөлшектеу"}}, "Q26": {"n": 26, "id": "Q26", "level": "easy", "topic": 2, "q": "Интроспекция әдісі.", "plan": ["<b>Интроспекция<\/b> — адамның өз санасындағы процестерді, яғни ойын, сезімін, толғанысын өзі бақылауы. Ұзақ уақыт бойы ол психологияның жалғыз әдісі болды.", "Әдіс екі сенімге сүйенді: сана процестері сырттан бақылауға <b>жабық<\/b>, бірақ оның иесіне <b>ашық<\/b>. Демек, адамның санасын тек оның өзі зерттей алады деп саналды.", "Әдістің негізін философ Дж. Локк қалады. Ол білімнің екі көзін атады: сыртқы дүние және ақылдың өз әрекеті. Ақылдың өз әрекетін бақылауды ол <b>рефлексия<\/b> деп атады және бұған ұзақ жаттығу керек деді.", "Вундт Лейпцигте алғашқы эксперименттік психология зертханасын ашқанда да осы әдісті қолданды: зерттеуші жағдайды жасайды, ал сыналушы өз жан-күйін өзі бақылап, баяндайды.", "<b>Кемшіліктері<\/b> (Маклаков): өз толғанысыңды бақылау өте қиын, бақылаған сәтте ол өзгеріп кетеді немесе тоқтайды; субъективтіліктен құтылу мүмкін емес; толғаныстың кейбір реңкін сөзбен жеткізу қиын. Сана сыртқы дүниеден бөлініп қалды, психология практикаға көмектесе алмады, осыдан дағдарыс туды.", "<b>Бүгінгі орны:<\/b> өзін-өзі бақылау негізгі әдіс емес, бірақ қосалқы әдіс ретінде қолданылады, көбіне сұраумен бірге. Психологтың өзі де өз күйін байқай білуі керек: бұл оның кәсіби дағдысы."], "terms": ["интроспекция", "өзін-өзі бақылау", "рефлексия", "субъективті әдістер", "сана психологиясы"], "tip": "Интроспекцияның кемшілігін айтқанда оны толық жоққа шығармаңыз: ол бүгін де қосалқы әдіс ретінде сұраумен бірге қолданылады.", "src": "Маклаков, 1-тарау (1.4) және 2-тарау (2.2); Бабаев, 1–2-дәрісбаяндар", "link": null}, "Q27": {"n": 27, "id": "Q27", "level": "easy", "topic": 1, "q": "Бихевиоризм мектебінің негізгі формуласы.", "plan": ["<b>Бихевиоризм<\/b> (ағылшынша <i>behaviour<\/i> — мінез-құлық) — XX ғасырдың басында АҚШ-та пайда болған бағыт. Негізін салушы — Дж. Уотсон. Ол психология сананы емес, сырттан бақыланатын мінез-құлықты зерттеуі керек деді.", "<b>Негізгі формула — S → R<\/b> (стимул → реакция). Уотсон бойынша сыртқы әсер, яғни <b>стимул<\/b> болмаса, ешқандай әрекет болмайды. Мінез-құлық — стимулға берілетін <b>реакциялар<\/b> жүйесі.", "Осыдан психологияның міндеті шығады: стимулды біліп, адамның реакциясын алдын ала болжау және, керісінше, реакцияға қарап оны тудырған стимулды анықтау.", "Күрделі әрекет қалай пайда болады? Уотсон Павлов пен Бехтеревтің шартты рефлекс туралы еңбектеріне сүйенді. <b>Мысал:<\/b> ана баланы сипағанда, бала жымияды. Кейін баланың жымиюына ананың бет-әлпетін көрудің өзі жеткілікті болады: бейтарап стимул шартты стимулға айналады.", "Кейін необихевиорист Э. Толмен бұл формулаға түзету енгізді: S пен R-дің арасына <b>аралық айнымалыларды<\/b> (V) қойды, сонда формула <b>S → V → R<\/b> болды. Аралық айнымалы деп ол стимулдың әсерін өзгертетін ішкі процестерді атады: мақсат, ниет, болжам, танымдық карталар.", "<b>Сыны:<\/b> формула бойынша адам ойсыз «стимул — жауап» машинасы сияқты көрінеді. Бихевиоризм сана, ойлау, ерік ұғымдарын психологиядан шығарып тастады және психиканың әлеуметтік жағын ескермеді. Бабаевтың сөзімен айтсақ, психология «санасыз» ғылымға айналды."], "terms": ["бихевиоризм", "S → R формуласы", "стимул", "реакция", "шартты рефлекс"], "tip": "Формуланы әріппен ғана айтпаңыз: S мен R-ді ашып, Уотсонның мысалын келтіріп, соңында бағыттың басты кемшілігін атаңыз.", "src": "Маклаков, 2-тарау (2.3); Бабаев, 2-дәрісбаян", "link": null}, "Q28": {"n": 28, "id": "Q28", "level": "easy", "topic": 1, "q": "Психоанализдің негізін салушы.", "plan": ["<b>Психоанализдің негізін салушы<\/b> — австриялық ғалым Зигмунд Фрейд. Бұл ілім алғашында жүйке ауруларымен ауыратын науқастарды емдеу және ауруының табиғатын түсіндіру үшін пайда болды, кейін адам туралы жалпы ілімге айналды.", "Фрейдтің басты идеясы: адамның әрекетін санадан гөрі <b>бейсана<\/b> басқарады. Бейсанада құмарлықтар (ең бастысы — <i>либидо<\/i>) жатыр, ал қоғам оларға тыйым салады. Осы екеуінің арасында үнемі қақтығыс жүреді.", "Басылған тілек сыртқа айналма жолмен шығады: түс, жаңсақ сөйлеу не жазу, жағымсыз нәрсені ұмыту, невроз белгілері.", "Фрейд тұлғаны үш бөлікке бөлді: <b>Ид<\/b> — бейсаналық құштарлықтар, <b>Эго<\/b> — «Мен»: шындықтың талабына сүйеніп, Ид пен Супер-эгоны татуластырады; <b>Супер-эго<\/b> — адам қабылдаған қоғамдық нормалар мен ар-ождан.", "Бейсананы зерттеудің екі әдісін ұсынды: <b>еркін ассоциациялар<\/b> және <b>түс жору<\/b>. Оның ізбасарлары — К. Юнг, А. Адлер, К. Хорни, Э. Фромм — тереңдік психологиясын дамытты.", "<b>Сыны:<\/b> Фрейд ілімінің көп қағидасының сенімді ғылыми дәлелі жоқ, ол сананың күшін кемітіп, қоғамның ықпалын ескермейді. Дегенмен бейсананың бар екенін көрсету — оның ғылымға қосқан үлкен үлесі."], "terms": ["психоанализ", "бейсана", "либидо", "Ид, Эго, Супер-эго", "еркін ассоциациялар"], "tip": "Тек есімді айтып тоқтамаңыз: Фрейдтің басты идеясын, тұлға құрылымын және әдістерін қысқаша атаңыз.", "src": "Бабаев, 2-дәрісбаян (Фрейдизм); «Психика, ми, сана» сайты, 19–20-тақырыптар (Немов, 5.4–5.5); «Тұлға психологиясы» сайты (тұлға құрылымы)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qurylym", "label": "Тұлға құрылымы · Фрейд теориясы"}}, "Q29": {"n": 29, "id": "Q29", "level": "easy", "topic": 5, "q": "Қарым-қатынас анықтамасы.", "plan": ["<b>Қарым-қатынас<\/b> (Бабаевта — <i>тілдесу<\/i>) — бірлескен іс-әрекет қажеттілігінен туатын, адамдар арасындағы байланыс. Онда адамдар білімін, ойын, ниетін, қызығуы мен сезімін бір-бірімен бөліседі.", "Қарым-қатынастың нәтижесі — зат емес, адам мен адамның, адам мен топтың арасында орнаған қатынас. Іс-әрекеттің нәтижесі — өнім, ал қарым-қатынастың нәтижесі — адамдар арасындағы қатынас. Сондықтан оған кемінде екі белсенді адам керек: бірі сөйлеп, екіншісі тек тыңдап тұрса да, екеуі бір-біріне әсер етеді.", "Бабаев қарым-қатынастың үш жағын бөледі: <b>коммуникативтік<\/b> (ақпарат алмасу), <b>интерактивтік<\/b> (бір-біріне ықпал ету) және <b>перцептивтік<\/b> (бірін-бірі қабылдап, түсіну).", "Қарым-қатынас <b>вербалды<\/b> (сөз арқылы) және <b>вербалды емес<\/b> (ым, ишара, дауыс ырғағы, дене қимылы арқылы) болады. Сөз ойдың мағынасын жеткізсе, вербалды емес белгілер ниет пен көңіл-күйді білдіреді.", "Мысал: студенттер топтық жобаны талқылап отыр. Олар идея алмасады (ақпарат), бір-бірін көндіреді (ықпал), әрі кімнің сенімді, кімнің шаршағанын сезеді (қабылдау). Осы үшеуі қосылып, бір қарым-қатынасты құрайды."], "terms": ["қарым-қатынас (тілдесу)", "коммуникативтік жағы", "интерактивтік жағы", "перцептивтік жағы", "вербалды емес қарым-қатынас"], "tip": "Анықтамада қарым-қатынастың нәтижесі зат емес, адамдар арасындағы қатынас екенін міндетті түрде айтыңыз: оны іс-әрекеттен ажырататын белгі — осы.", "src": "Бабаев, 8-дәрісбаян (тілдесу психологиясы)", "link": null}, "Q30": {"n": 30, "id": "Q30", "level": "easy", "topic": 4, "q": "Іс-әрекет анықтамасы.", "plan": ["<b>Іс-әрекет<\/b> — адамның айналадағы дүниемен белсенді байланысы. Адам осы байланыста дүниені таниды және оны өз қажетіне қарай өзгертеді.", "Іс-әрекеттің басты белгілері: оның әрдайым <b>түрткісі (мотиві)<\/b> мен <b>саналы мақсаты<\/b> болады; ол затқа бағытталады және нәтиже береді. Саналы мақсат адамның іс-әрекетін жануардың белсенділігінен ажыратады.", "Іс-әрекет — қоғамдық құбылыс. Адам бір нәрсені тек өзі үшін жасаса да, басқалардан алған білім мен тәжірибені пайдаланады.", "Іс-әрекет <b>сыртқы<\/b> (затпен жасалатын) және <b>ішкі<\/b> (ойша) болады. Сыртқы әрекеттің ішкі ойша әрекетке айналуын <b>интериоризация<\/b>, ал ішкі жоспардың сыртқы әрекетте көрінуін <b>экстериоризация<\/b> дейді.", "Адам өмір бойы үш негізгі іс-әрекетпен айналысады: <b>ойын, оқу және еңбек<\/b>. Әр жас кезеңінде бір іс-әрекет <b>жетекші<\/b> болады, яғни психиканың дамуын сол іс-әрекет алға сүйрейді. Жалпы алғанда, мектеп жасына дейін ойын, мектепте оқу, ересекте еңбек жетекші болады.", "Мысал: студент курстық жұмыс жазады. Түрткісі — білім алу мен жақсы баға, мақсаты — дайын жұмыс. Ол әдебиет оқиды, жоспар құрады, мәтін жазады: мұның бәрі бір іс-әрекеттің құрамындағы әрекеттер."], "terms": ["іс-әрекет", "түрткі (мотив)", "мақсат", "интериоризация", "жетекші іс-әрекет"], "tip": "Іс-әрекетті кез келген белсенділікпен шатастырмаңыз: оның басты белгісі — саналы мақсат пен түрткі.", "src": "Бабаев, 6-дәрісбаян; Маклаков, 5.1", "link": null}, "Q31": {"n": 31, "id": "Q31", "level": "medium", "topic": 3, "q": "Психиканың филогенездік даму этаптарын талдаңыз.", "plan": ["Тірі ағзаның бәрінде <b>тітіркену<\/b> бар: ол тек тіршілікке тікелей қажет әсерге жауап береді. Өсімдіктер осы сатыда қалады.", "Леонтьевтің болжамы бойынша, психика <b>сезу<\/b> пайда болғанда туды. Сезу — бейтарап әсерге де жауап беру, егер ол қажетті нәрсенің белгісі болса. Мысалы, Брамштедт тәжірибесінде бір жасушалылар алдымен жарыққа жауап бермеген. Ал жарық ұзақ уақыт жылумен байланыстырылғанда, олар жарыққа жауап бере бастаған: жарық жылудың белгісіне айналған.", "<b>Қарапайым сенсорлық психика<\/b> — бірінші саты. Жануар заттың жеке қасиетін ғана бейнелейді: иісін, жылуын, жарығын. Бұл сатыда қарапайымдылар, құрттар, жәндіктер тұр, мінез-құлқы негізінен инстинктік.", "<b>Перцептивтік психика<\/b> — екінші саты. Жануар енді затты тұтас бейнелейді. Инстинктпен қатар өз өмірінде үйренген <b>дағды<\/b> күшейеді. Бұл сатыда омыртқалылар тұр.", "<b>Интеллект сатысы<\/b> жоғары сүтқоректілерде, әсіресе адамтектес маймылдарда болады. Жануар заттардың арасындағы байланысты бейнелейді. Мысалы, Кёлердің тәжірибесінде шимпанзе екі таяқты жалғап, жемісті тартып алды.", "Тәжібаев мінез-құлық түрлерін бөледі: <b>тропизм<\/b> → <b>инстинкт<\/b> (тұқым арқылы беріледі) → <b>дағды<\/b> (жеке өмірде үйреніледі, негізі — шартты рефлекс) → <b>ақыл нышандары<\/b>. Бұл жіктеу Леонтьевтің сатыларына сай келеді: сенсорлық сатыда инстинкт, перцептивтік сатыда дағды, интеллект сатысында ақыл нышандары басым. Айырмашылығы: Леонтьев жануардың нені бейнелейтініне қарап бөледі (жеке қасиет → тұтас зат → заттар арасындағы байланыс), ал Тәжібаев мінез-құлық түріне қарап бөледі.", "<b>Қорытынды:<\/b> ең жоғары саты да санаға жетпейді. Кёлердің сөзімен, маймылдың ақылы «көру сезімінің құлы»: жеміс пен құрал көз алдында тұрғанда ғана жұмыс істейді. <b>Сана<\/b> тек адамда еңбек пен тіл арқылы пайда болды."], "terms": ["тітіркену", "сезу", "қарапайым сенсорлық психика", "перцептивтік психика", "интеллект сатысы", "инстинкт"], "tip": "Әр сатыны «не бейнелейді + қай жануар + мінез-құлық түрі» деген үш белгімен айтыңыз.", "src": "Бабаев, 3-дәрісбаян; «Психика, ми, сана» сайты, 2–3-тақырыптар (Тәжібаев, IV тарау)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#zhanuar", "label": "Инстинкт, дағды, интеллект · сайттың 3-тақырыбы"}}, "Q32": {"n": 32, "id": "Q32", "level": "medium", "topic": 6, "q": "Түйсіктердің жіктелуі және олардың сипаттамасы.", "plan": ["Түйсіктерді бірнеше белгі бойынша жіктейді. Ең қарапайымы — сезім мүшелері бойынша: көру, есту, иіс, дәм, тері, кинестезиялық, діріл, органикалық түйсіктер (Бабаев). Лурия екі принципті атайды: <b>жүйелік<\/b> (сигнал қайдан келеді) және <b>генетикалық<\/b> (сезгіштік эволюцияда қашан пайда болды). Шеррингтонның жіктеуі — жүйелік принциптің, Хэдтің жіктеуі генетикалық принциптің мысалы.", "<b>Ч. Шеррингтонның жіктелуі<\/b> — ең белгілісі, онда үш топ бар. <b>Экстероцептивті<\/b> түйсіктер сыртқы дүниеден хабар береді. Олар <b>дистантты<\/b> (көру, есту, иіс сезу) және <b>контактілі<\/b> (дәм, температура, жанасу) болып бөлінеді.", "<b>Интероцептивті<\/b> түйсіктер ішкі мүшелердің күйін хабарлайды: аштық, шөлдеу, жүректің қысылуы. Бабаев бойынша олар — ең көне, бұлыңғыр түйсіктер, адамның көңіл күйіне жақын.", "<b>Проприоцептивті<\/b> түйсіктер дененің кеңістіктегі қалпы мен қозғалысын хабарлайды; рецепторлары бұлшықеттер мен буындарда, тепе-теңдік рецепторлары ішкі құлақта орналасқан.", "<b>Б. М. Теплов<\/b> сол белгіге сүйеніп, екі топ қана бөледі (экстероцепторлар мен интероцепторлар), ал проприоцептивті түйсіктерді ішкі түйсіктерге қосады.", "<b>Х. Хэдтің генетикалық жіктелуі<\/b>: <b>протопатиялық<\/b> сезгіштік — көне, қарапайым, эмоциямен тығыз байланысты (аштық, шөлдеу); <b>эпикритикалық<\/b> — кейін пайда болған, нәзік ажырататын, негізгі сезім мүшелеріне байланысты.", "Қорытынды: жіктеулер бір-біріне қайшы емес, түйсікке әр қырынан қарайды. Барлық түйсіктің ортақ қасиеттері бар: сапа, қарқын, ұзақтық, кеңістікте орны (Бабаев)."], "terms": ["экстероцептивті түйсіктер", "интероцептивті түйсіктер", "проприоцептивті түйсіктер", "дистантты және контактілі түйсіктер", "протопатиялық және эпикритикалық сезгіштік"], "tip": "Әр жіктеудің қай белгіге сүйенетінін алдымен айтыңыз, сосын топтарын атаңыз; Шеррингтон мен Хэдтің топтарын араластырмаңыз.", "src": "Түйсік және қабылдау сайты, 4-тарау; Бабаев, 10-дәрісбаян; Маклаков, Немов (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s04", "label": "Түйсік және қабылдау · 4-тарау «Түйсік түрлері (жіктелуі)»"}}, "Q33": {"n": 33, "id": "Q33", "level": "medium", "topic": 6, "q": "Қабылдау қасиеттерін (заттылық, тұтастық, константтылық) салыстырыңыз.", "plan": ["Үш қасиет бір тізбекті құрайды: заттылық бейненің <i>неге<\/i> қатысты екенін, тұтастық оның <i>қандай түрде<\/i> берілетінін, константтылық жағдай өзгергенде оның <i>сақталатынын<\/i> көрсетеді.", "<b>Заттылық<\/b> — дүниені байланыспаған түйсіктер жиынтығы ретінде емес, жеке заттар түрінде бейнелеу. Алаңда «қозғалып келе жатқан түрлі түсті дақты» емес, досыңызды көресіз. Немов мұны түйсік пен бейненің басты айырмасы дейді.", "<b>Тұтастық<\/b> — затты бөліктерінің жиынтығы ретінде емес, біртұтас бейне ретінде бейнелеу. Бағананың артында жартылай тұрған адамды «жарты адам» деп емес, тұтас адам деп көреміз: жетпейтін бөлікті қабылдау өзі толықтырады.", "<b>Константтылық<\/b> — қашықтық, жарық, бұрыш өзгерсе де, заттың шамасын, пішінін, түсін тұрақты қабылдау. Алыстағы жүк көлігі бәрібір үлкен, ашылған есік бәрібір тік бұрышты болып көрінеді; көмір күн астында да қара, бор ымыртта да ақ.", "Тетіктері әртүрлі. Заттылық <b>қозғалыс<\/b> арқылы қалыптасады: бала затты ұстап, сипап, көзбен шолып үйренеді (Сеченов). Тұтастық түйсіктер арасындағы шартты рефлекторлық байланыстарға сүйенеді (Маклаков). Константтылық сақталады, өйткені қабылдау жағдайдың өзгерісін ескеріп, оны <b>түзетіп<\/b> отырады: көз бұлшықеттерінің кернеуін, жарыққа бейімделуді, бұрынғы тәжірибені пайдаланады.", "Ортақ белгісі: үшеуі де туа бітпейді, тәжірибе мен іс-әрекет арқылы дамиды. Константтылықтың да шегі бар: тауның басынан төмендегі адамдар шынымен кішкентай көрінеді.", "Қорытынды: заттылық болмаса, тұтас бейне құралмайды, ал константтылықсыз тұтас бейне әр қадам сайын «өзгеріп» кетер еді. Үшеуі бірге құбылмалы дүниені тұрақты заттар әлемі ретінде көрсетеді."], "terms": ["заттылық", "тұтастық", "константтылық", "шама, пішін және түс константтылығы", "перцептивтік іс-әрекет"], "tip": "Әр қасиетке бір мысал айтыңыз да, салыстыруды «не бейнеленеді — қалай — неліктен тұрақты» деген үш сұрақпен құрыңыз.", "src": "Түйсік және қабылдау сайты, 14-тарау; Бабаев, 11-дәрісбаян; Маклаков, Немов, Крысько (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s14", "label": "Түйсік және қабылдау · 14-тарау «Қабылдаудың қасиеттері»"}}, "Q34": {"n": 34, "id": "Q34", "level": "medium", "topic": 7, "q": "Естің психологиялық және физиологиялық теориялары.", "plan": ["Ес теориялары екі сұраққа жауап береді: физиологиялық теориялар естің <i>тетігін<\/i> (мида не болады), ал психологиялық теориялар оның <i>мазмұны мен себебін<\/i> (адам нені және неге есте сақтайды) түсіндіреді.", "<b>Физиологиялық негіз<\/b> — жүйке жүйесінің пластикалығы: әр жүйке процесі мида із қалдырады. Павлов бойынша есте қалдырудың негізі — уақытша жүйке байланыстары, яғни бірге әсер еткен тітіркендіргіштер арасындағы байланыс.", "<b>Нейрондық теория<\/b> (Бабаев): қысқа мерзімді ес нейрондардың уақытша электрлік белсенділігіне сүйенеді (қозу тұйық тізбекпен айналады — <b>реверберация<\/b>), ал ұзақ мерзімді ес нейрондар байланысының тұрақты өзгерісіне сүйенеді; із біртіндеп бекиді (<b>консолидация<\/b>).", "<b>Биохимиялық теория<\/b>: ес іздері РНҚ сияқты молекулалардың өзгерісімен байланысты. Бабаев үйретілген жалпақ құрттың РНҚ-сын екінші құртқа еккенде, ол алғашқысының дағдысын қайталағанын келтіреді. Кейін бұл тәжірибелерді басқа зерттеушілер тұрақты түрде қайталай алмады, сондықтан теория толық дәлелденбеген.", "<b>Ассоциативтік теория<\/b>: ес — елестердің жанасу, ұқсастық, қарама-қарсылық, себеп-салдар бойынша байланысуы. Бастауы — Аристотель, ал Немов бойынша ес туралы ілімде оны Г. Эббингауз бен Г. Мюллер дамытты; Эббингауз мағынасыз буындарды жаттау тәсілін ұсынды. Ол көп заңдылықты ашты, бірақ естің мақсаттылығын, қажеттілік пен эмоцияға тәуелділігін түсіндіре алмады.", "<b>Гештальтпсихология<\/b> материал тұтас құрылым ретінде есте қалатынын, <b>психоанализ<\/b> ес мотивке бағынатынын көрсетті. <b>Әрекеттік-мағыналық теория<\/b> (Выготский, Смирнов, Зинченко): ес — мақсатты әрекет, материал әрекеттің мақсатына айналса, жақсы есте қалады. <b>Когнитивтік теория<\/b> есті ақпаратты өңдейтін блоктар жүйесі ретінде қарайды.", "Қорытынды: физиологиялық және психологиялық теориялар бірін-бірі толықтырады. Әр теория алдыңғысының әлсіз жеріне жауап берді, бірақ өзі жаңа сұрақ қалдырды."], "terms": ["жүйке жүйесінің пластикалығы", "реверберация", "консолидация", "ассоциация", "әрекеттік-мағыналық теория"], "tip": "Теорияларды тізіп қана қоймаңыз: әрқайсысы не бергенін және неге жетпегенін айтыңыз.", "src": "Ес сайты, 2- және 10-тараулар; Бабаев, 12-дәрісбаян; Маклаков, 10-тарау; Немов (сайт бойынша)", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s10", "label": "Ес · 10-тарау «Естің теориялары»"}}, "Q35": {"n": 35, "id": "Q35", "level": "medium", "topic": 7, "q": "Реминисценция мен интерференция феномендерін салыстыру.", "plan": ["Екі құбылыс — бір жұп: екеуі де есте қалдырудан кейін болатын процестердің еске түсіруге әсерін көрсетеді. Интерференцияда еске түсіру нашарлайды, реминисценцияда керісінше жақсарады.", "<b>Интерференция<\/b> — бұрынғы және кейінгі ақпараттың бірін-бірі басуы, еске түсіруге кедергі жасауы. Ақпарат естен өшпейді, тек оған қол жетпей қалады. Ұмытудың интерференциялық теориясын Г. Мюллер мен А. Пильцекер негіздеген.", "Екі түрі бар. <b>Проактивті<\/b>: ескі ақпарат жаңасына кедергі жасайды (жаңа телефон нөмірінің орнына ескісін айтамыз). <b>Ретроактивті<\/b>: жаңа ақпарат ескісін еске түсіруге кедергі жасайды (биологиядан кейін бірден физиканы оқысақ, биология нашар еске түседі).", "А. А. Смирновтың тәжірибесі: сөз жаттаған соң бірден басқа сөз жаттаса, еске түсіру 25%-ға, қиын есеп шығарса 16%-ға, сан жаттаса 8%-ға төмендеген. Демек кейінгі іс ұқсас, қиын және үзіліссіз болса, кедергі күшейеді.", "<b>Реминисценция<\/b> — жаттағаннан біраз уақыт өткен соң материалды бастапқыдан толығырақ әрі дәлірек еске түсіру. Маклаков бойынша ол көлемді сөздік материалда, мектеп жасына дейінгі балалар мен бастауыш сынып оқушыларында жиі кездеседі.", "Себептері: жүйке жасушалары демалып, қалпына келеді; материал ой елегінен өтеді; ес іздері біртіндеп бекиді (<b>консолидация<\/b>).", "Қорытынды: екеуінен бір кеңес шығады — ұқсас пәндерді қатар оқымау, оқығаннан кейін үзіліс жасап, ұйқыға уақыт беру. Сонда интерференция азаяды, реминисценцияға мүмкіндік туады."], "terms": ["интерференция", "проактивті интерференция", "ретроактивті интерференция", "реминисценция", "консолидация"], "tip": "Проактивті мен ретроактивтіні «қай ақпарат зардап шекті?» деген сұрақпен ажыратыңыз: жаңасы зардап шексе — проактивті, ескісі — ретроактивті.", "src": "Ес сайты, 7-тарау; Маклаков, 10-тарау; Бабаев, 12-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s07", "label": "Ес · 7-тарау «Интерференция және реминисценция»"}}, "Q36": {"n": 36, "id": "Q36", "level": "medium", "topic": 8, "q": "Зейін теорияларына (Вундт, Ланге, Рибо) салыстырмалы талдау.", "plan": ["Үш ғалым бір сұраққа жауап іздеді: зейінді не тудырады және оны не ұстап тұрады? Вундт жауапты сананың ішкі белсенділігінен, Рибо дене мен эмоциядан, Ланге қимыл мен адамның тәжірибесінен іздеді. Үшеуін үш сұрақпен салыстырамыз: зейінді не тудырады, қандай тетікпен жүреді, қай жері әлсіз.", "<b>Вундт<\/b> (интроспективті сана психологиясы) зейінді белсенді еріктің көрінісі, яғни <b>апперцепция<\/b> деп түсінді (Лурия): зейінді сырттағы зат емес, сананың өзі туғызады, ол сананың анықтығы болып сезіледі. Маклаков оның әлі күнге мәнін жоймаған қорытындысын келтіреді: адам бір мезгілде берілген екі тітіркендіргішке қатар шоғырлана алмайды.", "Вундт бағытының әлсіз жері: ол зейінді сипаттады, бірақ түсіндірмеді. Анықтық — зейіннің нәтижесі, ал нәтиже себептің орнын баса алмайды; интроспекция деректерін бақылаушының өзінен басқа ешкім тексере алмайды.", "<b>Рибоның аффективті-моторлық теориясы<\/b>: зейінді эмоция тудырады, ал бұлшықет қимылы мен тамыр, тыныс реакциялары оны ұстап тұрады. Ырықты зейіннің құпиясы — қимылды басқара білу, зейіннің тарқауы — бұлшықеттің шаршауы. Крысько бойынша Рибо ырықты зейіннің тетігін алғаш көрсеткендердің бірі: импульс қыртыстан бұлшықетке барып, қайта оралады да, естелікті күшейтеді (кері байланыс).", "Рибоға айтылған сын (Немов): бұлшықетін нәзік басқаратын спортшылардың зейіні басқалардан артық емес; терең ойланғанда дене керісінше босаңсиды. Демек бұлшықет зейіннің себебі емес, көбіне серігі ғана.", "<b>Ланге<\/b> алдымен сол кездегі көзқарастарды жүйелеп, жеті тұжырымға жинады. Ол қимылдың маңызымен келісті, бірақ өз теориясын <b>аналитикалық<\/b> деп атады: зейін тұтас елестерді бөліктерге бөліп, санада саралайды. Немов бойынша бұл — Рибо сипаттаған күшейтуден кейінгі, зейіннің екінші қызметі.", "Қорытынды: Вундт зейіннің ішкі белсенділігін, Рибо оның эмоциямен және тәндік серіктерімен байланысын, Ланге талдау қызметі мен тәжірибенің маңызын көрсетті. Ешқайсысы ырықты зейінді толық түсіндіре алмады: оның әлеуметтік тегін кейін Выготский ашты."], "terms": ["апперцепция", "интроспекция", "аффективті-моторлық теория", "аналитикалық теория", "кері байланыс (Рибо тетігі)"], "tip": "Н. Н. Лангені (зейін теориясы) Г. Лангемен (Джемс–Ланге эмоция теориясы) шатастырмаңыз; Немов аффективті-моторлық теорияны «Ланге ұсынып, Рибо дамытты» дейді, ал Маклаков пен Крысько оны Рибоның теориясы деп атайды.", "src": "Зейін сайты, 4–5-тараулар; Маклаков, 14-тарау; Немов, I бөлім, 10-тарау; Крысько, 2.15-схема; Лурия, «Нейропсихология негіздері», III бөлім, «Зейін» тарауы; Бабаев, 9-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s05", "label": "Зейін · 5-тарау: Рибо мен Ланге — қимылдан апперцепцияға"}}, "Q37": {"n": 37, "id": "Q37", "level": "medium", "topic": 9, "q": "Ойлау операцияларының өзара байланысы.", "plan": ["<b>Ой қызметтері (операциялары)<\/b> — адам ой барысында орындайтын ақыл әрекеттері. Бабаев алтауын атайды: талдау, біріктіру, салыстыру, дерексіздендіру, нақтылау, қорытындылау; Немовтың тізімінде бесеу, онда салыстыру жоқ. Олар ешқашан жеке-дара жүрмейді, бірі екіншісіне ауысып отырады.", "<b>Талдау мен біріктіру<\/b> — қарама-қарсы, бірақ ажырамас жұп: бүтін болмаса, бөлетін ештеңе жоқ; бөліктерді біріктіру үшін алдымен оларды талдау арқылы тану керек. Дәрігер әр белгіні бөлек тексереді (талдау), сосын бәрін бір суретке жинап, «бұл — тұмау» дейді (біріктіру).", "<b>Салыстыру<\/b> талдауға сүйенеді: екі затты салыстыру үшін алдымен олардың белгілерін бөліп алу керек. Салыстыру әрдайым бір белгі бойынша жүреді; көп жақты, терең салыстыру мәнді белгіні табуға апарады.", "<b>Дерексіздендіру<\/b> талдау мен салыстырудан туады: заттың бір белгісін бөліп алып, қалғанын елемейміз. <b>Қорытындылау<\/b> соған сүйенеді: заттарды ортақ әрі мәнді белгісі бойынша бір ұғымға біріктіреміз — алма, алмұрт, өрік «жеміс» болады.", "<b>Нақтылау<\/b> — дерексіздендіруге қарсы жол: жалпы ойдан нақты мысалға қайта түсеміз. Жақсы дәрісте екі жол кезектесіп отырады: ереже — мысал — қайтадан ереже.", "Осы алты қызметтің негізінде жоғарырақ екі қызмет құрылады — <b>топтастыру<\/b> мен <b>жүйелестіру<\/b> (Бабаев). «Қазақтың ұлттық аспаптары» баяндамасын дайындаған студент бәрін бір тізбекте қолданады: аспапты бөліктерге бөледі, домбыра мен қобызды салыстырады, «дыбыс қалай шығады?» деген бір белгіні бөліп алады, «ішекті аспап» ұғымын шығарады, аспаптарды топқа бөледі, бәрін баяндамаға жинайды, әр топтан бір аспаптың дыбысын тыңдатады.", "Қорытынды: әр қызмет алдыңғысының нәтижесін пайдаланады. Бір буын түсіп қалса, ойлау толық болмайды: басқа қызметтермен ұштаспаған талдау жай бұзуға айналады (механистік талдау), ал бір жақты, үстірт салыстыру қате қорытындыға апарады."], "terms": ["ой қызметтері", "талдау мен біріктірудің бірлігі", "салыстыру", "дерексіздендіру", "қорытындылау", "топтастыру мен жүйелестіру"], "tip": "«Қорытындылау» (ой қызметі) мен «ой қорытындысын» (ойлау формасы) шатастырмаңыз; әр байланысты «бұл қызмет анау қызметке сүйенеді, өйткені…» деп дәлелдеңіз.", "src": "Ойлау және сөйлеу сайты, 3-тарау; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау (терминдер)", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s03", "label": "Ойлау және сөйлеу · 3-тарау: Ой қызметтері"}}, "Q38": {"n": 38, "id": "Q38", "level": "medium", "topic": 9, "q": "Ойлау мен сөйлеудің арақатынасы (Л. Выготский).", "plan": ["Мәселе екі сұрақтан тұрады: ересек адамда ойлау мен сөйлеу қалай байланысқан (статикада) және бала өскен сайын бұл байланыс қалай құралады (динамикада). Выготскийдің «Ойлау және сөйлеу» еңбегі екеуіне де жауап берді.", "Выготский ойлау мен сөйлеу бірлігінің ең кіші бөлшегін <b>сөз мағынасы<\/b> деп атады. Мағынасыз сөз жай дыбыс болып қалады, ал әр сөз мағынасы — жалпылау, яғни ой; сондықтан сөз мағынасы әрі сөйлеуге, әрі ойлауға жатады. Бірақ <b>ой мен сөз дәл сәйкес келмейді<\/b>: ойдың өз құрылымы, өз ағысы бар. Ой <b>симультанды<\/b> — басымызда тұтас, бір мезгілде тұрады; сөйлеу <b>сукцессивті<\/b> — сөзден сөзге біртіндеп өрбиді. Әйгілі теңеу: ой — төніп тұрған бұлт, сөз — одан тамшылап төгілетін жаңбыр.", "Бабаев та осыған жақын: сөз — негізгі ойлау құралы, бірақ ой мен сөз бір нәрсе емес. Бір ойды әртүрлі сөзбен айтамыз; кейде ой бар, сөз табылмайды; кейде көп сөйлеп, бір ойды жеткізе алмаймыз.", "Ойлау мен сөйлеудің <b>генетикалық тамыры бөлек<\/b
