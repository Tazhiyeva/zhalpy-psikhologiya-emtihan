йты, 6- және 7-тараулар", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s06", "label": "Түйсік және қабылдау · 6-тарау «Сезгіштік және психофизика»"}, "topic": 6}, "06-H1": {"id": "06-H1", "level": "hard", "q": "Айгерім таңертеңнен бері ас үйде тамақ пісіріп жүр. Сабақтан оралған құрбысы есіктен кірген бойда газдың әлсіз иісін сезіп, «Газ шығып тұр!» деді. Айгерім ешқандай иіс сезбейтінін айтты, бірақ далаға шығып, біраз жүріп қайта кіргенде, ол да иісті анық сезді. Бұл жағдайды түйсіктің қандай заңдылығымен түсіндіресіз? Қыздарға қандай кеңес бересіз?", "plan": ["Жағдайда екі құрбының бір иіске сезгіштігі әртүрлі болып тұр, ал Айгерімнің өз сезгіштігі таза ауадан кейін қайта артты. Бұл — <b>сенсорлық бейімделудің<\/b> көрінісі.", "<b>Сенсорлық бейімделу<\/b> — тітіркендіргіштің үздіксіз немесе ұзақ әсерінен анализатор сезгіштігінің артуы не төмендеуі. Тұрақты тітіркендіргішті біз біртіндеп сезбей қаламыз.", "Талдау: Айгерім иісті ортада ұзақ болды, сондықтан иіске сезгіштігі төмендеп, табалдырығы көтерілді. Әлсіз иіс енді оның табалдырығына жетпей қалды. Ал құрбысы таза ауадан келді, оның сезгіштігі жоғары, сондықтан әлсіз иісті бірден сезді.", "Айгерім таза ауада біраз жүрген соң, иісті өзі де сезді: тітіркендіргіш әсер етпегенде сезгіштік қайта артады. Демек айырманың себебі адамдардың өзінде емес, иістің оларға қанша уақыт әсер еткенінде.", "Бейімделудің бағытын тітіркендіргіштің күші анықтайды: күшті әрі ұзақ әсер ететін тітіркендіргіш сезгіштікті төмендетеді, ал әлсіз тітіркендіргіш немесе оның болмауы арттырады. Иіске бейімделу айқын байқалады. Бейімделу рецептордың өзінде де жүреді, ал ұзақ тітіркенуге ми қыртысы қорғаныштық тежелумен жауап береді.", "Бейімделу пайдалы: ол сезім мүшелерін тым күшті тітіркендіргіштен «қорғайды», әлсізін сезуге мүмкіндік береді. Бірақ бұл жағдайда ол қауіпті: адам шығып жатқан газды сезбей қалуы мүмкін.", "Кеңес: ас үйді жиі желдету; ұзақ тамақ пісіргенде анда-санда таза ауаға шығып келу, сонда иіске сезгіштік қайта артады. Сырттан келген адам иіс сезсе, оны елемей, плитаны бірден тексеру. Иіске бейімделген адам өз мұрнына толық сене алмайтынын есте ұстау."], "terms": ["сенсорлық бейімделу", "сезгіштік", "абсолютті төменгі табалдырық", "иіс сезу"], "tip": "Айырманы «құрбысының мұрны сезгіш» деп түсіндірмеңіз: Айгерім таза ауадан кейін иісті өзі де сезді, демек басты себеп — иіске ұзақ әсер ету.", "src": "Түйсік және қабылдау сайты, 7-тарау", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s07", "label": "Түйсік және қабылдау · 7-тарау «Бейімделу және түйсіктердің өзара әрекеттесуі»"}, "topic": 6}, "06-H2": {"id": "06-H2", "level": "hard", "q": "Аялдама жанында көлік жаяу жүргіншіні қағып кетті. Жолдан өтуге дайындалып тұрған студент тек «сұр көлік тез өтіп кетті» деді. Ал көлік қозғалысын қадағалап тұрған жол инспекторы көліктің маркасын, нөмірінің бір бөлігін және жүргізушінің қай жерде тежемегенін айтып берді. Куәгерлердің айырмашылығын қабылдаудың қандай ерекшеліктерімен түсіндіресіз? Тергеушіге қандай кеңес бересіз?", "plan": ["Жағдайда бір оқиғаны екі адам әртүрлі қабылдады. Айырмашылық сезім мүшелерінде емес: ол мақсатта, бұрынғы тәжірибеде және тұлғаның тұрақты ерекшеліктерінде жатыр. Қабылдау туа бітпейді: ол еңбек, ойын және оқу арқылы қалыптасады.", "<b>Ырықсыз қабылдау<\/b> арнайы міндетсіз, ерік күшінсіз жүреді. Студент оқиғаны дәл осылай қабылдады, сондықтан онда тек жалпы әсер қалды. <b>Ырықты қабылдау<\/b> саналы мақсатқа сүйенеді, ерік күшін керек етеді.", "Инспектор жолды арнайы қадағалап тұрды. Бұл — <b>бақылау<\/b>, яғни мақсатты, жоспарлы, ұйымдасқан қабылдау. Онда <b>байқағыштық<\/b> та көрінді: көзге оңай түспейтін, бірақ маңызды белгілерді аңғара білу.", "<b>Апперцепция<\/b> да әсер етті: қабылдау адамның бұрынғы тәжірибесіне тәуелді. Инспектор көлік маркалары мен нөмірлерін жақсы білетіндіктен, оларды бірден таныды. Оның <b>перцептивтік ұстанымы<\/b>, яғни нені көруге алдын ала дайын болуы, жол оқиғасына бағытталған еді.", "Қабылдау типтері де көрініп тұр. Студенттің «сұр көлік тез өтті» деген жалпы әсері <b>синтетикалық<\/b> қабылдауға тән, ал инспектор марканы, нөмірді, тежеу орнын бөліп көрді, бұл — <b>аналитикалық<\/b> қабылдау. Тергеуші куәгердің <b>сипаттаушы<\/b> немесе <b>түсіндіруші<\/b>, <b>объективті<\/b> немесе <b>субъективті<\/b> типке жататынын да ажыратуы керек: субъективті тип көргеніне өзінен көп нәрсе қосады.", "Кеңес: бөлшектер үшін бақылаушы куәгерге көбірек сүйену, ал студенттен жалпы көріністі сұрау. Куәгерлерден болжамын емес, нақты көргенін сұрау; сұрақты жауапқа бағыттамай қою. Куәгер көргенін түсіндіре бастаса, оның түсіндірмесін нақты деректермен тексеру."], "terms": ["ырықты және ырықсыз қабылдау", "бақылау", "байқағыштық", "апперцепция", "перцептивтік ұстаным"], "tip": "Айырмашылықты «біреуі зейінді» деп қана түсіндірмеңіз: қабылдаудың ырықтылығын, апперцепцияны және қабылдау типтерін атап, әрқайсысын жағдаятпен байланыстырыңыз.", "src": "Түйсік және қабылдау сайты, 14- және 16-тараулар", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s16", "label": "Түйсік және қабылдау · 16-тарау «Қабылдау түрлері, жеке ерекшеліктер, дамуы»"}, "topic": 6}, "07-E1": {"id": "07-E1", "level": "easy", "q": "Ес деген не? Естің негізгі процестерін сипаттаңыз.", "plan": ["<b>Ес<\/b> — өткен тәжірибені мида бекітетін, сақтайтын және кейін қайта жаңғыртатын психикалық процесс. Ес арқасында адам білім алады, дағды қалыптастырады, өз тәжірибесінің сабақтастығын сақтайды.", "Ес бір процесс емес, бір тізбектің буындары: есте қалдыру → сақтау → қайта жаңғырту немесе тану. Бұл тізбекке ұмыту да қосылады.", "<b>Есте қалдыру<\/b> — қабылданған ақпаратты бекітіп, сақтауға дайындау. Бекімеген нәрсені кейін еске түсіре алмаймыз.", "<b>Сақтау<\/b> — алынған білімді ұзақ уақыт есте ұстап тұру. 7-дәріс бойынша сақтау — ақпараттың жүйке жүйесінде із ретінде қалуы.", "<b>Қайта жаңғырту<\/b> — бұрын қабылданған, бірақ қазір көз алдында жоқ нәрсенің бейнесін қайта жасау. <b>Тану<\/b> — затты қайта көргенде оның бұрын қабылданғанын сезу. Эссе жазғанда біз еске түсіреміз, ал тест сұрағында дұрыс нұсқаны танимыз.", "<b>Ұмыту<\/b> — материалды қайта жаңғыртудың қиындауы не бұрмалануы. Ұмыту тек ақау емес: ол миды керексіз ақпараттан арылтады."], "terms": ["Ес", "Есте қалдыру", "Сақтау", "Қайта жаңғырту", "Тану", "Ұмыту"], "tip": "Процестерді жай атап шықпаңыз: әрқайсысына бір сөйлем анықтама, бір мысал беріп, олардың бір тізбек екенін көрсетіңіз.", "src": "Ес сайты, 1-тарау; 7-дәріс; Маклаков, 10-тарау; Бабаев, 12-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s01", "label": "Ес · 1-тарау: анықтамасы мен маңызы"}, "topic": 7}, "07-E2": {"id": "07-E2", "level": "easy", "q": "Естің түрлері қандай белгілерге қарай бөлінеді? Әр белгі бойынша түрлерін сипаттаңыз.", "plan": ["Естің түрі көп, өйткені оны әртүрлі белгі бойынша бөлеміз. Маклаков пен Бабаев үш белгіні алады: әрекетте қандай белсенділік басым, әрекеттің мақсаты қандай, материал қанша уақыт сақталады.", "Белсенділік сипаты бойынша төрт түр бар. <b>Қозғалыс есі<\/b> қимылдарды сақтайды: жүру, жазу, домбыра тарту. <b>Эмоционалдық ес<\/b> бастан кешкен сезімдерді сақтайды. <b>Бейнелі ес<\/b> көріністерді, дыбыстарды, иісті, дәмді елес түрінде сақтайды. <b>Сөздік-логикалық ес<\/b> ойларымызды, оқыған кітаптың мазмұнын сақтайды; ол тек адамға тән.", "Мақсат бойынша <b>ықтиярсыз<\/b> және <b>ықтиярлы ес<\/b> бөлінеді. Ықтиярсыз есте арнайы мақсат жоқ: қызық оқиға өздігінен есте қалады. Ықтиярлы есте адам есте қалдыру міндетін қояды да, ерік күшін салады: мысалы, емтиханға дайындалады.", "Сақтау ұзақтығы бойынша Маклаков пен Бабаев үш түрді бөледі. <b>Қысқа мерзімді ес<\/b> шамамен 15–30 секунд сақтайды, көлемі 7 ± 2 бірлік. <b>Жедел ес<\/b> ақпаратты міндет шешілгенше ұстайды. <b>Ұзақ мерзімді ес<\/b> айлар мен жылдар бойы сақтайды. Дәріс пен Немов бұған <b>сенсорлық есті<\/b> қосады: ол түйсіктің ізін секундтың бір бөлігінен бірнеше секундқа дейін ұстайды.", "Түрлер бір-бірінен бөлек жұмыс істемейді: бір әрекетте бірнеше түр қатар жүреді."], "terms": ["Қозғалыс есі", "Эмоционалдық ес", "Бейнелі ес", "Сөздік-логикалық ес", "Ықтиярсыз және ықтиярлы ес", "Қысқа мерзімді, ұзақ мерзімді және жедел ес"], "tip": "Алдымен жіктеу белгісін атаңыз, содан кейін сол белгіден шыққан түрлерді айтыңыз; барлық түрді бір тізімге араластырмаңыз.", "src": "Ес сайты, 4 және 8-тараулар; Маклаков, 10-тарау; Бабаев, 12-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s08", "label": "Ес · 8-тарау: Естің түрлері"}, "topic": 7}, "07-M1": {"id": "07-M1", "level": "medium", "q": "Интерференция мен реминисценция дегеніміз не? Проактивті және ретроактивті интерференцияны мысалмен салыстырыңыз.", "plan": ["<b>Интерференция<\/b> — бұрынғы және кейінгі ақпараттың бірін-бірі басуы, бұрмалауы не еске түсіруге кедергі жасауы. Мұнда ақпарат естен өшпейді, тек оған қол жетпей қалады. Ұмытудың интерференциялық теориясын Г. Э. Мюллер негіздеген.", "<b>Проактивті интерференция<\/b> — бұрын меңгерілген ақпарат жаңасына кедергі жасайды. Мысалы, жаңа телефон нөмірінің орнына ескісін айтамыз; мектепте ағылшын тілін оқыған студенттің аузына неміс сөзінің орнына ағылшын сөзі түседі.", "<b>Ретроактивті интерференция<\/b> — жаңа ақпарат бұрынғы материалды еске түсіруге кедергі жасайды. Мысалы, кешке биологияны оқыдыңыз да, артынша физикаға кірістіңіз; ертеңіне биология нашар еске түседі. Маклаков мұны <b>ретроактивті тежелу<\/b> дейді, А. А. Смирнов оны тәжірибе жүзінде зерттеген.", "Екеуін ажырату үшін «қай ақпарат зардап шекті?» деп сұраңыз. Жаңасы зардап шексе — проактивті, ескісі зардап шексе — ретроактивті.", "А. А. Смирновтың тәжірибесі: оқушылар сөз жаттаған соң бірден басқа сөз жаттаса, еске түсіру 25%-ға, сан жаттаса 8%-ға, қиын есеп шығарса 16%-ға төмендеген. Демек кейінгі іс үзіліссіз басталса, алдыңғыға ұқсас болса және одан қиын болса, кедергі күшейеді.", "<b>Реминисценция<\/b> — жаттағаннан біраз уақыт өткен соң материалды бастапқыдан толығырақ әрі дәлірек еске түсіру. Мысалы, бүгін толық айта алмаған мәтінді бір-екі күннен кейін анығырақ айтасыз. Маклаков бойынша ол көлемі үлкен сөздік материалда, мектеп жасына дейінгі балалар мен бастауыш сынып оқушыларында жиі, ересектерде сирек кездеседі.", "Реминисценцияның себептері: жүйке жасушалары демалып, қалпына келеді; материал ой елегінен өтеді; ес іздері біртіндеп бекиді, яғни <b>консолидация<\/b> жүреді. Екі құбылыстан бір кеңес шығады: оқығаннан кейін үзіліс жасап, демалыңыз, ұйқыға уақыт беріңіз."], "terms": ["Интерференция", "Проактивті интерференция", "Ретроактивті интерференция", "Ретроактивті тежелу", "Реминисценция", "Консолидация"], "tip": "Проактивті мен ретроактивтіні «жаңа» деген сөзге қарап емес, қай ақпараттың зардап шеккеніне қарап ажыратыңыз.", "src": "Ес сайты, 7-тарау; 7-дәріс; Маклаков, 10-тарау", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s07", "label": "Ес · 7-тарау: Интерференция және реминисценция"}, "topic": 7}, "07-M2": {"id": "07-M2", "level": "medium", "q": "Естің физиологиялық негізі қалай түсіндіріледі? Естің негізгі психологиялық теорияларын салыстырыңыз.", "plan": ["Физиологиялық негіз — <b>жүйке жүйесінің пластикалығы<\/b>: әр жүйке процесі мида із қалдырады. Із кейінгі процестерді жеңілдетеді және тітіркендіргіш жоқ кезде де қайта жандана алады. Павлов бойынша ассоциация — бірге не бірінен соң бірі әсер еткен тітіркендіргіштер арасындағы уақытша байланыс.", "Бабаев естің үш теориясын атайды: ассоциативтік, нейрондық және биохимиялық. Нейрондық деңгейде қысқа мерзімді ес <b>реверберацияға<\/b> сүйенеді: қозу тұйық нейрон тізбегімен айнала береді де, біраздан соң өшеді (Маклаков). Ұзақ мерзімді ес <b>консолидацияға<\/b>, яғни іздің бекуіне сүйенеді. Биохимиялық теория бойынша ес іздері РНҚ сияқты молекулалардың өзгеруімен байланысты: Бабаев РНҚ-ны бір жануардан екіншісіне егу тәжірибелерін келтіреді.", "<b>Ассоциативтік теория<\/b>: ес — елестердің жанасу, ұқсастық, контраст бойынша байланысуы. Ол көп заңның ашылуына жол ашты, бірақ естің мақсаттылығын, тұтас есте қалдыруды, қажеттілік пен эмоцияға тәуелділігін түсіндіре алмады.", "<b>Гештальтпсихология<\/b>: материал бөлшек-бөлшек емес, тұтас құрылым ретінде есте қалады. Бұл бағыт ұстаным есте қалдыруды бағыттайтынын көрсетті, ал Зейгарник аяқталмаған істің аяқталғаннан жақсы есте қалатынын дәлелдеді. <b>Психоанализ<\/b>: ес мотивке бағынады, оның процестері негізінен бейсаналы жүреді.", "<b>Мағыналық теория<\/b>: ес материалдың ішіндегі мағыналық байланыстарға тәуелді. <b>Әрекеттік-мағыналық теория<\/b>: ес — саналы, мақсатты әрекет. Выготский естің жоғары формалары шығу тегі жағынан әлеуметтік екенін көрсетті. Смирнов пен Зинченко материал әрекеттің мақсатына айналса, ықтиярсыз да жақсы есте қалатынын көрсетті.", "<b>Когнитивтік теория<\/b>: ес — компьютер сияқты ақпаратты өңдейтін жүйе, ол сенсорлық, қысқа мерзімді және ұзақ мерзімді блоктардан тұрады. Әлсіз жері — адамның қызығушылығын, мотиві мен эмоциясын ескермейді.", "Қорытынды: физиология естің тетігін көрсетеді, ал психологиялық теориялар оның мазмұны мен себебін түсіндіреді. Әр теория алдыңғысының бір әлсіз жеріне жауап берді, бірақ өзі жаңа сұрақ қалдырды."], "terms": ["Жүйке жүйесінің пластикалығы", "Реверберация", "Консолидация", "Ассоциация", "Ұстаным", "Әрекеттік-мағыналық теория"], "tip": "Теорияларды тізіп қана қоймаңыз: әрқайсысының не бергенін және неге жетпегенін айтыңыз, сонда әр теорияның алдыңғысына қалай жауап бергені көрінеді.", "src": "Ес сайты, 2 және 10-тараулар; Маклаков, 10-тарау; Немов, I бөлім, 11-тарау; Бабаев, 12-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s10", "label": "Ес · 10-тарау: Естің теориялары"}, "topic": 7}, "07-H1": {"id": "07-H1", "level": "hard", "q": "Екінші курс студенті Ерлан бір пәннің бес тақырыбын емтиханның алдындағы түні бір отырыста оқып шықты. Ертеңіне емтиханды әрең тапсырды, ал бір аптадан кейінгі қорытынды тестте сол тақырыптардың көбін ұмытып қалды. Бірінші және соңғы тақырып есінде жақсы сақталған, ортадағылары бір-бірімен араласып кеткен. Мұны естің қандай заңдылықтарымен түсіндіресіз? Ерланға қандай кеңес бересіз?", "plan": ["Жағдаятта ұмыту, жинақты қайталау, шеткі заң және интерференция көрінеді. Ерлан материалды бір түнде, бір отырыста оқыған; кейін қайталағаны айтылмайды.", "<b>Ұмыту заңы<\/b> (Эббингауз заңы, ұмыту қисығы): механикалық жатталған материал алғашқы сағаттар мен күндері тез ұмытылады, бір-екі тәулікте жартысынан көбі ұмытылады (Немов), кейін ұмыту баяулайды. Бір рет оқылып, қайталанбаған материал бір аптада осылай көбіне ұмытылады.", "<b>Жинақты қайталау<\/b> (бір отырыста, үзіліссіз) <b>бөлшектенген қайталаудан<\/b> әлсіз. Маклаковтың дерегі бойынша өлеңді жинақты тәсілмен жаттауға 24 қайталау, аралықпен жаттауға 10 қайталау жеткен.", "Қайталаудың мерзімі де маңызды. Шардаковтың деректері бойынша бірінші күні бір рет қайталау алты айдан кейін сақталған материалды 38 %-дан 60 %-ға көтереді. Ерланның бір түндік оқуында мұндай қайталауға уақыт болмаған.", "<b>Шеткі заң<\/b>: ұзын тізбектің басы мен соңы жақсы есте қалады, ортасы жиі ұмытылады. Ортадағы ұқсас тақырыптар бірін-бірі басқан, бұл — <b>интерференция<\/b>. Мұнда <b>ұстаным заңы<\/b> да әсер етуі мүмкін: Ерлан «ертеңгі емтиханды тапсырсам болды» деп оқыса, материалды тез ұмытады.", "Кеңес: қайталаудың кестесін жасау — бірінші күні, ертеңіне, бір аптадан соң, емтихан алдында; ұқсас тақырыптарды қатар оқымай, арасына үзіліс не басқа пән қою. Ең қиын тақырыпты оқудың басына қою: шеткі заң бойынша басы жақсы есте қалады, ал дәріс қиын пәнді жеңілінен бұрын оқуға кеңес береді. Ортада қалған тақырыптарды келесі жолы басына ауыстыру.", "Мағыналы есте қалдыру тәсілдерін қолдану керек: жоспар құру, тірек сөздер белгілеу, тақырыптарды салыстыру, өз мысалын келтіру. Оқығаннан кейін ұйқыға уақыт беру керек: ұйқы кезінде жаңа әсер аз түседі, ал ми өткен күннің материалын реттейді. Түнгі «марафонда» материал бекіп үлгермейді."], "terms": ["Ұмыту заңы", "Жинақты және бөлшектенген қайталау", "Шеткі заң", "Интерференция", "Ұстаным", "Мағыналы есте қалдыру"], "tip": "Жағдаяттағы әр деталь бір заңдылыққа сай келеді: «бір түнде» — жинақты қайталау, «бір аптадан соң ұмытты» — ұмыту заңы, «басы мен соңы» — шеткі заң; әрқайсысын бөлек талдаңыз.", "src": "Ес сайты, 3, 6, 7, 11 және 14-тараулар; Маклаков, 10-тарау; Немов, I бөлім, 11-тарау", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s11", "label": "Ес · 11-тарау: Естің заңдары"}, "topic": 7}, "07-H2": {"id": "07-H2", "level": "hard", "q": "Бір сыныптың екі оқушысы тарих параграфына дайындалды. Әлия мәтінді сөзбе-сөз жаттап алды, бірақ мұғалім сұрақты басқаша қойғанда жауап бере алмады, ал бір аптадан кейін мәтіннің көбін ұмытты. Айбек мәтінді оқып, жоспар құрды, кесте сызды, оқиғаларды өз сөзімен айтып шықты. Бір айдан кейін де ол негізгі ойды жақсы есіне алды. Екі оқушының есте қалдыруындағы айырманы түсіндіріңіз. Әлияға қандай кеңес бересіз?", "plan": ["Жағдаятта есте қалдырудың екі тәсілі көрінеді: Әлия механикалық, Айбек мағыналы есте қалдырған. Екеуінде де <b>ықтиярлы есте қалдыру<\/b>: екеуі де мақсат қойып, күш салған.", "<b>Механикалық есте қалдыру<\/b> — материал бөліктерінің логикалық байланысын ұғынбай жаттау. Оның негізі — жанасу ассоциациясы: сөздер тек бірінен соң бірі келгені үшін байланысады. Сондықтан сұрақ басқаша қойылса, тізбек үзіліп кетеді.", "<b>Мағыналы есте қалдыру<\/b> материал бөліктерінің ішкі логикалық байланысын түсінуге сүйенеді. Онда әрдайым ойлау қатысады: адам нені неге байланыстыру керегін түсінеді. Маклаковтың дерегі: механикалық жатталған материалдың 1 сағаттан кейін 40%-ы, бірнеше сағаттан кейін 20%-ы ғана қалады, ал мағыналы жатталғанның 40%-ы 30 күннен кейін де сақталады.", "Айбек мағыналандыру тәсілдерін қолданған: негізгі ойларды бөліп, жоспар құрған; материалды жүйелеп, кестеге түсірген; өз сөзімен айтып, белсенді қайталаған. Кесте <b>бейнелі есті<\/b>, ал мазмұндау <b>сөздік-логикалық есті<\/b> іске қосқан.", "Әлия мәтінді мағынасын өңдемей, сөзбе-сөз жаттаған. Мұндай жаттау енді логикалық емес, механикалық есте қалдыру болады. Маклаков бойынша мәтінді жатқа айту мен оны өз сөзімен мазмұндау бір адамда бірдей дамымауы да мүмкін.", "Әлияға кеңес: алдымен мәтінді түсініп оқу; оны бөлімдерге бөліп, әр бөлімге тірек сөз таңдау; жаңа материалды бұрынғы біліммен салыстыру; ережені нақты мысалмен түсіндіру; кітапқа қарамай, өз сөзімен дауыстап айтып көру."], "terms": ["Механикалық есте қалдыру", "Мағыналы есте қалдыру", "Сөздік-логикалық ес", "Бейнелі ес", "Жанасу ассоциациясы", "Ықтиярлы есте қалдыру"], "tip": "Механикалық есте қалдыруды «нашар ес» деп атамаңыз: екі тәсіл өмірде қатар жүреді, бірақ мағынаға сүйенбеген жаттау тез ұмытылады.", "src": "Ес сайты, 3 және 8-тараулар; Маклаков, 10-тарау; Бабаев, 12-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s03", "label": "Ес · 3-тарау: Есте қалдыру"}, "topic": 7}, "08-E1": {"id": "08-E1", "level": "easy", "q": "Зейін деген не? Зейіннің түрлерін сипаттаңыз.", "plan": ["<b>Зейін<\/b> — психикалық іс-әрекеттің бір нысанға бағытталуы және соған шоғырлануы. Мысалы, сурет салуға беріліп кеткен бала ата-анасының сөзін естімейді.", "Зейіннің екі белгісі бар. <b>Бағытталу<\/b> — маңызды нысанды таңдап алу және сол таңдауды біраз уақыт ұстап тұру. <b>Шоғырлану<\/b> — іске терең беріліп, бөгде нәрседен ойды аулақ ұстау.", "Зейіннің өз өнімі жоқ: ол жаңа бейне не ой тудырмайды, бірақ барлық танымдық процеске араласады. Оны адамның ісінен, бет-әлпетінен, дене қалпы мен қимылынан байқаймыз.", "<b>Ырықсыз зейін<\/b> адамның мақсатына қарамай, өздігінен туады. Оны тітіркендіргіштің күші, контрасты, жаңалығы, қозғалысы, сондай-ақ адамның қажеттілігі мен қызығуы тудырады: кенет шыққан дыбыс бәрімізді елең еткізеді.", "<b>Ырықты зейін<\/b> саналы мақсатқа бағынады және ерік күшін талап етеді. Студент тарау өзіне қызықсыз болса да, емтиханға керек болған соң оны оқиды.", "<b>Үйреншікті зейін<\/b> ырықты зейін сияқты мақсаттан басталып, басында ерік күшін талап етеді. Кейін іс қызықты бола бастағанда, зейін ерік күшінсіз-ақ сақталады."], "terms": ["Зейін", "Бағытталу", "Шоғырлану", "Ырықсыз зейін", "Ырықты зейін", "Үйреншікті зейін"], "tip": "Үйреншікті зейінді ырықсыз зейінмен шатастырмаңыз: үйреншікті зейін мақсаттан басталады, тек кейін ерік күшін қажет етпей қалады.", "src": "Зейін сайты, 1, 8, 9-тараулар; Бабаев, 9-дәрісбаян; Маклаков, 14-тарау", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s08", "label": "Зейін · 8-тарау: Ырықсыз зейін"}, "topic": 8}, "08-E2": {"id": "08-E2", "level": "easy", "q": "Зейіннің негізгі қасиеттерін атап, әрқайсысын сипаттаңыз.", "plan": ["<b>Тұрақтылық<\/b> — біраз уақыт бойы бір нысанға шоғырлана алу. Оның басты шарты — нысаннан жаңа қырлар мен байланыстар табу. Тұрақты зейіннің өзі де мезгіл-мезгіл тербеліп тұрады.", "<b>Шоғырлану<\/b> — істегі ең бастысына жинақталып, міндетке қатысы жоқ нәрседен алшақтай алу. Міндет неғұрлым қиын болса, шоғырлану соғұрлым күшті болады.", "<b>Бөліну<\/b> — санада бір мезгілде бірнеше әртекті нысанды ұстай алу не бірнеше әрекеттен тұратын істі орындау. Бұл әрекеттердің бірі автоматтанған болса ғана мүмкін: тәжірибелі жүргізуші көлік айдап келе жатып әңгімелеседі.", "<b>Ауысу<\/b> — зейіннің бір нысаннан екіншісіне саналы әрі байыппен өтуі. Жаңа іс бұрынғының жалғасы болса және қызықты болса, ауысу жеңіл.", "<b>Көлем<\/b> — бір мезгілде бірдей анық қабылданатын нысандардың саны. Ересек адамда ол әдетте 5 ± 2 нысан (Маклаков, Немов). Жаттығудан ол іс жүзінде өзгермейді, бірақ нысандар мағыналы бүтінге біріксе, зейінге көбірек сыяды.", "Маклаков алтыншы қасиет ретінде <b>алаңдаушылықты<\/b> атайды, ал Бабаев оны бес қасиеттен бөлек, зейіннің кемшілігі ретінде қарайды. Алаңдаушылық — зейіннің бір нысаннан екіншісіне еріксіз ауысуы. Сыртқы алаңдаушылықты бөгде тітіркендіргіш тудырады, ал ішкі алаңдаушылықты күшті сезім не іске қызығудың жоқтығы тудырады."], "terms": ["Тұрақтылық", "Шоғырлану", "Бөліну", "Ауысу", "Көлем", "Алаңдаушылық"], "tip": "Ауысу мен алаңдаушылықты шатастырмаңыз: ауысуды адам өзі саналы басқарады, ал алаңдаушылықта зейін еріксіз көшеді.", "src": "Зейін сайты, 10–13-тараулар; Бабаев, 9-дәрісбаян; Маклаков, 14-тарау", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s10", "label": "Зейін · 10-тарау: қасиеттерге шолу, тұрақтылық"}, "topic": 8}, "08-M1": {"id": "08-M1", "level": "medium", "q": "Зейіннің физиологиялық негіздерін түсіндіріңіз. Павлов пен Ухтомскийдің ілімдері мұнда нені түсіндіреді?", "plan": ["Мида зейіннің жеке орталығы жоқ. Зейін өзі қатысатын процестердің орталықтарына сүйенеді, бірақ олардың жұмыс тәртібін өзгертеді: қыртыста қозғыштығы жоғары және төмен аймақтар пайда болады.", "Зейіннің жалпы аясы — <b>сергектік<\/b>. Бабаев сергектіктің бес күйін ажыратады: терең ұйқы, қалғып-мүлгу, сабырлы, белсенді және шектен тыс сергектік. Тиімді зейін тек сабырлы және белсенді сергектікте мүмкін. Сергектікті торлы құрылым көтереді.", "Павлов «немене?» рефлексі деп атаған <b>бағдарлау рефлексі<\/b> — ортадағы кез келген өзгеріске туатын туа біткен реакция. Ол ырықсыз зейіннің негізі: жаңа дыбыс естілсе, басымызды соған бұрамыз. Тітіркендіргіш өзгеріссіз қайталана берсе, рефлекс сөнеді.", "<b>Индукция заңы<\/b> (оны Шеррингтон ашқан, Павлов кеңінен қолданған): қыртыстың бір аймағы қозса, басқа аймақтарында тежелу туады (бір мезгілді, теріс индукция); сол аймақтың өзінде қозудың орнын біраз уақыттан соң тежелу басады (бірізді индукция). Шоғырлану осыдан туады: кітапқа беріліп кеткен адам аялдамасынан өтіп кетеді.", "Ухтомскийдің <b>доминантасы<\/b> — мидағы уақытша үстем қозу ошағы. Ол бөгде импульстерді өзіне жинап күшейеді, басқа орталықтарды басады және инертті болады. Доминанта зейіннің шоғырлануы мен қарқындылығын түсіндіреді: қарны ашқан адамның көзіне ең алдымен тамақ түседі.", "Бірақ физиология ырықты зейінді толық түсіндіре алмайды. Ырықты зейінді адамның өзі қойған мақсаты мен сөзі, яғни екінші сигнал жүйесі басқарады."], "terms": ["Сергектік деңгейлері", "Бағдарлау рефлексі", "Индукция заңы", "Теріс индукция", "Доминанта", "Торлы құрылым"], "tip": "Бағдарлау рефлексін доминантамен шатастырмаңыз: біріншісі зейінді жаңа нәрсеге бұрады, екіншісі оны бір іске ұзақ байлап тұрады.", "src": "Зейін сайты, 2-тарау; Маклаков, 14-тарау; Бабаев, 9-дәрісбаян; Крысько, 2.12–2.15-схемалар", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s02", "label": "Зейін · 2-тарау: Зейіннің физиологиялық негіздері"}, "topic": 8}, "08-M2": {"id": "08-M2", "level": "medium", "q": "Зейін туралы ілім қалай дамыды? Негізгі теорияларды салыстырыңыз.", "plan": ["Зейінді зерттеу қиын: оның өз өнімі жоқ, ол әрдайым басқа процестің ішінде жүреді. Сондықтан ол туралы пікір көп болды, әр жаңа теория алдыңғысы шеше алмаған сұрақтан туды.", "<b>Сана психологиясы<\/b> (Вундт, Титченер) зейінді сананың анықтығы, апперцепция деп сипаттады. Вундт ырықты зейінді белсенді еріктің көрінісі деп санады. Бұл бағыт зейінге тым көп мағына жүктеді: оны сипаттады, бірақ түсіндірмеді.", "Ланге сол кездегі көзқарастарды алғаш жүйеге келтіріп, жеті тұжырымға жинады. Рибоның <b>аффективті-моторлық теориясы<\/b> бойынша зейінді эмоция тудырады, ал ырықты зейінді бұлшықет қимылы ұстап тұрады; әлсіз жері — бұлшықет зейіннің себебі емес, көбіне серігі ғана. Ланге қимылдың маңызымен келісті, бірақ өз теориясын <b>аналитикалық<\/b> деп атады: зейін тұтас елесті бөліктерге бөліп талдайды, ал оны адамның тәжірибесі, апперцепция бағыттайды.", "<b>Физиологиялық теориялар<\/b> (Павлов, Ухтомский) зейінді қозу ошағымен, теріс индукциямен, доминантамен түсіндірді, бірақ ырықты зейінді толық түсіндіре алмады. <b>Гештальтпсихология<\/b> (Рубин) зейінді қабылдау өрісінің құрылымы деп, оның дербестігін жоққа шығарды.", "Узнадзенің <b>ұстаным теориясы<\/b>: зейін — ұстанымның көрінісі, нені таңдайтынымызды ішкі дайындық алдын ала анықтайды. Гальперин: зейін — ішкі, қысқарған <b>бақылау әрекеті<\/b>; ол өз алдына бөлек нәтиже бермейді, бірақ істің сапасын қадағалайды. Выготский: ырықты зейіннің тегі әлеуметтік, ол алдымен ересек пен баланың арасында туады.", "<b>Когнитивтік психология<\/b> (Бродбент т.б.) адамды ақпарат өңдейтін жүйе деп қарады: жүйенің шамасы шектеулі, сондықтан зейін — ақпаратты іріктеп өткізетін сүзгі. Кейінгі тәжірибелер сүзгі «не ашық, не жабық» емес екенін көрсетті: зейін аударылмаған арнадан да ақпарат әлсіреп өтеді."], "terms": ["Апперцепция", "Аффективті-моторлық теория", "Аналитикалық теория", "Ұстаным", "Бақылау әрекеті (Гальперин бойынша)", "Сүзгі (Бродбент бойынша)"], "tip": "Теорияларды тізіп шықпаңыз: әрқайсысы зейінді не деп түсінгенін және алдыңғы теорияға не қосқанын айтыңыз; дереккөз сын айтқан теорияның әлсіз жерін де атаңыз.", "src": "Зейін сайты, 4–7-тараулар; Маклаков, 14-тарау; Немов, I бөлім, 10-тарау; Лурия, III тарау; Бабаев, 9-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s04", "label": "Зейін · 4-тарау: Зейін туралы ілімнің тарихы"}, "topic": 8}, "08-H1": {"id": "08-H1", "level": "hard", "q": "Бірінші сынып мұғалімі байқады: оқушылар сабақтың басында жақсы тыңдайды, 15–20 минуттан кейін терезеге қарап, бір-бірімен сыбырласа бастайды. Мұғалім түрлі түсті сурет көрсетсе не ойын ұйымдастырса, бәрі қайта жиналады. Мұны зейіннің қандай түрлері мен қасиеттерімен түсіндіресіз? Мұғалімге қандай кеңес бересіз?", "plan": ["Жағдаятта бала зейінінің тұрақсыздығы мен алаңдаушылығы көрінеді. Сурет пен ойын балалардың ырықсыз зейінін оятып, қайта жинайды.", "Кіші мектеп жасында <b>ырықты зейін<\/b> енді ғана жоғары функцияға айнала бастайды: бала оны ішкі сөйлеу арқылы реттеуге үйренеді, бірақ зейіннің қасиеттері әлі толық жетілмеген. Немов бойынша ырықты зейін жасөспірім шақта, шамамен 14–15 жаста толық жетіледі; Лурия бойынша оның физиологиялық негізі 12–15 жасқа қарай қалыптасады.", "Ырықты зейін ерік күшіне сүйенеді, ал ерік күші адамды шаршатады. Ұзақ, біркелкі түсіндіру кезінде нысаннан жаңа қыр ашылмайды, сондықтан <b>тұрақтылық<\/b> төмендейді, зейін тербеліп, <b>алаңдаушылық<\/b> күшейеді.", "Түрлі түсті сурет, қозғалыс, жаңалық — <b>ырықсыз зейіннің<\/b> себептері, олардың негізі — бағдарлау рефлексі. Бірақ бір тәсіл өзгеріссіз қайталана берсе, рефлекс сөнеді, сурет те зейінді ұстамай қалады.", "Кеңес: сабақты қызықты етіп, ойын тәсілімен өткізу; тақырыпты әр жолы жаңа қырынан ашатын тапсырма беру. Түпкі міндет — мақсаттан туған қызығуды істің өзіне деген қызығуға айналдыру. Сонда ырықты зейін <b>үйреншікті зейінге<\/b> ауысады.", "Сонымен қатар сыныптан алаңдататын заттар мен әсерлерді алып тастау; балаға сыртқы құралдар беру — бетбелгі, сызғыш, «алдымен…, сосын…» деген өзіне-өзі нұсқау. Мұндай құралдар <b>жанама зейін<\/b> тудырады. Ол бірте-бірте ішке көшіп, баланың өз ырықты зейініне айналады (Выготский)."], "terms": ["Ырықты зейін", "Ырықсыз зейін", "Үйреншікті зейін", "Тұрақтылық", "Бағдарлау рефлексі", "Жанама зейін"], "tip": "Баланы «зейінсіз» деп кінәламаңыз: жауапта бұл жастағы ырықты зейіннің әлі қалыптасып жатқанын міндетті түрде айтыңыз.", "src": "Зейін сайты, 8, 9, 10, 14, 15-тараулар; Маклаков, 14-тарау; Бабаев, 9-дәрісбаян; Немов, I бөлім, 10-тарау", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s14", "label": "Зейін · 14-тарау: Зейіннің дамуы"}, "topic": 8}, "08-H2": {"id": "08-H2", "level": "hard", "q": "Жатақханада тұратын Әсем курстық жұмыс жазып отыр. Ол бірнеше минут сайын телефонына қарайды, бөлмедегі әңгімеге араласады, бір абзацты бітірмей, екіншісіне көшеді. Ал оның ағасы мақала жазып отырғанда атын атап шақырса да естімейді, шайының суып қалғанын да байқамайды. Екеуінің зейініндегі айырманы түсіндіріңіз. Әсемге қандай кеңес бересіз?", "plan": ["Сырттай қарасаңыз, екеуі де айналасын «байқамайтын» шашыраңқы адам сияқты, бірақ олардың зейіні қарама-қарсы күйде. Ағасында <b>жалған шашыраңқылық<\/b> бар. Әсемде <b>сыртқы алаңдаушылық<\/b> пен <b>шын шашыраңқылыққа<\/b> ұқсас күй байқалады.", "<b>Жалған шашыраңқылық<\/b> — іске шектен тыс берілгендіктен айналадағы адамдарды, заттарды байқамау. Мұнда шоғырлану шегіне жеткен: мидағы қуатты қозу ошағы теріс индукция заңы бойынша айналасын тежейді. Бабаев бойынша ол шығармашылықпен айналысатын адамдарда жиі кездеседі.", "<b>Шын шашыраңқылық<\/b> — ешнәрсеге ұзақ шоғырлана алмай, бір нысаннан екіншісіне үнемі көшу. Мұнда ішкі тежелу әлсіз, қозу оңай тарап кетеді. Бұл түр адамға көп зиян келтіреді.", "Әсемнің <b>сыртқы алаңдаушылығын<\/b> телефон хабарламасы мен әңгіме тудырады. Кенет, әр жолы әр уақытта шығатын тітіркендіргіштер ең қатты алаңдатады: хабарлама дыбысы бағдарлау рефлексін қайта-қайта оятады, рефлекс сөнуге үлгермейді. Себебі тек сыртта емес: Крысько бойынша алаңдаушылық көбіне ерік күші мен іске деген қызығудың жоқтығынан туады.", "Абзацтан абзацқа секіру — <b>ауысу<\/b> емес: ауысу саналы, ал мұнда зейін еріксіз көшеді. <b>Тұрақтылық<\/b> та төмен, өйткені Әсем жұмысынан жаңа қыр таппай отыр.", "Кеңес: жұмыс кезінде телефонды басқа бөлмеде қалдыру, алаңдататын заттар мен әсерлерді алып тастау. Әсемді бір реніш не уайым мазаласа (бұл — <b>ішкі алаңдаушылық<\/b>), алдымен соны шешуге тырысу. Жұмыстың өзіне не үшін керек екенін анықтап, мақсаттан туған қызығуды істің өзіне деген қызығуға айналдыру."], "terms": ["Жалған шашыраңқылық", "Шын шашыраңқылық", "Алаңдаушылық", "Теріс индукция", "Ауысу", "Тұрақтылық"], "tip": "Ағасының жағдайын «зейіні нашар» деп бағаламаңыз: жалған шашыраңқылықта шоғырлану ең күшті болады, ал шын шашыраңқылықта ол жетпейді.", "src": "Зейін сайты, 10, 12, 13-тараулар; Маклаков, 14-тарау; Бабаев, 9-дәрісбаян; Крысько, 2.12–2.15-схемалар", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s13", "label": "Зейін · 13-тарау: Алаңдаушылық пен шашыраңқылық"}, "topic": 8}, "09-E1": {"id": "09-E1", "level": "easy", "q": "Ойлау деген не? Ойлаудың негізгі заңдылықтары мен формаларын сипаттаңыз.", "plan": ["<b>Ойлау<\/b> — тұлғаның шындықты жалпылама және жанама бейнелеуге бағытталған танымдық әрекеті (Бабаев). <b>Жалпылама<\/b> — бір топқа ортақ мәнді белгіні бейнелеу; <b>жанама<\/b> — бір нәрсені басқа нәрсе арқылы тану: термометрге қарап, далада аяз екенін білеміз.", "Ойлау түйсік пен қабылдау берген деректерден басталып, тікелей көрінбейтін байланыстарды ашады. Оның басты міндеті — кездейсоқ сәйкестікті мәнді байланыстан ажырату.", "Ойлау <b>проблемалық жағдайдан<\/b> оянады: мақсат пен қолда бар шарттың арасында алшақтық туғанда адам ойлана бастайды. Бәрі таныс болса, адам ойланбай, үйреншікті жолмен жүре береді.", "Ойлау <b>жалқыдан жалпыға<\/b> және жалпыдан жалқыға қозғалады. Оның негізгі құралы — сөз, ал іс-тәжірибе ойдың әрі негізі, әрі тексерушісі.", "Ойлаудың үш формасы бар. <b>Ұғым<\/b> — заттың не құбылыстың жалпы әрі мәнді қасиеттерін бейнелейтін ой: «балық», «дельфин», «өкпе». Ұғым елестен кеңірек: елес бір нақты заттың бейнесі, ал ұғым сол топтың бәріне ортақ мәнді белгіні береді.", "<b>Пікір<\/b> — заттар мен құбылыстар, олардың байланыстары туралы бір нәрсені мақұлдайтын не теріске шығаратын ой: «Балықтар желбезекпен тыныс алады», «Дельфин желбезекпен тыныс алмайды».", "<b>Ой қорытындысы<\/b> — бір не бірнеше пікірден жаңа пікір шығару: «Демек, дельфин — балық емес». Индуктивтік ой қорытындысы жалқыдан жалпыға, дедуктивтік ой қорытындысы жалпыдан жалқыға жүреді; Немов трансдуктивтік ой қорытындысын да атайды."], "terms": ["Ойлау", "Проблемалық жағдай", "Жалпылама және жанама бейнелеу", "Ұғым", "Пікір", "Ой қорытындысы"], "tip": "Ойлау формаларын ой қызметтерімен шатастырмаңыз: ұғым, пікір, ой қорытындысы — ойдың пішіні, ал талдау, салыстыру, қорытындылау — ойдың әрекеті.", "src": "Ойлау және сөйлеу сайты, 1–2-тараулар; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s01", "label": "Ойлау және сөйлеу · 1-тарау: Ойлау деген не?"}, "topic": 9}, "09-E2": {"id": "09-E2", "level": "easy", "q": "Тіл мен сөйлеудің айырмасы неде? Сөйлеудің түрлері мен қызметтерін сипаттаңыз.", "plan": ["<b>Тіл<\/b> — сөйлесу құралдарының қатаң қалыпқа келтірілген жүйесі, оның ережелері бәріне ортақ. <b>Сөйлеу<\/b> — адамның ойы мен сезімін жеткізу үшін тілді басқа адаммен қатынаста іс жүзінде қолдануы. Тоғызқұмалақтың тақтасы мен ережесі тіл сияқты, ал сол тақтада нақты ойналған ойын — сөйлеу. Тіл бәріне ортақ, ал сөйлеу әр адамда өзінше.", "Сөйлеу алдымен <b>сыртқы<\/b> және <b>ішкі<\/b> болып бөлінеді. Сыртқы сөйлеуді басқалар естиді не көреді. Ішкі сөйлеуді басқалар қабылдамайды, адамның өзі де оны саналы түрде байқамайды (Немов). Ол тілдесуге емес, адамның өзін-өзі басқаруына керек.", "Сыртқы сөйлеу <b>ауызша<\/b> және <b>жазбаша<\/b> болады. Ауызша сөйлеу дыбыс түрінде беріліп, құлақпен қабылданады; ол жазбаша сөйлеуден бұрын пайда болған. Жазбаша сөйлеу таңба түрінде, мәтін арқылы жүреді. Ауызша сөйлеу <b>диалогтық<\/b> не <b>монологтық<\/b> болады.", "Бабаев сөздің екі негізгі қызметін атайды. <b>Коммуникативтік<\/b> қызмет — тілдесу, ақпарат алмасу құралы болу. <b>Сигнификативтік<\/b> қызмет — затты атау, белгілеу: жануардың дыбысы тек оның күйін білдіреді, ал адамның сөзі затты атайды. Бұларға көңіл-күйді білдіру мен тыңдаушыға ықпал ету қосылады.", "Немов сөйлеудің бес негізгі қызметін атайды: коммуникативтік, интеллектуалдық, мотивациялық-реттеуші, психодиагностикалық, психотерапиялық. Ең бастылары — коммуникативтік және интеллектуалдық қызмет; тарихта ең алғашқысы — коммуникативтік."], "terms": ["Тіл", "Сөйлеу", "Ішкі сөйлеу", "Ауызша және жазбаша сөйлеу", "Коммуникативтік қызмет", "Сигнификативтік қызмет"], "tip": "Тіл мен сөйлеуді синоним ретінде қолданбаңыз: тіл — бәріне ортақ жүйе, сөйлеу — сол жүйені нақты адамның қолдануы.", "src": "Ойлау және сөйлеу сайты, 10–11-тараулар; Бабаев, 8 және 13-дәрісбаяндар; Немов, II бөлім, 14-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s11", "label": "Ойлау және сөйлеу · 11-тарау: Сөйлеу түрлері мен қызметтері"}, "topic": 9}, "09-M1": {"id": "09-M1", "level": "medium", "q": "Ойлаудың негізгі түрлерін салыстырыңыз. Олар бала дамуында қандай ретпен пайда болады?", "plan": ["Ойлау түрлері әртүрлі белгі бойынша бөлінеді. Ең жиі айтылатыны — даму сатысы бойынша үш түр: заттық-әрекеттік, көрнекі-бейнелі және сөзді-логикалы ойлау.", "<b>Заттық-әрекеттік ойлау<\/b> — ең қарапайым түр: міндет нақты заттармен жасалатын сыртқы әрекет арқылы шешіледі, ой қолдың қимылымен қатар жүреді. Ол үш жасқа дейінгі балаларға тән (Бабаев; Немов бойынша 2–3 жасқа дейін), адамтәріздес маймылдарда да кездеседі. Ересек те жиһаздың орнын ауыстырғанда осылай ойлайды.", "<b>Көрнекі-бейнелі ойлау<\/b> — міндетті заттардың бейнесімен ойша әрекет етіп шешу. Бабаев бойынша оның қарапайым түрі 4–7 жастағы балаларға тән. Ол қиялға жақын.", "<b>Сөзді-логикалы ойлау<\/b> толығымен ойша, ұғымдармен, логика заңдары бойынша жүреді және тілге сүйенеді. Немов бойынша оның алғашқы белгілері 5–6 жастан ерте байқалмайды, ал 12–13 жаста қалыптасады.", "Үш түр баспалдақ сияқты бірінен соң бірі пайда болады, бірақ ересек адамда үшеуі де сақталып, дами береді. Немов бойынша заттық-әрекеттік ойлау қолымен күрделі зат жасайтын шеберлерде, көрнекі-бейнелі ойлау өнер адамдарында ерекше дамиды.", "Басқа жіктемелер де бар: <b>теориялық<\/b> және <b>тәжірибелік<\/b> ойлау; <b>шығармашыл (өнімді)<\/b> және <b>қайта жаңғыртушы<\/b> ойлау; <b>логикалық<\/b> және <b>интуитивтік<\/b> ойлау. Шығармашыл ойлау жаңа шешім табады, ал қайта жаңғыртушы ойлау дайын біліммен, «ескі сүрлеумен» жүреді. Логикалық ойлау бірізді жүреді, оның дұрыстығын логика ережелерімен тексеруге болады; интуитивтік ойлау ішкі сезімге сүйенеді, оның қадамдары анық көрінбейді."], "terms": ["Заттық-әрекеттік ойлау", "Көрнекі-бейнелі ойлау", "Сөзді-логикалы ойлау", "Теориялық және тәжірибелік ойлау", "Шығармашыл және қайта жаңғыртушы ойлау", "Интуитивтік ойлау"], "tip": "Ересектің ойлауын тек сөзді-логикалы деп айтпаңыз: үш түрдің бәрі ересекте сақталып, күрделене түседі.", "src": "Ойлау және сөйлеу сайты, 4-тарау; Немов, I бөлім, 13-тарау; Бабаев, 13-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s04", "label": "Ойлау және сөйлеу · 4-тарау: Ойлау түрлері"}, "topic": 9}, "09-M2": {"id": "09-M2", "level": "medium", "q": "Психологияда ойлау қалай түсіндірілді? Негізгі теорияларды салыстырыңыз.", "plan": ["Әр теорияны екі сұрақ бойынша салыстырамыз: ойлау деген не және адам шешімді қалай табады. Әр бағыт бұған өзінше жауап берді.", "<b>Ассоциативтік теория<\/b>: ой — ассоциациялардың тізбегі; адам тізбектерді бірінен соң бірін байқап көреді, біреуі шешімге жеткізеді. Әлсіз жері: ойдың мақсаттылығын, инсайт пен шығармашылықты түсіндірмейді.", "<b>Вюрцбург мектебі<\/b>: ойлау — ішкі әрекеттер жүйесі; ойды міндет, ұстаным және <b>антиципация<\/b>, яғни нәтижені алдын ала сезу бағыттайды. Бұл мектеп бейнесіз ойды ашты. Бабаев бойынша мұнда ой сезімдік негізден және сөзден ажырап қалды.", "<b>Гештальтпсихология<\/b>: ойлау <b>проблемалық жағдайдан<\/b> басталады; сәтсіз сынақтар тоқтаған соң жағдай тұтас қайта құрылып, кенет <b>инсайт<\/b> келеді.", "<b>Бихевиоризм<\/b> ойлауды бейімделуге көмектесетін ең тиімді реакцияны іздеу деп қарады. Ол психологиялық ұғымдардан бас тартып, тұйыққа тірелді.", "<b>Когнитивтік психология<\/b> ойлауды компьютер сияқты ақпаратты алгоритм бойынша өңдеу деп түсінді. Немов бойынша бұл теория психологиялық болудан қалды.", "Пиаже ойлаудың дамуын <b>операциялардың<\/b>, яғни қайтымды ішкі әрекеттердің қалыптасуымен түсіндірді. Выготский ойлау дамуының басты процесі деп ұғымның қалыптасуын санады. Отандық психологияда (Бабаев) ойлау заттық әрекеттен туады да, тіл арқылы ішке көшеді: адам оны қоғам тарихында қалыптасқан құралдар мен тіл арқылы меңгереді."], "terms": ["Ассоциативтік теория", "Вюрцбург мектебі", "Антиципация", "Проблемалық жағдай", "Инсайт", "Операция (Пиаже бойынша)"], "tip": "Әр теорияны екі сұрақпен баяндаңыз: ойлау деген не және шешім қалай табылады; дереккөз сын айтқан болса ғана, әлсіз жерін де атаңыз.", "src": "Ойлау және сөйлеу сайты, 7 және 9-тараулар; Немов, I бөлім, 13-тарау; Бабаев, 13-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s07", "label": "Ойлау және сөйлеу · 7-тарау: Ойлау теориялары"}, "topic": 9}, "09-H1": {"id": "09-H1", "level": "hard", "q": "Биология сабағында жетінші сынып оқушысы Ерасыл: «Кит — балық, өйткені ол суда жүзеді, пішіні де балыққа ұқсайды», — деді. Сыныптасы Аружан қарсы шықты: «Кит өкпемен тыныс алады, баласын сүтпен асырайды, сондықтан ол — сүтқоректі». Екі оқушының ойлауын ой қызметтері арқылы талдаңыз. Мұғалім Ерасылға қалай көмектесе алады?", "plan": ["Жағдаятта екі оқушы бір міндетті шешеді: китті белгілі бір топқа жатқызу. Бұл міндетті шешуге ой қызметтері қатысады: талдау, біріктіру, салыстыру, дерексіздендіру, нақтылау, қорытындылау. Олар бір-бірінсіз жүрмейді.", "Ерасыл <b>үстірт салыстыру<\/b> жасаған: сыртқы, көзге бірден түсетін белгілерге — пішініне, суда жүзуіне сүйенген. Ол бір-екі белгіні ғана алған, яғни салыстыруы <b>бір жақты<\/b>. Бабаев бойынша бұл — <b>қорытындылаудың<\/b> ең қарапайым сатысы: кездейсоқ, жеке белгіге сүйену («ұшатынның бәрі — құс» деген сияқты).", "Аружан <b>терең салыстыру<\/b> жасаған: ішкі, мәнді белгілерді — тыныс алуын, ұрпағын асырауын бөліп алған. Мұнда <b>дерексіздендіру<\/b> бар: ол сыртқы пішінді елемей, мәнді белгіні ғана бөліп қараған.", "Аружан китті мәнді белгілері бойынша «сүтқоректілер» тегіне жатқызды. Бұл — қорытындылаудың ең күрделі сатысы: адам тек пен түрді ажыратып, затты ұғымдар жүйесіне орналастырады.", "Ойлаудың басты міндеті — кездейсоқ сәйкестікті мәнді байланыстан ажырату (Бабаев). Ерасылдың қатесі осында: суда жүзу — кездейсоқ ұқсастық, ал тыныс алу мен ұрпақ асырау — мәнді белгі.", "Мұғалімге кеңес: Ерасылға китті балықпен <b>көп жақты<\/b> салыстыруды ұсыну — тыныс алуын, ұрпақ өрбітуін, басқа белгілерін кестеге жазғызу; «қай белгі мәнді, қайсысы кездейсоқ?» деп сұрау. Ереже шыққан соң оны басқа жануарға қолдандыру — мысалы, «дельфин қай топқа жатады?» деп сұрау. Бұл — <b>нақтылау<\/b>. Қатесін бетке баспай, ойлау жолын бірге талдаған жөн."], "terms": ["Ой қызметтері", "Салыстыру", "Дерексіздендіру", "Қорытындылау", "Нақтылау", "Тек пен түр"], "tip": "Ой қызметтерін жай тізбеңіз: әрқайсысын жағдаяттағы нақты сөзбен байланыстырып, «мұнда салыстыру үстірт, өйткені…» деп дәлелдеңіз.", "src": "Ойлау және сөйлеу сайты, 1 және 3-тараулар; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s03", "label": "Ойлау және сөйлеу · 3-тарау: Ой қызметтері"}, "topic": 9}, "09-H2": {"id": "09-H2", "level": "hard", "q": "Бес жасар Ернұр конструктордан үй құрастырып отыр. Жанында ешкім жоқ, бірақ ол үздіксіз сөйлейді: «Мұнда есік болады… Жоқ, бұл бөлшек сыймайды… Онда үлкенін аламын». Әжесі «бала өзімен-өзі сөйлейді, бір жерінде ақау бар ма?» деп алаңдап жүр. Бұл құбылысты ойлау мен сөйлеудің байланысы арқылы түсіндіріңіз. Әжеге не айтасыз?", "plan": ["Жағдаятта <b>эгоцентрлік сөйлеу<\/b> көрінеді: бала ешкімге арнамай, өзіне-өзі дауыстап сөйлейді. Выготский бойынша бұл сөйлеу 4–5 жаста пайда болады.", "Ойлау мен сөйлеу ажырамайды, бірақ бір нәрсе емес. Бір ойды әртүрлі сөзбен айтуға болады; кейде ой бар, сөз табылмайды; кейде көп сөйлеп, бір ойды жеткізе алмаймыз. Выготский бойынша ой бірден, тұтас тұрады, ал сөйлеу оны біртіндеп жаяды: «ой — бұлт, сөз — жаңбыр». Бабаев бойынша сөз — негізгі ойлау құралы: оның арқасында адам көз алдында жоқ зат туралы ойлай алады.", "<b>Пиаже<\/b> бойынша эгоцентрлік сөйлеу керексіз болып, 6–7 жасқа қарай жоғалып кетеді.", "<b>Выготский<\/b> бойынша эгоцентрлік сөйлеу жоғалмайды, ішке көшіп, <b>ішкі сөйлеуге<\/b> айналады. Ол — баланың өз ойлауын реттейтін сыртқы құралы. Ернұрдың сөзі де осы: қиындыққа кезіккенде («бөлшек сыймайды») ол дауыстап ойланып, келесі қадамын жоспарлайды.", "Выготский бойынша бірігудің алғышарты — ересекпен бірлескен тілдесу (1–3 жас). Ішкі сөйлеу қалыптасқан соң (6–7 жас) сөзді-логикалы ойлау мен <b>интеллектуалданған сөйлеу<\/b>, яғни ойлауға қызмет ететін сөйлеу, бірге дамиды.", "Әжеге айтатыным: бұл ақау емес, ойлаудың дамып жатқанының белгісі. Баланы тыйып тастамаңыз. Онымен көбірек сөйлесіп, бірге ойнап, бірге міндет шешкен пайдалы: ойлау мен сөйлеудің бірігуі ересекпен бірлескен тілдесуден басталады."], "terms": ["Эгоцентрлік сөйлеу", "Ішкі сөйлеу", "Ойлау мен сөйлеудің бірігуі", "Интеллектуалданған сөйлеу", "Сөзді-логикалы ойлау"], "tip": "Пиаже мен Выготскийдің айырмасын бір сөйлеммен айта біліңіз: біріншісінде эгоцентрлік сөйлеу жоғалады, екіншісінде ішке көшеді.", "src": "Ойлау және сөйлеу сайты, 15-тарау; Немов, I бөлім, 13-тарау; Бабаев, 13-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s15", "label": "Ойлау және сөйлеу · 15-тарау: Ойлау мен сөйлеу"}, "topic": 9}, "10-E1": {"id": "10-E1", "level": "easy", "q": "Қиял деген не? Қиялдың адам өміріндегі негізгі қызметтерін атаңыз.", "plan": ["<b>Қиял<\/b> — бұрынғы қабылдаулар мен тәжірибеге сүйеніп, мида жаңа бейнелер, идеялар немесе жобалар жасау процесі. Қысқа формуласы: тәжірибе + қайта өңдеу = жаңа бейне.", "Қиял жоқтан бар жасамайды. Оның материалы — бұрын көрген, естіген, сезген нәрселеріміздің елестері. Қиял оларды бөлшектеп, басқаша қиыстырады.", "Қиял бейнесі шындықтың дәл көшірмесі емес: ол дәл қазір қабылдап тұрған нәрсеге де, есте сақталған нәрсеге де толық сәйкес келмейді (Немов). Бірақ тәжірибеден мүлде ажырамайды.", "Бабаев қиялдың болашаққа бағытталғанын баса айтады: жағдай әлі анық болмағанда қиял істің нәтижесін алдын ала болжап, әрекет бағдарламасын құруға көмектеседі.", "Крысько қиялдың бес қызметін атайды: шындықты бейнелер арқылы көрсету; эмоциялық күйді реттеу; басқа психикалық процестерді басқару; әрекеттің ішкі жоспарын құру; іс-әрекетті жоспарлау және бағдарламалау.", "Мысал: сәулетші әлі салынбаған үйді ойша көреді. Ауылдан қалаға оқуға келген студент алдағы жылды көз алдына елестетіп, соған қарап жоспар құрады."], "terms": ["қиял", "бейне", "елес", "тәжірибе", "әрекеттің ішкі жоспары"], "tip": "«Қиял — шындықта жоқ нәрсе» деп қана қоймаңыз: қиялдың материалы әрқашан тәжірибеден алынатынын міндетті түрде айтыңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.1; Немов, 12.1; Крысько, 2.19–2.20", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s01", "label": "Қиял · сайттың 1–2-тараулары"}, "topic": 10}, "10-E2": {"id": "10-E2", "level": "easy", "q": "Қиялдың негізгі түрлерін атап, сипаттаңыз.", "plan": ["Ең қарапайым бөлініс — <b>пассивті<\/b> және <b>активті<\/b> қиял (Бабаевта — енжар және белсенді қиял). Айырмасы — бейнені кім басқаратынында.", "Пассивті қиялда бейне ерік күшінсіз, өздігінен туады. Маклаков оны ниеттелген (қиялға берілу, бос арман) және ниетсіз (мүлгу, түс көру, ал патологиялық түрі — галлюцинация) деп бөледі.", "Активті қиялда адам саналы мақсат қояды, бейнені өзі шақырып, ерік күшімен бағыттайды. Дәріс слайды оның үш түрін атайды: қайта жаңғыртушы, шығармашылық және болжамдық қиял.", "<b>Қайта жаңғыртушы қиял<\/b> (Бабаевта — жасампаз қиял) сипаттама не сызба бойынша бейне құрады: кітап оқығанда, картаға не сызбаға қарағанда керек.", "<b>Шығармашылық қиял<\/b> (Бабаевта — шығармашыл қиял) дайын үлгісіз жаңа бейне жасайды. Жаңалығы объективті (дүниеде бұрын болмаған) не субъективті (адамның өзі үшін жаңа) болады. <b>Болжамдық қиял<\/b> болашақты жоспарлап, нәтижені алдын ала көреді.", "<b>Арман<\/b> — қалаған болашақтың бейнесі. Слайдта ол пассивті қиялға, ал Маклаков пен Крысько бойынша активті қиялға жатады. Бабаев оны болымды (мақсаты мен жолы анық, әрекетпен байланысты) және болымсыз (жолы белгісіз, әрекетке итермелемейді) деп бөледі."], "terms": ["пассивті (енжар) қиял", "активті (белсенді) қиял", "ниеттелген және ниетсіз қиял", "қайта жаңғыртушы қиял", "шығармашылық қиял", "арман"], "tip": "Түрлерді жай тізіп шықпаңыз: әр түрге бір мысал келтіріп, бөлудің белгісін (белсенділік, ерік күшінің қатысуы) атаңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11-тарау; Немов, 12-тарау; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s07", "label": "Қиял · сайттың 7–8-тараулары"}, "topic": 10}, "10-M1": {"id": "10-M1", "level": "medium", "q": "Қиялдың физиологиялық негізін түсіндіріңіз. Екінші сигнал жүйесі қиялға қалай қатысады?", "plan": ["Қиял да түйсік, қабылдау, ес, ойлау сияқты ми қабығының жұмысы, жоғары жүйке қызметінің өнімі. Оның материалы — бұрынғы әсерлердің мидағы іздері (энграммалар). Бір мезгілде түскен іздер бір-бірімен байланысып қалады. Крысько бойынша, тәжірибеде түзілген осы уақытша байланыстар — қиялдың тұрақты қоймасы.", "Анықтама: қиялдың физиологиялық негізі — жүйке байланыстарының іске қосылуы, бұзылуы, қайта түзілуі және жаңа жүйелерге бірігуі (Бабаев; Маклаков).", "Слайдтағы төрт қадам: іздер қайта жанданады → ескі байланыстар ыдырайды → босаған бөлшектер арасында жаңа байланыс түзіледі → жаңа бейне пайда болады. Мысалы, көк түйенің әр бөлшегі (түйе, көк түс, қар) таныс, жаңасы тек тіркесі.", "Крысько бойынша бұл ми қабығындағы қозу мен тежелу, иррадиация мен концентрация, оң және теріс индукция, талдау мен біріктіру арқылы жүреді.", "Ес пен қиял бір қоймадан материал алады. Бірақ ес іздерді мүмкіндігінше өзгертпей қайта жаңғыртады, ал қиял оларды өзгертіп, жаңаша құрастырады.", "<b>Екінші сигнал жүйесі<\/b> — сөз бен ой — қиялды ұйымдастырады. Сөз керекті іздерді оятады және олардың қалай қосылатынын бағыттайды: «Алпамыс батыр» жырын тыңдағанда батырдың бейнесі осылай жиналады.", "Бабаев бойынша, оң ми сынары бейнені тұтас, үйлесімді көрініске келтіреді, ал сол сынар оны реттеп, сөзбен өрнектейді. Қиял сезіммен тығыз байланысты. Сондықтан Бабаев пен Маклаков оның тетіктері мидың терең бөлімдерінде де жатыр деп болжайды. Маклаков әсіресе гипоталамус-лимбиялық жүйені атайды."], "terms": ["ақпарат іздері (энграммалар)", "уақытша байланыстар", "екінші сигнал жүйесі", "талдау мен біріктіру", "гипоталамус-лимбиялық жүйе"], "tip": "«Қиял — мидың жұмысы» деп тоқтап қалмаңыз: ескі байланыстың ыдырап, жаңаша қосылатынын қадаммен көрсетіп, мысал келтіріңіз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.1–11.2; Крысько, 2.19; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s04", "label": "Қиял · сайттың 4-тарауы"}, "topic": 10}, "10-M2": {"id": "10-M2", "level": "medium", "q": "Қиялда жаңа бейне жасаудың тәсілдерін мысалмен түсіндіріңіз. Агглютинация мен типизацияның айырмасы неде?", "plan": ["Қиял бейнесі екі кезеңнен өтеді. Алдымен талдау: қиял бейнені бөлшектерге бөледі, керек белгісін бөліп алады (абстракциялау). Сосын біріктіру: бөлшектерді жаңаша құрастырады. Бабаев мұны қиялдың аналитикалық-синтетикалық сипаты дейді.", "<b>Агглютинация<\/b> — әртүрлі заттың бөлшектерін бір бейнеге қосу: сфинкс, кентавр, жезтырнақ, троллейбус. Оның бір түрі — таныс бейнені өзгертпей, жаңа мәнмәтінге қосу.", "<b>Гиперболизация<\/b> — нысанның көлемін, қасиетін не санын шамадан тыс үлкейту не кішірейту. Бабаев мұны гипербола мен литота дейді: Алпамыс, Ер Төстік, Шора батырдың бейнелері.", "<b>Акценттеу<\/b> — бір белгіні әдейі баса көрсету: карикатура, шарж, ашқарақтың мес қарны.", "<b>Схематизация<\/b> — айырмашылықтарды азайтып, ортақ ұқсастықты қарапайым схемаға келтіру: карта, белгі, ою-өрнек.", "<b>Типизация<\/b> — көп адам мен құбылыстың маңызды ортақ қасиеттерінен типтік бейне жасау. Абайдың «Болыс болдым, мінеки» өлеңіндегі болыс — нақты бір адам емес, сол заманның көп болысына тән белгілерден жиналған тип.", "Айырмасы: агглютинация бөлшектерді бір бейнеге жай қосады. Ал типизацияда автор көп нысанды бақылап, маңызды белгіні таңдап, жалпылайды. Маклаков бойынша бұл механикалық қосу емес, күрделі шығармашылық процесс."], "terms": ["агглютинация", "гиперболизация", "акценттеу", "схематизация", "типизация"], "tip": "Агглютинация мен типизацияны шатастырмаңыз: агглютинация екі-үш нысанның бөлшегін бір бейнеге жай қосады, ал типизация көп нысанды салыстырып, маңызды ортақ белгіні таңдап, жалпылайды.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.2; Крысько, 2.20; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s06", "label": "Қиял · сайттың 6-тарауы"}, "topic": 10}, "10-H1": {"id": "10-H1", "level": "hard", "q": "Екінші курс студенті Айгерім ертеңгі емтиханды ойлап, түні бойы ұйықтай алмады. Ол оқытушының алдында сасып, ештеңе айта алмай тұрғанын қайта-қайта елестетеді. Таңертең жүрегі дүрсілдеп, алақаны терлеп, басы ауырып тұр, ал шын мәнінде ол емтиханға жақсы дайындалған. Айгерімнің күйін қиялдың ағзаға әсерімен түсіндіріңіз. Оған қандай кеңес бересіз?", "plan": ["Жағдаят: Айгерімнің денесі шын қауіпке емес, ойдағы бейнеге жауап беріп тұр. Бұл — қиялдың ағзаға әсері. Бейне Айгерімнің еркінен тыс қайта-қайта оралады: ол бейнені басқара алмай тұр.", "Теория: барлық психикалық процестің ішінде денемен ең тығыз байланысқаны — қиял. Мида туған бейне мидан тыс мүшелердің жұмысын өзгертеді, өйткені қиялдың тетіктері мидың терең бөлімдерінде де жатыр. Сол себепті қиял тыныс ырғағына, тамыр соғысына, қан қысымына әсер етеді. Қышқыл құртты елестетсек, сілекей өзі ағатыны да осыдан.", "Талдау: қорқыныш пен қиял бірін-бірі күшейтеді (Бабаев). Сайттың түсіндіруінше, мұндай бейне гиперболизацияға ұқсас бұрмаланады: қауіп үлкейіп, адамның өз күші кішірейеді. «Қорыққанға қос көрінеді.» Мұндай қиял тіпті адамды ауруға ұшыратуы мүмкін.", "Дәл осы тетік емдей де алады. Қиял бейнесін орынды пайдалансақ, денедегі процестерді басқаруға болады. Эмиль Куэнің саналы өзін-өзі сендіру әдісі мен одан шыққан аутогендік жаттығу осыған сүйенеді: адам бұлшықеттерін босаңсытуды, денесін тыныштандыруды үйренеді.", "Ұсыныс: Айгерім қауіпті шын көлеміне қайтарсын: «Мен дайындалдым, сұрақтардың көбін білемін» деп өз тірегін еске алсын. Ұйықтар алдында Куэ әдісіндегідей тыныштандыратын қысқа сөзді бірнеше рет қайталасын, бұлшықетін босаңсытып, қолының жылынғанын елестетсін. Бұл — аутогендік жаттығудың қарапайым тәсілі.", "Қорытынды: қиял адамның тек ішкі күйін өзгертеді, ал сыртқы нәтиже әрекетпен өзгереді. Сондықтан тыныштандыратын бейнені нақты дайындықпен, мысалы, сұрақтарды қайталаумен ұштастырған жөн."], "terms": ["қиялдың ағзаға әсері", "қиял мен сезімнің байланысы", "гиперболизация", "өзін-өзі сендіру", "аутогендік жаттығу"], "tip": "Алдымен құбылысты атаңыз (қиялдың ағзаға әсері), сосын оның екі жағын көрсетіңіз: бір тетік адамды ауыртады да, емдейді де; ұсынысты осы екінші жағына құрыңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.1; Крысько, 2.19–2.21", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s05", "label": "Қиял · сайттың 5-тарауы (кеңестер — 12-тарауда)"}, "topic": 10}, "10-H2": {"id": "10-H2", "level": "hard", "q": "Бірінші курс студенті Ерлан кешкісін жатақханада сағаттап өзін өз компаниясын ашқан атақты бағдарламашы ретінде елестетеді. Бірақ бағдарламалау сабағына дайындалмайды, тапсырмаларын кейінге қалдыра береді. Ерланның қиялы қай түрге жатады? Оның қиялын іске пайдалы етуге қалай көмектесесіз?", "plan": ["Жағдаят: Ерлан бейнеге өзі беріледі, бірақ бейне ешбір іске ұласпайды. Маклаков бойынша бұл — ниеттелген пассивті қиял, яғни қиялға берілу, бос арман. Бабаевша бұл — болымсыз арман: мақсаты бар, бірақ жолы белгісіз, ол адамды әрекетке итермелемейді.", "Теория: активті қиялда адам мақсат қояды, бейнені ерік күшімен бағыттап, әрекетке айналдырады. Болымды арманның мақсаты анық, жолы белгілі, ол әрекеттен ажырамайды.", "Талдау: бос арманда адамның қажеттілігі айқын көрінеді. Іске аспаған арманның да пайдасы бар: ол психологиялық қорғаныс ретінде ауыр күйден шығарады. Бірақ арман іс-әрекеттің орнын басса, тұлғаның дамуы тежеледі. Бабаев мысалға алатын Гогольдің Маниловы да тоған үстіне тас көпір салуды армандайды, бірақ бір іс бастамайды.", "Ерланның арманынан бас тартудың қажеті жоқ: болашақты елестету мақсат қалыптастыруға, әрекет жоспарын нақтылауға көмектеседі. Міндет — болымсыз арманды болымдыға айналдыру.", "Ұсыныс: арманды бір нақты қадаммен байланыстыру. Психологтың сұрағы қарапайым: «Осы аптада не істейсіз?» Мысалы, бүгінгі тапсырманы бітіру, бір айда шағын жоба жасау.", "Ойша жаттығу: Ерлан тек нәтижені емес, жолды да елестетсін — тапсырманы бастағанын, қиын жерінен қалай өткенін басынан аяғына дейін ойша өтсін. Ойша жаттығу Крысько айтқан әрекеттің ішкі жоспарына сүйенеді.", "Қорытынды: психолог арманды айыптамайды, оны әрекетке апаратын көпір етеді. Арманға апаратын жолды психолог емес, Ерланның өзі құрастыруы керек."], "terms": ["пассивті қиял", "бос арман", "болымды және болымсыз арман", "активті қиял", "ойша жаттығу"], "tip": "Ерланды «қиялшыл» деп сынаумен шектелмеңіз: қиялдың түрін анықтап, оны активті қиялға айналдыратын нақты қадамдарды ұсыныңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11-тарау; Немов, 12-тарау", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s08", "label": "Қиял · сайттың 8-тарауы (7 және 12-тарауларды да қараңыз)"}, "topic": 10}, "11-E1": {"id": "11-E1", "level": "easy", "q": "Эмоция деген не? Эмоцияның негізгі қызметтерін атап, сипаттаңыз.", "plan": ["<b>Эмоция<\/b> — адамның дүниеге және өзіне қатынасын толғаныс түрінде бейнелеуі. Маклаков бойынша бұл — жағдайдың адам үшін жеке маңызын толғаныс түрінде бейнелейтін психикалық процесс, басты белгісі — субъективтілігі.", "Түйсік пен қабылдау заттың қасиетін бейнелейді, ал эмоция затқа қатынасымызды бейнелейді. Эмоция қажеттіліктің қалай қанағаттанып жатқанын хабарлайды. Оның әрқашан таңбасы болады: жағымды не жағымсыз.", "<b>Бейнелеу-бағалау<\/b> (Бабаевта — бейнелеу): эмоция оқиғаға жалпылама баға береді, әсердің пайдалы не зиянды екенін денеге зардабы білінбей тұрып-ақ аңғартады.", "<b>Ынталандыру<\/b> (Бабаевта — ниеттеу): эмоция адамды затқа ұмтылуға не одан аулақ болуға итермелейді. <b>Қуаттау<\/b>: күшті эмоция туғызған оқиға тез әрі ұзақ есте қалады, табыс пен сәтсіздік ынтаны арттырады не өшіреді.", "<b>Ауыстыру<\/b> (Бабаевта — ауысу): бірнеше түрткі таласқа түскенде эмоция әрекетті бір қажеттіліктен екіншісіне бұрады. <b>Бейімделу<\/b> (Бабаевта — икемдесу): эмоция ағзаның ортаға бейімделуіне көмектеседі.", "<b>Коммуникативтік<\/b> қызмет: бет-әлпет, дене қимылы, дауыс ырғағы арқылы адам өз толғанысын басқаларға білдіреді."], "terms": ["эмоция", "толғаныс", "жағымды және жағымсыз эмоция", "бейнелеу-бағалау қызметі", "коммуникативтік қызмет"], "tip": "Анықтамада «толғаныс» пен «қатынас» деген екі сөзді міндетті түрде қолданыңыз: эмоция заттың өзін емес, оған қатынасымызды бейнелейді.", "src": "Бабаев, 17-дәрісбаян; Маклаков, 16.1; Немов, 24-тарау", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s01", "label": "Эмоция және сезім · сайттың 1–2-тараулары"}, "topic": 11}, "11-E2": {"id": "11-E2", "level": "easy", "q": "Эмоциялық күйлер мен сезімдердің негізгі түрлерін атап, қысқа сипаттаңыз.", "plan": ["Эмоциялық күйлер бір-бірінен қарқындылығымен, ұзақтығымен және неге бағытталатынымен ажырайды.", "<b>Сезімдік реңк<\/b> (Бабаевта — көңіл) — түйсікке ілесетін жағымды не жағымсыз толғаныс: жусанның иісі біреуге жылы сезім оятады, бордың шиқылы денені түршіктіреді. <b>Тар мағынадағы эмоция<\/b> (Бабаевта — сезім шарпуы) — нақты жағдайға байланысты қысқа толғаныс. <b>Көңіл-күй<\/b> (Бабаевта — кейіп) әлсіз, ұзақ, себебі көбіне беймәлім, бәріне жайылады.", "<b>Аффект<\/b> — қысқа, бірақ өте күшті толғаныс: сана мен зейін тарылады, бақылау күрт әлсірейді, кейін аффективтік із қалады. <b>Құмарлық<\/b> әрі күшті, әрі ұзақ, әрқашан бір нысанға бағытталады.", "<b>Стресс<\/b> — адам көтере алмайтын жүктеме кезінде туатын ауыр күй; оның үш фазасы бар: дабыл, қарсыласу, қалжырау. <b>Фрустрация<\/b> мақсат жолындағы кедергіден туады.", "Сезімдер тұрақты, нақты нысанға бағытталған, тек адамға тән. Жоғары сезімдердің үш тобы бар: адамгершілік (моральдық), ақыл-ой (интеллектуалдық) және эстетикалық сезімдер.", "Адамгершілік сезім қоғамның нормасы адамның ішкі заңына айналғанда қалыптасады. Ақыл-ой сезімі таңданудан басталып, ізденіс пен сенімге ұласады. Эстетикалық сезімді Құрманғазының күйі оятады."], "terms": ["сезімдік реңк", "көңіл-күй", "аффект", "құмарлық", "стресс", "жоғары сезімдер"], "tip": "Әр күйді үш белгімен сипаттаңыз: күші, ұзақтығы және бір нысанға бағытталуы. Жоғары сезімдерді күйлермен араластырмаңыз: олар — тұрақты қатынас.", "src": "Бабаев, 17-дәрісбаян; Маклаков, 16.1, 16.3; Немов, 24-тарау", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10", "label": "Эмоция және сезім · сайттың 10–11-тараулары"}, "topic": 11}, "11-M1": {"id": "11-M1", "level": "medium", "q": "Эмоция мен сезімнің айырмашылығын түсіндіріңіз. Олар бір-бірімен қалай байланысты?", "plan": ["Алдымен сөзді анықтап алайық. «Эмоция» сөзінің екі мағынасы бар. Кең мағынада ол бүкіл эмоциялық сала, ал сезім — оның бір түрі (Маклаков, Немов). Тар мағынада эмоция — сезімнің тікелей, уақытша көрінісі (Крысько, Бабаев). Бабаев тар мағынадағы эмоцияны «сезім шарпуы» дейді. «Сезім мүшелері» тіркесіндегі «сезім» түйсікті білдіреді.", "<b>Сезім<\/b> — көптеген жағымды және жағымсыз эмоциялардан құралған, нақты нысанға бағытталған, тек адамға тән, өмір бойы қалыптасатын күрделі толғаныс (Немов).", "Пайда болу уақыты: эмоция филогенезде де, онтогенезде де ертерек туады, қарапайым эмоциялар адам мен жануарға ортақ. Сезім кейін, адамның өмірінде біртіндеп қалыптасады.", "Ұзақтығы мен бағыты: эмоция қысқа, нақты жағдайға байланысты; сезім ұзақ, тұрақты және белгілі бір нысанға бағытталған.", "Табиғаты мен саналылығы: эмоция көбіне биологиялық қажеттілікпен байланысты және бейсаналы салаға жақын. Сезімнің табиғаты әлеуметтік, ол санада айқын көрінеді (Маклаков). Сезімді адам саналы түрде реттей алады (Немов); сезім тұлғаны сипаттайды және тұлғамен бірге өзгереді.", "Байланысы: қайталанған эмоциялардан сезім туады, ал сезім эмоциялар арқылы өмір сүреді. Бір сезім әртүрлі, тіпті қарама-қарсы эмоциялармен көрінеді: махаббат бірде қуаныш, бірде қызғаныш, бірде уайым болып білінеді. Эмоциялар басылады, ал махаббат сол күйі қалады.", "Ұқсастығы: екеуі де субъективті, рахат не жайсыздық туғызады, қажеттілікке байланысты, физиологиялық негізі ортақ."], "terms": ["эмоция", "сезім", "сезім шарпуы", "толғаныс", "қажеттілік"], "tip": "Айырмашылықты бірнеше белгімен қатар салыстырыңыз, соңында байланысын міндетті түрде айтыңыз: сезім эмоциялар арқылы көрінеді.", "src": "Бабаев, 17-дәрісбаян; Маклаков, 16.1; Немов, 24.1, 24.3", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s03", "label": "Эмоция және сезім · сайттың 3-тарауы"}, "topic": 11}, "11-M2": {"id": "11-M2", "level": "medium", "q": "Джемс–Ланге теориясын баяндап, оны Кеннон–Бард теориясымен салыстырыңыз.", "plan": ["<b>Джемс–Ланге перифериялық (органикалық) теориясы:<\/b> тітіркендіргіш алдымен денені өзгертеді, ал адамның осы өзгерістерді сезінуі — эмоция. Тізбек: оқиға → дене → эмоция. «Қайғыруымыз — жылағанымыздан.»", "Теорияның үш қағидасы: дене өзгерісінсіз эмоция болмайды; дене өзгерісі эмоциядан бұрын келеді; әр эмоцияның өзіне ғана тән дене өзгерісі бар. Ланге эмоцияны тамыр-қозғалыс өзгерістерін сезіну деп түсіндірді.", "Теорияға қарсы дәлелдер: әртүрлі эмоцияда дене бірдей өзгереді; ішкі мүшелер баяу өзгереді; адреналин екпесі сияқты жасанды дене өзгерісі нағыз эмоция бермейді; денеден миға сигнал жетпесе де, эмоция туады (Кеннонның ең күшті дәлелі).", "<b>Кеннон–Бард таламустық теориясы:<\/b> хабар таламусқа келеді, ал таламус оны бір мезгілде ми қыртысына (толғаныс) және денеге (дене өзгерісі) жібереді. Бірі екіншісін тудырмайды, екеуі қатар жүреді.", "Салыстыру: Джемс–Лангеде дене өзгерісі — эмоцияның себебі. Кеннон–Бардта дене өзгерісі мен толғаныс — бір хабардың қатар жүретін екі салдары. Біріншісі шеткі мүшелерге, екіншісі миға (таламусқа) сүйенеді.", "Ортақ кемшілігі: екеуі де адам мен жануарға ортақ қарапайым биологиялық эмоциялар мен аффектілерді ғана түсіндіреді, адамның күрделі сезімдерін аша алмайды. Кеннон–Бард теориясында ми қыртысының үлесі де анық көрсетілмеген. Сондықтан кейін когнитивтік теориялар пайда болды."], "terms": ["перифериялық теория", "таламустық теория", "таламус", "дене өзгерістері", "толғаныс"], "tip": "Екі теорияның тізбегін сызба түрінде көрсетіңіз: «оқиға → дене → эмоция» және «оқиға → таламус → дене өзгерісі мен толғаныс қатар».", "src": "Маклаков, 16.2; Немов, 24.2; Бабаев, 17-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s07", "label": "Эмоция және сезім · сайттың 7–8-тараулары"}, "topic": 11}, "11-H1": {"id": "11-H1", "level": "hard", "q": "Үшінші курс студенті Дана топ алдында жобасын қорғауға шықты. Алғашқы сөйлемнен кейін оның даусы дірілдеп, беті қызарды, жүрегі дүрсілдей бастады. Ол ішінен «бәрі мені сынап отыр, қазір ұятқа қаламын» деп ойлап, сөзін тездетіп, тезірек орнына барғысы келеді. Дананың эмоциясын құрылымдық компоненттерге бөліп талдаңыз. Оған қандай кеңес бересіз?", "plan": ["Жағдаят: Данада көпшілік алдында сөйлеуден туған жағымсыз эмоция бар, ол қорқынышқа жақын. Эмоция тұтас болып көрінгенімен, оның бес компоненті бар: субъективтік толғаныс, физиологиялық өзгерістер, экспрессия, когнитивтік бағалау және мінез-құлықтағы көрінісі. Бұл — Маклаков атаған алты құрамдас бөліктің сайттағы жинақталған түрі.", "<b>Субъективтік толғаныс<\/b>: «қорқып тұрмын», «ұят болады» деген ішкі сезінуі. Оны тек Дананың өзі тікелей біледі, басқалар оған сыртқы белгілер арқылы жанама жетеді.", "<b>Физиологиялық (вегетативтік) өзгерістер<\/b>: жүректің дүрсілдеуі, беттің қызаруы. Вегетативтік жүйке жүйесінің симпатикалық бөлімі ағзаны шұғыл әрекетке дайындайды. Бұл өзгерістер ерікке бағынбайды.", "<b>Экспрессия<\/b>: тез, асығыс сөйлеу, оны тыңдаушылар көреді. Дауыстың дірілі — экспрессия мен ағза реакциясының шекарасы: дауыс — экспрессияның арнасы, бірақ діріл еріктен тыс шығады. <b>Мінез-құлықтағы көрінісі<\/b>: орнына тезірек қайтуға ұмтылу, яғни әрекетке бейімділік.", "<b>Когнитивтік бағалау<\/b>: «бәрі мені сынап отыр» деген ой жағдайды қауіпті етіп көрсетеді. Компоненттер бір-біріне әсер етеді: бағалау эмоцияны іске қосады, ал дене толғаныстың күшін арттырады.", "Ұсыныс: Дана экспрессиясынан бастасын, себебі оны ішінара басқаруға болады: сөзін асықпай айтсын, сөйлем арасында кідіріс жасасын. Кідіріс асығыс эмоцияға ақылдың араласуына уақыт береді. Ал жүрек дүрсілі мен беттің қызаруын күшпен басуға тырыспасын: олар ерікке бағынбайды.", "Қорытынды: эмоцияны жоқ қылу емес, реттеу керек. Хебб қисығы бойынша әрекет орташа қозуда ең тиімді, сондықтан аздаған толқу Данаға зиян емес. Ерікпен ішінара басқаруға болатыны — бағалау мен экспрессия; дене өзгерістері ерікке бағынбайды."], "terms": ["субъективтік толғаныс", "физиологиялық (вегетативтік) өзгерістер", "экспрессия", "когнитивтік бағалау", "мінез-құлықтағы көрінісі"], "tip": "Компоненттерді тек тізбей, әрқайсысын жағдаяттағы нақты белгімен байланыстырыңыз.", "src": "Маклаков, 16.1–16.3; Немов, 24.1; Бабаев, 17-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s04", "label": "Эмоция және сезім · сайттың 4-тарауы (реттеу — 12-тарауда)"}, "topic": 11}, "11-H2": {"id": "11-H2", "level": "hard", "q": "Бір топтың екі студенті емтиханнан бірдей «жақсы» баға алды. Асқар «жақсы» алсам болды деп жүрген еді, енді қуанып, достарына хабарлап жатыр. Ал Мөлдір жылап жіберді: ол «өте жақсыдан» төмен бағаны жеңіліс деп санайды, грантынан айырылып қалам ба деп қорқады. Бір оқиға неге екі түрлі эмоция тудырды? Мұны эмоцияның қай теорияларымен түсіндіресіз?", "plan": ["Жағдаят: тітіркендіргіш бірдей, ал эмоция қарама-қарсы: Асқарда қуаныш, Мөлдірде мұң мен қорқыныш. Демек эмоцияны оқиғаның өзі емес, оның адам үшін мәні анықтайды.", "Физиологиялық теориялар бұл айырманы түсіндіре алмайды: олар эмоцияны денеден не таламустан іздейді, ал мұнда айырма адамның ойы мен күтуінде. Сондықтан психологтар эмоцияны ой мен сана арқылы түсіндіретін когнитивтік теорияларды жасады.", "<b>Шехтердің когнитивтік-физиологиялық (екі факторлы) теориясы:<\/b> эмоция тітіркендіргіштің, дене қозуының және когнитивтік себептердің (жад, мотивация, ойлау) бірігуінен туады. Екеуінде де қозу бар, бірақ «атаусыз» қозуға ат беретін — бағалау.", "<b>Лазарустың когнитивтік-делдалдық теориясы:<\/b> бағалау эмоциядан бұрын келеді. Асқар бағаны «мақсатыма жеттім» деп, Мөлдір «грантқа қатер төнді» деп бағалады. Бағалау екі түрлі болғандықтан, бір оқиғадан екі түрлі эмоция туды.", "<b>Фестингердің когнитивтік диссонанс теориясы:<\/b> Асқардың күткені мен болғаны сәйкес келді (консонанс), сондықтан жағымды күй туды. Мөлдірде күткені мен болғанының арасы алшақ (диссонанс), сондықтан жағымсыз күй туды.", "<b>Симоновтың ақпараттық теориясы:<\/b> эмоция қажеттіліктің күшіне және оны өтеу ықтималдығын адамның қалай бағалайтынына байланысты. Мөлдірдің қажеттілігі (грант) күшті, ал ықтималдықты төмен бағалап отыр, сондықтан жағымсыз эмоция туды.", "Ұсыныс: Мөлдір бағасын тексерсін — грант шартын нақтыласын, бір баға грантқа шын қатер төндіре ме, соны білсін. Жетіспеген ақпарат толыққан сайын қорқыныш азаяды. Келесі сессияға жоспар құру да мақсатқа жету ықтималдығын арттырады.", "Қорытынды: эмоцияны оқиғаның өзі емес, адамның оны қалай бағалағаны анықтайды, сондықтан бағаны өзгерту арқылы эмоцияны да реттеуге болады."], "terms": ["когнитивтік бағалау", "когнитивтік-делдалдық теория (Лазарус)", "екі факторлы теория", "когнитивтік диссонанс", "ақпараттық теория", "қажеттілік"], "tip": "Бір теориямен шектелмеңіз: физиологиялық теориялар неге жарамайтынын қысқа айтып, сосын когнитивтік теорияларды әр студентке нақты қолданыңыз.", "src": "Маклаков, 16.2; Немов, 24.2", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s08", "label": "Эмоция және сезім · сайттың 8–9-тараулары"}, "topic": 11}, "12-E1": {"id": "12-E1", "level": "easy", "q": "Ерік деген не? Ырықты және ырықсыз әрекеттің айырмашылығын түсіндіріңіз.", "plan": ["<b>Ерік<\/b> — адамның мақсатқа жету жолында кезіккен сыртқы және ішкі кедергілерді жеңіп, өз әрекеті мен қылығын саналы түрде реттей білуі (Бабаев; Маклаков).", "Ерік қиын жағдайда белсенділікті саналы түрде реттейді. Бабаев оның екі қызметін атайды: ынталандыру — белсенділікті іске қосады, реттеу — керексіз әрекетті тежейді. Бұлардың негізінде жүйке жүйесіндегі қозу мен тежелудің өзара байланысы жатыр.", "<b>Ырықсыз әрекет<\/b> санадан тыс, өздігінен жүреді: көздің жыпылықтауы, түшкіру, ыстық затқа тиген қолды тартып алу, шуға қарай бас бұру, таңданғанда ауыздың ашылып қалуы.", "<b>Ырықты (еріктік) әрекет<\/b> саналы мақсатқа бағытталады және адамнан күш салуды талап етеді. Ырықты әрекет ырықсыз қимылдардың негізінде дамиды.", "Еріктік қылықтың ерекшелігі — «мен қалаймын» емес, «мен міндеттімін» деген толғаныс. Бірақ адам кейде екеуін біріктіре алады: «Мен өз борышымды орындауды қалаймын».", "Кедергіні жеңген әрекеттің бәрі еріктік емес: иттен қорқып, биік дуалдан секіріп кеткен бала ерік көрсеткен жоқ, оны сыртқы қауіп айдады."], "terms": ["ерік", "ырықты әрекет", "ырықсыз әрекет", "еріктік әрекет", "ішкі және сыртқы кедергілер"], "tip": "Еріктік әрекетті кез келген белсенділікпен шатастырмаңыз: оның басты белгісі — саналы мақсат пен кедергіні жеңу.", "src": "Бабаев, 16-дәрісбаян, 1-бөлім; Маклаков, 15.1; Немов, 23.1", "link": null, "topic": 12}, "12-E2": {"id": "12-E2", "level": "easy", "q": "Еріктің негізгі сапаларын атап, сипаттаңыз.", "plan": ["Ерік сапалары — адамның еріктік әрекетінде көрінетін тұрақты ерекшеліктер. Олардың бәрін біріктіретін — <b>ерік күші<\/b>: үлкен кедергіні жеңу қабілеті. Жеңілген кедергі неғұрлым ауыр болса, ерік күші соғұрлым зор.", "<b>Мүдделі мақсат<\/b> (мақсаттылық) — өз әрекетін белгілі бір нәтижеге бағыттай алу. Ол екі түрлі: стратегиялық мақсат өмірлік ұстаным мен мұратқа бағытталады, оперативтік (жедел) мақсат жақын, нақты іске бағытталады.", "<b>Ынталылық<\/b> — идеяны өз бетімен іске асыруды бастау. <b>Дербестік<\/b> — басқаның кеңесін сынмен бағалап, өз сенімі бойынша шешім қабылдау.", "<b>Ұстамдылық<\/b> — сезімді, ашуды тежеп, ойланбаған әрекетке бармау. <b>Батылдық<\/b> — орынды шешімді тез әрі берік қабылдап, оны іске асыра алу.", "<b>Табандылық<\/b> — қиындыққа төзіп, мақсатқа ұзақ уақыт ұмтыла беру. Бабаев оны шалттықпен қатар қояды: тез қызатын шалттық табандылықпен ұштасса ғана құнды. <b>Өзіндік бақылау<\/b> — өз әрекетін көздеген мақсатпен салыстырып отыру.", "Оң сапаларды олардың теріс «егіздерінен» ажырату керек: табандылықтан — өжеттік пен қиқарлықты, дербестіктен — негативизмді, яғни себепсіз қарсы шығуды (Маклаков), батылдықтан — көзсіздікті (Бабаев). Еріктің әлсіздігінің жалпы көрінісі — еріншектік."], "terms": ["ерік күші", "мүдделі мақсат", "табандылық", "батылдық", "ұстамдылық", "өжеттік пен қиқарлық"], "tip": "Әр сапаны оның теріс «егізінен» ажыратыңыз: табандылық пен қиқарлық, батылдық пен көзсіздік бір нәрсе емес.", "src": "Бабаев, 16-дәрісбаян, 5-бөлім; Маклаков, 15.5; Немов, 23.5", "link": null, "topic": 12}, "12-M1": {"id": "12-M1", "level": "medium", "q": "Ерік туралы негізгі теорияларды баяндаңыз. Олар еріктің көзін неден көреді?", "plan": ["Ежелгі ойшылдар ерікті бөлек құбылыс деп қарамаған, оның орнына даналық мұратын алға қойған. Аристотель бойынша әрекет логикалық қорытындыдан туады: «дәмдінің бәрін жеу керек» және «бұл алма дәмді» деген ойлар адамды бірден алманы жеуге итермелейді. Еріктің көзі — ақыл.", "Орта ғасырда адамды енжар, сырттан әсер жинайтын «ұя» деп санаған. Ерікті сыртқы күштерге — періште мен шайтанға — телиген. Адамның өз бетімен әрекет етуі мойындалмады.", "Қайта өрлеу дәуірінде ерік бостандығы тұлғаның басты құндылығына айналды. Оны шектен тыс асыра бағалаудан экзистенциализм туды (Сартр, Камю): ерік қоғамға, нормаға тәуелсіз деп саналды. Бабаев пен Маклаков мұны сынайды: экзистенциалистер адамды қоғамнан бөліп қарайды, ал бір норманы жоққа шығарған адам міндетті түрде басқа норманы ұстанады.", "<b>Павловтың ілімі:<\/b> ерік — «еркіндік инстинкті», тіршілік иесі кедергіге тап болғанда көрінетін белсенділік; ол аштық пен қауіп инстинктінен кем емес. Бұл көзқараста ерік рефлекстік, яғни тітіркендіргішке берілетін жауап. Оны бихевиористер мен рефлексологтар қолдады. Сыны: онда ерік сыртқы жағдайға тәуелді болып шығады, ал еріктік әрекет адамның өзіне толық байланысты болмайды.", "<b>Психоанализ:<\/b> ерік — әрекетке дем беретін ерекше қуат. Фрейд оны либидоға, Лоренц агрессияға, Адлер билікке ұмтылуға, Хорни мен Фромм өзін іске асыруға байланыстырды. Сыны: бір қажеттілікті асыра бағалайды, ал өз өмірін қатерге тіккен ерлікті түсіндіре алмайды.", "<b>Қазіргі көзқарас<\/b> (Бернштейн мен Анохиннің зерттеулеріне сүйенеді): адам бастапқыда белсенді және мінез-құлқын саналы таңдай алады. Ерік — сол мінез-құлықты саналы реттеу. Ерік бостандығы табиғат пен қоғам заңдарын жоққа шығармайды, оларды танып, соған сай әрекет етуді білдіреді."], "terms": ["ерік бостандығы", "экзистенциализм", "еркіндік инстинкті", "психоанализ", "саналы реттеу"], "tip": "Теорияларды тізбемеңіз: әрқайсысы еріктің көзін неден көретінін (ақыл, жоғары күш, рефлекс, биологиялық қуат, сана) айтып, салыстырыңыз.", "src": "Бабаев, 16-дәрісбаян, 2-бөлім; Маклаков, 15.2; Немов, 23.2", "link": null, "topic": 12}, "12-M2": {"id": "12-M2", "level": "medium", "q": "Еріктік әрекеттің құрылымын түсіндіріңіз. Түрткілер күресі мен шешім қабылдау қалай жүреді?", "plan": ["Қарапайым еріктік әрекетте мақсат анық, адам бірден әрекетке көшеді. Күрделі еріктік әрекетте түрткі мен нақты әрекеттің арасына қосымша кезеңдер енеді. Бабаев бойынша олар: ниеттің тууы мен мақсат белгілеу; түрткілер күресі; шешім қабылдау; орындау. Орындаудан кейін бағалау келеді.", "Бастапқы кезеңде қажеттілік әуелі <b>құмарлық<\/b> түрінде көрінеді: адам бір нәрсенің керегін сезеді, бірақ не керегін анық білмейді («не керегін өзі де білмейді»). Бұл — эмоция тақырыбындағы күшті әрі ұзақ құмарлық емес, әлі айқындалмаған қажеттілік. Қажеттілік айқындалғанда <b>тілекке<\/b> айналады, тілек бағаланып, мақсатқа ұласады.", "Бір мезгілде қарама-қайшы тілектер туса, <b>түрткілер күресі<\/b> басталады: адам әр әрекеттің оң және теріс жағын салмақтайды, «қалау» мен «міндет» арасында толғанады.", "Күрес <b>шешім қабылдаумен<\/b> аяқталады: адам бір түрткіні таңдап, мақсат пен тәсілді белгілейді және жауапкершілікті сезінеді. Джемс шешімге келудің бес жолын сипаттаған (Маклаковта — шешімділік түрлері): ақылға сай шешім; кездейсоқ себепке бағыну; ойланбай іске кірісу; құндылық өзгергенде келетін шешім; ерік күшімен әлсіз түрткіні күшейту («Көз қорқақ, қол батыр»).", "Шешім әлі әрекет емес. Орындау ұзақ мерзімге қалдырылса, шешім ниет күйінде қалады. Мысалы, оқушы «келесі жылдан бастап беске оқимын» деп ниет етеді. Ниеттен кейін жоспар құрылады. Жоспарды іске асыру үшін <b>ерік күші<\/b> керек — ішкі және сыртқы кедергіні жеңуге жұмсалатын қосымша қуат.", "Еріктік әрекеттің мәні түрткілер күресінде емес, нәтижеде: шешімін іспен көрсете алған адамды ғана ерік күші бар дейміз.", "Соңында адам нәтижені бағалайды. Қанағаттану не өкіну сезімі істі жалғастыруға, өзгертуге не тоқтатуға түрткі болады."], "terms": ["түрткілер күресі", "шешім қабылдау", "құмарлық", "тілек", "ниет", "ерік күші"], "tip": "Кезеңдерді ретімен атап, әрқайсысына бір мысал келтіріңіз. Есіңізде болсын: еріктік әрекеттің мәні шешімде емес, нәтижеде.", "src": "Бабаев, 16-дәрісбаян, 4-бөлім; Маклаков, 15.4; Немов, 23.3", "link": null, "topic": 12}, "12-H1": {"id": "12-H1", "level": "hard", "q": "Бірінші курс студенті Нұрлан жаңа жылдан бастап күн сайын таңертең жүгіруге және ағылшын тілін оқуға шешім қабылдады. Алғашқы үш күн орындады, кейін «бөлмелесім ұйықтатпады», «ауа райы суық» деп сылтау айтып, телефонға үңіліп отыра беретін болды. Нұрланның жағдайын ерік психологиясымен талдаңыз. Оған қандай кеңес бересіз?", "plan": ["Жағдаят: Нұрланның «жаңа жылдан бастап» деген шешімі алдымен ниет күйінде тұрды. Бабаев бойынша, орындалуы кейінге қалдырылған шешім — ниет қана, ол еріктік әрекетке жеткіліксіз. Үш күннен кейін әрекет орындау кезеңінде үзілді. Бұл — ерік күшінің жетіспеуі. Негізгі кедергі ішкі: жалқаулық, шаршау, ойын-сауыққа ауатын тілек.", "Теория: шешім әлі әрекет емес. Еріктік әрекеттің мәні нәтижеде, ал шешімді іске асыру үшін жоспар мен ерік күші керек. Ерік күші адамның көзқарасына, мақсаттың мәніне және өзін басқара алуына байланысты.", "Талдау: Нұрлан ішкі кедергіні сыртқы себепке айналдырып отыр. Бабаев мұны психологиялық қорғаныс деп сипаттайды: сабаққа кешіккен оқушы ұйқысын емес, автобусты кінәлайды. Мұндай адамда бақылау локусы сыртқы: ол себепті өзінен емес, жағдайдан іздейді.", "Тағы бір себеп — мақсаттың мәні терең түсінілмеген. Мақсат неғұрлым маңызды болса, адам кедергіден соғұрлым аз қаймығады. Нұрланның мақсаты «қалаймын» күйінде қалып, «міндеттімін» деген сенімге айналмаған.", "Ұсыныс: Нұрлан мақсатты өзі үшін мәнді етсін — не үшін жүгіреді, ағылшын тілі неге керек, соны анықтасын. Жоспарды шағын, нақты қадамға бөлсін: күніне 15 минут, бір уақытта, бір орында. Әр күнді белгілеп, өзіндік бақылау жүргізсін.", "Өзіндік бағаға сақ болсын: тым қатал баға сенімді жояды, тым жұмсақ баға бақылауды әлсіретеді.", "Қорытынды: ерік сапалары іс-әрекетте, тұрақты еңбек пен тәртіпте қалыптасады. Бабаевтың сөзімен айтсақ, ерік — дұрыс ұйымдастырылған еңбек."], "terms": ["ерік күші", "ішкі кедергі", "бақылау локусы", "табандылық", "өзіндік бақылау"], "tip": "Нұрланды жай «жалқау» деп бағалауға асықпаңыз: еріктік әрекеттің қай кезеңде үзілгенін анықтап, кеңесті сол кезеңге бағыттаңыз.", "src": "Бабаев, 16-дәрісбаян, 1, 4–6-бөлімдер; Маклаков, 15.4–15.5", "link": null, "topic": 12}, "12-H2": {"id": "12-H2", "level": "hard", "q": "Ауыл мектебінің мұғалімі Серік жол апатында мидың маңдай бөлігінен жарақат алды. Емделіп шыққан соң ол сабақ жоспарын бастап жазады да, аяқтамай тастайды, кез келген сыртқы әсерге алаңдап, басқа іске ауысып кетеді. Кейде не істеу керегін жақсы түсінсе де, іске кірісуге күші жетпейтінін айтады. Мұны еріктің физиологиялық негізімен түсіндіріңіз. Отбасына қандай кеңес бересіз?", "plan": ["Жағдаят: Серікте ырықты әрекетті реттеу бұзылған. Мақсатты ұстап тұра алмай, кездейсоқ әсерге ілесуі — Бабаев пен Маклаков апраксия деп атайтын бұзылыс: ырықты әрекеттің реттелуі
