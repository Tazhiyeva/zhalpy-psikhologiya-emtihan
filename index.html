бұзылады. Қажетін біле тұра іске кірісе алмауы абулияға ұқсайды.", "Ырықты қимылдың ми негізі: импульс ми қабығының алдыңғы орталық иіріміндегі (Бабаевта — алдыңғы орталық жүйке сайлары) пирамидалы жасушаларда туады. Олардан шыққан пирамидалы жол жұлын арқылы дененің қарама-қарсы жағындағы бұлшықетке жетеді.", "Ырықты әрекеттер бір-бірімен байланысқан жүйеде жүреді. Иірімнің артындағы бөлік қимылды сезуге көмектеседі, алдындағы бөлік қимылдың бірізділігі мен жатықтығына жауап береді.", "Серік жаза алады: онда сал жоқ, қимылды сезу мен жатықтығы да бұзылмаған. Демек алдыңғы орталық иірім мен оған іргелес бөліктер аман. Бұзылғаны — мақсатты ұстап тұру, ал оған маңдай бөлігінің алдыңғы аймақтары жауап береді.", "Мақсатты әрекет бойы ұстап тұратын — маңдай бөлігінің алдыңғы аймақтары. Олар зақымданса, адам бастаған ісін аяқтай алмайды, болмашы себептен басқа арнаға бұрылады: бір науқас ашық тұрған шкафтың жанынан өтіп бара жатып, ішіне кіріп алып, не істерін білмей тұрып қалған. Бұл — апраксия.", "<b>Абулия<\/b> ми қабығындағы шектен тыс тежелуден, мидан келетін әрекет импульсінің әлсіреуінен туады: адам қажетін біледі, бірақ шешімге келіп, іске кірісуге ерік күші жетпейді.", "Еріктік әрекетке екінші сигнал жүйесі де қатысады: сөз адамның саналы әрекетін реттейді. Ретикулярлы формация қажетті қозу ошағын қуатпен ұстап тұрады. Абулияда бұл қуат жетпейді: ми қабығындағы шектен тыс тежелуден әрекет импульсі әлсірейді.", "Кеңес: бұл жалқаулық емес, мидың зақымы, сондықтан Серікті айыптауға болмайды. Оны невролог пен нейропсихологқа көрсету керек. Отбасы істі шағын қадамдарға бөліп, жазбаша жоспар берсін, әр қадамды сөзбен еске салып отырсын: сырттан берілген сөз бен жоспар бұзылған ішкі реттеудің орнын ішінара толтырады."], "terms": ["пирамидалы жасушалар", "маңдай бөлігі", "апраксия", "абулия", "екінші сигнал жүйесі", "ретикулярлы формация"], "tip": "Алдымен ырықты қимылдың ми негізін қысқа айтыңыз, сосын жағдаяттағы әр белгіні мидың нақты бөлігімен байланыстырыңыз.", "src": "Бабаев, 16-дәрісбаян, 3-бөлім; Маклаков, 15.3", "link": null, "topic": 12}, "13-E1": {"id": "13-E1", "level": "easy", "q": "Жеке-психологиялық ерекшелік ретінде темперамент дегеніміз не? Гиппократ пен Гален ұсынған гуморалдық типологияның мәнін ашыңыз.", "plan": ["<b>Жеке-психологиялық (дара) ерекшеліктер<\/b> — бір адамды екіншісінен ажырататын тұрақты психикалық қасиеттер. Оларға темперамент, мінез және қабілет жатады. Темперамент — солардың ең тұрақтысы: Бабаев оны тұлға қалыптасуының табиғи ірге тасы дейді.", "<b>Темперамент<\/b> — адамның психикалық әрекетінің динамикасын айқындайтын дара қасиеттердің жиынтығы. Ол адамның «не» істейтінін емес, «қалай» әрекет ететінін көрсетеді: қаншалықты жылдам, күшті, ұстамды. Бұл қасиеттер іс-әрекеттің мазмұны мен мақсатына қарамай бірдей көрінеді және ересек шақта аз өзгереді.", "Ілімнің негізін ежелгі грек дәрігері <b>Гиппократ<\/b> қалады. Оның ойынша, адамдар ағзадағы төрт «дене шырынының» арақатынасымен ажыратылады: қан, шырыш, сары өт және қара өт (запыран). Бұл арақатынасты кейін латынша temperamentum — «үйлесім, дұрыс өлшем» деп атады.", "Ежелгі дәуірдің тағы бір дәрігері <b>Гален<\/b> бұл ойды жүйеге келтірді: темперамент типі бір шырынның басым болуына байланысты. Ол алдымен 13 тип бөліп, кейін оларды төртеуге келтірді: сангвиник (қан), флегматик (шырыш), холерик (өт), меланхолик (қара өт).", "Шырындар туралы түсіндіру ғылымда расталмады, бірақ төрт тип пен олардың атаулары сақталды. Кейін Павлов бұл типтерге жүйке жүйесі арқылы жаңа негіз берді."], "terms": ["жеке-психологиялық (дара) ерекшеліктер", "темперамент", "гуморалдық типология", "дене шырындары", "сангвиник, холерик, флегматик, меланхолик"], "tip": "Ескірген түсіндіру мен сақталған атауларды ажыратыңыз: шырындар туралы ой расталмады, ал төрт тип пен олардың атаулары әлі қолданылады.", "src": "Бабаев, 18-дәрісбаян (1–2-бөлім); Маклаков, 24.1–24.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}, "topic": 13}, "13-E2": {"id": "13-E2", "level": "easy", "q": "Павловтың жоғары жүйке әрекетінің типтері туралы ілімін баяндаңыз.", "plan": ["Павлов иттерде шартты рефлекстердің түзілуін зерттеп, олардың мінез-құлқындағы даралық айырмашылықтарды байқады. Айырмашылық рефлекстің түзілу жылдамдығынан, дәлдігінен және сөнуінен көрінді.", "Бұл айырмашылықтың негізінде жүйкенің екі процесі жатыр: <b>қозу<\/b> мен <b>тежелу<\/b>. Павлов олардың үш қасиетін бөлді: күші, теңгерімділігі, қозғалғыштығы (Бабаевта: күші, тепе-теңдігі, қозғалмалылығы).", "<b>Күші<\/b> — жүйке жасушасының жұмысқа қабілеті: ол ұзақ не қатты қозуға шыдап, тежелуге ауыспайды. Павлов қозу күші мен тежелу күшін бір-біріне тәуелсіз екі қасиет деп санады.", "<b>Теңгерімділігі<\/b> — қозу мен тежелу процестерінің арақатынасы. <b>Қозғалғыштығы<\/b> — қозу мен тежелудің бір-бірімен тез алмасу қабілеті; оған қарсы қасиет — инерттілік (селқостық).", "Үш қасиеттің үйлесімі <b>жоғары жүйке әрекетінің типін<\/b>, ал тип темпераментті береді. Павлов төрт тип бөлді: күшті, теңгерімді, қозғалғыш тип — сангвиник; ұстамсыз тип (күшті, теңгерімсіз, қозуы басым) — холерик; инертті тип (күшті, теңгерімді, аз қозғалғыш) — флегматик; әлсіз тип — меланхолик.", "Павлов жүйке жүйесінің типін туа біткен, тәрбие мен ортаның әсерінен аз өзгеретін қасиет деп санады. Жүйке жүйесінің типі — темпераменттің физиологиялық негізі, ал темперамент — осы типтің психикадағы көрінісі."], "terms": ["жоғары жүйке әрекеті (ЖЖӘ)", "қозу және тежелу", "күші", "теңгерімділігі (тепе-теңдігі)", "қозғалғыштығы (қозғалмалылығы)", "жүйке жүйесінің типі"], "tip": "Жүйке жүйесінің типі мен темпераментті бір деп айтпаңыз: тип — физиологиялық негіз, темперамент — оның психикадағы көрінісі.", "src": "Бабаев, 18-дәрісбаян; Маклаков, 24.3; Немов, 21.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}, "topic": 13}, "13-M1": {"id": "13-M1", "level": "medium", "q": "Кречмер мен Шелдонның конституциялық типологияларын салыстырыңыз. Бұл теориялардың басты кемшілігі неде?", "plan": ["Конституциялық типологиялар темпераментті дене бітімімен байланыстырады. Олардың ортақ идеясы: дене құрылысы белгілі болса, адамның психикалық ерекшелігін де білуге болады.", "<b>Кречмер<\/b> дене мүшелерін өлшеп, төрт конституциялық тип бөлді: лептосоматик, оны астеник те дейді (бойшаң, нәзік, тар иықты), пикник (толық, орта бойлы, мойны қысқа), атлетик (бұлшық еті дамыған, иығы кең), диспластик (дене бітімі қисынсыз).", "Бұл типтерге үш темперамент сай келеді. <b>Шизотимик<\/b> — нәзік денелі, тұйық, көңіл күйі құбылмалы, ортаға қиын бейімделеді. <b>Иксотимик<\/b> — атлетик, сабырлы, әсерленгіштігі аз, ойы икемсіздеу. <b>Циклотимик<\/b> — пикник, көңіл күйі қуаныш пен мұңның арасында ауысып тұрады, тіл табысқыш, өмірге шынайы қарайды.", "<b>Шелдон<\/b> ұқсас идеяны АҚШ-та дамытты, терминдерін эмбриологиядан алды. Ол үш дене типін бөлді: эндоморф (майы көп, ішкі ағзалары басым), мезоморф (бұлшық еті мықты), эктоморф (арық, нәзік). Оларға үш темперамент сай: висцеротоник жайлылықты, тамақты, көпшілікті сүйеді; соматотоник жігерлі, қимылға, үстемдікке ұмтылады; церебротоник тұйық, ұстамды, жалғыздықты қалайды.", "Айырмашылығы: Кречмер психиатр болды, сондықтан дене бітімін психикалық ауруға бейімділікпен де байланыстырды: пикник маниакалды-депрессиялық психозға, астеник пен атлетик шизофренияға бейім деді. Шелдон әр адамда үш құрамдас та бар, айырма тек қайсысы басым екенінде деп санады.", "Басты кемшілігі: екі теорияда да орта мен тәрбиенің ықпалы ескерілмейді. Шелдонды сынаған Стреляу айтқандай, ұжымшылдық не қайырымдылық сияқты қасиеттер дене бітіміндей тұқым қуаламайды, олар тәрбиеде, әлеуметтік ортада қалыптасады."], "terms": ["конституциялық типология", "лептосоматик (астеник), пикник, атлетик", "шизотимик, иксотимик, циклотимик", "эндоморф, мезоморф, эктоморф", "висцеротоник, соматотоник, церебротоник"], "tip": "Типтерді тізіп қана қоймаңыз: ортақ идеяны (дене бітімі психиканы анықтайды) және ортақ кемшілікті (орта мен тәрбие ескерілмейді) міндетті түрде атаңыз.", "src": "Бабаев, 18-дәрісбаян; Маклаков, 24.2, 25.2; Немов, 21.1–21.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі: Кречмердің дене бітімі типтері"}, "topic": 13}, "13-M2": {"id": "13-M2", "level": "medium", "q": "Теплов, Небылицын және Мерлин еңбектерінде жүйке жүйесінің қасиеттері туралы ілім қалай дамыды?", "plan": ["Павлов ілімі иттерге жасалған тәжірибеге сүйенді. Оның ізбасарлары жүйке жүйесінің қасиеттерін ересек адамдарда зертханалық тәжірибемен өлшей бастады және ілімді жаңа деректермен толықтырды.", "<b>Теплов<\/b> темпераментті эмоциялық қозғыштықпен байланыстырды: сезімнің қаншалықты тез пайда болуы және қаншалықты күшті болуы. Ол темпераменттің тоғыз қасиетін сипаттады: эмоциялық қозғыштық, зейіннің қозғыштығы, эмоция күші, үрейлілік, еріксіз қимылдардың реактивтілігі, мақсатты ерікті әрекеттің белсенділігі, икемділік не ригидтілік, резистенттілік (басталған істі тежейтін әсерге қарсы тұру), субъективация (әрекетте ішкі бейне мен ұғымға сүйену).", "Теплов тағы бір маңызды ойды айтты: темпераменті әртүрлі адамдар әрекеттің соңғы нәтижесімен емес, оған жету тәсілімен ерекшеленеді.", "Алдымен Теплов, кейін <b>Небылицын<\/b> осындай тәжірибелерде жүйкенің жаңа екі қасиетін ашты. <b>Лабильділік<\/b> — жүйке процесінің пайда болу және сөну жылдамдығы. <b>Динамикалылық<\/b> — оң және тежегіш шартты рефлекстердің жеңіл әрі тез түзілуі.", "Небылицын жүйке жүйесі қасиеттерінің 12 өлшемді жіктемесін ұсынды: қозуға және тежелуге қатысты күш, қозғалғыштық, динамикалылық, лабильділік (8 бастапқы қасиет) және олардың теңгерімділігі (4 туынды қасиет). Қасиет бүкіл жүйке жүйесіне ортақ (жалпы) не жеке талдағышқа тән (парциалды) болуы мүмкін.", "Небылицын темпераменттің үш құрамдасын бөлді: жалпы белсенділік, моторика, эмоционалдылық. Оның ойынша, айқын шекаралы типтер жоқ.", "<b>Мерлин<\/b> темперамент қасиеттері жүйке жүйесінің типіне тәуелді, тұрақты және психикалық әрекеттің динамикасын реттейді деп есептеді. Ол да типтерді бөлуден бас тартты, кейін «интегралды даралық» ұғымына көшті. Мерлин мен Климов <b>іс-әрекеттің даралық стилі<\/b> ұғымын дамытты: адам темпераментінің әлсіз жағын тәжірибеде қалыптасқан тәсілдермен толтырады."], "terms": ["эмоциялық қозғыштық", "лабильділік", "динамикалылық", "жалпы және парциалды қасиеттер", "іс-әрекеттің даралық стилі"], "tip": "Әр ғалымның жаңалығын бөлек атаңыз: Теплов — темперамент қасиеттері; Теплов пен Небылицын — лабильділік пен динамикалылық; Небылицын — 12 өлшемді жіктеме мен темпераменттің үш құрамдасы; Мерлин — типтерден бас тарту, интегралды даралық, даралық стиль.", "src": "Бабаев, 18-дәрісбаян; Маклаков, 24.2–24.4, 23.2; Немов, 21.1–21.3", "link": null, "topic": 13}, "13-H1": {"id": "13-H1", "level": "hard", "q": "8-сынып жетекшісі төрт оқушыны бақылап жүр. Арман сабақта бірінші болып қол көтереді, бірақ ескерту естісе бірден ашуланып, дауыс көтереді. Дана тақтаға шыққанда қызарып кетеді, кішкене сыннан кейін жылап қалады. Ерлан тапсырманы асықпай, қатесіз орындайды, бірақ жаңа тапсырмаға көшуі қиын. Әсел бәрімен тез тіл табысады, жаңа іске бірден кіріседі, бірақ бірсарынды тапсырмадан тез жалығады. Оқушылардың әрекетін темперамент ілімімен талдаңыз. Мұғалімге әр оқушымен жұмыс істеу бойынша қандай кеңес бересіз?", "plan": ["Жағдаят: төрт оқушының әрекет қарқыны, эмоциясының күші мен ауысу жылдамдығы әртүрлі. Бұл — темпераменттің, яғни психикалық әрекет динамикасының айырмашылығы.", "Талдаудың негізі — Павловтың жоғары жүйке әрекеті туралы ілімі және темперамент қасиеттері: сезімталдық, реактивтілік, белсенділік, икемділік, экстраверсия не интроверсия.", "Арман — холерикке жақын: күшті, теңгерімсіз, қозуы басым; реактивтілігі белсенділігінен басым, сондықтан ұстамсыз, қызба. Дана — меланхолик белгілері: жүйкесі әлсіз, сезімталдығы жоғары, болмашы нәрсеге ренжиді, тез шаршайды; ішкі жан дүниесіне бағытталған — интроверт.", "Ерлан — флегматик: күшті, теңгерімді, инертті; сабырлы, тиянақты, бірақ жаңа жағдайға баяу бейімделеді. Әсел — сангвиник: күшті, теңгерімді, қозғалғыш; көпшіл, бір істен екіншісіне тез ауысады, бірақ бірсарынды істе ынтасы тез суиды.", "Ескерту: таза типтер сирек кездеседі, көп адамда аралас белгілер болады. Бір оқушы түрлі жағдайда әртүрлі типтің белгілерін көрсетуі де мүмкін, сондықтан қорытындыны ұзақ бақылаудан кейін жасау керек. Жақсы не жаман темперамент жоқ: әр типтің күшті және әлсіз жағы бар.", "Ұсыныс: Арманға қатты сөзбен, жекіріп сөйлемеу, оқуын жиі тексеріп, әділ бағалау. Данаға дауыс көтермеу, қатесін оңаша айту, аз ғана белсенділігін де мақтау. Ерланды бір істен екіншісіне жиі ауыстырмау, ойлануға уақыт беру. Әселге жаңа, қызықты, күш жұмсауды талап ететін тапсырмалар беріп, үнемі іске қосып отыру.", "Қорытынды: мұғалімнің міндеті — темпераментті «түзету» емес, оның күшті жағын пайдаланып, әлсіз жағын ескеру."], "terms": ["темперамент типтері", "холерик, меланхолик, флегматик, сангвиник", "реактивтілік және белсенділік", "сезімталдық", "экстраверсия және интроверсия"], "tip": "Оқушыға тип атауын жай жапсырмаңыз: әр қорытындыны жағдаяттағы нақты белгімен дәлелдеңіз және таза типтер сирек екенін ескертіңіз.", "src": "Бабаев, 18-дәрісбаян (3–4-бөлім); Маклаков, 24.1, 24.4", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}, "topic": 13}, "13-H2": {"id": "13-H2", "level": "hard", "q": "Ауылдан келген 1-курс студенті Нұрлан жатақханада тұрады. Кешке кафеде даяшы болып істей бастады, бірақ тапсырыс көбейгенде шатасып, баяу жұмыс істейді деп ескерту алды. Ал кітапханада құжаттарды ретке келтіргенде ұзақ, жалықпай, қатесіз істейді. Нұрлан «Мен ешнәрсеге қабілетсізбін» деп ойлай бастады. Бұл жағдайды темперамент пен іс-әрекеттің байланысы арқылы түсіндіріңіз. Нұрланға қандай кеңес бересіз?", "plan": ["Жағдаят: Нұрлан жылдамдықты талап ететін жұмыста қиналады, ал бірқалыпты жұмыста табысты. Бұл — темперамент пен іс-әрекет талабының сәйкес келмеуі. Оның белгілері флегматикке жақын: қарқыны баяу, жаңа жағдайға баяу ауысады, бірақ төзімді, тиянақты.", "Теория: темперамент адамның психикалық мүмкіндігінің шамасын емес, оның көріну тәсілін анықтайды. Қалыпты, күйзеліссіз жағдайда әрекеттің соңғы нәтижесі темпераментке тәуелді емес: ол көбіне мотив пен қабілетке байланысты. Ал қарбалас, уақыт тапшы жағдайда темперамент нәтижеге де әсер етеді, Нұрланның кафедегі қиындығы осыдан.", "Теплов байқағандай, темпераменті әртүрлі адамдар нәтижесімен емес, оған жету тәсілімен ерекшеленеді. Әр адам уақыт өте <b>іс-әрекеттің даралық стилін<\/b> қалыптастырады. Климов бойынша, бұл — адам темпераментін жұмыс талабына бейімдеу үшін қолданатын тәсілдер жүйесі: әлсіз жағын тәсілмен толтырып, күшті жағын пайдаланады.", "Талдау: Нұрланның «қабілетсізмін» деген қорытындысы қате, ол темпераментті қабілетпен шатастырып тұр. Флегматиктің инерттілігі жиі ауысатын, қарбалас жұмыста кедергі болады, ал тұрақты, бір тәртіппен жүретін жұмыста оның күшті жағы ашылады. Тежелуі басым адам жұмыстың басында баяу әрі аз өнімді болады, бірақ өз тәсілін тапқан соң оның өнімділігі күрт артады.", "Ұсыныс: жұмысты темпераментіне сай таңдау. Флегматик бірқалыпты, бір тәртіппен жүретін жұмыста тиімді: кітапханада, құжатпен жұмыста.", "Даяшылықта қалса, өз тәсілін жасау керек: тапсырысты жазып алу, әрекет ретін алдын ала жоспарлау, жаттығу арқылы қарқынды біртіндеп арттыру. Тәжірибе әрекет жылдамдығын арттырады, бірақ оның шегін жүйке жүйесі белгілейді.", "Қорытынды: жақсы не жаман темперамент жоқ. Темпераментті өзгертуге тырыспай, оны ескеріп іс-әрекетті ұйымдастыру керек."], "terms": ["темперамент және іс-әрекет", "іс-әрекеттің даралық стилі", "флегматик", "инерттілік", "нәтиже мен тәсіл"], "tip": "Темперамент пен қабілетті шатастырмаңыз: темперамент әрекеттің қалай жүретінін көрсетеді, бірақ оның қаншалықты табысты болатынын анықтамайды.", "src": "Бабаев, 18-дәрісбаян (4-бөлім); Маклаков, 24.4; Немов, 21.3", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}, "topic": 13}, "14-E1": {"id": "14-E1", "level": "easy", "q": "Мінез дегеніміз не? Мінез бітістері қалай топтастырылады?", "plan": ["Бабаев бойынша <b>мінез<\/b> — адамның қылық-әрекетінде, қарым-қатынасында тұрақты қалыптасатын дара ерекшеліктерінің жиынтығы. Ол адамның қоршаған әлемге, іске, басқа адамдарға және өзіне деген қатынасынан көрінеді.", "Мінез туа берілмейді, өмір барысында қалыптасады: отбасында, сыныпта, достар арасында, еңбек ұжымында. Мінезді білсек, адамның түрлі жағдайдағы әрекетін алдын ала болжай аламыз.", "<b>Мінез бітісі<\/b> — адамның әдеттегі жағдайдағы қылығының тұрақты түрі. Бір рет көрінген қылық (мысалы, жанжалдағы дөрекілік) әлі бітіс емес; тұрақты қайталанатыны ғана бітіс.", "Бірінші топтастыру — қатынастар жүйесі бойынша. Бабаев төрт қатынасты атайды: адамдарға (шыншыл — өтірікші, әдепті — дөрекі), іске (еңбекқор — еріншек), өзіне (өзін сынай білетін — өзімшіл), заттарға (ұқыпты — салақ, жомарт — сараң). Маклаков бұларға қоршаған әлемге қатынасты қосады: нанымы берік — принципсіз.", "Екінші топтастыру — психикалық салалар бойынша: ерік бітістері (батылдық, табандылық, өзін-өзі ұстау, дербестік), эмоциялық бітістер (екпінділік, әсерленгіштік, немқұрайлылық), зияткерлік бітістер (ойлылық, алғырлық, тапқырлық, білуге құмарлық).", "Мінез бітістердің механикалық қосындысы емес: бітістер өзара байланысып, тұтас құрылым түзеді. Олардың ішінде жетекші және қосалқы бітістер болады."], "terms": ["мінез", "мінез бітісі", "қатынастар жүйесі", "ерік, эмоциялық, зияткерлік бітістер", "жетекші және қосалқы бітістер"], "tip": "Бітісті дұрыс топқа жатқызыңыз: батылдық — ерік бітісі, әсерленгіштік — эмоциялық бітіс, ал әдептілік адамдарға қатынастан туады.", "src": "Бабаев, 19-дәрісбаян (1, 3–4-бөлім); Маклаков, 25.1", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "14-E2": {"id": "14-E2", "level": "easy", "q": "Мінез асқынуы деген не? Ол көбіне қай жаста айқын көрінеді және неге?", "plan": ["<b>Мінез асқынуы<\/b> (акцентуация) — мінездің кейбір бітістерінің шамадан тыс дамуы. Бұл ауру емес, қалыптың шегіндегі ауытқу, бірақ ол психиканың «әлсіз жерін» түзеді.", "Асқынған мінезді адам жалпы алғанда тұрақты болады, бірақ кейбір әсерлерге аса сезімтал, шыдамсыз келеді. Қиын жағдай дәл осы «әлсіз жерге» тисе, оның қылығы күрт өзгереді, асқынған бітіс басқа ұнамды қасиеттерді басып кетеді.", "Ұғымды психологияға Леонгард енгізді. Оның ойынша, асқыну ең алдымен адамдармен қарым-қатынаста көрінеді, сондықтан ол типтерді қарым-қатынас стиліне қарап бөлді, мысалы: гипертимдік, дистимдік, қозғыш, «тұрып қалатын», педантты, үрейлі, демонстративті тип. Кейін Личко жасөспірімдердегі асқыну типтерін сипаттады.", "Асқыну көбіне жасөспірім шақта және ерте жастық кезде айқын көрінеді. Себебі бұл кезде мінез әлі қалыптасып жатады, ал жасөспірім күйзеліске аса сезімтал болады. Личко бойынша уақытша ауытқулар күйзеліс «ең әлсіз жерге» тигенде туады.", "Ересек шақта асқыну көбіне бәсеңдейді, бірақ ауыр жағдайда қайта көрінуі мүмкін. Айналадағы ұнамсыз жағдай басым болса, психикалық бұзылысқа әкелуі ықтимал."], "terms": ["мінез асқынуы (акцентуация)", "«әлсіз жер»", "Леонгард типтері", "жасөспірімдік кезең"], "tip": "Мінез асқынуын психикалық аурумен теңестірмеңіз: ол қалыптың ішінде, бірақ оның шекарасына жақын тұрған ерекшелік.", "src": "Бабаев, 19-дәрісбаян (5-бөлім); Маклаков, 25.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "14-M1": {"id": "14-M1", "level": "medium", "q": "«Мінез» және «темперамент» ұғымдарын салыстырыңыз. Олар бір-біріне қалай әсер етеді?", "plan": ["<b>Темперамент<\/b> — психикалық процестердің жүру динамикасы: жылдамдық, күш, ұстамдылық. Ол туа біткен жүйке жүйесіне негізделеді. <b>Мінез<\/b> адамның әлемге, іске, адамдарға, өзіне қатынасынан көрінеді; ол өмір барысында, тәрбиеде қалыптасады.", "Айырмашылығы: темперамент әрекеттің динамикасын — жылдамдығын, күшін, қарқынын — көрсетеді. Мінез адамның бағыт-бағдарын, яғни әлемге, іске, адамдарға қатынасын және сол қатынастан туатын әрекет тәсілін көрсетеді. Бабаев айтқандай, адамды не істейтініне қарап емес, сол істі қалай орындайтынына қарап бағалаймыз: мінез — бағыт-бағдар мен әрекет тәсілінің бірлігі.", "Екеуі де «қалай?» деген сұраққа жауап береді, бірақ әр мағынада: темперамент — іс қаншалықты жылдам, екпінді жүреді, мінез — іс адал, ұқыпты не салақ орындала ма. Сондықтан темпераментті жақсы не жаман деп бағаламаймыз, ал мінез бітістерін бағалаймыз.", "Ұқсастығы: екеуі де жүйке жүйесінің ерекшеліктерімен байланысты, екеуі де тұрақты дара қасиет. Бабаев айтқандай, оларды жиі салыстырады, кейде бірінің орнына бірін қолданады, бірақ бұл қате.", "Ғылымда төрт көзқарас бар: мінез бен темпераментті теңестіру (Кречмер); оларды қарама-қарсы қою; темпераментті мінездің өзегі деп санау (Рубинштейн); темпераментті мінездің табиғи негізі деп санау (Выготский, Ананьев). Отандық психологияда соңғысы басым, себебі темпераменттің негізгі қасиеттері мінезден әлдеқайда ерте қалыптасады.", "Темперамент мінезге өз таңбасын салады: ұстамдылық не ұстамсыздық, қозғалғыштық не салғырттық темпераментке тікелей байланысты. Ол кейбір бітістердің қалыптасуын жеңілдетеді, кейбірін қиындатады: меланхоликке батылдық пен жігерлілік, холерикке ұстамдылық, флегматикке тез тіл табысу қиынырақ келеді.", "Бірақ темперамент мінезді алдын ала шешпейді: темпераменті бірдей адамдардың мінезі әртүрлі болуы мүмкін. Мінезі қалыптасқан адамда темперамент мінездің көріну формасына айналады: ол мінез бітістері қандай қарқынмен көрінетінін көрсетеді."], "terms": ["темперамент", "мінез", "бағыт-бағдар", "мінездің табиғи негізі", "мінез бітісі", "жүйке жүйесінің типі"], "tip": "«Флегматик — жалқау» деген сияқты қате қорытындыдан сақтаныңыз: жалқаулық — мінез бітісі, ал баяулық — темперамент белгісі.", "src": "Бабаев, 18-дәрісбаян (1-бөлім), 19-дәрісбаян (1, 3-бөлім); Маклаков, 25.2; Немов, 22.1", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "14-M2": {"id": "14-M2", "level": "medium", "q": "Мінез туралы отандық және шетелдік көзқарастарды салыстырыңыз.", "plan": ["Мінез туралы ілім — <b>характерология<\/b> — ерте заманда пайда болды. Ежелгі грек ойшылы Теофраст отыз мінез типін сипаттады. Характерологияның басты мақсаты — мінез типтерін тауып, адамның қылығын алдын ала болжау.", "Ғылыми емес тәсілдер де көп болды: жұлдызнама (туған күн бойынша), физиогномика (бет-әлпет бойынша), хиромантия (алақан сызықтары бойынша). Ғылым оларды растамайды, тек хиромантиядан саусақ өрнектерін тұқым қуалаумен байланыстыра зерттейтін дерматоглифика өсіп шықты. Графология (жазу бойынша) туралы дерек әлі біржақты емес: жазудың эмоциялық күймен байланысы ғана анық дәлелденген.", "Шетелдік көзқарастардың көбі адамдарды типтерге бөледі: Кречмер мінезді дене бітімімен байланыстырды, Юнг экстраверт пен интровертті бөлді, Леонгард мінез асқынуының типтерін сипаттады. Фромм <b>әлеуметтік мінез<\/b> ұғымын енгізді: ол бір топқа ортақ өмір тәжірибесінен туады. Фромм «мазохист-садист», «қиратушы», «конформист-автомат» типтерін бөлді.", "Отандық психологияда мінез тұлғаның қатынастары мен бағыттылығы арқылы түсіндіріледі. Рубинштейн бойынша мінез бітістері мотивтерден туады және өздері мотивтерді анықтайды. Мінез іс-әрекетте қалыптасады, оның ең күшті құралы — еңбек.", "Бабаев мінездің төрт жалпы типін береді: үйлесімді, іштей қайшылықты, икемі кем, тиянақсыз. Олар адамның ортаға бейімделу тәсіліне қарай бөлінеді. Бабаев мінездің ұлттық ерекшеліктерін де қарастырады: Ы. Алтынсарин қазақ халқына тән қарапайымдылықты, кішіпейілділікті, қонақжайлылықты атаған.", "Салыстыру: шетелдік тәсілдердің көбі адамдарды типтерге бөлуге, мінезді дене бітімімен (Кречмер) не қызығуы мен өмірлік қуатының бағытымен (Юнг) түсіндіруге ұмтылады. Отандық тәсіл мінездің әлеуметтік ортада, іс-әрекетте қалыптасуын және оның құрылымын — қатынастар мен бітістерді — алға шығарады.", "Ортақ кемшілік: ешбір типке толық сыймайтын адамдар көп, олар барлық адамның жартысына дейін жетеді. Сондықтан типті адамға жапсырылатын «таңба» ретінде емес, бағдар ретінде қолдану керек."], "terms": ["характерология", "мінез типі", "әлеуметтік мінез", "мінез асқынуы", "қатынастар жүйесі", "ұлттық мінез"], "tip": "Әр көзқарасқа бір ғалым мен бір негізгі идеяны атасаңыз жеткілікті; тізім жаттағаннан гөрі екі тәсілдің айырмашылығын түсіндіріңіз.", "src": "Бабаев, 19-дәрісбаян (2, 4, 6-бөлім); Маклаков, 25.2–25.3; Немов, 22.1–22.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "14-H1": {"id": "14-H1", "level": "hard", "q": "Әлия — отбасындағы жалғыз қыз. Ата-анасы оның барлық ісін өздері шешіп, қиындықтан үнемі қорғап келді. Университетке түсіп, жатақханаға көшкен соң Әлия бөлмеластарымен келісе алмайды: кішкене сынға ренжіп жылайды, тапсырманы соңғы күнге қалдырады, «бәрі маған қарсы» дейді. Әлияның мінезі неге осылай қалыптасқанын түсіндіріңіз. Оған қалай көмектесуге болады?", "plan": ["Жағдаят: Әлияда дербестік пен жауапкершілік бітістері дамымаған; сынға аса сезімтал, істі кейінге қалдырады, кінәні өзгеден іздейді. Бұл — мінездің қалыптасу жағдайларымен байланысты мәселе. Жаңа ортада үйдегі қылық үлгісі қолдау таппағандықтан, ішкі және сыртқы жанжал туып отыр.", "Теория: мінез туа берілмейді, қарым-қатынаста және іс-әрекетте қалыптасады. Оның сезімтал кезеңі — шамамен 2–3 жастан 9–10 жасқа дейін: бала үлкендерге еліктейді, ал үлкендер қолдаған қылық бекиді. Еңбекқорлық, ұқыптылық, жауапкершілік ерте жастағы ойын мен үй жұмысында қалыптасады.", "Талдау: артық қамқорлықтан Әлия өз бетімен шешім қабылдауға, қиындықты жеңуге үйренбеген. Бұл Бабаев сипаттаған «икемі кем» мінез типіне ұқсас: мұндай адам балалықта шектен тыс еркелетіліп, дербестікке үйренбейді, қиындықтан қорқып, оны айналып өтуге тырысады.", "Белгілерді ажырату керек. Сынға тез ренжу темпераменттің, яғни жоғары сезімталдықтың белгісі болуы мүмкін. Ал дербессіздік, істі кейінге қалдыру, кінәні өзгеден іздеу — тәрбиеде қалыптасқан мінез бітістері: біріншісін ескеру, екіншісін өзгерту керек.", "Ұсыныс: өзін-өзі тәрбиелеу. Әлия өз кемшілігін мойындап, нақты мақсат қойсын: мысалы, тапсырманы мерзімінен бір күн бұрын бітіру. Шағын міндеттерден бастап жауапкершілік алсын: бөлмедегі кезекшілік, топтық жобадағы бір бөлік.", "Үлгі тұтатын адам, тәлімгер табу, ұжымдық іске араласу пайдалы. Куратор не психолог оның кемшілігін жұмсақ әрі нақты айтып, әр табысын атап отыруы керек.", "Қорытынды: мінез өмір бойы өзгере алады. Ересек адам мінезін өзі тәрбиелей алады. Мінезді қалыптастырудың ең тиімді құралы — еңбек пен ұжымдық іс."], "terms": ["мінездің қалыптасуы", "сезімтал кезең", "артық қамқорлық", "өзін-өзі тәрбиелеу", "мінез бітісі", "мінез және темперамент"], "tip": "Жағдаяттағы мінезді жай «жаман» деп бағаламаңыз: оның қалыптасу себебін (отбасы, тәрбие) көрсетіп, мінездің өзгеруге болатынын дәлелдеңіз.", "src": "Бабаев, 19-дәрісбаян (1, 3–4-бөлім); Маклаков, 25.2–25.3", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "14-H2": {"id": "14-H2", "level": "hard", "q": "Бауыржан бөлімде бір жыл жұмыс істейді. Бір жиналыста әріптесінің сынына қатты жауап беріп, дауыс көтерді. Жаңа келген бөлім басшысы оны «дөрекі, мінезі ауыр адам» деп атады. Ал әріптестері Бауыржанның бір жыл бойы адал, жауапты, көмекке әрдайым дайын болғанын айтады. Басшының қорытындысы дұрыс па? Жағдайды «мінез» және «тұлға» ұғымдарының арақатынасы арқылы талдаңыз.", "plan": ["Жағдаят: басшы бір реткі қылыққа қарап, адамның мінезі мен тұлғасы туралы жалпы қорытынды жасап тұр. Мәселе — мінез бітісін жеке қылықтан ажырата алмау.", "Теория: мінез бітісі — адамның әдеттегі жағдайдағы қылығының тұрақты түрі. Бабаев айтқандай, адам дау-дамайда бір рет дөрекілік көрсетсе, оны оның төл қасиеті деу дұрыс емес; көңілді адамның өзі де кейде мұңаяды.", "Мінез бен тұлғаның арақатынасы: «тұлға» мен «мінез» терминдері ұзақ уақыт бір-бірінің орнына қолданылған, бірақ қазір мінезді тұлғаның бір бөлігі, оның негізі деп санайды. Тұлғаға мінезбен қатар темперамент, қабілет, дүниетаным, құндылықтар, моральдық нормалар, қажеттіліктер, әлеуметтік рөлдер, ерік кіреді.", "Мінез арқылы адамның қылығын басқа қасиеттерге қарағанда жақсырақ болжаймыз. Бірақ адамгершілік жағын құндылықтар мен нормалар, ал әрекет динамикасын темперамент жақсырақ түсіндіреді. Сондықтан бір қасиет арқылы бүкіл тұлғаға баға беруге болмайды.", "Талдау: Бауыржанның бір жылғы тұрақты қылығы — адалдық, жауапкершілік, көмекке дайындық — оның шынайы мінез бітістері. Жиналыстағы ашу — жағдайға байланысты көрініс; оған темпераменттің ұстамсыздығы, шаршау не әділетсіздік сезімі әсер етуі мүмкін.", "Ұсыныс: басшы адамды бір оқиғамен бағаламай, ұзақ бақылауы керек және Бауыржанмен оңаша сөйлесіп, жанжалдың себебін анықтағаны жөн. Бауыржанға ашуын ұстауды, келіспеушілікті сабырмен айтуды үйрену пайдалы.", "Қорытынды: басшының қорытындысы асығыс. Мінезді тұрақты бітістер арқылы, ал тұлғаны тұтас қасиеттер жүйесі арқылы бағалау керек."], "terms": ["мінез бітісі", "жағдаяттық қылық", "тұлғаның құрылымы", "мінез және тұлға", "мінез және темперамент"], "tip": "«Мінез» бен «тұлғаны» синоним ретінде қолданбаңыз: мінез — тұлғаның негізі, бірақ тұлға одан кеңірек.", "src": "Бабаев, 19-дәрісбаян (1, 3-бөлім); Маклаков, 25.1; Немов, 22.4", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}, "topic": 14}, "15-E1": {"id": "15-E1", "level": "easy", "q": "Қабілет дегеніміз не? Теплов бөлген қабілеттің негізгі белгілерін сипаттаңыз.", "plan": ["<b>Қабілеттер<\/b> — бір немесе бірнеше іс-әрекет түрімен табысты айналысуға және оларды меңгеруге мүмкіндік беретін тұлғаның психикалық қасиеті. Бірдей жағдайда біреу білімді «лезде қағып алады», екіншісіне көп уақыт пен күш керек.", "Теплов қабілеттің үш белгісін атады. Бірінші: қабілет — бір адамды екіншісінен ажырататын дара психологиялық ерекшелік. Барлық адамда бірдей болатын қасиет қабілет емес.", "Екінші: кез келген дара ерекшелік емес, тек іс-әрекеттің табысты орындалуына қатысы бар ерекшелік қабілет деп аталады.", "Үшінші: қабілет адамда бар білім, ептілік (іскерлік), дағдыға теңестірілмейді. Ол солардың қаншалықты тез әрі жеңіл меңгерілетінінен көрінеді.", "Қабілеттер <b>жалпы<\/b> және <b>арнайы<\/b> болып бөлінеді. Жалпы қабілет көп іс-әрекетке бірдей қажет: ойлау, ес, сөйлеу, қолдың дәлдігі. Арнайы, кәсіби қабілет нақты іске қажет: музыкалық, математикалық қабілет, мұғалімнің педагогикалық зейінділігі.", "Теплов бойынша, қабілет тек үздіксіз дамуда өмір сүреді. Пайдаланылмаған қабілет уақыт өте жоғалады."], "terms": ["қабілет", "жалпы және арнайы қабілеттер", "білім, ептілік (іскерлік), дағды", "дара психологиялық ерекшелік"], "tip": "Қабілет пен дағдыны шатастырмаңыз: дағды — меңгерілген әрекет, ал қабілет — оны тез әрі жеңіл меңгеру мүмкіндігі.", "src": "Бабаев, 20-дәрісбаян (1-бөлім); Маклаков, 23.1", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}, "topic": 15}, "15-E2": {"id": "15-E2", "level": "easy", "q": "Қабілеттің даму деңгейлерін сипаттаңыз.", "plan": ["Қабілет бір орында тұрмайды: ол туа біткен нышаннан басталып, іс-әрекет арқылы деңгейден деңгейге көтеріледі: нышандар → қабілет → дарындылық → шеберлік → талант → данышпандық. Жоғары деңгейге көтерілу үшін алдыңғысы жеткілікті қалыптасуы керек.", "<b>Дарындылық<\/b> — нақты адамға тән жалпы және арнайы қабілеттердің жиынтығы. Ол табыстың өзін емес, табыстың мүмкіндігін береді; мүмкіндікті іске асыру үшін білім мен дағды керек.", "<b>Шеберлік<\/b> — нақты бір іс-әрекеттегі кемелдік. Шебер үшін «не істеу керек» пен «қалай істеу керек» бірге келеді. Шеберлік ұзақ, қажырлы еңбектен туады.", "<b>Талант<\/b> — адам белгілі бір салада іске асырған дарындылықтың жоғары дәрежесі, арнайы қабілеттердің жоғары дамуы. Ол бірнеше қабілеттің бірлігі: жеке бір өте жоғары қабілет талант емес. Талантты адамның ісі жаңашыл, қайталанбас болады.", "<b>Данышпандық<\/b> — дарындылықтың ең жоғары дәрежесі. Данышпанның таланттан айырмашылығы — ол өз саласында дәуір жасайды, оның шығармашылығының қоғам үшін тарихи маңызы бар. Адамзаттың бес мың жылдық тарихында мұндай адамдар 400-ге жуық деп есептеледі.", "Данышпан көбіне бірнеше салада қатар биікке жетеді: мысалы, Леонардо да Винчи, Ломоносов."], "terms": ["нышандар", "дарындылық", "шеберлік", "талант", "данышпандық"], "tip": "Деңгейлерді ретімен атаңыз және әрқайсысының алдыңғысынан айырмашылығын бір сөйлеммен көрсетіңіз.", "src": "Бабаев, 20-дәрісбаян (4-бөлім); Маклаков, 23.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}, "topic": 15}, "15-M1": {"id": "15-M1", "level": "medium", "q": "Қабілеттің табиғаты туралы негізгі көзқарастарды салыстырыңыз. Қазіргі психология бұл дауды қалай шешеді?", "plan": ["Бірінші көзқарас: қабілет биологиялық, тұқым қуалайды. Бұл ой Платоннан басталады. Оның жақтастары оқу мен тәрбие қабілеттің тек пайда болу жылдамдығын өзгертеді дейді. Дәлел ретінде ерте көрінген дарын келтіріледі: Моцарттың музыкалық дарыны 3 жаста, Гайдндікі 4 жаста, Дина Нұрпейісованың күйшілігі 8 жаста байқалған.", "Бұл бағытқа Галльдің <b>френологиясы<\/b> жатады: әр қабілет бас сүйегінің белгілі «дөңесінен» анықталады деген. Бас сүйегі ми қыртысының пішінін қайталамайтыны дәлелденгенде, ілім ғылыми емес болып шықты. Ми салмағына қарап ақылды бағалау да расталмады: ең ауыр ми ақыл-есі кем адамда болған.", "Гальтон Дарвин теориясына сүйеніп, атақты адамдардың өмірбаянын талдады да, қабілет тұқым қуалайды деп қорытты; Бах әулетінен 60-қа жуық музыкант шыққаны осыған мысал. Бірақ мұндай әулеттерде баланың ортасы мен тәрбиесі де ықпал етеді. Тұқым қуалау мен ортаның ықпалын ажырату үшін Гальтон егіздер әдісін ұсынды.", "Екінші көзқарас: қабілетті толығымен тәрбие мен оқу қалыптастырады. Гельвеций тәрбие арқылы данышпан өсіруге болады деді. Дәлелдері: қоғамнан тыс өскен «маугли» балалар; вьетнамдықтардың дыбыс биіктігін ажырататын естуі жаппай жақсы дамыған (Леонтьев жетекшілігімен жасалған зерттеу), себебі вьетнам тілінде дыбыстың биіктігі сөздің мағынасын ажыратады және бала оны тіл үйренгенде-ақ жаттықтырады.", "Қазіргі шешім: қабілеттің табиғаты <b>биоәлеуметтік<\/b>. Туа берілетін — қабілеттің өзі емес, нышан. Одан қандай қабілет дамитыны тәрбиеге, оқуға, қоғамның қажеттілігіне, іс-әрекетке байланысты.", "Егіздер әдісі тұқым қуалаудың маңызын көрсетті: бір жұмыртқалы егіздердің қабілеттері 70–80% жағдайда, ал жай бауырлардікі 40–50% жағдайда сәйкес келеді. Бірақ орта мен тұқым қуалаудың қайсысы маңыздырақ деген сұрақ әлі ашық.", "Бабаев қазақ мысалын да келтіреді: Төлеген Момбеков шыққан әулеттегі дарын тек тұқыммен емес, бесіктен естіген ән-күймен, үлкендердің музыкалық тәрбиесімен де байланысты."], "terms": ["тұқым қуалау", "френология", "нышан", "биоәлеуметтік табиғат", "егіздер әдісі"], "tip": "«Қабілет туа беріледі» деп жазбаңыз: қазіргі көзқарас бойынша туа берілетін — нышан, ал қабілет іс-әрекетте дамиды.", "src": "Бабаев, 20-дәрісбаян (2-бөлім); Маклаков, 23.2–23.3", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}, "topic": 15}, "15-M2": {"id": "15-M2", "level": "medium", "q": "Нышан мен қабілеттің арақатынасын түсіндіріңіз. Қабілеттің құрылымы неден тұрады?", "plan": ["<b>Нышандар<\/b> — қабілеттердің дамуын жеңілдететін ағзаның туа біткен анатомиялық-физиологиялық ерекшеліктері: ми, сезім мүшелері, қозғалыс мүшелерінің ерекшеліктері. Мысалы, нәзік есту — музыкалық қабілеттің, түсті жақсы ажырату — суретшілік қабілеттің нышаны.", "Нышан қабілет емес. Бабаев айтқандай, адамдардың табиғи айырмашылығы дайын қабілетте емес, нышанда. Қабілет нышаннан басталатын даму процесінің нәтижесі, ол тек іс-әрекетте қалыптасады.", "Нышандар <b>көпмәнді<\/b>: бір нышан негізінде әртүрлі қабілеттер қалыптасуы мүмкін. Жақсы есту мен ырғақ сезімі бар адам орындаушы, дирижер, әнші, биші, музыка сыншысы не педагог болуы мүмкін. Қай қабілет дамитыны қоршаған ортаға және таңдалған іс-әрекеттің талабына байланысты.", "Павлов сигнал жүйелерінің арақатынасына қарай үш типті бөлді: <b>көркемөнерлік<\/b> тип, яғни «суреткерлер» (бірінші сигнал жүйесі басым; тұтас, бейнелі қабылдау, эмоциялылық), <b>ой-саналық<\/b> тип, яғни «ойшылдар» (екінші сигнал жүйесі басым; талдау, дерексіз ойлау) және <b>аралас<\/b> тип. Бұл — нышандардың айырмашылығы: тип қай қабілеттің жеңілірек дамитынын көрсетеді, бірақ қабілеттің өзі емес.", "Қабілеттің құрылымы — бірнеше қасиеттің бірлігі. Оның ішінде <b>жетекші<\/b> және <b>қосалқы<\/b> қасиеттер бар. Мысалы, бейнелеу қабілетінде жетекші — көру талдағышының жоғары сезімталдығы (сызық, пішін, түс, пропорция сезімі), қолдың дәлдігі, бейнелі ес; қосалқы — көркем қиял, эмоциялық көңіл-күй.", "Құрылым икемді: жетекші мен қосалқы қасиеттердің арақатынасы әр адамда әртүрлі. Теплов бойынша, әлсіз қабілеттің орнын басқа жақсы дамыған қабілет толтыра алады — бұл <b>компенсация<\/b>."], "terms": ["нышандар", "көпмәнділік", "жетекші және қосалқы қасиеттер", "компенсация", "көркемөнерлік және ой-саналық типтер"], "tip": "Нышан мен қабілетті шатастырмаңыз: нышан — туа біткен анатомиялық-физиологиялық алғышарт, қабілет — іс-әрекетте дамыған психикалық қасиет.", "src": "Бабаев, 20-дәрісбаян (3-бөлім); Маклаков, 23.1–23.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі (нышандар)"}, "topic": 15}, "15-H1": {"id": "15-H1", "level": "hard", "q": "Ауылда тұратын 8 жасар Ерасыл радиодан естіген әуенді бірден домбырамен қайталап, ырғағын дәл ұстайды. Ауыл мектебінде музыка үйірмесі жоқ. Әкесі: «Қабілеті болса, өзі-ақ шығады, оқытудың қажеті жоқ» дейді. Қабілеттің дамуы туралы ілімге сүйеніп, әкенің пікірін бағалаңыз. Ата-анаға қандай кеңес бересіз?", "plan": ["Жағдаят: Ерасылда музыкалық есту мен ырғақ сезімі ерте байқалған. Бұл — жақсы <b>нышанның<\/b> белгісі және қабілеттің алғашқы көрінісі, бірақ қабілет әлі толық қалыптаспаған.", "Теория: кез келген нышан қабілетке айналу үшін ұзақ даму жолынан өтеді, бұл даму тек іс-әрекетте жүреді. Теплов бойынша, пайдаланылмайтын қабілет уақыт өте жоғалады. Бабаев айтқандай, қабілет жерге тастаған дән сияқты: қолайлы жағдай болса өнеді, болмаса көрінбей-ақ жойылады.", "Даму кезеңдері: туғаннан 6–7 жасқа дейін ағза құрылымдары жетіліп, жалпы қабілеттер қалыптасады. Арнайы қабілеттер мектепте, әсіресе бастауыш және орта сыныптарда, алдымен ойын, кейін оқу мен еңбек арқылы дамиды. Ерасыл дәл осы кезеңде тұр.", "Әр қабілеттің дамуына қолайлы, сезімтал кезеңі бар. Ол өтіп кетсе, кейін қуып жету өте қиын, кейде мүмкін емес. Сондықтан әкенің «өзі-ақ шығады» деген пікірі қате: ол қабілетті тек туа берілетін нәрсе деп санайтын ескі көзқарасқа сүйенеді.", "Даму шарттары: қабілетті ең көп дамытатын — баланы ойлантып, жаңа нәрсе ашуға жетелейтін шығармашылық іс-әрекет. Тапсырма баланың мүмкіндігінің шегінде, яғни жақын даму аймағында болсын: тым жеңіл тапсырма дамытпайды, тым қиыны орындалмай қалады. Ата-ана баланың дамуына қамқор болса, оның қабілеті байқалу мүмкіндігі әлдеқайда жоғары.", "Ұсыныс: баланы музыкамен жүйелі айналыстыру: домбыра үйрететін ұстаз табу (аудан орталығындағы музыка мектебі, қашықтан сабақ), үйде күй тыңдату, ауыл кештерінде өнер көрсетуге мүмкіндік беру. Әуенді өзгертіп, өз әуенін шығаруға шақыру. Ынтасын мақтаумен қолдау.", "Қорытынды: бала табиғи нышанмен туған, бірақ одан қабілет, кейін дарындылық пен талант өсуі үшін қ <script>
(()=>{
const E=window.EXAM, Q=E.questions, T=E.tickets, TT=E.titles;
const CATALOG="https://tazhiyeva.github.io/zhalpy-psikhologiya/";
const LV={easy:{n:"Жеңіл",c:"L-easy"},medium:{n:"Орташа",c:"L-medium"},hard:{n:"Күрделі",c:"L-hard"}};
const app=document.getElementById("app");
const st={get(k,d){try{const v=localStorage.getItem("emt:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("emt:"+k,JSON.stringify(v))}catch(e){}}};
let marks=st.get("marks",{});
const ICON={dice:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',ext:'<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const known=()=>Object.values(marks).filter(v=>v==="k").length;
const total=Object.keys(Q).length;

function qCard(id,i){
  const q=Q[id],lv=LV[q.level],m=marks[id]||"";
  return `<article class="q" data-id="${id}">
    <div class="qtop"><span class="badge ${lv.c}">${i?i+". ":""}${lv.n}</span><a class="topic" href="#topic/${q.topic}">${q.topic}-тақырып · ${esc(TT[q.topic])}</a></div>

    <div class="ans" hidden>
      <p class="eyebrow">Жауап жоспары</p>
      <ol>${q.plan.map(p=>`<li>${p}</li>`).join("")}</ol>

      ${q.tip?`<p class="tip"><b>Кеңес.</b> ${esc(q.tip)}</p>`:""}

      ${q.link&&q.link.url?`<a class="btn" href="${esc(q.link.url)}" target="_blank" rel="noopener">${esc(q.link.label||"Сайтта оқу")} ${ICON.ext}</a>`:""}

}
function bindCards(){
  app.querySelectorAll(".q").forEach(c=>{
    const id=c.dataset.id,ans=c.querySelector(".ans"),tg=c.querySelector(".tg");

    c.querySelectorAll(".mk").forEach(b=>b.addEventListener("click",()=>{
      const v=b.classList.contains("k")?"k":"r";

    }));
  });
}
function dots(ids){return `<span class="dots">${ids.map(id=>`<i class="${marks[id]||""}"></i>`).join("")}</span>`}

function home(){
  const rev=Object.values(marks).filter(v=>v==="r").length;
  app.innerHTML=`<p class="eyebrow">Жалпы психология · қорытынды емтихан</p>
  <h1>Емтиханға дайындық</h1>
  <p class="lede">Емтиханда бір билетте үш сұрақ болады: жеңіл, орташа және күрделі. Мұнда силлабустың 15 тақырыбын түгел қамтитын ${T.length} билет, ${total} сұрақ бар. Әр сұраққа жауап жоспары жазылған: негізгі ойлар, терминдер және кеңес. Алдымен өзіңіз жауап беріп көріңіз, сосын жоспармен салыстырыңыз.</p>
  <div class="row"><button class="btn pri" id="rnd" type="button">${ICON.dice} Кездейсоқ билет тарту</button><a class="btn" href="#tickets">Барлық билеттер</a></div>
  <div class="stats">
    <div class="stat"><b>${known()} / ${total}</b><span>«Білемін» деп белгіленген</span></div>
    <div class="stat"><b>${rev}</b><span>«Қайталау керек»</span></div>
    <div class="stat"><b>${T.length}</b><span>билет · 15 тақырып</span></div>
  </div>
  <h2>Сұрақ деңгейлері</h2>
  <div class="lvls">
    <div class="lv L-easy"><b>Жеңіл</b><span>Анықтама беру, түрлерін атап сипаттау.</span></div>
    <div class="lv L-medium"><b>Орташа</b><span>Түсіндіру, салыстыру, теорияны баяндау.</span></div>
    <div class="lv L-hard"><b>Күрделі</b><span>Жағдаятты теориямен талдап, қорытынды жасау.</span></div>
  </div>
  <h2>Қалай дайындалған дұрыс?</h2>
  <ol>
    <li>Билет тартып, таймерді қосыңыз. Үш сұраққа жауапты қағазға қысқаша жоспар етіп жазыңыз.</li>
    <li>«Жауап жоспары» батырмасын ашып, өз жауабыңызбен салыстырыңыз.</li>
    <li>Сұрақты «Білемін» немесе «Қайталау керек» деп белгілеңіз. Белгілер осы құрылғыда сақталады.</li>
    <li>«Қайталау» бөлімінде әлсіз сұрақтарыңыз жиналады. Оларды тақырыптың сайтынан қайта оқыңыз.</li>
  </ol>
  <p class="foot">Барлық дәрістердің сайттары: <a href="${CATALOG}" target="_blank" rel="noopener">Жалпы психология каталогы</a>.</p>`;
  document.getElementById("rnd").addEventListener("click",()=>{location.hash="#ticket/"+(1+Math.floor(Math.random()*T.length))});
}
function tickets(){
  app.innerHTML=`<h1>Билеттер</h1><p class="lede">Әр билетте үш сұрақ. Нүктелер сіздің белгілеріңізді көрсетеді: жасыл — білемін, қызыл — қайталау керек.</p>
  <div class="tgrid">${T.map((ids,i)=>`<a class="tile" href="#ticket/${i+1}"><small>БИЛЕТ</small>${i+1}${dots(ids)}</a>`).join("")}</div>`;
}
let timer=null,left=st.get("tleft",20*60);
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ticket(n){
  n=Math.min(Math.max(1,n|0),T.length);const ids=T[n-1];
  app.innerHTML=`<div class="thead"><div><p class="eyebrow">Билет</p><h1 style="margin:0">№ ${n}</h1></div>
    <div class="timer" role="timer"><b id="tm">${fmt(left)}</b><button type="button" id="tgo">${timer?"Тоқтату":"Бастау"}</button><button type="button" id="trs" aria-label="Таймерді қайта бастау">↺</button></div></div>
  ${ids.map((id,i)=>qCard(id,i+1)).join("")}
  <div class="pager"><a class="btn" href="#ticket/${n>1?n-1:T.length}">${ICON.left} ${n>1?n-1:T.length}</a>
  <button class="btn" type="button" id="rnd">${ICON.dice} Басқа билет</button>
  <a class="btn" href="#ticket/${n<T.length?n+1:1}">${n<T.length?n+1:1} ${ICON.right}</a></div>`;
  bindCards();
  document.getElementById("rnd").addEventListener("click",()=>{let r;do{r=1+Math.floor(Math.random()*T.length)}while(r===n&&T.length>1);location.hash="#ticket/"+r});
  const tm=document.getElementById("tm"),go=document.getElementById("tgo");
  const paint=()=>{tm.textContent=fmt(left);tm.classList.toggle("low",left<=120)};
  go.addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null;go.textContent="Бастау"}else{if(left<=0)left=20*60;timer=setInterval(()=>{left=Math.max(0,left-1);st.set("tleft",left);const el=document.getElementById("tm");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<=120)}if(left<=0){clearInterval(timer);timer=null;const g=document.getElementById("tgo");if(g)g.textContent="Бастау"}},1000);go.textContent="Тоқтату"}});
  document.getElementById("trs").addEventListener("click",()=>{left=20*60;st.set("tleft",left);paint()});
}
function topics(){
  app.innerHTML=`<h1>Тақырыптар</h1><p class="lede">Силлабустың 15 тақырыбы. Әр тақырыпта 6 сұрақ: екі жеңіл, екі орташа, екі күрделі. Жолақ «Білемін» деп белгіленген сұрақтардың үлесін көрсетеді.</p>
  <div class="tlist">${Object.keys(E.topics).map(t=>{const ids=E.topics[t],k=ids.filter(id=>marks[id]==="k").length;
    return `<a class="trow" href="#topic/${t}"><span class="n">${String(t).padStart(2,"0")}</span><span class="tt">${esc(TT[t])}</span><span class="mini"><i style="width:${Math.round(k/ids.length*100)}%"></i></span><span class="pg">${k}/${ids.length}</span></a>`}).join("")}</div>`;
}
function topic(t){
  const ids=E.topics[t];if(!ids){location.hash="#topics";return}
  app.innerHTML=`<p class="eyebrow"><a href="#topics">Тақырыптар</a> · ${t}-тақырып</p><h1>${esc(TT[t])}</h1>
  ${ids.map(id=>qCard(id,0)).join("")}
  <div class="pager">${+t>1?`<a class="btn" href="#topic/${+t-1}">${ICON.left} ${+t-1}-тақырып</a>`:"<span></span>"}${+t<15?`<a class="btn" href="#topic/${+t+1}">${+t+1}-тақырып ${ICON.right}</a>`:""}</div>`;
  bindCards();
}
function review(){
  const ids=Object.keys(marks).filter(id=>marks[id]==="r"&&Q[id]);
  app.innerHTML=`<h1>Қайталау</h1><p class="lede">«Қайталау керек» деп белгілеген сұрақтарыңыз осында жиналады. Сұрақты меңгерген соң «Білемін» деп белгілеңіз, сонда ол тізімнен шығады.</p>
  ${ids.length?ids.map(id=>qCard(id,0)).join(""):`<p class="empty">Әзірге бос. Билеттерді шешкенде қиын сұрақтарды «Қайталау керек» деп белгілеңіз.</p>`}`;
  bindCards();
}
function route(){
  const h=location.hash.slice(1)||"home",[r,arg]=h.split("/");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r||(r==="ticket"&&a.dataset.r==="tickets")||(r==="topic"&&a.dataset.r==="topics")));
  if(r==="tickets")tickets();else if(r==="ticket")ticket(+arg);else if(r==="topics")topics();else if(r==="topic")topic(arg);else if(r==="review")review();else home();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const h=a.getAttribute("href");if(location.hash===h)route();else location.hash=h});
addEventListener("hashchange",route);route();
(()=>{const r=document.documentElement,b=document.getElementById("themeBtn");
  try{const s=localStorage.getItem("emt:theme");if(s)r.dataset.theme=JSON.parse(s)}catch(e){}
  b.addEventListener("click",()=>{const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";st.set("theme",r.dataset.theme)})})();
})();
</script>
</body>
</html>
