>. Сөзге дейінгі ойлау бар: маймыл таяқпен жемісті алады. Ойға дейінгі сөйлеу де бар: сәбидің былдырлауы мен айқайы. Шамамен екі жаста, бала ересекпен бірге әрекет етіп, сөйлескенде, бұл екі желі түйіседі: сөйлеу ойлы, ал ойлау сөзді бола бастайды. Кейінгі дау <b>эгоцентрлік сөйлеудің<\/b> төңірегінде өрбіді: бала ешкімге арнамай, өзіне-өзі дауыстап сөйлейді.", "<b>Пиаже<\/b> бойынша эгоцентрлік сөйлеу керексіз болып, 6–7 жасқа қарай жоғалады. <b>Выготский<\/b> бойынша ол 4–5 жаста бірігудің басы болады, баланың әрекетін жоспарлайды, ал 6–7 жаста жоғалмай, ішке көшіп, <b>ішкі сөйлеуге<\/b> айналады.", "Бірігуден кейін де ойлау мен сөйлеу толық қосылып кетпейді: сөзді-логикалы ойлау мен мағыналы сөйлеуде біріккенмен, әрқайсысы өз заңымен де дами береді. Тәжірибелік, бейнелі, интуитивтік ойлау сөзсіз де жүре алады (Немов).", "Қорытынды: Выготский бұл байланысты қозғалыста қарауға негіз қалады. Сөйлеумен біріккен процестер <b>ырықты<\/b> болады: сөз ойлауды, зейінді, есті іштен реттей бастайды. Выготский айтқан жоғары психикалық функциялар осылай туады."], "terms": ["симультандылық пен сукцессивтілік", "эгоцентрлік сөйлеу", "ішкі сөйлеу", "ойлау мен сөйлеудің бірігуі", "жоғары психикалық функциялар"], "tip": "«Ой — бұлт, сөз — жаңбыр» теңеуін айтқанда оның мәнін ашыңыз: ой басымызда тұтас тұрады, ал сөйлеуде біртіндеп өрбиді.", "src": "Ойлау және сөйлеу сайты, 15-тарау; Немов, II бөлім, 14-тарау (жас кезеңдері Немов бойынша); Бабаев, 13-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s15-vygotsky", "label": "Ойлау және сөйлеу · 15-тарау: Выготский — ой бұлт, сөз жаңбыр"}}, "Q39": {"n": 39, "id": "Q39", "level": "medium", "topic": 10, "q": "Қиялдың қайта жасаушы және шығармашылық түрлері.", "plan": ["Бұл екі түр <b>активті қиялға<\/b> жатады: адам мақсат қояды, бейнені өзі шақырып, ерік күшімен бағыттайды. Айырмасы — бейнені қандай жолмен құратынында.", "<b>Қайта жаңғыртушы қиял<\/b> (Бабаевта — жасампаз қиял) сипаттама, сызба не карта бойынша бейне құрады (Маклаков). Тарих кітабын оқып, көрмеген шайқасты көз алдымызға келтіреміз.", "Кез келген оқу осы қиялға сүйенеді (Бабаев): мәтінде бейне жоқ, тек белгілер бар — сөз, сан, сызба. Бейненің айқындығы автордың шеберлігіне, оқырманның көңіл күйіне және психикасының күйіне байланысты.", "<b>Шығармашылық қиял<\/b> (Бабаевта — шығармашыл қиял) дайын үлгісіз жаңа бейне жасайды: адам бейненің нобайын да, материалын да өзі таңдайды (Маклаков). Әңгіме жазған жазушы, күй шығарған композитор осы қиялды қолданады.", "Шығармашылық бейненің жаңалығы екі түрлі: <b>объективті<\/b> жаңа — дүниеде бұрын болмаған, <b>субъективті<\/b> жаңа — адамның өзі үшін ғана жаңа. Жаңа бейне қоғамның сұранысына да байланысты туады.", "Байланысы: екеуі де бұрынғы тәжірибені пайдаланады, арасында қатаң шекара жоқ. Романды оқыған әр адам өз Қамар сұлуын елестетеді, яғни қайта жаңғыртуға шығармашылық та араласады.", "Қорытынды: қайта жаңғыртушы қиял біреудің берген нұсқауымен жүреді, шығармашылық қиял нұсқаусыз жаңа нәрсе жасайды. Біріншісі оқуға, екіншісі өнер мен ғылымға жол ашады."], "terms": ["активті қиял", "қайта жаңғыртушы (жасампаз) қиял", "шығармашылық қиял", "объективті және субъективті жаңалық", "кеңістіктік қиял"], "tip": "Екі түрді «сипаттама бойынша» және «үлгісіз» деген белгімен ажыратыңыз, бірақ соңында арасында қатаң шекара жоқ екенін міндетті түрде айтыңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.3; Немов, 12-тарау; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s08-recreate", "label": "Қиял · 8-тарау: қайта жаңғыртушы және шығармашылық қиял"}}, "Q40": {"n": 40, "id": "Q40", "level": "medium", "topic": 10, "q": "Қиялдағы бейнелерді қайта өңдеу тәсілдері (агглютинация, гиперболизация).", "plan": ["Қиял бейнесі екі кезеңнен өтеді: алдымен <b>талдау<\/b> — бейнені бөлшектеп, керек белгісін бөліп алу; сосын <b>біріктіру<\/b> — бөлшектерді жаңаша құрастыру. Бабаев мұны қиялдың аналитикалық-синтетикалық сипаты дейді.", "<b>Агглютинация<\/b> — шындықта бір-бірімен қосылмайтын әртүрлі заттардың бөлшектерін бір бейнеге «желімдеу»: сфинкс, кентавр, жезтырнақ, троллейбус.", "Агглютинацияның бір түрі — таныс бейнені өзгертпей, жаңа мәнмәтінге қосу. Бөлшектің өзі өзгермейді, жаңасы — орны мен тіркесі.", "<b>Гиперболизация<\/b> — нысанның көлемін, қасиетін не санын шамадан тыс үлкейту не кішірейту. Бабаев мұны гипербола мен литота дейді: Алпамыс, Ер Төстік, Шора батырдың «бойымен бұлтты тіреген» алып бейнелері — гипербола, ал литота нысанды керісінше кішірейтеді.", "Басқа тәсілдер: <b>акценттеу<\/b> (бір белгіні баса көрсету — карикатура, шарж), <b>схематизация<\/b> (айырмашылықты азайтып, ортақ ұқсастықты ықшамдау — ою-өрнек), <b>типизация<\/b> (көп адамның маңызды белгісінен типтік бейне жасау — Абайдың «Болыс болдым, мінеки» өлеңіндегі болыс).", "Айырмасы: агглютинация бірнеше нысанның бөлшегін қосады, ал гиперболизация бір нысанның өлшемін не қасиетін өзгертеді. Біріншісінде бөлшектің <i>саны<\/i>, екіншісінде <i>мөлшері<\/i> өзгереді.", "Қорытынды: тәсілдердің бәрі бір заңдылыққа бағынады — жаңа бейне таныс бөлшектерден құралады. Маклаков бойынша бұл механикалық қосу емес, шығармашылық процесс."], "terms": ["агглютинация", "гиперболизация", "акценттеу", "схематизация", "типизация", "талдау мен біріктіру"], "tip": "Әр тәсілге бір мысал келтіріңіз және агглютинацияны (бөлшектерді қосу) гиперболизациядан (өлшемді өзгерту) нақты ажыратыңыз.", "src": "Бабаев, 14-дәрісбаян; Маклаков, 11.2; Крысько, 2.20; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s06-aggl", "label": "Қиял · 6-тарау: бейнені қайта өңдеу тәсілдері"}}, "Q41": {"n": 41, "id": "Q41", "level": "medium", "topic": 11, "q": "Эмоциялық күйлердің жіктелуі (аффект, стресс, фрустрация).", "plan": ["Эмоциялық күйлер үш белгімен ажыратылады: <b>қарқындылығы<\/b> (қаншалықты күшті), <b>ұзақтығы<\/b> және неге бағытталатыны. Оқулықтардың тізімдері бірдей емес, ал Бабаев оларға қазақша ат береді (көңіл, кейіп, сезім шарпуы).", "<b>Сезімдік реңк<\/b> (Бабаевта — көңіл) — түйсікке ілесетін жағымды не жағымсыз толғаныс. <b>Көңіл-күй<\/b> (Бабаевта — кейіп) әлсіз, бірақ ұзақ, себебі көбіне беймәлім, бүкіл мінез-құлыққа жайылады.", "<b>Аффект<\/b> — қысқа, бірақ өте күшті толғаныс (Немов). Адам үшін маңызды жағдай кенеттен өзгергенде туады: сана мен зейін тарылады, бақылау күрт әлсірейді, кейін <b>аффективтік із<\/b> қалады.", "<b>Стресс<\/b> — адам көтере алмайтын жүктеме кезіндегі күрделі психофизиологиялық күй (Немов). Селье оның үш фазасын сипаттаған: дабыл, қарсыласу, қалжырау. Пайдалы стресті эустресс, зияндысын дистресс дейді.", "<b>Фрустрация<\/b> — саналы мақсатқа жетуге кедергі болғанда туатын эмоциялық жауап (Маклаков). Адам ренжиді, ашуланады, өшпенділікке бейім болады (Бабаев).", "Салыстыру: аффект — ең қысқа, бірақ ең күшті күйлердің бірі; стресс жүктеме созылғанша жүреді; фрустрация кедергі тұрғанша сақталады. Аффект бүкіл жағдайға жауап береді, ал фрустрация нақты кедергіге байланысты.", "Қорытынды: үш күйдің ортақ белгісі — адамның бақылауы әлсірейді, бірақ толық жоғалмайды. Маклаков мұны эмоциялық-еріктік орнықтылыққа байланыстырады, ал ол тәрбиемен де қалыптасады."], "terms": ["аффект", "аффективтік із", "стресс", "жалпы бейімделу синдромы", "фрустрация", "көңіл-күй"], "tip": "Әр күйді үш белгімен сипаттаңыз — күші, ұзақтығы, себебі; стрестің үш фазасын ретімен айтуды ұмытпаңыз.", "src": "Немов, 24.1; Маклаков, 16.1, 16.3; Бабаев, 17-дәрісбаян, 5-бөлім; Крысько, 3.3–3.4", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-kinds", "label": "Эмоция және сезім · 10-тарау: эмоциялық күйлер"}}, "Q42": {"n": 42, "id": "Q42", "level": "medium", "topic": 12, "q": "Еріктік әрекеттің құрылымдық кезеңдері.", "plan": ["<b>Қарапайым еріктік әрекетте<\/b> мақсат анық, адам бірден іске көшеді. <b>Күрделі еріктік әрекетте<\/b> түрткі мен әрекеттің арасына қосымша кезеңдер енеді. Бабаев бойынша олар: ниеттің тууы мен мақсат қою; түрткілер күресі; шешім қабылдау; орындау. Соңында нәтиже бағаланады.", "<b>Бірінші кезең<\/b>: қажеттілік әуелі <b>құмарлық<\/b> түрінде көрінеді — адам бір нәрсенің керегін сезеді, бірақ не керегін анық білмейді. Қажеттілік айқындалғанда <b>тілекке<\/b>, сосын мақсатқа айналады.", "<b>Түрткілер күресі<\/b>: бір мезгілде қарама-қайшы тілектер туады, адам әр жолдың оң және теріс жағын салмақтайды. Мысалы, студент кешке кинога бару мен курстық жұмысты жазу арасында толғанады.", "<b>Шешім қабылдау<\/b>: адам бір түрткіні таңдап, мақсат пен тәсілді белгілейді, жауапкершілікті мойнына алады. Шешімнің орындалуы кейінге қалса, ол <b>ниет<\/b> күйінде тұрады.", "<b>Орындау<\/b>: жоспар құрылады, оны іске асыру үшін <b>ерік күші<\/b> керек — ішкі және сыртқы кедергіні жеңуге жұмсалатын қосымша қуат.", "<b>Бағалау<\/b>: адам нәтижені мақсатпен салыстырады. Қанағаттану не өкіну сезімі істі жалғастыруға, өзгертуге не тоқтатуға түрткі болады.", "Қорытынды: еріктік әрекеттің мәні түрткілер күресінде емес, нәтижеде. Шешімін іспен көрсете алған адамды ғана ерік күші бар дейміз."], "terms": ["түрткілер күресі", "шешім қабылдау", "құмарлық", "тілек", "ниет", "ерік күші"], "tip": "Кезеңдерді ретімен атап, бәрін бір мысалмен (бір студенттің бір шешімімен) өткізіңіз — сонда жауап тізім емес, түсіндіру болады.", "src": "Бабаев, 16-дәрісбаян, 4-бөлім; Маклаков, 15.4; Немов, 23.3", "link": null}, "Q43": {"n": 43, "id": "Q43", "level": "medium", "topic": 13, "q": "Гиппократ пен Галеннің гуморалдық теориясы.", "plan": ["<b>Гуморалдық теория<\/b> — темпераментті ағзадағы сұйықтықтардың («дене шырындарының») арақатынасымен түсіндіретін ең ежелгі ілім. «Гумор» латынша сұйықтық деген мағынаны береді.", "Ілімнің негізін ежелгі грек дәрігері <b>Гиппократ<\/b> қалады: адамдар төрт дене шырынының арақатынасымен ажыратылады — қан, шырыш, өт және қара өт (запыран). Бұл арақатынасты кейін латынша temperamentum — «үйлесім, дұрыс өлшем» деп атады.", "Ежелгі дәуірдің дәрігері <b>Гален<\/b> бұл ойға ғылыми сипат беріп, темперамент типін бір шырынның басым болуымен байланыстырды. Ол алдымен көп тип бөліп, кейін төртеуге келтірді.", "Галеннен бізге жеткен төрт атау: <b>сангвиник<\/b> (sanguis — қан), <b>флегматик<\/b> (phlegma — шырыш), <b>холерик<\/b> (chole — өт), <b>меланхолик<\/b> (melaina chole — қара өт).", "Гиппократ пен Галеннің айырмашылығы: Гиппократ шырындардың арақатынасы туралы жалпы идеяны айтты, ал Гален сол идеяны темперамент типтерінің жүйесіне айналдырып, оларға ат берді.", "Бағасы: шырындар туралы түсіндіру ғылымда расталмады, бірақ темпераменттің төрт типі мен олардың сипаттамасы өмірдегі бақылауға сәйкес келгендіктен сақталып қалды.", "Кейін Павлов осы төрт типке жаңа, физиологиялық негіз берді: оларды сұйықтықпен емес, жүйке жүйесінің типімен түсіндірді. Сондықтан гуморалдық теория — темперамент туралы ғылымның бастауы."], "terms": ["гуморалдық теория", "дене шырындары", "Гиппократ", "Гален", "сангвиник, флегматик, холерик, меланхолик"], "tip": "Ескірген түсіндіру мен сақталған атауларды ажыратыңыз: шырындар туралы ой расталмады, ал төрт тип пен олардың атаулары әлі қолданылады.", "src": "Бабаев, 18-дәрісбаян (2-бөлім); Маклаков, 24.2; Немов, 21.1", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}}, "Q44": {"n": 44, "id": "Q44", "level": "medium", "topic": 13, "q": "Э. Кречмер мен У. Шелдонның конституционалдық типологиясы.", "plan": ["<b>Конституциялық типологиялар<\/b> темпераментті дене бітімімен байланыстырады. Ортақ идеясы: дене құрылысы белгілі болса, адамның психикалық ерекшелігін де білуге болады.", "<b>Кречмер<\/b> дене мүшелерін өлшеп, төрт конституциялық тип бөлді: лептосоматик немесе астеник (бойшаң, нәзік, тар иықты), пикник (толық, орта бойлы, мойны қысқа), атлетик (бұлшық еті дамыған, иығы кең), диспластик (дене бітімі қисынсыз).", "Кречмер бойынша бұл типтерге үш темперамент сай: <b>шизотимик<\/b> (нәзік денелі, тұйық, көңіл күйі құбылмалы, ортаға қиын бейімделеді), <b>иксотимик<\/b> (атлетик, байсалды, әсерленгіштігі аз, ойы икемсіздеу), <b>циклотимик<\/b> (пикник, көңіл күйі қуаныш пен мұңның арасында ауысады, тіл табысқыш).", "<b>Шелдон<\/b> бұл идеяны АҚШ-та жалғастырды, терминдерін эмбриологиядан алды. Үш дене типі: эндоморф (майы көп, ішкі ағзалары басым), мезоморф (бұлшық еті мықты), эктоморф (арық, нәзік).", "Шелдонның үш темпераменті: <b>висцеротоник<\/b> жайлылықты, тамақты, көпшілікті сүйеді; <b>соматотоник<\/b> жігерлі, қимылға, үстемдікке ұмтылады; <b>церебротоник<\/b> ұстамды, тұйық, жалғыздықты қалайды.", "Айырмашылығы: Кречмер психиатр болғандықтан дене бітімін психикалық ауруға бейімділікпен де байланыстырды (пикник — маниакалды-депрессиялық психозға, астеник — шизофренияға). Шелдон әр адамда үш құрамдас та бар, айырма тек қайсысы басым екенінде деп санады.", "Ортақ кемшілігі: орта мен тәрбиенің ықпалы ескерілмейді. Стреляу Шелдонды сынап, ұжымшылдық не қайырымдылық сияқты қасиеттер дене бітіміндей тұқым қуаламайды, олар тәрбие мен әлеуметтік ортада қалыптасады деп жазды."], "terms": ["конституциялық типология", "лептосоматик (астеник), пикник, атлетик", "шизотимик, иксотимик, циклотимик", "эндоморф, мезоморф, эктоморф", "висцеротоник, соматотоник, церебротоник"], "tip": "Типтерді тізумен шектелмеңіз: ортақ идеяны (дене бітімі психиканы анықтайды) және ортақ кемшілікті (орта мен тәрбие ескерілмейді) міндетті түрде айтыңыз.", "src": "Бабаев, 18-дәрісбаян (2-бөлім); Маклаков, 24.2; Немов, 21.1; Крысько, 156–157 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі: Кречмердің дене бітімі типтері"}}, "Q45": {"n": 45, "id": "Q45", "level": "medium", "topic": 13, "q": "И.П. Павловтың ЖЖЖ типтері мен темперамент байланысы.", "plan": ["Павлов иттерде шартты рефлекстің түзілуін зерттеп, олардың мінез-құлқындағы даралық айырмашылықтарды байқады: рефлекстер әртүрлі жылдамдықпен түзіліп, әртүрлі сөнді. Бұл айырмашылықтың негізінде жүйкенің екі процесі — <b>қозу<\/b> мен <b>тежелу<\/b> жатыр.", "Павлов осы процестердің үш қасиетін бөлді. <b>Күші<\/b> — жүйке жасушасының ұзақ не қатты қозуға шыдай алуы. <b>Теңгерімділігі<\/b> (тепе-теңдігі) — қозу мен тежелудің арақатынасы. <b>Қозғалғыштығы<\/b> — қозу мен тежелудің бір-бірімен тез алмасуы; оған қарсы қасиет — инерттілік (селқостық).", "Үш қасиеттің үйлесімі <b>жоғары жүйке әрекетінің (ЖЖӘ) типін<\/b> береді. Павлов төрт тип бөлді: күшті, теңгерімді, қозғалғыш — сангвиник; күшті, теңгерімсіз, қозуы басым (ұстамсыз) — холерик; күшті, теңгерімді, инертті — флегматик; әлсіз тип — меланхолик.", "Темпераментпен байланысы: Павлов бойынша жүйке жүйесінің типі туа беріледі және тәрбиемен аз өзгереді. Ол — темпераменттің <b>физиологиялық негізі<\/b>, ал темперамент — сол типтің адам әрекетінің қарқыны мен күшінде көрінуі.", "Павлов типтері Гиппократтың төрт типіне сай келді, бірақ оларды сұйықтықпен емес, ми қызметімен түсіндірді. Сондықтан ескі атаулар жаңа ғылыми мағынаға ие болды.", "Павловтың шәкірттері ілімді дамытты: Теплов пен Небылицын ересек адамдарда жүйкенің тағы екі қасиетін ашты — <b>лабильділік<\/b> (жүйке процесінің пайда болу және сөну жылдамдығы) және <b>динамикалылық<\/b> (шартты рефлекстердің тез түзілуі).", "Қорытынды: жүйке жүйесінің типі мен темпераментті бір деуге болмайды. Тип — физиологиялық деңгей, темперамент — психологиялық деңгей; біріншісі екіншісінің негізін құрайды."], "terms": ["жоғары жүйке әрекеті (ЖЖӘ)", "қозу және тежелу", "күші, теңгерімділігі, қозғалғыштығы", "жүйке жүйесінің типі", "темпераменттің физиологиялық негізі"], "tip": "Тип пен темпераментті ажыратыңыз: тип — физиологиялық негіз, темперамент — оның психикадағы көрінісі.", "src": "Бабаев, 18-дәрісбаян (2-бөлім); Маклаков, 24.3; Немов, 21.2; Крысько, 150–151 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}}, "Q46": {"n": 46, "id": "Q46", "level": "medium", "topic": 14, "q": "Мінез бен темпераменттің өзара қатынасы.", "plan": ["<b>Темперамент<\/b> — психикалық әрекеттің динамикасы: жылдамдық, күш, ұстамдылық; ол туа біткен жүйке жүйесіне негізделеді. <b>Мінез<\/b> адамның әлемге, іске, адамдарға, өзіне қатынасынан көрінеді және өмір барысында, тәрбиеде қалыптасады.", "Ұқсастығы: екеуі де жүйке жүйесінің ерекшелігімен байланысты және екеуі де тұрақты дара қасиет. Бабаев айтқандай, оларды жиі салыстырады, кейде бірінің орнына бірін қолданады, бірақ бұл қате.", "Айырмашылығы: темперамент іс қаншалықты жылдам, екпінді жүретінін көрсетеді, ал мінез істің адал не салақ, батыл не жасқаншақ орындалатынын көрсетеді. Сондықтан темпераментті жақсы не жаман деп бағаламаймыз, ал мінез бітістерін бағалаймыз.", "Ғылымдағы көзқарастар: мінез бен темпераментті теңестіру (Кречмер); оларды қарама-қарсы қою; темпераментті мінездің өзегі деп санау (Рубинштейн); темпераментті мінездің <b>табиғи негізі<\/b> деп санау (Выготский, Ананьев). Отандық психологияда соңғысы басым.", "Темперамент мінезге өз таңбасын салады: ұстамдылық не ұстамсыздық, қозғалғыштық не салғырттық темпераментке тікелей байланысты. Ол кейбір бітістердің қалыптасуын жеңілдетеді, кейбірін қиындатады: меланхоликке жігерлілік пен батылдық, холерикке ұстамдылық, флегматикке тез тіл табысу қиынырақ келеді.", "Бірақ мінез темпераментке толық тәуелді емес: темпераменті бірдей адамдардың мінезі әртүрлі болуы мүмкін. Мінезі қалыптасқан адамда темперамент мінез бітістері қандай қарқынмен көрінетінін ғана айқындайды.", "Қорытынды: мінез бен темперамент бірге тұлға даралығының тұтас бейнесін береді. Темперамент — негіз, мінез — сол негізде тәрбие мен іс-әрекетте қалыптасқан құрылым."], "terms": ["темперамент", "мінез", "мінездің табиғи негізі", "мінез бітісі", "жүйке жүйесінің типі"], "tip": "«Флегматик — жалқау» деген қате қорытындыдан сақтаныңыз: жалқаулық — мінез бітісі, ал баяулық — темперамент белгісі.", "src": "Бабаев, 19-дәрісбаян (3-бөлім); Маклаков, 25.2; Немов, 22.1; Крысько, 155 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}}, "Q47": {"n": 47, "id": "Q47", "level": "medium", "topic": 5, "q": "Тұлғаның бағыттылығы мен оның компоненттері.", "plan": ["<b>Тұлғаның бағыттылығы<\/b> — оның өмірі мен іс-әрекетінде қажеттіліктері, мотивтері, дүниетанымы, ұстанымдары мен мақсаттары көрінетін психикалық қасиеті (Крысько). Қысқаша айтқанда, бағыттылық адамның неге ұмтылатынын көрсетеді.", "Крысько бағыттылықты бір тізбек ретінде береді: <b>қажеттілік<\/b> (бір нәрсеге мұқтаждық) → <b>мотив<\/b> (адамды әрекетке итермелейтін ішкі күш, ұғынылған қажеттілік) → <b>мақсат<\/b> (адам жеткісі келетін нәтиженің бейнесі). Мотив пен мақсаттың арасында <b>дүниетаным<\/b> (сенімдер мен көзқарастар жүйесі) мен <b>ұстанымдар<\/b> (белгілі бір әрекетке ішкі дайындық) тұрады: адам қажеттілігін қай жолмен қанағаттандыратынын солар анықтайды.", "Бабаев бағыт-бағдарды адамның іс-әрекетін бағыттайтын тұрақты мотивтер жиынтығы дейді және оның формаларын төменнен жоғары қарай атайды: <b>құмарлық<\/b> (ең қарапайым, биологиялық форма), <b>ниет<\/b> (саналы қажетсіну), <b>ұмтылыс<\/b> (ниетке ерік қосылғанда), <b>қызығу<\/b>, <b>бейімділік<\/b>, <b>мұрат<\/b>, <b>көзқарас<\/b>, <b>наным<\/b> (ең жоғары форма).", "<b>Қызығушылық<\/b> — мотивтің ерекше түрі: ол адамды бір нәрсені тануға, сол іспен ұзақ айналысуға тартады. Қызығушылықтар тұрақты не тұрақсыз, терең не үстірт, белсенді не енжар болады (Крысько).", "Екі сипаттаманың айырмасы мен байланысы: Крысько бағыттылықты құрамдас бөліктерге бөледі, ал Бабаев оның даму сатыларын көрсетеді. Екеуінде де бастау — қажеттілік. Крысько тізбегі мақсатпен аяқталады, ал Бабаевтың сатыларының ең жоғарғысы — наным. Екі авторда да дүниетаным мен наным бағыттылықтың өзегін құрайды.", "Немов «бағыттылық» ұғымы кеңестік кезеңде енгізіліп, саяси-идеологиялық реңк алғанын айтады: адамдарды «ұжымшыл» және «даралық бағыттағы» деп бөліп бағалаған.", "Қорытынды: бағыттылық тұлғаның «өзегі» сияқты. Мысалы, екі студент бірдей медицина факультетінде оқиды: бірін науқасқа көмектесу ниеті жетелейді, екіншісін ата-анасының талабы. Сырттай іс бірдей, ал бағыттылық әртүрлі."], "terms": ["бағыттылық (бағыт-бағдар)", "қажеттілік", "мотив", "ұстаным", "дүниетаным", "наным"], "tip": "Компоненттерді жай тізбектеп шықпаңыз: «қажеттілік → мотив → мақсат» тізбегін айтып, әр буынға бір мысал келтіріңіз.", "src": "Тұлға сайты, «Бағыттылық және мотивация» бөлімі (Крысько, 142–149 б.); Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#bagyt", "label": "Тұлға · «Бағыттылық және мотивация» бөлімі"}}, "Q48": {"n": 48, "id": "Q48", "level": "medium", "topic": 4, "q": "Іс-әрекеттің психологиялық құрылымы (А.Н. Леонтьев).", "plan": ["Іс-әрекет теориясын кеңес психологтары жасаған, оны ең толық А.Н. Леонтьев баяндаған. Леонтьев іс-әрекетте үш буынды бөледі: <b>іс-әрекет, әрекет, операция<\/b>. Маклаков оларға төртінші, ең төменгі қабатты — <b>психофизиологиялық қызметтерді<\/b> қосады.", "Әр қабаттың өз тірегі бар: іс-әрекет <b>түрткіге (мотивке)<\/b>, әрекет <b>мақсатқа<\/b>, операция <b>шарттарға<\/b> сүйенеді. Осы үш жұпты есте сақтасаңыз, құрылымның бәрі түсінікті болады.", "<b>Іс-әрекет<\/b> — бір түрткі тудыратын әрекеттердің жиынтығы. Мысалы, мамандықты меңгеру — іс-әрекет, оған көптеген жеке әрекеттер кіреді.", "<b>Әрекет<\/b> — саналы мақсатқа бағытталған процесс, іс-әрекеттің негізгі бірлігі. Мақсат — қалаған нәтиженің санадағы бейнесі. Ірі мақсат ұсақ мақсаттарға бөлінеді: алма ағашын отырғызу үшін орын таңдап, шұңқыр қазып, көшетті көму керек.", "<b>Операция<\/b> — әрекетті орындау тәсілі; бір мақсатқа әртүрлі жағдайда әртүрлі тәсілмен жетеміз. Операциялар аз ұғынылады: олардың бір бөлігі ортаға бейімделуден туады, бір бөлігі — автоматтанып, дағдыға айналған саналы әрекеттер. Құймақты ойланбай аударсақ — операция, «қалай жақсырақ аударамын?» деп ойлансақ — әрекет.", "Ең төменгі қабат — <b>психофизиологиялық қызметтер<\/b>: түйсіну, қимылдау, есте қалдыру сияқты туа біткен мүмкіндіктер. Оларсыз ешбір әрекет орындалмайды.", "Құрылым қозғалмалы: әрекет қайталанып, автоматтанса, операцияға айналады; ал қиындық туса, операция қайтадан саналы әрекетке оралады. Сонымен қатар сыртқы затпен жасалатын әрекет біртіндеп ішкі, ойша әрекетке айналады (<b>интериоризация<\/b>). Қорытынды: Леонтьев құрылымы адамның не үшін (мотив), нені (мақсат) және қалай (шарт пен тәсіл) істейтінін бөліп көрсетеді."], "terms": ["іс-әрекет", "әрекет", "операция", "мотив", "мақсат", "психофизиологиялық қызметтер"], "tip": "Құрылымды жұптармен айтыңыз: іс-әрекет — мотив, әрекет — мақсат, операция — шарт; бұл жұптарсыз жауап жай тізімге айналады.", "src": "Маклаков, 5.2; Бабаев, 6-дәрісбаян", "link": null}, "Q49": {"n": 49, "id": "Q49", "level": "medium", "topic": 5, "q": "Қарым-қатынастың үш жағы (коммуникативті, интерактивті, перцептивті).", "plan": ["<b>Қарым-қатынас<\/b> (Бабаевта — <i>тілдесу<\/i>) — бірлескен іс-әрекет қажеттілігінен туатын адамдар арасындағы байланыс. Бабаев бір тұтас тілдесу процесінде үш жақты бөледі: коммуникативтік, интерактивтік және перцептивтік.", "<b>Коммуникативтік жағы<\/b> — ақпарат алмасу. Хабар бір жақты берілмейді: екі адам кезек-кезек жауап қатады, әрқайсысы әрі айтушы, әрі тыңдаушы. Ақпарат сөзбен де, ым-ишара, дауыс ырғағы сияқты вербалды емес белгілермен де беріледі.", "<b>Интерактивтік жағы<\/b> — бір-біріне ықпал ету, әрекеттерді үйлестіру. Бабаев бойынша бұл сөз алмасу ғана емес, бір-бірінің әрекетін, қылығын танып, оны өзгертуге, оған жауап беруге ұмтылу.", "<b>Перцептивтік жағы<\/b> — адамдардың бірін-бірі қабылдап, түсінуі, бір-бірінің психологиялық бейнесін құруы. Бұл жерде қателер жиі болады: алғашқы әсер, гало әсері, стереотиптер бейнені бұрмалайды.", "Үш жақтың байланысы: олар бір процестің қырлары. Әңгімелесіп отырып, біз бір мезгілде хабар береміз, әңгімелесушіге ықпал етеміз және оны «оқимыз». Мысалы, дәрігер науқасқа ем туралы түсіндіреді (ақпарат), оны емді бастауға көндіреді (ықпал) және оның қорқып отырғанын байқайды (қабылдау).", "Айырмашылығы — неге бағытталғанында: біріншісі хабарға, екіншісі бірлескен әрекетке, үшіншісі адамның өзін түсінуге бағытталады. Бір жағы бұзылса, қалғандары да әлсірейді: әңгімелесушіні дұрыс түсінбесек, ақпарат та, ықпал да мақсатына жетпейді.", "Қорытынды: қарым-қатынасты бағалағанда тек «не айтылды?» деп емес, «қандай ықпал болды?» және «адамдар бірін-бірі қалай түсінді?» деп те сұрау керек."], "terms": ["коммуникативтік жағы", "интерактивтік жағы", "перцептивтік жағы", "тілдесу", "тұлғааралық қабылдау"], "tip": "Үш жақты жай атамаңыз: бір әңгіменің мысалында әр жағы қалай көрінетінін көрсетіңіз.", "src": "Бабаев, 8-дәрісбаян (тілдесу); Түйсік және қабылдау сайты, 20-тарау", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s20", "label": "Түйсік және қабылдау · 20-тарау «Адамның адамды қабылдауы»"}}, "Q50": {"n": 50, "id": "Q50", "level": "medium", "topic": 4, "q": "И.М. Сеченов пен Н.А. Бернштейннің іс-әрекет физиологиясы.", "plan": ["Екі ғалым да іс-әрекеттің физиологиялық негізін зерттеді, бірақ әртүрлі сұраққа жауап берді. Сеченов психиканың рефлекстік табиғатын дәлелдеді, ал Бернштейн қозғалыс пен әрекеттің қалай басқарылатынын түсіндірді.", "<b>И.М. Сеченов<\/b> «Бас ми рефлекстері» (1863) еңбегінде рефлекс қағидасын бүкіл психикалық әрекетке қолданды. Оның пікірінше, адамның саналы да, бейсаналы да әрекеттерінің бәрі шығу тегі жағынан рефлекстерге байланысты (Бабаев).", "Сеченов рефлекстің үш буынын бөлді: <b>бастапқы<\/b> — сыртқы тітіркендіргіш; <b>ортаңғы<\/b> — мидағы қозу мен тежелу және соның нәтижесінде туатын түйсік, ой, сезім; <b>ақырғы<\/b> — сыртқы қозғалыс. Ортаңғы, психикалық буын шеткі екі буынсыз болмайды. Демек психиканың қызметі — әрекетті өзгермелі жағдайға сай реттеу.", "<b>Н.А. Бернштейн<\/b> қозғалысты тек мидан бұлшық етке баратын бұйрықпен басқару мүмкін емес екенін көрсетті: буындардың еркіндік дәрежесі тым көп. Қозғалыс аяқ-қолдың орны мен бұлшық ет күйі туралы кері сигналдар арқылы үнемі түзетіліп отырады. Осыдан рефлекс доғасының орнына <b>рефлекс сақинасы<\/b> (кері байланыс) ұғымы келді (Лурия).", "Бернштейн өз ілімін <b>белсенділік физиологиясы<\/b> деп атады. Оның басты ұғымы — <b>қажетті болашақтың моделі<\/b>, яғни қозғалыс міндеті: әрекет басталмай тұрып, мида оның нәтижесінің бейнесі құрылады. Модель тұрақты, ал оған жеткізетін қимылдар өзгеріп отырады: адам оң қолмен де, сол қолмен де, тіпті аяқпен де жаза алады, бірақ қолтаңбасы өзгермейді (Лурия).", "Бернштейн қозғалысты реттеудің бес деңгейін (A–E) бөлді. Жаңа, күрделі қозғалысты жоғары, саналы деңгей басқарады; ол дағдыға айналған сайын басқару төменгі, бейсаналы деңгейлерге ауысады.", "Салыстыру мен қорытынды: Сеченовте әрекет сыртқы әсерге жауап ретінде түсіндіріледі, ал Бернштейнде әрекетті болашақ нәтиженің моделі басқарады: адам тітіркендіргішке жауап қайтармайды, алдына қойған міндетке ұмтылады. Екеуі бір-бірін жалғайды: Сеченов психиканың реттеуші қызметін ашты, Бернштейн сол реттеудің кері байланыс пен деңгейлер арқылы жүретінін көрсетті."], "terms": ["рефлекс қағидасы", "рефлекстің үш буыны", "рефлекс сақинасы (кері байланыс)", "қажетті болашақтың моделі", "қозғалысты реттеу деңгейлері"], "tip": "Екі ғалымды «доға — сақина» қарсылығы арқылы салыстырыңыз: Сеченовте әрекет тітіркендіргіштен басталады, Бернштейнде оны нәтиженің моделі бағыттайды, ал қозғалыс кері сигналмен түзетіліп отырады.", "src": "Бабаев, 1-дәрісбаян (Сеченов); Психика, ми, сана сайты, 21-тақырып (Немов, 5.6); Лурия, «Нейропсихология негіздері»", "link": null}, "Q51": {"n": 51, "id": "Q51", "level": "medium", "topic": 5, "q": "Өзін-өзі бағалау және өзіндік сана құрылымы.", "plan": ["<b>Өзіндік сана<\/b> — жеке сананың адамның өзіне бағытталған бөлігі. Ол адамның өзін, өз қасиеттерін, мүмкіндіктері мен қадірін тануы. Бабаев бойынша әр тұлғаның өз «Менінің» көптеген бейнесі бар: қазір өзін қандай деп біледі және болашақта қандай болғысы келеді.", "Немов пен Романова өзіндік сананың төрт бөлігін атайды: <b>өзін-өзі бағалау<\/b> (өз қасиеттеріне берген баға), <b>талаптану деңгейі<\/b> (қандай табысқа жетуге үміттенеді), <b>«Мен» бейнесі<\/b> (өзі туралы бағасыз түсінік) және <b>Мен-тұжырымдама<\/b> (өткендегі, қазіргі, болашақтағы өзі туралы жалпы түсінік).", "<b>Мен-тұжырымдама<\/b> (Р. Бернс) — адамның өзі туралы түсініктері мен оларға берген бағаларының жиынтығы. Оның үш құрамдасы бар: когнитивтік (өзі туралы білім), эмоциялық (өзіне қатынас) және мінез-құлықтық (өзіне қатысты әрекет).", "Сонымен бірге <b>өзін-өзі бағалау<\/b> — Мен-тұжырымдаманың бағалау жағы. Ол <b>нақты Мен<\/b> мен <b>идеалды Менді<\/b> салыстырудан туады, оған айналадағылардың бағасы да сіңеді (Немов). Бір адамда «өзім үшін Мен», «басқалар үшін Мен» және басқалардың бағасынан туған «айналық Мен» болады.", "Өзін-өзі бағалау төмен, барабар және жоғары болады. Төмен бағалайтын адам жеңіл міндетті таңдайды, ал жоғары бағалайтын адам шамасы жетпейтін іске кірісіп, сәтсіздіктен сабақ алмайды. Барабар бағалайтын адам қиын, бірақ шамасы жететін міндетті алады.", "Байланыс: өзін-өзі бағалау талаптану деңгейін айқындайды, ал екеуі Мен-тұжырымдаманың ішінде жатыр. Мен-тұжырымдама тұтас: бір жағы өзгерсе, қалғандары да өзгереді (Роджерс).", "Қорытынды: өзіндік сана дүниеге келгеннен бар емес, ол қарым-қатынаста қалыптасады. Адам өзін басқалардың бағасы арқылы таниды, бірақ Бабаев ескерткендей, өз бағаңды тек басқалардың пікіріне қарап шығаруға болмайды."], "terms": ["өзіндік сана", "өзін-өзі бағалау", "талаптану деңгейі", "Мен-бейне", "Мен-тұжырымдама", "нақты Мен және идеалды Мен"], "tip": "«Өзін-өзі бағалау» мен «Мен-тұжырымдаманы» шатастырмаңыз: біріншісі — екіншісінің бағалау жағы ғана.", "src": "Психика, ми, сана сайты, 17-тақырып (Немов, 5.2); Тұлға сайты, «Тұлға құрылымы» (Немов, 107–109 б.); Бабаев, 4-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana-qurylym", "label": "Психика, ми, сана · «Сананың құрылымы мен деңгейлері»"}}, "Q52": {"n": 52, "id": "Q52", "level": "medium", "topic": 14, "q": "Мінез акцентуациясы ұғымы және оның типтері (К. Леонгард).", "plan": ["<b>Мінез асқынуы<\/b> (акцентуация) — мінездің кейбір бітістерінің шамадан тыс дамып, психиканың «әлсіз жері» түрінде көрінуі (Бабаев). Бұл ауру емес, қалыптың ішіндегі, бірақ оның шекарасына жақын ерекшелік.", "Асқынған мінезді адам жалпы алғанда тұрақты, бірақ кейбір әсерлерге аса сезімтал келеді. Қиын жағдай дәл осы «әлсіз жерге» тисе, оның қылығы күрт өзгереді, асқынған бітіс басқа ұнамды қасиеттерді басып кетеді.", "Ұғымды неміс психиатры <b>Леонгард<\/b> енгізді. Оның ойынша, асқыну адамдармен қарым-қатынаста айқын көрінеді, сондықтан ол типтерді қарым-қатынас пен мінез-құлық стиліне қарап сипаттады.", "Леонгард типтері: <b>гипертимдік<\/b> (көтеріңкі көңіл, белсенді, көпшіл), <b>дистимдік<\/b> (көңілсіз, тұйық, баяу), <b>циклотимдік<\/b> (көтеріңкі және түсіңкі көңіл кезектеседі), <b>қозғыш<\/b> (ашушаң, ұстамсыз), <b>«тұрып қалатын»<\/b> (ренішті ұзақ ұмытпайды, күдікшіл).", "Тағы бір топ: <b>педантты<\/b> (ұқыпты, ұсақ-түйекке қадалады), <b>үрейлі<\/b> (жасқаншақ, сенімсіз), <b>эмотивті<\/b> (аса сезімтал, ренішін ішке бүгеді), <b>демонстративті<\/b> (назардың ортасында болуға ұмтылады), <b>экзальтацияланған<\/b> (қуаныш пен үрейді өте күшті сезінеді).", "Леонгард типтерін кейін Личко жасөспірімдерге бейімдеді. Асқыну жасөспірім шақта айқын көрінеді, ересек шақта көбіне бәсеңдейді; бірақ ұнамсыз жағдай басым болса, психикалық бұзылысқа әкелуі мүмкін.", "Қорытынды: асқыну — мінез бітісінің күшеюі, ал әр типтің жақсы жағы да бар (гипертим — жігерлі, педант — ұқыпты). Асқыну типін білу адаммен қарым-қатынасты дұрыс құруға және оның «әлсіз жерін» қорғауға көмектеседі."], "terms": ["мінез асқынуы (акцентуация)", "«әлсіз жер»", "Леонгард типтері", "гипертимдік, дистимдік, қозғыш, педантты", "Личко"], "tip": "Мінез асқынуын психикалық аурумен теңестірмеңіз: ол қалыптың ішінде, бірақ оның шекарасына жақын тұрған ерекшелік.", "src": "Бабаев, 19-дәрісбаян (5-бөлім); Маклаков, 25.2; Крысько, 158–159 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі: коммуникативтік-мінез-құлықтық типтер"}}, "Q53": {"n": 53, "id": "Q53", "level": "medium", "topic": 15, "q": "Жалпы және арнайы қабілеттерді салыстыру.", "plan": ["Қабілет — іс-әрекетті табысты орындауға және тез меңгеруге мүмкіндік беретін тұлғаның психикалық қасиеті. Қабілеттер ауқымына қарай <b>жалпы<\/b> және <b>арнайы<\/b> болып бөлінеді.", "<b>Жалпы қабілеттер<\/b> көп іс-әрекетке бірдей қажет: ойлау, ес, зейін, сөйлеу, қолдың дәлдігі, тапқырлық пен алғырлық. Бабаев бойынша әртүрлі салада білім мен дағдыны жеңіл әрі нәтижелі меңгеруге көмектесетін жалпы қабілеттер ерекшелігі — <b>дарындылық<\/b>.", "<b>Арнайы (кәсіби) қабілеттер<\/b> нақты бір іс-әрекетке керек: музыкалық, математикалық, суретшілік, спорттық, педагогикалық қабілет. Мысалы, мұғалімге педагогикалық зейінділік, музыкантқа дыбыс биіктігін ажырататын есту керек.", "Айырмашылығы: жалпы қабілет кез келген іске «кіру есігі», ал арнайы қабілет бір салада ерекше табысқа жеткізеді. Жалпы қабілеті жақсы адам көп нәрсені орташа жақсы меңгереді, арнайы қабілеті жоғары адам өз саласында биікке шығады.", "Байланысы: екеуі бір-бірін толықтырады. Арнайы қабілеттер жалпы қабілеттің негізінде дамиды, ал арнайы іспен айналысу жалпы қабілетті де жетілдіреді. Мысалы, математикалық қабілет ойлау мен естің дамуына сүйенеді.", "Арнайы қабілеттің өзі бірнеше қасиеттің бірлігі: онда <b>жетекші<\/b> және <b>қосалқы<\/b> қасиеттер бар. Бейнелеу қабілетінде жетекші — көру сезімталдығы, қолдың дәлдігі, бейнелі ес; қосалқы — көркем қиял.", "Қорытынды: жалпы және арнайы қабілеттер қарама-қарсы емес. Табысты маман болу үшін екеуі де керек, ал олардың үйлесімі адамның дарындылығын құрайды."], "terms": ["жалпы қабілеттер", "арнайы (кәсіби) қабілеттер", "дарындылық", "жетекші және қосалқы қасиеттер", "педагогикалық зейінділік"], "tip": "Жалпы қабілетті «барлық адамда бірдей» деп түсінбеңіз: ол да дара ерекшелік, тек көп іс-әрекетке ортақ.", "src": "Бабаев, 20-дәрісбаян (1, 4-бөлім); Маклаков, 23.1–23.2; Крысько, 163 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}}, "Q54": {"n": 54, "id": "Q54", "level": "medium", "topic": 15, "q": "Дарындылық пен таланттың айырмашылығы.", "plan": ["Дарындылық пен талант — қабілеттің даму деңгейлері. Қабілет нышаннан басталып, іс-әрекет арқылы дамиды: нышан → қабілет → дарындылық → шеберлік → талант → данышпандық.", "<b>Дарындылық<\/b> — нақты адамға тән жалпы және арнайы қабілеттердің жиынтығы. Бабаев бойынша ол әртүрлі салада білім мен дағдыны жеңіл әрі нәтижелі меңгеруден көрінеді. Дарынды адамға зейінділік, жинақылық, жұмысқа деген қажырлылық тән.", "Дарындылық табыстың өзін емес, <b>табыстың мүмкіндігін<\/b> береді. Ол іске асу үшін адам білім мен дағдыны меңгеріп, еңбек етуі керек; Бабаев дарындылық дәрежесі білім мен дағдыны жетілдіруге тікелей тәуелді дейді.", "<b>Талант<\/b> — адам белгілі бір салада іске асырған дарындылықтың жоғары дәрежесі, арнайы қабілеттердің (музыкалық, суретшілік, әдеби) жоғары дамуы. Талантты адамның ісі жаңашыл, қайталанбас мәнерімен ерекшеленеді.", "Талант — бірнеше қабілеттің бірлігі. Бабаев айтқандай, жеке бір қабілет өте жоғары дамыса да, ол талант бола алмайды: көп таңбалы санды лезде көбейтетін адам осының өзімен математик болмайды.", "Айырмашылығы: дарындылық — мүмкіндік, көбіне жалпы, әлі іске аспаған әлеует; талант — нақты салада іске асқан, нәтиже берген дарындылық. Талант іс-әрекетте ғана көрінеді және өседі.", "Таланттың ашылуы қоғамға да байланысты: дәуірдің қажеттілігі қай саладағы дарындылықтың жол табатынын анықтайды. Бабаев мысалы: Қ. Сәтпаев, М. Әуезов, Б. Момышұлы — әрқайсысы өз дәуірінің саңлағы."], "terms": ["дарындылық", "талант", "шеберлік", "данышпандық", "қабілеттің даму деңгейлері"], "tip": "Дарындылықты «мүмкіндік», талантты «іске асқан мүмкіндік» деп есте сақтаңыз.", "src": "Бабаев, 20-дәрісбаян (4-бөлім); Маклаков, 23.2; Крысько, 162–163 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі (даму деңгейлері)"}}, "Q55": {"n": 55, "id": "Q55", "level": "medium", "topic": 1, "q": "Психологиядағы детерминизм принципінің мәні.", "plan": ["<b>Детерминизм<\/b> (латынша <i>determinare<\/i> — анықтау) — кез келген құбылыстың себебі бар деген ұстаным. Бабаев бойынша, ол кеңес психологиясында 30-жылдары қалыптасқан үш негізгі принциптің бірі: детерминизм, сана мен іс-әрекет бірлігі, даму принципі.", "<b>Мәні:<\/b> кез келген психикалық құбылыс адамның өмір салтына, қоршаған ортаның әсеріне байланысты пайда болады. Өмір жағдайы өзгерсе, психика да өзгереді. Психика өзімен өзі тұйықталған дүние емес, сыртқы әсерден туатын құбылыс, ал оның салдары іс-әрекетте көрінеді.", "<b>Жануар мен адамның айырмасы:<\/b> жануар психикасының дамуын табиғи сұрыптау анықтайды, ал адам психикасының дамуын қоғамдық-тарихи заңдар анықтайды. Адам мәдениетті игеріп, қоғамдық қатынасқа араласқан сайын оның психикасы дамиды.", "<b>Әдіске әсері:<\/b> себепті іздеу интроспекцияны ығыстырды. Оның орнына объективті әдіс келді: адамға әсер ететін себепті нақты білу, әсердің сандық және сапалық сипатын беру, сыртқы жауапты тіркеу, әр түрлі әсерлерді салыстыру.", "<b>Ми мен психика:<\/b> детерминизм психиканы ми қызметімен байланыстырады, сондықтан психикалық құбылысты түсіндіргенде физиологиялық заңдылықтарға сүйенуге жол ашты. 50-жылдары С.Л. Рубинштейн бұл принципке ерекше мән берді.", "<b>Басқа принциптермен байланысы:<\/b> себеп іс-әрекет арқылы әсер етеді (сана мен іс-әрекет бірлігі), ал себептер өзгергенде психика дамиды (даму принципі). Бабаев детерминизм психикалық дамудағы биологиялық пен әлеуметтіктің, ішкі заңдылық пен сыртқы әсердің, оқу мен дамудың байланысы туралы сұрақтарды алға қойғанын айтады.", "<b>Мысал және қорытынды:<\/b> баланың сабаққа ынтасы төмендесе, психолог «жалқау» деп тоқтамай, себебін іздейді: отбасы жағдайы ма, сыныптағы қарым-қатынас па, денсаулығы ма. Детерминизм психологияны құбылысты сипаттаудан оның себебін түсіндіруге көшірді."], "terms": ["детерминизм принципі", "себеп-салдар", "сана мен іс-әрекет бірлігі принципі", "даму принципі", "объективті әдіс"], "tip": "Детерминизмді жай «себептілік» деп қалдырмаңыз: адам психикасының себебі тек табиғатта емес, қоғамдық-тарихи жағдайда да жатқанын міндетті түрде айтыңыз.", "src": "Бабаев, 2-дәрісбаян (психология ғылымының негізгі принциптері)", "link": null}, "Q56": {"n": 56, "id": "Q56", "level": "medium", "topic": 3, "q": "Сана мен санасыздықтың арақатынасы (З. Фрейд).", "plan": ["Фрейдке дейін психология негізінен сананы зерттеді, ал бейсананы психиканың шағын бөлігі деп санады. <b>З. Фрейд<\/b> бейсананы психиканың басты құрылымы деп таныды: оның ойынша, психикада бейсана басым, ал сана оған бағынады.", "Фрейд психиканы қабаттарға бөлді: <b>сана<\/b> — адам дәл қазір аңғарып тұрғаны; <b>сана алды<\/b> — аздаған күшпен есіне түсіретіні; <b>бейсана<\/b> — адам өзі аңғармайтын құштарлықтар мен басылған тілектер.", "<b>Қайшылық идеясы:<\/b> бейсана — биологиялық инстинкттер (Эрос — өмір инстинкті, Танатос — өлім инстинкті), ал сана — қоғам қабылдаған нормалар. Сондықтан екеуі бастапқыдан бір-біріне қарсы, олардың арасында үнемі күрес жүреді. Тұлға құрылымында бұл Ид пен Супер-эгоның арасындағы күрес, ал Эго оларды татуластыруға тырысады.", "<b>Бейсананың көріністері:<\/b> қоғам тыйым салған тілек санадан ығыстырылады, бірақ жоғалмайды. Ол түс, ес қателері, тілдің тайып кетуі, қате әрекеттер мен невроз белгілері арқылы сыртқа шығады. Мысалы, адам біреудің атын ұмытса, Фрейд бойынша бұл көбіне сол адамға деген жағымсыз сезімге байланысты.", "<b>Әдістері:<\/b> бейсананы ашу үшін Фрейд еркін ассоциация мен түс жоруды ұсынды. Түстің айқын мазмұны оның жасырын, бейсаналық мағынасына әдетте сай келмейді.", "<b>Сыны:<\/b> психологтардың көпшілігі Фрейдтің бұл шешімін қабылдамайды. Біріншіден, көп адам мұндай ішкі қақтығысты мүлде сезінбейді. Екіншіден, бұл идея эволюция теориясына қайшы: тек зиян келтіретін қақтығыс эволюция барысында сақталмас еді.", "<b>Қорытынды:<\/b> Фрейд бейсананың бар екенін және оның мінез-құлыққа әсерін көрсетті. Ал қазіргі психология сана мен бейсананы қарсылас емес, бірін-бірі толықтыратын деңгейлер деп қарайды: қарапайым, әдеттегі әрекетті бейсана реттейді, жаңа әрі күрделі міндетті сана шешеді (Бернштейн)."], "terms": ["сана", "сана алды", "бейсана", "ығыстыру", "Эрос және Танатос", "сана мен бейсананың арақатынасы"], "tip": "Фрейдтің көзқарасын баяндап болған соң, оған айтылған сынды және қазіргі «бірін-бірі толықтыру» көзқарасын міндетті түрде қосыңыз.", "src": "«Психика, ми, сана» сайты, 19–21-тақырыптар (Немов, 5.4–5.6); Бабаев, 2-дәрісбаян (Фрейдизм) және 4-дәрісбаян (Сана және бейсана)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#aragatynas", "label": "Сана мен бейсананың арақатынасы · сайттың 21-тақырыбы"}}, "Q57": {"n": 57, "id": "Q57", "level": "medium", "topic": 6, "q": "Гештальтпсихологиядағы қабылдау заңдары.", "plan": ["<b>Гештальтпсихология<\/b> — ХХ ғасырдың басында Германияда пайда болған бағыт (М. Вертгеймер, В. Кёлер, К. Коффка). Басты қағидасы: бүтін бөліктердің қосындысынан өзгеше. Олар ассоцианизмді сынап, бейне түйсіктерден жиналмайды, бірден тұтас құрылым ретінде пайда болады деді.", "Өрісті ұйымдастырудың алғашқы қадамы — <b>фигура мен фон<\/b>. Фигура — алға шығып тұрған, зейінді тартатын тұйық бөлік, фон — оның айналасы. Бұл мәселені алғаш Э. Рубин зерттеген (Рубин вазасы).", "Гештальт заңдарын М. Вертгеймер сипаттаған. <b>Жақындық заңы<\/b>: бір-біріне жақын тұрған бөліктер бір топқа бірігеді (әріптер сөзге топталады). <b>Ұқсастық заңы<\/b>: ұқсас бөліктер топталады (футболшыларды форма түсіне қарап екі командаға бөлеміз).", "<b>Ортақ тағдыр заңы<\/b>: бірге, бір бағытта қозғалатын бөліктер бір топ болып көрінеді (аспанда ұшып бара жатқан құстар тобы). Немов тізімге <b>біртекті байланыс заңын<\/b> да қосады: бір сызықпен жалғанған нүктелер жұп болып көрінеді. <b>Жақсы жалғасу заңы<\/b>: біз үзік-үзік сызықтарды емес, біркелкі жалғасқан сызықтарды көреміз. <b>Симметрия заңы<\/b>: бөліктер симметриялы фигура құрайтындай бірігеді.", "<b>Тұйықталу заңы<\/b>: қабылдау жетіспейтін бөлікті толықтырып, тұйық фигура көреді (үзік доғалардан шеңбер). <b>Жақсы пішін (прегнанттылық) заңы<\/b> қалған заңдарды жалпылайды: қабылдау ең қарапайым, тұрақты, таныс пішінге ұмтылады.", "Шектеуі: бұл заңдылықтар физикалық заң сияқты қатаң емес, бір-бірімен бәсекелесе алады; сондықтан қазір оларды «принцип» деп те атайды. Қабылдауға тек тітіркендіргіштің құрылымы емес, адамның тәжірибесі мен <b>ұстанымы<\/b> да әсер етеді («Жас әйелдің портреті»).", "Қорытынды: гештальтпсихология қабылдаудың тұтастығы мен құрылымдылығын ғылыми түрде ашты. Вертгеймердің пікірінше, бұл заңдар қабылдауды ғана емес, ес пен ойлауды да басқарады; кейін ол бұл қағидаларды «Өнімді ойлау» кітабында ойлауды зерттеуге қолданды."], "terms": ["гештальт", "фигура мен фон", "жақындық және ұқсастық заңдары", "ортақ тағдыр заңы", "тұйықталу заңы", "прегнанттылық (жақсы пішін) заңы"], "tip": "Әр заңға бір көрнекі мысал айтыңыз (нүктелер, футбол формасы, үзік шеңбер) — гештальт заңдары мысалсыз есте қалмайды.", "src": "Түйсік және қабылдау сайты, 15-тарау; Немов, Маклаков, OpenStax (сайт бойынша); Бабаев, 1-тарау (гештальтпсихология)", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s15-laws", "label": "Түйсік және қабылдау · 15-тарау «Гештальт заңдары»"}}, "Q58": {"n": 58, "id": "Q58", "level": "medium", "topic": 12, "q": "Адамның ерік сапалары және оларды тәрбиелеу.", "plan": ["<b>Ерік сапалары<\/b> — адамның еріктік әрекетінде көрінетін тұрақты ерекшеліктері. Олардың бәрін біріктіретін — <b>ерік күші<\/b>: үлкен кедергіні жеңе алу. Жеңілген кедергі неғұрлым ауыр болса, ерік күші соғұрлым зор.", "Бабаев сапаларды еріктік әрекеттің кезеңдерімен байланыстырады. Іске кірісу кезеңінде <b>ынталылық<\/b> пен <b>дербестік<\/b> керек: адам нұсқау күтпей, басқаның кеңесін сынмен бағалап, өз сенімімен шешім қабылдайды.", "Іске ниеттену кезеңінде <b>ұстамдылық<\/b> сезім мен ашуды тежейді. Шешім кезеңінде <b>батылдық<\/b> — орынды шешімді тез әрі берік қабылдап, іске асыра алу. Ол көзсіздікке қарсы.", "Орындау кезеңінде <b>шалттық<\/b> пен <b>табандылық<\/b> маңызды: шалттық тез қызады да, тез суиды, сондықтан табандылықпен ұштасқанда ғана құнды. Табандылықтың теріс «егізі» — <b>өжеттік пен қиқарлық<\/b>: адам қатесін көріп тұрса да, райынан қайтпайды.", "Шешімнің орындалуы үшін <b>өзіндік бақылау<\/b> мен <b>өзіндік баға<\/b> керек. Тым қатал баға сенімді жояды, тым жұмсақ баға бақылауды әлсіретеді (Бабаев).", "Тәрбиелеу (Бабаев): ерік балалық шақта, іс-әрекетте қалыптасады. Отбасының қатесі — баланың тілегенін бәрін орындап, ұстамдылыққа үйретпеу (бұдан өжеттік туады) немесе шамасы келмейтін тапсырма беру (бұдан бастаған ісін аяқтамау әдеті қалыптасады).", "Еріктің тәрбие жолдары: ата-ана мен кейіпкерлердің үлгісі, тұрақты тәртіп, дене тәрбиесі, ойын, ұжым және еңбек. Бабаевтың сөзімен: «Ерік — бұл дұрыс ұйымдастырылған еңбек»."], "terms": ["ерік күші", "ынталылық", "дербестік", "батылдық", "табандылық", "өзіндік бақылау"], "tip": "Сапаларды жай тізбемей, еріктік әрекеттің кезеңдеріне орналастырыңыз да, әрқайсысының теріс «егізін» (табандылық — қиқарлық, батылдық — көзсіздік) атаңыз.", "src": "Бабаев, 16-дәрісбаян, 5–6-бөлімдер; Маклаков, 15.5; Немов, 23.5", "link": null}, "Q59": {"n": 59, "id": "Q59", "level": "medium", "topic": 9, "q": "Ойлау формалары: ұғым, пікір, ой қорытындысы.", "plan": ["Ой үш түрде көрінеді: <b>ұғым, пікір және ой қорытындысы<\/b>. Олар бір-бірімен байланысты: ұғымдардан пікір құралады, пікірлерден қорытынды шығады.", "<b>Ұғым<\/b> — заттың не құбылыстың жалпы әрі мәнді қасиеттерін бейнелейтін ой (Бабаев). Ол заттың барлық белгісін емес, тек мәнді белгісін алады: «балық», «өкпе», «жеміс».", "Ұғымды елестен және сөзден ажыратамыз. <b>Елес<\/b> — нақты бір заттың бейнесі (өз үйім), ал ұғым көп затқа ортақ («үй — адамның баспанасы»); көзге елестете алмайтынды да ұғыммен айтамыз: «мыңбұрыш». Ұғым мен сөз де теңдес емес: бір ұғым әртүрлі сөзбен («самолет», «аэроплан») және әр тілде әртүрлі сөзбен («хлеб», «нан») беріледі, ал бір сөз бірнеше ұғымды білдіреді («ат»).", "<b>Пікір<\/b> — бір нәрсе мақұлданатын не теріске шығарылатын ойлау формасы; пікірде ұғымның мазмұны ашылады. «Далада жаңбыр жауып тұр» — мақұлдау, «Оқушы есепті шешкен жоқ» — теріске шығару. Пікір шындыққа сай келуі де, келмеуі де мүмкін, сондықтан оны тексеруге болады.", "<b>Ой қорытындысы<\/b> — бір не бірнеше пікірден (алғышарттан) жаңа пікір шығару; алғышарттарды ортақ ұғым жалғайды. «Құс — жануар», «Жануарлар оттегісіз өмір сүре алмайды», демек «Құстар оттегісіз өмір сүре алмайды» (Бабаев).", "Ой қорытындысының түрлері: <b>индуктивтік<\/b> — жеке фактілерден жалпы пікірге, <b>дедуктивтік<\/b> — жалпы ережеден жеке қорытындыға жүреді. Немов <b>трансдуктивтік<\/b> түрді де атайды: онда алғышарт пен қорытынды бірдей дәрежеде жалпы.", "Қорытынды: формалар — ойдың пішіні, ал талдау, салыстыру, қорытындылау — ұғымды құратын ой әрекеттері. Дұрыс ойлаудың формалары мен заңдарын <b>логика<\/b> зерттейді. Бабаев бойынша логикалық ойлау шындыққа сай пікірлерден қорытынды шығаруға сүйенеді."], "terms": ["ұғым", "елес", "пікір", "ой қорытындысы", "индукция мен дедукция"], "tip": "Әр формаға бір мысал дайындаңыз, ал ой қорытындысында алғышарттарды жалғап тұрған ортақ ұғымды көрсетіңіз.", "src": "Ойлау және сөйлеу сайты, 2-тарау; Бабаев, 13-дәрісбаян; Немов, I бөлім, 13-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s02-forms", "label": "Ойлау және сөйлеу · 2-тарау: Ойдың үш формасы"}}, "Q60": {"n": 60, "id": "Q60", "level": "medium", "topic": 1, "q": "Клиникалық психология мен жалпы психологияның пәнаралық байланысы.", "plan": ["<b>Жалпы психология<\/b> психиканың жалпы заңдылықтарын, ұғымдарын, әдістерін зерттейді, сондықтан ол барлық салаға негіз береді. <b>Клиникалық (медициналық) психология<\/b> — іс-әрекет түріне қарай бөлінетін қолданбалы сала: ол аурудың психикаға әсерін, психикалық бұзылыстарды және оларды зерттеу мен түзету жолдарын қарайды.", "<b>Жалпы психологиядан клиникалық психологияға:<\/b> бұзылысты көру үшін алдымен қалыпты процесті білу керек. Түйсік, қабылдау, ес, зейін, ойлау, эмоция туралы ұғымдар мен олардың заңдылықтары клиникалық психологқа «өлшеуіш» береді. Хомская Лурияның нейропсихологияны жалпы психологиялық ұғымдарды ми жұмысына қолдану деп қарағанын жазады.", "<b>Клиникалық психологиядан жалпы психологияға:<\/b> клиника психиканың құрылысын ашатын маңызды дерек көзі. Тәжібаев ми мен психиканың байланысын зерттейтін төрт жолдың бірі ретінде медициналық клиниканы атайды: мидың қай бөлігі зақымданса, қандай психикалық әрекет бұзылатыны анықталады.", "<b>Лурияның синдромдық талдауы:<\/b> мидың бір жері зақымданғанда бірнеше процесс бірге бұзылады. Мысалы, сол жақ төбе-шүйде бөлігі зақымданса, адам кеңістікте бағдарлай алмайды, есепте қиналады, күрделі грамматикалық құрылымды түсінбейді. Демек, бұл процестердің ортақ буыны бар. Лурия синдромдық талдау психикалық процестердің ішкі құрылысын ашуға жол береді дейді. Мидың функционалдық блоктары туралы ілім де осындай клиникалық деректерден туды.", "<b>Тарихи байланыс:<\/b> Бабаев XIX ғасырдың соңында невропатология мен психиатрия зерттеулері адам әрекетінің бір бөлігін сана басқармайтынын көрсеткенін айтады. Бұл сана психологиясының дағдарысына әсер етіп, жалпы психологияда бейсана мәселесін көтерді.", "<b>Ортақ әдістер:<\/b> бақылау, әңгіме, эксперимент, тест екі салада да қолданылады. Жалпы психологияда ерекше орны бар әдістердің бірі — <b>кейс (клиникалық зерттеу)<\/b>: бір адамды терең зерттеу сирек жағдайдан жалпы заңдылыққа жаңа сұрақ тудырады.", "<b>Қорытынды:<\/b> байланыс екі жақты. Жалпы психология клиникалық психологияға теория мен әдіс береді, ал клиникалық психология оған психиканың қалай құрылғанын бұзылыс арқылы көрсетіп, теорияны тексереді."], "terms": ["клиникалық психология", "жалпы психология", "синдромдық талдау", "нейропсихология", "кейс (клиникалық зерттеу)"], "tip": "Байланысты бір бағытта ғана айтпаңыз: жалпы психология клиникаға не беретінін және клиника жалпы психологияға не беретінін бөлек көрсетіңіз.", "src": "Лурия, «Основы нейропсихологии» (Хомская алғысөзі; I бөлім, II тарау, 4-бөлім); Бабаев, 1–2-дәрісбаяндар; «Психика, ми, сана» сайты, 1 және 11-тақырыптар", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#lokal", "label": "Психикалық функциялардың локализациясы · сайттың 11-тақырыбы"}}, "Q61": {"n": 61, "id": "Q61", "level": "hard", "topic": 7, "q": "Кейс: Пациентте бассүйек-ми жарақатынан кейін жаңа ақпаратты есте сақтау қабілеті бұзылған, бірақ бұрынғы есі сақталған. Ес теориясы негізінде талдаңыз.", "plan": ["Жағдайды талдау: жарақаттан кейін жаңа ақпарат есте қалмайды, ал жарақатқа дейінгі оқиғалар сақталған. Ес теориясы бойынша бұл <b>антероградтық амнезияның<\/b> көрінісі (OpenStax); Маклаков ұқсас бұзылысты <b>фиксациялық амнезия<\/b> дейді. Нақты диагнозды дәрігер қояды, психолог феноменді сипаттап, тексереді.", "Аткинсон мен Шиффриннің моделі бойынша ақпарат сенсорлық естен қысқа мерзімді еске, одан ұзақ мерзімді еске өтеді. Науқаста қысқа мерзімді ес жұмыс істейді (жаңа сөзді бірден қайталай алады), бірақ ақпарат ұзақ мерзімді еске <b>көшпейді<\/b>.", "Тетігі: ес ізі бекімейді, яғни <b>консолидация<\/b> бұзылған. Мұндайда әдетте <b>гиппокамп<\/b> пен оның байланыстары зақымданады. Әйгілі мысал — Г. М.: гиппокамптары алынғаннан кейін ол жаңа адамдарды, оқыған журналын есте сақтай алмаған, ал отаға дейінгі өмірін есіне алған.", "Не сақталуы мүмкін: Г. М. айнаға қарап жұлдыз сызуды күн сайын жақсырақ орындаған, пазлды да тезірек құрастырған, бірақ бұл тапсырмаларды бұрын көргенін есіне алмаған. Демек <b>процедуралық (имплициттік) ес<\/b> эпизодтық естен бөлек жұмыс істейді; науқас «не болғанын» білмесе де, «қалай істеуді» біртіндеп үйренеді.", "Кері жағдаймен салыстыру: <b>ретроградтық амнезияда<\/b> керісінше жарақатқа дейінгі оқиғалар ұмытылады. Маклаков бойынша уақыт өте ұмытылған кезең қысқаруы мүмкін. Лурия гиппокамп пен оның байланыстары зақымданғанда ес іздері бөгде әсерден оңай тежелетінін көрсетеді; ауыр жағдайда көрініс <b>корсаковтық (амнестикалық) синдромға<\/b> жақындайды: адам жаңа оқиғаны есте сақтамайды, есіндегі бос орындарды ойдан толтырады.", "Психологиялық тексеру әдістемелері: <b>Лурияның 10 сөз әдістемесі<\/b> — сөздерді бірнеше рет оқып, әр қайталаудан кейін және біраз уақыттан соң қайта сұрау (есте қалдыру қисығы сызылады); <b>әңгімені қайта айту<\/b>; <b>интерференциялық сынама<\/b> — екі қысқа сөз тобынан кейін біріншісін сұрау. Бірден және кешіктіріп сұрағандағы айырма консолидацияның бұзылғанын көрсетеді.", "Ұсыныстар: сыртқы көмекшілерді пайдалану (күнделік, жазба кітапша, телефондағы еске салғыш); күн тәртібін тұрақты ету; жаңа дағдыны көп қайталап, процедуралық еске сүйеніп үйрету; туыстарына науқастың бір сұрақты қайталап қоюы әдейі емес екенін түсіндіру.", "Қорытынды: жағдай естің бір тұтас «қойма» емес, бірнеше жүйеден тұратынын көрсетеді: ұзақ мерзімді естегі ескі іздер сақталған, ал жаңа ізді бекіту жүйесі бұзылған."], "terms": ["антероградтық (фиксациялық) амнезия", "консолидация", "гиппокамп", "процедуралық ес", "Лурияның 10 сөз әдістемесі"], "tip": "Антероградтық пен ретроградтық амнезияны уақыт сызығымен ажыратыңыз: жарақаттан <i>кейінгісі<\/i> есте қалмаса — антероградтық, жарақатқа <i>дейінгісі<\/i> ұмытылса — ретроградтық.", "src": "Ес сайты, 2-, 4-, 9-, 13-тараулар; Маклаков, 10.4; OpenStax 8.2 (сайт бойынша); Лурия, «Нейропсихология негіздері» (лобтық және медиалды бөлімдер зақымдануындағы ес бұзылыстары)", "link": {"url": "https://tazhiyeva.github.io/es-psikhologiyasy/#s13-antero-retro", "label": "Ес · 13-тарау «Антероградтық және ретроградтық амнезия»"}}, "Q62": {"n": 62, "id": "Q62", "level": "hard", "topic": 11, "q": "Кейс: Студент емтихан кезінде қатты қобалжып, білетін сұрағына жауап бере алмады. Стресс пен аффекттің танымдық процесстерге әсерін түсіндіріңіз.", "plan": ["<b>Жағдаят<\/b>: студенттің білімі бар, бірақ қатты қобалжу оны пайдалануға мүмкіндік бермеді. Бұл — білімнің жоқтығы емес, эмоциялық күйдің танымдық процестерді бұзуы. Қатты қобалжу кенет күшейсе, аффектіге, ұзақ созылса, стреске жақындайды.", "<b>Аффект<\/b> кезінде сана мен зейін тарылады: адам тек өз толғанысын көреді, назарын басқаға аудара алмайды, ойлауы әрекеттің салдарын болжай алмай қалады (Крысько; Немов). Студенттің ойы сұрақта емес, «құлаймын» деген қорқынышта тұр.", "<b>Стресс<\/b> қабылдауды, зейінді, есті, ойлауды, сөйлеуді баяулатады, адам байқамайтын қателер көбейеді (Немов). Селье бойынша бұл — <b>дабыл фазасы<\/b>: симпатикалық жүйке жүйесі денені «қашуға не төбелесуге» дайындайды, ал ой жұмысына қуат аз қалады.", "<b>Ес<\/b>: Немовтың эмоция заңы бойынша, жағымсыз эмоция аясында материал қиын еске түседі. Білім ізі сақталған, бірақ дәл сол сәтте оған қол жеткізу қиын — сондықтан «білетін сұрақ» шықпай қалды.", "<b>Хебб қисығы<\/b>: әрекет орташа қозуда ең тиімді, ал тым күшті қозу нәтижені төмендетеді (Маклаков). Аздаған толқу студентті жинақтайды, ал үрей назарды шашыратады.", "<b>Ұсыныстар<\/b> (қадаммен): 1) кідіріс жасап, демді баяу шығару — парасимпатикалық бөлім денені тыныштандырады; 2) алдымен ең оңай білетін сұрақтан бастау; 3) сұрақтың жоспарын қағазға түсіру — сыртқы тірек есті жеңілдетеді; 4) бағаны өзгерту: емтиханды «құлау» емес, «білгенімді көрсету» деп көру (Лазарус бойынша стресс оқиғаның бағасына байланысты).", "<b>Әдістемелер<\/b>: мазасыздықты Спилбергер–Ханиннің ситуациялық және тұлғалық мазасыздық шкаласымен өлшеуге болады. Тұлғалық мазасыздық жоғары болса, емтиханға дейін жаттығу (сынақ емтихан, топ алдында жауап беру) пайдалы.", "Қорытынды: эмоцияны жою емес, оның күшін оңтайлы шамаға түсіру керек. Маклаков бойынша ең күшті аффектіде де бақылау толық жоғалмайды, ал эмоциялық-еріктік орнықтылықты жаттықтыруға болады."], "terms": ["аффект", "стресс", "дабыл фазасы", "эмоция заңы (ес)", "Хебб қисығы", "когнитивтік бағалау"], "tip": "Аффект пен стресті жай анықтап қоймай, әр танымдық процестің (зейін, ес, ойлау) қалай бұзылғанын жағдаяттағы нақты белгімен байланыстырыңыз.", "src": "Немов, 24.1–24.2; Маклаков, 16.2–16.3; Крысько, 3.4; Бабаев, 17-дәрісбаян; Ес сайты, 11-тарау (эмоция заңы)", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-stress", "label": "Эмоция және сезім · 10-тарау: аффект пен стресс (Хебб қисығы — 8-тарауда)"}}, "Q63": {"n": 63, "id": "Q63", "level": "hard", "topic": 6, "q": "Кейс: Пациент нақты емес, белгісіз сыртқы тітіркендіргіштерді (мысалы, қабырғадағы дақты) адам бейнесі ретінде қабылдайды. Қабылдаудың қандай феномені/бұзылысы?", "plan": ["Жағдайды талдау: пациент <b>шын бар<\/b> затты (қабырғадағы дақты) көреді, бірақ оны басқа нәрсе — адам бейнесі ретінде қабылдайды. Демек бұл — <b>иллюзия<\/b>, яғни қате немесе бұрмаланған қабылдау (Маклаков), галлюцинация емес.", "Иллюзия мен галлюцинацияны ажырату маңызды. Иллюзияда сыртқы тітіркендіргіш бар, ол бұрмаланады; <b>галлюцинацияда<\/b> тітіркендіргіш мүлде жоқ, бірақ адам оны көреді не естиді. Бабаев галлюцинацияны жүйке жүйесінің ауруымен байланысты жалған, бұрмаланған бейнелер дейді.", "Белгісіз дақтан, бұлттан, тұскиіз өрнегінен бет-әлпет немесе адам бейнесін көру психиатрияда <b>парейдолия<\/b> (парейдолиялық иллюзия) деп аталады. Ол дені сау адамда да кездеседі; маңыздысы — адам мұның «жай дақ» екенін түсіне ме, жоқ па.", "Механизмі: қабылдау — <b>перцептивтік гипотезалар<\/b> құру. Ми толық емес ақпаратты таныс пішінге дейін толықтырады (тұтастық, тұйықталу заңы). Анық емес тітіркендіргіште болжам тексерілмей, «адам» деген таныс бейне бекіп қалады.", "Әсер ететін жағдайлар: <b>апперцепция<\/b> — қабылдау адамның тәжірибесіне, эмоциясына, күтуіне тәуелді; <b>перцептивтік ұстаным<\/b> — адам неге дайын тұрса, соны көреді. Маклаков мысалы: қараңғы бөлмедегі күртеше қорыққан адамға адам болып көрінеді. Қорқыныш, мазасыздық, шаршау мұндай иллюзияны күшейтеді.", "Психологиялық тексеру: бейнелер көп пе, олар тұрақты ма, пациенттің оларға сыни көзқарасы бар ма — соны бақылау және әңгімелесу. Көру арқылы тануды Лурия қолданған <b>үстінен сызықтар жүргізілген фигуралармен<\/b> тексеруге болады; анық емес дақтарды түсіндіруге негізделген <b>Роршах<\/b> тесті де осы құбылысқа сүйенеді.", "Ұсыныстар: бейнелер жиі, айқын болса және пациент оларға сенсе, психиатрға жіберу керек — клиникалық бағаны дәрігер береді. Жоғары қызу, улану не ішімдікті кенет тоқтату кезінде мұндай иллюзиялар делирийдің алғашқы белгісі болуы мүмкін, сондықтан пациенттің дене күйін де ескеру керек. Иллюзияны <b>агнозиямен<\/b> де шатастырмау керек: агнозияда адам затты көреді, бірақ танымайды, ал мұнда кері жағдай — жоқ бейнені «таниды».", "Қорытынды: бұл — қабылдаудың тұтастыққа және мағына беруге ұмтылуының шектен шыққан көрінісі. Пациент тітіркендіргіштің өзін емес, оған өз тәжірибесі мен күйінен қосқан мағынаны көреді."], "terms": ["иллюзия", "парейдолия", "галлюцинация", "апперцепция", "перцептивтік гипотеза", "перцептивтік ұстаным"], "tip": "Негізгі айырманы бірден айтыңыз: дақ шынымен бар болғандықтан бұл — галлюцинация емес, иллюзия (парейдолия).", "src": "Түйсік және қабылдау сайты, 14- және 15-тараулар; Бабаев, 11-дәрісбаян; Маклаков, OpenStax (сайт бойынша); Лурия, «Нейропсихология негіздері» (көру агнозиясы). «Парейдолия», делирий және Роршах тесті курс дереккөздерінде жоқ — жалпы клиникалық психология мен психиатрия терминологиясы", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s14-illusion", "label": "Түйсік және қабылдау · 14-тарау «Иллюзия ұғымы»"}}, "Q64": {"n": 64, "id": "Q64", "level": "hard", "topic": 11, "q": "Адамның эмоционалды-еріктік сферасының күйзеліске төзімділігін арттыруға арналған психологиялық ұсыныстар дайындаңыз.", "plan": ["<b>Мақсат<\/b>: адамның ауыр жүктемені қалжырауға жеткізбей көтеруіне көмектесу. Мұны Маклаков <b>эмоциялық-еріктік орнықтылық<\/b> дейді: ол тұқым қуалайтын ерекшелікке де, тәрбиеге де байланысты, демек оны дамытуға болады.", "<b>Теориялық негіз 1 — Селье<\/b>: стресс дабыл, қарсыласу, қалжырау фазаларынан өтеді. Ресурс қарсыласу фазасында таусылады, сондықтан ұсыныстардың басты міндеті — адамды қалжырау фазасына жібермеу.", "<b>Теориялық негіз 2 — Лазарус пен Фолкман<\/b>: стресс оқиғаның өзінен гөрі оны адамның қалай бағалайтынына байланысты: «бұл қатер ме, әлде сынақ па?», «менің қандай мүмкіндігім бар?»", "<b>Эмоцияны реттеу ұсыныстары<\/b>: 1) бағаны тексеру — оқиғаны «апат» емес, «шешетін міндет» деп көру; 2) ашу келгенде кідіріс жасау; 3) түсіңкі көңіл-күйдің себебін іздеу — себебі анықталса, көңіл-күй жиі тез басылады (Крысько); 4) күн сайын үш жақсы оқиғаны жазу.", "<b>Ерікті нығайту ұсыныстары<\/b> (Бабаев): мақсатты шағын, нақты қадамдарға бөлу; әр қадамды өзіндік бақылаумен тексеру; ұстамдылық пен табандылықты күнделікті тәртіп арқылы жаттықтыру; дене жаттығуы — дене әлсіз болса, адам жүктемені көтере алмай, күйзеліске тез түседі.", "<b>Денені баптау<\/b>: жүктемені уақтылы азайтып, тынығу; бұлшықетті босаңсыту, аутогендік жаттығу — қиял арқылы денені тыныштандыру (Бабаев, Куэ әдісі). Ішкі бақылау локусын дамыту: себепті тек сырттан емес, өз әрекетінен іздеу.", "<b>Әдістемелер<\/b>: бастапқы күйді өлшеу үшін Спилбергер–Ханиннің мазасыздық шкаласы, бақылау локусын анықтау үшін субъективтік бақылау деңгейі сауалнамасы (Роттер идеясы негізінде) қолданылады. Ұсыныстардан кейін өлшеуді қайталап, өзгерісті салыстырған жөн.", "Қорытынды: күйзеліске төзімділік үш тіректен құралады — оқиғаны дұрыс бағалау, өз эмоциясын реттеу, ерік күшімен жоспарды орындау. «Ашу — дұшпан, ақыл — дос» деген сөз осының қысқа формуласы."], "terms": ["эмоциялық-еріктік орнықтылық", "жалпы бейімделу синдромы", "когнитивтік бағалау", "бақылау локусы", "аутогендік жаттығу"], "tip": "Ұсыныстарды «эмоция», «ерік», «дене» деп үш топқа бөліп айтыңыз және әр топты бір теориямен (Селье, Лазарус, Бабаев) негіздеңіз.", "src": "Маклаков, 16.3; Немов, 24-тарау; Бабаев, 16–17-дәрісбаяндар; Крысько, 3.4; OpenStax, 14.2", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s12-reg", "label": "Эмоция және сезім · 12-тарау: эмоцияны реттеу (стресс — 10-тарауда)"}}, "Q65": {"n": 65, "id": "Q65", "level": "hard", "topic": 14, "q": "Клиникалық психологтың практикасында мінез акцентуациясын диагностикалаудың маңыздылығын негіздеңіз.", "plan": ["<b>Мінез асқынуы<\/b> (акцентуация) — мінездің кейбір бітістерінің шамадан тыс дамып, психиканың «әлсіз жерін» түзуі. Ол қалыптың ішінде, бірақ оның шекарасына жақын тұрады; Леонгард бұл ұғымды психиатриялық тәжірибесінде енгізіп, типтерін сипаттады.", "Бірінші маңызы — <b>қалып пен бұзылысты ажырату<\/b>. Асқыну тек кейбір жағдайда көрінеді, ал тұлғаның бұзылысы (психопатия) барлық жағдайда тұрақты көрініп, адамды әлеуметтік бейімсіздікке әкеледі. Бұл белгілер Ганнушкин мен Кербиков сипаттаған критерийлерге сүйенеді; Личко да солар арқылы асқынуды психопатиядан ажыратқан.", "Екінші маңызы — <b>«әлсіз жерді» алдын ала білу<\/b>. Личко бойынша күйзеліс асқынған бітістің «ең әлсіз жеріне» тигенде уақытша ауытқулар, реакциялар туады. Мысалы, гипертимдік жасөспірімге қатаң шектеу ауыр тиеді, ал эмотивті адамға дөрекі сын ауыр тиеді.", "Үшінші маңызы — <b>алдын алу<\/b>. Асқыну жасөспірім шақта айқын көрінеді, ал ұнамсыз жағдай басым болса, ол психикалық бұзылысқа ұласуы мүмкін (Бабаев). Ерте анықталса, отбасы мен мұғалімге кеңес беріп, қауіпті жағдайдың алдын алуға болады.", "Диагностика әдістері: <b>клиникалық сұхбат<\/b> пен <b>бақылау<\/b> (адамның түрлі жағдайдағы әрекеті), Леонгард типтеріне негізделген <b>Шмишек сауалнамасы<\/b>, жасөспірімдерге арналған <b>Личконың патохарактерологиялық диагностикалық сауалнамасы (ПДС)<\/b>. Анамнез бен туыстарынан алынған мәлімет те ескеріледі.", "Нәтижені қолдану: психотерапия мен түзету жұмысын адамның мінез типіне қарай құру (мысалы, үрейлі адамға қолдау, педантқа нақты жоспар), кәсіп таңдауда кеңес беру, отбасына қарым-қатынас стилі туралы ұсыныс беру.", "Сақтық: сауалнама нәтижесі диагноз емес. Асқынуды ауру деп атауға, адамға «таңба» жапсыруға болмайды; бір әдіспен шектелмей, бірнеше дереккөзді салыстыру керек.", "Қорытынды: асқынуды анықтау клиникалық психологқа адамның қай жағдайда «сынатынын» болжауға, қалып пен бұзылысты ажыратуға және көмекті дәл бағыттауға мүмкіндік береді."], "terms": ["мінез асқынуы (акцентуация)", "«әлсіз жер»", "тұлғаның бұзылысы (психопатия)", "Шмишек сауалнамасы", "Личконың ПДС-ы", "клиникалық сұхбат"], "tip": "Асқыну мен тұлға бұзылысының айырмашылығын міндетті түрде атаңыз: асқыну кейбір жағдайда ғана көрінеді, бұзылыс барлық жағдайда тұрақты және бейімсіздікке әкеледі.", "src": "Бабаев, 19-дәрісбаян (5-бөлім); Маклаков, 25.2; Немов, 22.5; Крысько, 158–159 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#adister", "label": "Тұлға психологиясы · Тұлғаны зерттеу әдістері"}}, "Q66": {"n": 66, "id": "Q66", "level": "hard", "topic": 6, "q": "Сенсорлық депривация жағдайында адам психикасында болатын өзгерістерді талдаңыз.", "plan": ["<b>Сенсорлық депривация<\/b> — сезім мүшелері мен ми қалыпты жұмыс істеуге жеткілікті ақпарат ала алмайтын жағдай; адам сыртқы және ішкі ортадан келетін әдеттегі тітіркенуден айырылады (Немов).", "Салдары ұзақтығына байланысты. <b>Қысқа<\/b> депривация, мысалы, қатты шаршағаннан кейін, тіпті жағымды, босаңсытатын болып сезілуі мүмкін. <b>Ұзаққа созылған<\/b> депривацияны адам өте ауыр көтереді.", "Ұзақ депривациядағы өзгерістер: <b>галлюцинациялар<\/b>, мазасыз ойлар, қорқыныш пен үрей, мінез-құлықтың бұзылуы (Немов). Лурия Хэббтің бақылауын келтіреді: тітіркенуі күрт шектелген адамдарда психикалық бұзылыстар мен галлюцинациялар пайда болған. Хэббтің зертханасында студенттер жарықты ғана өткізетін көзілдірік, қолғап пен жең киіп, бір сарынды шу естіліп тұрған шағын бөлмеде жатқан; көбі екі-үш күннен артық шыдамаған, кейбіріне бейнелер көрінген.", "Бабаев бұл өзгерістердің ретін сипаттайды: тұрақты ақпарат көзінен айырылған адам алдымен мүлгіп, ұйқыға кетеді, кейін төзгісіз күйзеліске түседі.", "Механизмі (Лурия): мидың сергек жұмыс істеуі үшін <b>ретикулярлық формация<\/b> арқылы келетін тұрақты белсендіру керек, ал оның негізгі көзі — сезім мүшелерінен келетін қозу. Ақпарат тоқтаса, ми тонусы түседі. Галлюцинациялар жетпей тұрған тітіркенудің орнын белгілі бір дәрежеде толтырады.", "Даму үшін маңызы: Бабаев бойынша ерте жастан көрмейтін және естімейтін бала арнайы оқытылмаса, оның психикалық дамуы күрт тежеледі. Демек түйсіктер психиканың қалыптасуына да қажет.", "Ұсыныстар: оқшау жағдайда (ұзақ жалғыз қалғанда, аурухана төсегінде) күн тәртібін сақтау, әртүрлі сезімдік әсер беру (дыбыс, жарық, қозғалыс, сөйлесу), көру мен есту кемістігі бар балаға ерте бастан арнайы оқыту ұйымдастыру.", "Қорытынды: миға түйсіктер ауа сияқты үнемі қажет. Адамның <b>сенсорлық саласы<\/b>, яғни түйсіктерінің жиынтығы неғұрлым бай болса, ол өмірге соғұрлым жақсы бейімделеді (Немов). Сенсорлық депривация түйсіктің тек таным көзі емес, психиканың қалыпты жұмысының шарты екенін дәлелдейді."], "terms": ["сенсорлық депривация", "галлюцинация", "ретикулярлық формация", "ми тонусы", "сенсорлық сала"], "tip": "Қысқа және ұзақ депривацияның әсерін бөлек айтыңыз: біріншісі босаңсытуы мүмкін, екіншісі психиканы бұзады.", "src": "Түйсік және қабылдау сайты, 1-тарау; Бабаев, 10-дәрісбаян; Немов (сайт бойынша); Лурия, «Нейропсихология негіздері» (мидың тонусын реттейтін блок). Хэбб зертханасындағы тәжірибенің егжей-тегжейі курс дереккөздерінде жоқ — жалпы психология әдебиеті", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s01-role", "label": "Түйсік және қабылдау · 1-тарау «Түйсіктің таным мен өмірдегі рөлі»"}}, "Q67": {"n": 67, "id": "Q67", "level": "hard", "topic": 13, "q": "Кейс: Бала жаңа тапсырманы орындау кезінде тез жалыққыш, бірақ қозғалысы шапшаң әрі қарым-қатынасқа тез түседі. ЖЖЖ типі мен темпераментін анықтаңыз.", "plan": ["Жағдаят: баланың қимылы шапшаң, адамдармен тез тіл табысады, бірақ жаңа тапсырмаға кіріскенде тез жалығады. Бұл белгілер психикалық әрекеттің динамикасына, яғни темпераментке қатысты.", "Теория: Павлов бойынша темперамент жүйке жүйесінің типіне негізделеді. Тип үш қасиеттен құралады: қозу мен тежелудің <b>күші<\/b>, <b>теңгерімділігі<\/b> және <b>қозғалғыштығы<\/b>.", "Талдау: шапшаң қимыл мен тез тіл табысу — жүйке процестерінің жоғары <b>қозғалғыштығы<\/b> мен күшінің белгісі. Ашуланшақтық, ұстамсыздық айтылмаған, сондықтан қозу мен тежелу теңгерімді деп болжаймыз.", "Қорытынды: ЖЖӘ типі — күшті, теңгерімді, қозғалғыш; темпераменті — <b>сангвиник<\/b>. Бабаев сангвиникті көпшіл, жаңа жағдайға тез бейімделетін, бір істен екіншісіне оңай ауысатын адам деп сипаттайды; Крысько бойынша байыпты мақсат болмаса, оның қызығушылығы тұрақсыз, үстірт болып кетеді. Тез жалығу осыдан.", "Холерикпен ажырату: холерик те шапшаң әрі белсенді, бірақ ол ұстамсыз, қызба, ал қызығуы тұрақтылау, зейінін ауыстыруы қиындау (Бабаев). Бұл балада ашушаңдық емес, тез ауысу басым — сондықтан сангвиникке жақын.", "Тексеру әдістері: ұзақ уақыт ойында, сабақта <b>бақылау<\/b>; ата-ана мен мұғалімнен сұрау; жүйке жүйесінің күшін анықтайтын <b>теппинг-тест<\/b> (Ильин); балаларға арналған <b>Айзенк сауалнамасы<\/b> (экстраверсия мен эмоциялық тұрақтылық). Таза типтер сирек, сондықтан бір байқаумен қорытынды жасамаймыз.", "Ұсыныс (Бабаев кеңесі бойынша): сангвиник баланы жаңа, қызықты, күш жұмсауды талап ететін істерге үнемі қосып отыру, мақтауды үзбеу. Бірсарынды тапсырманы шағын бөлікке бөліп, әр бөлікке жаңалық қосу, бастаған ісін аяқтауға үйрету.", "Қорытынды: жақсы не жаман темперамент жоқ. Мұғалімнің міндеті — баланың тез бейімделу, көпшілдік сияқты күшті жағын пайдаланып, тұрақсыздығын тәрбие арқылы теңестіру."], "terms": ["ЖЖӘ типі", "күші, теңгерімділігі, қозғалғыштығы", "сангвиник", "холерикпен ажырату", "теппинг-тест"], "tip": "Тип атауын бірден айтпаңыз: алдымен жағдаяттағы әр белгіні жүйке қасиетіне (күш, теңгерім, қозғалғыштық) байлап, содан кейін қорытынды жасаңыз.", "src": "Бабаев, 18-дәрісбаян (2–4-бөлім); Маклаков, 24.3–24.4; Немов, 21.2, 21.5; Крысько, 150–153 б.", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#temperament", "label": "Тұлға психологиясы · Темперамент бөлімі"}}, "Q68": {"n": 68, "id": "Q68", "level": "hard", "topic": 4, "q": "Тұлғаның деструктивті іс-әрекетінің мотивтерін диагностикалау алгоритмін ұсыныңыз.", "plan": ["Міндетті анықтау: <b>деструктивті іс-әрекет<\/b> — адамның өзіне, өзгелерге не заттарға зиян келтіретін әрекеті (агрессия, бұзақылық, өзіне зиян келтіру). Диагностиканың мақсаты — адамды айыптау емес, әрекеттің артындағы <b>мотивті<\/b> табу: дәл сол қылықты әртүрлі түрткі тудыруы мүмкін.", "Теориялық негіз: мотив — ұғынылған қажеттілік, адамды әрекетке итермелейтін ішкі күш (Крысько). Мотивтер саналы да, бейсаналы да болады, адам өз қылығының шын себебін көбіне айта алмайды (Бабаев). Сондықтан бір әдіспен шектелмей, бірнеше әдісті қатар қолдану керек.", "<b>1-қадам — бақылау және әңгіме.<\/b> Деструктивті қылық қашан, қай жерде, кімнің қасында пайда болатынын тіркеу; адаммен және оны жақсы білетіндермен (ата-ана, мұғалім) әңгімелесу. Құжаттарды (мінездеме, жазбалары) талдау қосымша дерек береді.", "<b>2-қадам — фрустрация мен қажеттіліктерді тексеру.<\/b> Фрустрация — мақсатқа жетуге кедергі болғанда туатын эмоциялық жауап; ол жиі қайталанса, агрессивтілік, ызақорлық бекуі мүмкін. Қандай қажеттілік қанағаттанбай тұрғанын (қауіпсіздік, қарым-қатынас, сыйластық) анықтау керек.", "<b>3-қадам — стандартталған әдістемелер.<\/b> Агрессияның түрлерін бағалау үшін Басс–Дарки сауалнамасы, фрустрацияға жауап түрін анықтау үшін Розенцвейгтің фрустрациялық суреттер тесті, мотивтің өзін емес, оған әсер ететін мінез ерекшелігін білу үшін Шмишек сауалнамасы (қосымша дерек) қолданылады.", "<b>4-қадам — проективті әдістер.<\/b> Адам бір нәрсені ойдан шығарғанда, суреттегенде өз ішкі күйін соған «көшіреді» (проекция). Аяқталмаған сөйлемдер әдістемесі, тақырыптық апперцепция тесті (ТАТ) адам ашық айтпайтын мотивтерді байқатады.", "<b>5-қадам — деректерді жинақтау.<\/b> Нәтижелерді салыстырып, жетекші мотивті бөліп шығару: мысалы, өзін-өзі бекіту, кек алу, топқа қабылдану, психологиялық қорғаныс (кінәні басқаға көшіру). Бір тесттің нәтижесіне қарап қорытынды жасамау.", "Қорытынды: алгоритм «бақылау → әңгіме → тест → проективті әдіс → жинақтау» тізбегінен тұрады. Анықталған мотивке қарай түзету жұмысы жоспарланады, ал қауіпті жағдайда (өзіне не өзгеге зиян келтіру қаупі) маман дереу дәрігерге, психиатрға жібереді."], "terms": ["деструктивті іс-әрекет", "мотив", "фрустрация", "проективті әдістер", "психологиялық қорғаныс"], "tip": "Алгоритмді нөмірленген қадамдармен айтыңыз және әр қадамда бір нақты әдісті атаңыз; «тест жүргіземін» деп жалпылама айту жеткіліксіз.", "src": "Тұлға сайты, «Бағыттылық және мотивация», «Зерттеу әдістері» (Крысько, 146–147 б.; Немов, 118–120 б.); Эмоция сайты, 10, 12-тарау; Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#adister", "label": "Тұлға · «Тұлғаны зерттеу әдістері» бөлімі"}}, "Q69": {"n": 69, "id": "Q69", "level": "hard", "topic": 11, "q": "Психосоматикалық аурулардың пайда болуындағы эмоционалдық репрессияның (ығыстырудың) рөлін талдаңыз.", "plan": ["<b>Феномен<\/b>: <b>психосоматикалық<\/b> (Немовта — психогендік, стрессогендік) аурулар — ұзаққа созылған эмоциялық күймен байланысты дене аурулары. Қазіргі медицина оларды шын ауру деп таниды (Немов).", "<b>Механизмі<\/b>: эмоция кезінде симпатикалық жүйке жүйесі жүректі жиілетеді, қан қысымын көтереді, қанға адреналин шығарады. Бұл дайындық қысқа уақытқа арналған. Толғаныс шамадан тыс ұзақ әрі күшті болса, ағзаның жұмысы бұзылып, адам ауруға шалдығуы мүмкін (Бабаев).", "Аствацатуровтың пікірін Бабаев пен Маклаков келтіреді: қорқыныш жүрекке, ашу бауырға, жабырқау асқазанға әсер етеді. Бұл — тарихи пікір, оны диагноз қою үшін қолдануға болмайды.", "<b>Ығыстыру<\/b> — Бабаев бойынша психологиялық қорғаныстың ең әмбебап әдісі: адам ауыр толғанысты ойланбастан санадан шығарып тастайды. Фрейдтің идеясы бойынша ауыр естеліктер санадан бейсаналыққа итеріледі.", "<b>Талдау<\/b>: эмоция бірнеше компоненттен тұрады — толғаныс, дене өзгерісі, экспрессия. Ығыстыруда адам эмоцияны сезінуден және сыртқа білдіруден бас тартады, бірақ дене өзгерісі ерікке бағынбайды. Сөйтіп эмоция «жасырын» күйде денеде ұзақ сақталып, стрестің қарсыласу, кейін қалжырау фазасына жетуі мүмкін. Бұл — психоаналитикалық түсіндіру, оқулықтарда тікелей дәлелденген заң ретінде берілмейді.", "<b>Психологтың іс-әрекеті<\/b>: 1) клиенттің дене шағымдарына («асқазаным ауырады», «ұйқым жоқ») назар аудару; 2) ауруды анықтамай, міндетті түрде дәрігерге жіберу; 3) эмоциялық жағымен жұмыс — толғанысты атауға, сөзбен не суретпен білдіруге үйрету; 4) стресті бағалауды өзгерту.", "<b>Әдістемелер<\/b>: эмоцияны тануға және атауға қиналуды (алекситимия) Торонто алекситимия шкаласымен, мазасыздықты Спилбергер–Ханин шкаласымен бағалауға болады. Эмоцияның дене көрсеткіштерін физиологиялық әдістер (тері-гальваникалық реакция, жүрек соғуы) тіркейді.", "Қорытынды: дене мен психиканың байланысы екі жақты — басылған эмоция ауруға жол ашуы мүмкін, ал «сөз де емдейді»: эмоциялық күйдің жақсаруы сауығуды жеделдетеді (Маклаков)."], "terms": ["психосоматикалық (психогендік) ауру", "ығыстыру", "психологиялық қорғаныс", "вегетативтік жүйке жүйесі", "стресс"], "tip": "Психологтың ауруды анықтамайтынын және дене шағымында клиентті дәрігерге жіберетінін міндетті түрде айтыңыз; ығыстырудың әсерін «дәлелденген себеп» емес, түсіндірме ретінде ұсыныңыз.", "src": "Бабаев, 15-дәрісбаян (психологиялық қорғаныс), 17-дәрісбаян; Маклаков, 16.2; Немов, 24.2; Ес сайты, 11-тарау (Фрейд, ығыстыру)", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s05-health", "label": "Эмоция және сезім · 5-тарау: ұзаққа созылған эмоция және денсаулық"}}, "Q70": {"n": 70, "id": "Q70", "level": "hard", "topic": 5, "q": "Соматикалық стационардағы пациентпен перцептивті коммуникация құру моделін әзірлеңіз.", "plan": ["Жағдай: соматикалық стационардағы науқас ауырып жатыр, қорқады, дәрігер мен психологқа сенуі-сенбеуі белгісіз. Қарым-қатынастың <b>перцептивтік жағы<\/b> — адамдардың бірін-бірі қабылдап, түсінуі — мұнда ең маңызды: маман науқасты дұрыс түсінбесе, ақпарат та, ықпал да нәтиже бермейді.", "Теориялық негіз: адам туралы бейне аз ғана белгіден тез құралады, сондықтан қателер жиі болады. <b>Алғашқы әсер<\/b>, <b>гало әсері<\/b>, <b>стереотиптер<\/b> (мысалы, «қарт адам бәрібір түсінбейді») және <b>бітіс таңу<\/b> — өз қасиеттерімізді басқаға телу (Бабаев, Немов) бейнені бұрмалайды.", "<b>1-кезең — алғашқы танысу.<\/b> Науқасқа өзін таныстыру, оның атын атау, үстінен төне қарамай, қасына отыру. Алғашқы әсер бүкіл кейінгі қатынасты бояйтындықтан, маман асықпай, ашық әрі сабырлы сөйлеуі керек.", "<b>2-кезең — науқасты «оқу».<\/b> Сөзіне ғана емес, вербалды емес белгілерге назар аудару: ым, қимыл, дауыс ырғағы, үнсіздік. Қатты ауырған адамның тұйықтығын «мінезі ауыр» деп бағаламау керек. Мұны <b>негізгі (фундаменталды) атрибуция қатесі<\/b> дейді: басқа адамның әрекетін оның мінезімен түсіндіріп, жағдайдың (ауру, ауырсыну, қорқыныш) әсерін елемеу.", "<b>3-кезең — түсінудің тетіктерін іске қосу.<\/b> <b>Эмпатия<\/b> — өзгенің күйі мен сезімін түсініп, бірге сезіне білу; <b>идентификация<\/b> — өзіңді оның орнына қойып көру; <b>рефлексия<\/b> — маманның өзі науқасқа қандай әсер қалдырып отырғанын ойлауы.", "<b>4-кезең — кері байланыс.<\/b> Түсінгенін науқастың өз сөзімен қайталату («Сізді дұрыс түсіндім бе: сіз операциядан емес, наркоздан қорқасыз ба?»). Бұл маманға науқас туралы құрған бейнесін тексеруге көмектеседі, ал науқасқа «мені тыңдады» деген сезім береді.", "<b>5-кезең — бейнені уақыт бойы тексеру.<\/b> Адамды бір сәтте емес, әртүрлі жағдайда, біраз уақыт бақылап барып бағалау; өз пікіріңді басқа мамандардың (дәрігер, медбике) пікірімен салыстыру (Түйсік және қабылдау сайты, 20-тарау).", "Қорытынды: модель «танысу → бақылау → эмпатия мен рефлексия → кері байланыс → тексеру» тізбегінен тұрады. Психолог ауруға диагноз қоймайды; ол науқастың эмоциялық күйін түсініп, оның дәрігермен ынтымақтасуына жағдай жасайды."], "terms": ["перцептивтік коммуникация", "эмпатия", "идентификация", "рефлексия", "алғашқы әсер", "атрибуция қатесі"], "tip": "Модельді кезеңдерге бөліп айтыңыз және әр кезеңде қабылдаудың қай қатесінен сақтанатыныңызды атаңыз.", "src": "Түйсік және қабылдау сайты, 20-тарау (Немов, Крысько); Бабаев, 7–8-дәрісбаян; Тұлға сайты, «Әлеуметтік сипаттамалар»", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s20", "label": "Түйсік және қабылдау · 20-тарау «Адамның адамды қабылдауы»"}}, "Q71": {"n": 71, "id": "Q71", "level": "hard", "topic": 9, "q": "Ойлаудың клиникалық бұзылыстары мен оларды бағалау жолдарын сипаттаңыз.", "plan": ["Ойлау бұзылысын екі жақтан зерттейді. <b>Патопсихология<\/b> (Б. В. Зейгарник) психикалық аурулардағы ойлаудың өзгерісін сипаттайды, <b>нейропсихология<\/b> (А. Р. Лурия) мидың қай бөлігі зақымданғанда ойлаудың қай буыны бұзылатынын көрсетеді. Психолог диагноз қоймайды: бұзылыстың түрін сипаттап, тетігін түсіндіреді.", "Зейгарник ойлау бұзылыстарын үш топқа бөледі. Бірінші топ — <b>операциялық жағының бұзылуы<\/b>. Жалпылау деңгейі төмендейді: адам заттарды нақты, тұрмыстық белгісі бойынша топтайды («мысық пен тышқан бірге, өйткені мысық тышқанды ұстайды»). Не жалпылау бұрмаланады: адам мәнсіз, кездейсоқ белгілерге сүйенеді.", "Екінші топ — <b>динамикасының бұзылуы<\/b>. <b>Лабильділікте<\/b> ой тұрақсыз, секірмелі болады: дұрыс шешім мен мағынасыз шешім кезектесіп келеді. <b>Инерттілікте<\/b> адам бір ойға, бір тәсілге жабысып, келесісіне ауыса алмайды.", "Үшінші топ — <b>мотивациялық-тұлғалық жағының бұзылуы<\/b>. <b>Әртүрлі жазықтықта ойлауда<\/b> адам бір тап
