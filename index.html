сырманы бірде мәнді, бірде кездейсоқ, бірде жеке талғамы бойынша шешеді. <b>Резонерлікте<\/b> ұсақ мәселе туралы мағынасыз ұзақ ой толғайды. <b>Сыншылдық бұзылғанда<\/b> өз қатесін байқамайды, түзетуге тырыспайды.", "Психиатрияда ойдың ағымы мен мазмұнын бөлек қарайды. Ағымы бұзылса, ой тым тездейді не баяулайды, бір ойға жабысып қалады, сөйлемдер бір-бірімен байланыспайды. Мазмұны бұзылса, адамда сандырақ не еріксіз мазалайтын ойлар пайда болады.", "Лурия ойлауды кезеңдерден тұратын әрекет деп қарайды: шартты бағдарлау, жоспар таңдау, операция, нәтижені тексеру. <b>Маңдай бөліктері<\/b> зақымданса, адам шартты талдамай бірден жауап береді, нәтижені тексермейді, қатесін байқамайды. <b>Төбе-шүйде бөлігі<\/b> зақымданса, жоспар мен сыншылдық сақталады, тек кеңістіктік біріктіру бұзылады: адам Коос текшелерін қалай қоюды таппай, қайта-қайта сынап көреді.", "Бағалау әдістері: заттарды <b>топтастыру<\/b>, <b>«артығын алып таста»<\/b>, ұғымдарды салыстыру, <b>мақал-мәтелдің ауыспалы мағынасын<\/b> түсіндіру, <b>пиктограмма<\/b> (Зейгарник әдістемелері); көрнекі ойлау үшін Коос текшелері (Лурия). Ойлаудың жалпы дамуын интеллект тесттері — Векслер, Равен тесттері бағалайды (Немов).", "Бағалағанда тек жауаптың дұрыс-бұрысына емес, <b>шешу жолына<\/b> қараймыз: адам қандай белгіге сүйенді, тапсырманы ұстап тұра ала ма, қатесін байқай ма, көмектен кейін түзете ме. Қорытынды: психолог бұзылыстың операциялық, динамикалық не мотивациялық жағында екенін сипаттайды, ал диагнозды дәрігер қояды."], "terms": ["жалпылау деңгейінің төмендеуі", "лабильділік және инерттілік", "резонерлік", "сыншылдықтың бұзылуы", "топтастыру әдістемесі", "пиктограмма"], "tip": "Ойлау бұзылысын «ақылы кем» деп жалпылама айтпаңыз: Зейгарниктің үш тобын атап, әрқайсысына бір мысал мен оны көрсететін әдістемені қосыңыз.", "src": "Б. В. Зейгарник жіктемесі мен әдістемелері — жалпы клиникалық психология (курс кітаптарында жоқ); Лурия, «Нейропсихология негіздері», III бөлім, VI тарау «Ойлау»; Ойлау және сөйлеу сайты, 8-тарау; Немов, I бөлім, 13-тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s08-methods", "label": "Ойлау және сөйлеу · 8-тарау: Ойлауды қалай зерттейді?"}}, "Q72": {"n": 72, "id": "Q72", "level": "hard", "topic": 8, "q": "Адамның танымдық процестеріндегі зейіннің доминанталық функциясын (А. Ухтомский) клинико-психологиялық жағдаятта негіздеңіз.", "plan": ["<b>Доминанта<\/b> (Ухтомский) — мидағы уақытша үстем қозу ошағы. Ол осы сәтте жүйке орталықтарының қалай жұмыс істейтінін анықтап, мінез-құлыққа бағыт береді. Ухтомский зейіннің бір нысанға бағытталуын, шоғырлануын және таңдамалылығын осымен түсіндірді.", "Доминантаның қасиеттері: қозғыштығы жоғары; бөгде импульстерді өзіне жинап, <b>күшейе түседі<\/b>; басқа орталықтарды тежейді; <b>тұрақты<\/b> және <b>инертті<\/b> — тітіркендіргіш тоқтаса да сақталады (Маклаков). Ол тек тітіркендіргіштің күшінен емес, жүйке жүйесінің ішкі күйінен және өткен тәжірибенің іздерінен де туады (Маклаков, Бабаев).", "Жағдаят: жол апатынан кейін екі ай өтсе де, студент апат туралы ойдан арыла алмайды. Кез келген көлік дыбысы оны сол сәтке қайтарады; кітап ашса да, ойы апатқа оралады, сабаққа зейін қоя алмайды, айналасындағы қуанышты оқиғаларды байқамайды.", "Талдау: апат туралы ой мидағы <b>қуатты ошақ<\/b> құрған. Бөгде әсерлер оны әлсіретпей, керісінше оған «құйылып», күшейтеді. Оқу міндетіне сай әлсіз ошақ <b>теріс индукция<\/b> бойынша тежеліп қалады. Маклаков мұны <b>ішкі алаңдаушылықтың<\/b> тетігі дейді: күшті сезім өз «доминантасын» құрады да, оқудың ошағы соның көлеңкесінде қалады.", "Клиникалық жағдаятта ең маңыздысы — доминантаның <b>инерттілігі<\/b>. Себеп өтіп кетсе де, ошақ сақталып, мінез-құлықтың қалыпты реттелуін бұзуы мүмкін. Бұрынғы әсерлердің іздері мида «әлеуетті доминанталар» болып сақталады; олар бір-бірімен үйлеспесе, доминанта ауру процесін ұйымдастырып, күшейтіп жіберуі мүмкін (Маклаков). Сондықтан психолог мұны «жалқаулық» деп бағаламайды.", "Тексеру: әңгімелесу арқылы ошақты не тудырғанын анықтаймыз, ал зейіннің қай қасиеті бұзылғанын әдістемемен өлшейміз: тұрақтылықты — <b>Бурдонның түзету сынамасымен<\/b>, бөліну мен ауысуды — Шульте кестесімен не <b>Горбовтың қызыл-қара кестесімен<\/b>. Өнімділік қай минутта құлап, қате қашан көбейетініне қараймыз.", "Ұсыныстар: ошақты қайта-қайта қоздыратын әсерлерді азайту; қорқыныш сияқты жағымсыз күйзелісті жеңілдету (Маклаков, Бабаев) — мысалы, тыныс алу жаттығуы, студенттің ойын айтқызу, уайымға арналған уақытты шектеу. Ырықты зейінді мақсат пен сөз басқаратындықтан (Бабаев), студентпен бірге нақты, орындауға болатын мақсат пен қадамдық жоспар құрамыз; білімге тұрақты қызығуды тәрбиелеу — алаңдаушылықпен күрестің маңызды шарты.", "Қорытынды: доминанта бір жағынан шоғырланудың негізі — ісіне беріліп кеткен ғалым айналасын байқамайды; екінші жағынан, инерттілігі арқылы ішкі алаңдаушылық пен мазасыз ойдың тетігі. Психолог диагноз қоймайды: феноменді атап, тетігін түсіндіреді, күй ұзаққа созылса, маманға жібереді."], "terms": ["доминанта", "инерттілік", "теріс индукция", "ішкі алаңдаушылық", "әлеуетті доминанта", "Бурдон сынамасы"], "tip": "Доминантаны индукция заңымен шатастырмаңыз: индукция — бір сәттің суреті, ал доминанта бөгде әсерден күшейіп, ұзақ сақталатын ошақ.", "src": "Зейін сайты, 2, 11, 13 және 15-тараулар; Маклаков, 14-тарау; Бабаев, 9-дәрісбаян; Крысько, 2.12-схема", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s02-dominant", "label": "Зейін · 2-тарау: Ухтомскийдің доминантасы"}}, "Q73": {"n": 73, "id": "Q73", "level": "hard", "topic": 9, "q": "Рефлексивті сөйлеу мен ішкі сөйлеудің тұлғаның өзін-өзі реттеуіндегі рөлін талдаңыз.", "plan": ["<b>Ішкі сөйлеу<\/b> — дауыссыз, өзіне арналған сөйлеу. Оны айналадағылар қабылдамайды, адамның өзі де байқай бермейді; ол тілдесу құралы емес, адамға өзін іштей басқару үшін — ойын бір арнаға салу, өзін ерік күшімен ұстау үшін керек (Немов). <b>Рефлексивті сөйлеу<\/b> деп адамның өз ойы мен әрекетіне қарата айтқан, оны бақылап, бағалайтын сөзін айтамыз: «Тоқта, бұл жол дұрыс емес», «Алдымен шартты оқиын». Бұл термин оқулықтарда тұрақталмаған, сондықтан оны осылай анықтаймыз.", "Ішкі сөйлеу ықшам болады: онда <b>предикативтілік<\/b> бар — тек баяндауыш қалады («Кешігемін!»), сөздер бір-біріне кірігіп қысқарады (агглютинация). Адам не туралы ойлап отырғанын өзі біледі, сондықтан толық сөйлемнің керегі жоқ.", "Шығу тегі (Выготский): мінез-құлықты сөзбен реттеу алдымен ересек пен баланың арасында жүреді. Сосын бала өзіне-өзі дауыстап сөйлейді — <b>эгоцентрлік сөйлеу<\/b>: «Бұл бөлшек сыймайды… онда үлкенін аламын». Ол әрекетті жоспарлайды да, 6–7 жаста ішке көшіп, ішкі сөйлеуге айналады. Гальперин бойынша ақыл-ой әрекеті де дауыстап айтудан ішкі сөйлеуге көшеді.", "Ересекте ішкі сөйлеу өзін-өзі реттеудің негізгі құралы: <b>ерік<\/b> ішкі сөйлеу арқылы жұмыс істейді, адам өзін <b>ішкі сөздік бұйрықтармен<\/b> іске жұмылдырады. Оятқыш шырылдағанда іштей «Тұр! Бүгін бірінші сабақ бар» дейміз. Сөйлеу зейінді, есті, ойлауды іштен реттеп, оларды ырықты етеді.", "Ми тетігі (Лурия): адамның ниеті мен жоспары алдымен сыртқы, кейін ішкі сөйлеудің қатысуымен құралады, ал сөзбен құралған ниетті орындауға <b>маңдай бөліктері<\/b> қатысады. Лурияның сынамасы: «Мен жұдырығымды көтерсем, сіз саусағыңызды көтеріңіз» деп тапсырма береміз. Маңдай бөліктері зақымданған науқас нұсқауды дұрыс қайталайды, бірақ зерттеушінің қимылын көшіріп, жұдырығын көтереді: сөз оның әрекетін реттемейді.", "Рефлексивті сөйлеу реттеудің <b>бақылау буыны<\/b>: адам әрекетін сөзбен жоспарлап, нәтижесін мақсатпен салыстырады. Пиаже бойынша жасөспірімнің жетілген ойлауына <b>рефлексивтік интеллект<\/b> тән: адам өз ойының қалай жүріп жатқанын бақылап, логикасын тексереді (Немов). Емтиханда іштей «асықпа, сұрақты тағы оқы» деген студент асығыс шешімді тежеп, ойланып барып жауап береді.", "Қолдану: баланың өзімен-өзі сөйлеуін тыймау, керісінше онымен көбірек сөйлесу; оқушыға «алдымен…, сосын…» деген өзіне-өзі нұсқау беруді үйрету; қиын іс алдында қадамдарды іштей айтып шығу. Психолог «дауыстап ойлану» әдісімен ойлау мен сөйлеуді бірге зерттейді (Немов).", "Қорытынды: сыртқы сөйлеу эгоцентрлік сөйлеу арқылы ішкі сөйлеуге айналып, адамның өзін басқару құралына айналады. Ішкі сөйлеу ерік пен мотивацияны жүргізеді, ал рефлексивті сөйлеу өз ойын бақылап, түзетуге мүмкіндік береді."], "terms": ["ішкі сөйлеу", "рефлексивті сөйлеу", "эгоцентрлік сөйлеу", "ішкі сөздік бұйрық", "сөйлеудің реттеуші қызметі", "предикативтілік"], "tip": "Рефлексивті сөйлеуді когнитивтік стильдегі «рефлексивті стильмен» шатастырмаңыз; жауаптың өзегі — Выготскийдің «эгоцентрлік сөйлеу ішке көшеді» деген ойы мен Лурия сипаттаған сөйлеудің реттеуші қызметі.", "src": "Ойлау және сөйлеу сайты, 9, 11, 15 және 16-тараулар; Немов, I бөлім, 13-тарау және II бөлім, 14-тарау; Бабаев, 13-дәрісбаян; Лурия, «Нейропсихология негіздері», I бөлім, III тарау және II бөлім, V тарау", "link": {"url": "https://tazhiyeva.github.io/oilau-psikhologiyasy/#s11-inner", "label": "Ойлау және сөйлеу · 11-тарау: Ішкі сөйлеу"}}, "Q74": {"n": 74, "id": "Q74", "level": "hard", "topic": 11, "q": "Фрустрация жағдайындағы агрессия мен қорғаныс механизмдерін еңсеру кейсін шешіңіз.", "plan": ["<b>Кейс<\/b>: студент жазғы тағылымдамаға бару үшін бір жыл шет тілін оқыды. Сұхбат алдында бағдарлама жабылды. Ол үйге келіп, інісіне себепсіз ұрсып тастады, ал досына «ол тағылымдаманың маған керегі де жоқ еді» деді.", "<b>Феномен<\/b>: бұл — <b>фрустрация<\/b>, саналы мақсатқа жетуге кедергі болғанда туатын эмоциялық жауап (Маклаков). Фрустрация кезінде адам ашуға, өшпенділікке, кейіске бейім келеді (Бабаев). Кедергі студенттің кінәсінен емес, бірақ мақсаты күйреді.", "<b>Агрессия<\/b>: ашу кедергіні тудырған нысанға жете алмайды, сондықтан қолы жететін, қауіпсіз нысанға — інісіне бағытталды. Бабаев сипаттайтын <b>ауыстыру<\/b> қорғанысына ұқсайды: қолы жетпеген әрекеттің орнына қолы жететін әрекетке көшу күйзелісті бәсеңдетеді, бірақ мақсат ұмыт қалады.", "<b>Қорғаныс<\/b>: «маған керегі де жоқ еді» деген сөз — Бабаевтағы <b>жаңалау<\/b> (рационализация): қолы жетпеген нәрсенің құнын төмендетіп, көңілін аулау. Бабаевтың мысалындағы бала да қолы жетпеген жүзімді «әлі піспеген, ащы» деп қолын сілтейді. Қорғаныс ішкі тепе-теңдікті сақтайды, бірақ шындықты бұрмалайды.", "<b>Еңсеру алгоритмі<\/b>: 1) эмоцияны атау («ашуланып тұрмын, себебі мақсатым бұзылды»); 2) кідіріс жасап, ашуды кінәсіз адамға төкпеу; 3) кедергіні нақты бағалау; 4) Маклаковтың үш жолының бірін таңдау — кедергіні еңсеру (келесі жылы қайта тапсыру), айналып өту (басқа бағдарламаға өтініш), жаңа мақсат (тілді жұмыста қолдану); 5) келген зиянды түзеу — інісінен кешірім сұрау.", "<b>Даму жағы<\/b>: фрустрацияны бір қалыпты тәсілмен шешу әдетке айналса, мінезде із қалады: біреуде агрессивтілік пен ызақорлық, біреуде бастамасыздық бекиді. Адам өз кемшілігін мойындап, оны жоюға ұмтылса ғана қорғаныс өсуге жол береді (Бабаев).", "<b>Әдістемелер<\/b>: фрустрацияға жауаптың бағытын (өзгеге, өзіне, ешкімге кінә артпау) Розенцвейгтің суреттік фрустрация әдістемесімен, агрессияның түрлерін Басс–Дарки сауалнамасымен анықтауға болады.", "Қорытынды: фрустрацияның өзі қалыпты құбылыс; маңыздысы — одан агрессия мен қорғаныс арқылы «қашу» емес, кедергіні еңсеретін не жаңа мақсат табатын жолды саналы таңдау."], "terms": ["фрустрация", "агрессия", "психологиялық қорғаныс", "ауыстыру", "жаңалау (рационализация)", "фрустрациядан шығудың үш жолы"], "tip": "Кейсті өзіңіз құрасаңыз да, әр қорғаныс механизмін кейіпкердің нақты сөзімен не қылығымен көрсетіңіз, соңында Маклаковтың үш шешімін міндетті түрде атаңыз.", "src": "Маклаков, 16.3; Бабаев, 15-дәрісбаян (психологиялық қорғаныс), 17-дәрісбаян; Немов, 24-тарау", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-frustr", "label": "Эмоция және сезім · 10-тарау: фрустрация (бала мінезі — 12-тарауда)"}}, "Q75": {"n": 75, "id": "Q75", "level": "hard", "topic": 15, "q": "Адамның қабілеттерін дамытудағы генотип пен орта факторларының үлесін салыстырмалы сараптаңыз.", "plan": ["Мәселе: адамның қабілеті тұқым қуалаудан (генотиптен) келе ме, әлде орта мен тәрбиеден бе? Бұл дау Платоннан бері жалғасып келеді. Қазіргі психологияда туа берілетін — қабілеттің өзі емес, <b>нышан<\/b>, яғни ағзаның анатомиялық-физиологиялық ерекшеліктері.", "<b>Генотиптің үлесін<\/b> жақтаушылар: ерте көрінген дарын (Моцарттың музыкалық дарыны 3 жаста, Дина Нұрпейісованың күйшілігі 8 жаста байқалған). Гальтон атақты адамдардың өмірбаянын талдап, қабілет тұқым қуалайды деп қорытты; Бах әулетінен 60-қа жуық музыкант шыққан.", "Бұл көзқарастың әлсіз жағы: әулеттерде баланың ортасы мен тәрбиесі де ортақ. Бабаев Төлеген Момбеков әулетін мысалға алып, бесіктен естіген ән-күй мен үлкендердің музыкалық тәрбиесі болмаса, баланың кім болары белгісіз дейді. Галльдің френологиясы мен ми салмағы бойынша ақылды бағалау да расталмады.", "<b>Ортаның үлесін<\/b> жақтаушылар: Гельвеций тәрбие арқылы дарынды адам өсіруге болады деді. Дәлелдері: қоғамнан тыс өскен «маугли» балалардың адамдық қасиеттері дамымайды; Леонтьев пен әріптестерінің зерттеуі бойынша вьетнамдықтардың дыбыс биіктігін ажырататын естуі жаппай жақсы дамыған, себебі тілінде дыбыс биіктігі сөз мағынасын ажыратады.", "<b>Егіздер әдісі<\/b> екі ықпалды ажыратуға мүмкіндік береді: бір жұмыртқалы егіздердің қабілеттері жай бауырларға қарағанда әлдеқайда жиі сәйкес келеді. Бұл тұқым қуалаудың маңызын көрсетеді, бірақ бір отбасында өскен егіздердің ортасы да ұқсас екенін ескеру керек.", "Байланыс: нышандар <b>көпмәнді<\/b> — бір нышаннан әртүрлі қабілет дамуы мүмкін, ал қайсысы дамитынын іс-әрекет, оқу, қоғамның сұранысы шешеді. Теплов бойынша қабілет тек дамуда өмір сүреді: пайдаланылмаса, ол жоғалады.", "Салыстыру: генотип қабілеттің дамуының <b>шегі мен жеңілдігін<\/b> белгілейді, ал орта сол мүмкіндіктің <b>іске асуын<\/b> шешеді. Бірі екіншісінсіз жұмыс істемейді: жақсы нышан қолайсыз ортада дамымайды, ал нышан әлсіз болса, қабілет баяу дамып, жаттығуды көп қажет етеді.", "Қорытынды: қабілеттің табиғаты <b>биоәлеуметтік<\/b>. Генотип пен орта үлесінің қайсысы көп деген сұрақ әлі толық шешілмеген, бірақ практикада бала нышанын ерте байқап, оған сай іс-әрекет пен қолайлы орта жасау маңызды."], "terms": ["генотип және орта", "нышан", "егіздер әдісі", "көпмәнділік", "биоәлеуметтік табиғат"], "tip": "«Қабілет туа беріледі» деп айтпаңыз: туа берілетін — нышан, ал қабілет іс-әрекетте, ортаның ықпалымен дамиды.", "src": "Бабаев, 20-дәрісбаян (2–3-бөлім); Маклаков, 23.2–23.3; Немов (қабілет тарауы)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qabilet", "label": "Тұлға психологиясы · Қабілеттер бөлімі"}}, "Q76": {"n": 76, "id": "Q76", "level": "hard", "topic": 5, "q": "Тұлғаның «Мен-концепциясының» бұзылуы кезіндегі эмоционалдық-еріктік өзгерістерді сипаттаңыз.", "plan": ["Негізгі ұғым: <b>Мен-тұжырымдама<\/b> — адамның өзі туралы түсініктері мен оларға берген бағаларының жиынтығы (Р. Бернс). Оның үш құрамдасы бар: когнитивтік, эмоциялық және мінез-құлықтық. Мен-тұжырымдама тұтас болғандықтан, бір құрамдасы бұзылса, эмоция мен ерік те өзгереді (Роджерс).", "Бұзылыстың негізгі көрінісі — <b>негативті Мен-тұжырымдама<\/b>: өзіне теріс қатынас, өзін қабылдамау, өзін толымсыз сезіну. Тағы бір түрі — нақты Мен мен идеалды Меннің арасындағы үлкен алшақтық немесе Мен-бейненің тұрақсыздығы, біріздігінің жоқтығы (Розенберг өлшемдері).", "<b>Эмоциялық өзгерістер:<\/b> мұң, жабырқау, мазасыздық басым болады; адам ұят пен кінә сезімін жиі бастан кешеді. Ауыр жағдайда <b>апатия<\/b> (бәріне бей-жай қарау) мен <b>депрессия<\/b> пайда болуы мүмкін. Әлсірететін, яғни астеникалық эмоциялар басым бола бастайды.", "<b>Еріктік өзгерістер:<\/b> бастамасыздық, шешім қабылдай алмау, қиындықтан қашу. <b>Талаптану деңгейі<\/b> бұзылады: өзін төмен бағалаған адам тым жеңіл міндетті таңдайды, ал өзін асыра бағалаған адам шамасы жетпейтін іске кірісіп, сәтсіздіктен сабақ алмайды.", "<b>Фрустрация мен қорғаныс:<\/b> мақсатқа жете алмау фрустрация туғызады, ол агрессияға не енжарлыққа ұласуы мүмкін. Өзін-өзі бағалауды сақтау үшін <b>психологиялық қорғаныс<\/b> іске қосылады: жоққа шығару, ығыстыру, кінәні басқаға көшіру (Бабаев). Бабаев айтқандай, адамның өзіне берген бағасы тым жоғары не тым төмен болса, ішкі жан арпалысы туады.", "Мысал: жұмыстан шығарылған маман «мен ешнәрсеге жарамаймын» деп ойлайды (когнитивтік жағы), өзін жек көреді (эмоциялық жағы), жаңа жұмысқа өтініш бермейді (еріктік, мінез-құлықтық жағы).", "Зерттеу әдістері: Дембо–Рубинштейн өзін-өзі бағалау әдістемесі, Кун–Макпартлендтің «Мен кіммін?» тесті, клиникалық әңгіме және бақылау. Психолог «депрессия» деген диагноз қоймайды: ауыр эмоциялық күйді байқаса, дәрігерге жібереді.", "Қорытынды: Мен-тұжырымдама бұзылғанда эмоция мен ерік бірге өзгереді. Оны қалпына келтіру қарым-қатынастан басталады: шағын табыстарды байқатып, өзін барабар бағалауға үйрету."], "terms": ["Мен-тұжырымдама", "негативті Мен-тұжырымдама", "өзін-өзі бағалау", "талаптану деңгейі", "апатия", "психологиялық қорғаныс"], "tip": "Өзгерістерді екі топқа бөліп айтыңыз (эмоциялық және еріктік) және әрқайсысын Мен-тұжырымдаманың үш құрамдасымен байланыстырыңыз.", "src": "Тұлға сайты, «Тұлға құрылымы» (Немов, 107–109 б.); Психика, ми, сана сайты, 17-тақырып; Эмоция сайты, 10-тарау; Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qurylym", "label": "Тұлға · «Тұлға құрылымы» бөлімі (Мен-тұжырымдама)"}}, "Q77": {"n": 77, "id": "Q77", "level": "hard", "topic": 2, "q": "Клиникалық бақылау мен созылмалы ауруы бар пациентті тексерудегі этикалық нормаларды негіздеңіз.", "plan": ["<b>Жағдай:<\/b> созылмалы ауруы бар науқас ұзақ емделеді, жиі шаршайды, ауруы мен болашағы туралы алаңдайды, тәуелді күйде болады. Сондықтан оны бақылау мен тексеру кезінде зиян келтіру қаупі жоғары, ал этикалық талап та қатаңырақ.", "<b>Теориялық негіз:<\/b> Маклаков оқулығында (Аткинсон мен әріптестерінің «Психологияға кіріспе» кітабынан алынған үзіндіде) сыналушымен жұмыстың үш этикалық принципі аталады: <i>қауіпті азайту<\/i>, <i>ақпараттандырылған келісім<\/i> және <i>құпиялылық<\/i>. Адамдар қатысатын кез келген зерттеуде келісім формасы зерттеудің барысы мен қаупін түсіндіреді, қатысудың ерікті екенін және оны кез келген уақытта тоқтатуға болатынын хабарлайды.", "<b>1-қадам — келісім:<\/b> психолог науқасқа түсінікті тілде не істейтінін, қанша уақыт кететінін, нәтижесі неге керек екенін айтады. Науқас келісім береді, кәмелетке толмаса — ата-анасы не заңды өкілі. Бас тарту емдеуге әсер етпейтіні ескертіледі.", "<b>2-қадам — зиянсыз бақылау:<\/b> клиникалық бақылау науқастың ар-ұятын, жеке шекарасын құрметтеп жүргізіледі, жасырын түсіру мен келісімсіз жазуға жол берілмейді. Бақылаушы тек өзі күткенді көріп қалмау үшін нені тіркейтінін алдын ала белгілейді.", "<b>3-қадам — науқастың күйін ескеру:<\/b> созылмалы ауруда шаршағыштық жоғары, сондықтан тексеру қысқа кезеңдерге бөлінеді, үзіліс жасалады, нашар күйде тексеру кейінге қалдырылады. Әдістемелер сол мақсатқа ғана сай таңдалады: мысалы, зейінді Шульте кестелерімен, есті Лурияның 10 сөз әдістемесімен тексеру; артық тест берілмейді.", "<b>4-қадам — құпиялылық:<\/b> деректер науқастың атынсыз, кодпен сақталады. Нәтиже емдеуші дәрігерге тек ем мақсатында және науқас келісімімен беріледі. Туыстарына, жұмыс орнына науқастың рұқсатынсыз ештеңе айтылмайды.", "<b>5-қадам — кәсіби шекара:<\/b> психолог өз құзыретінен шықпайды: медициналық диагноз қоймайды, ем тағайындамайды. Ол психикалық процестердің ерекшелігін сипаттап, дәрігермен бірге жұмыс істейді. Нәтижені науқасқа қорқытпай, түсінікті әрі шынайы айтады.", "<b>Қорытынды:<\/b> этикалық норма — тексерудің сыртқы шарты емес, оның сапасының кепілі. Науқас өзін қауіпсіз сезінсе, шынайы әрекет етеді, ал деректер сенімді болады. Негізгі ереже — науқасқа зиян келтірмеу және оның құқығын құрметтеу."], "terms": ["ақпараттандырылған келісім", "құпиялылық", "қауіпті азайту", "клиникалық бақылау", "еріктілік"], "tip": "Нормаларды жай тізбектемеңіз: әрқайсысы созылмалы науқастың нақты жағдайында (шаршау, тәуелділік, үрей) неліктен маңызды екенін түсіндіріңіз.", "src": "Маклаков, 1-тарау (1.4, «Психолог жұмысының моральдық принциптері»); «Психологиялық зерттеу әдістері» сайты, 2.2 және 2.4 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s24-human", "label": "Адамдар қатысатын зерттеу · сайттың 2.4-бөлімі"}}, "Q78": {"n": 78, "id": "Q78", "level": "hard", "topic": 14, "q": "Кейс: Пациент өзіне сенімсіз, шешім қабылдаудан қашады және жауапкершілікті басқаға ысырады. Мінез бітісі мен ерік сапасын талдаңыз.", "plan": ["Жағдаят: пациент өзіне сенбейді, шешім қабылдаудан қашады, жауапкершілікті басқаға ысырады. Бұл белгілер мінездің ерік бітістеріне және адамның өзіне қатынасына қатысты.", "Мінез бітістері: <b>сенімсіздік<\/b>, жүрексіздік, <b>дербессіздік<\/b>. Бабаев еркі бос адамды «мінезсіз» деу дұрыс емес дейді: оның да мінез бітістері бар — қорқақтық, жүрексіздік, сенімсіздік; оның әрекеті өз билігінде емес, сыртқы ықпалға тәуелді.", "Ерік сапалары: әлсіз жақтары — <b>батылдық<\/b> (орынды шешімді тез әрі берік қабылдау), <b>дербестік<\/b> (өз сенімі бойынша шешу) және жауапкершілік. Еріктік әрекеттің құрылымында бұл адам <b>түрткілер күресі<\/b> кезеңінде тұрып қалады: Бабаев бойынша шешім қабылдағанда адам әрекеттің бәрі өзіне тәуелді екенін сезеді, яғни жауапкершілік туады — пациент дәл осыдан қашады.", "Жауапкершілікті басқаға ысыру — сыртқы <b>бақылау локусының<\/b> белгісі (Роттер). Бабаев бойынша экстерналдар өз қабілетіне сенімсіз, ісін кейінге қалдыруға бейім, жауапкершілігі кем; ал интерналдар өз қылығына өздері жауап береді. Бақылау локусы тәрбиеде қалыптасады.", "Мүмкін себептер: Бабаев сипаттаған «икемі кем» мінез типінде адам балалықта артық қамқорлықтан дербестікке үйренбейді, сондықтан кез келген кедергіден қорқып, оны айналып өтуге тырысады. Мұндай белгілер Леонгардтың үрейлі типіне ұқсауы мүмкін, бірақ бұл — тексеруді қажет ететін болжам, диагноз емес.", "Әдістемелер: <b>клиникалық сұхбат<\/b> (өмір тарихы, отбасындағы тәрбие), бақылау, мінез асқынуын анықтайтын <b>Шмишек сауалнамасы<\/b>, бақылау локусын өлшейтін сауалнама (Роттер шкаласы негізіндегі «субъективті бақылау деңгейі» әдістемесі), өзін-өзі бағалауды зерттеу (Дембо–Рубинштейн әдістемесі). Үрей не көңіл-күй бұзылысының белгілері болса, психиатрға жіберу керек.", "Ұсыныстар: шешімді шағын қадамнан бастау (күнделікті ұсақ таңдауларды өзі жасау); жауапкершілікті біртіндеп арттыру; әр шешімнің нәтижесін бірге талдап, табысын атап отыру; «бәрі басқаға байланысты» деген сенімді нақты мысалмен тексеру. Бабаев айтқандай, ерік сапалары тұрақты іс-әрекет пен өзін-өзі тәрбиелеуде қалыптасады.", "Қорытынды: мәселенің өзегі — ерік сапаларының (батылдық, дербестік) әлсіздігі және сыртқы бақылау локусы. Мінез өмір бойы өзгере алады, сондықтан психологтың мақсаты — пациентке өз шешіміне жауап беру тәжірибесін жинауға көмектесу."], "terms": ["мінездің ерік бітістері", "батылдық, дербестік", "түрткілер күресі, шешім қабылдау", "бақылау локусы", "икемі кем мінез типі"], "tip": "Мінез бітісін (сенімсіздік) ерік сапасынан (батылдықтың әлсіздігі) бөлек атап, екеуінің байланысын шешім қабылдау кезеңі арқылы көрсетіңіз.", "src": "Бабаев, 16-дәрісбаян (ерік сапалары, бақылау локусы), 19-дәрісбаян (3–4-бөлім); Маклаков, 15.5, 25.1–25.2", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#minez", "label": "Тұлға психологиясы · Мінез бөлімі"}}, "Q79": {"n": 79, "id": "Q79", "level": "hard", "topic": 4, "q": "Н. Бернштейннің қимыл-қозғалысты реттеу теориясын моторлы реабилитацияда қолдану мүмкіндігін талдаңыз.", "plan": ["Мәселе: жарақаттан не инсульттен кейін қозғалыс бұзылған науқасқа қимылды қайта үйрету — шын мәнінде жаңа дағды қалыптастыру. Н.А. Бернштейннің қозғалысты реттеу теориясы осы процестің заңдылықтарын түсіндіреді.", "<b>Кері байланыс қағидасы.<\/b> Буындардың еркіндік дәрежесі тым көп, сондықтан қозғалысты тек мидан баратын бұйрықпен басқару мүмкін емес. Қозғалыс аяқ-қолдың орны мен бұлшық ет күйі туралы сигналдар арқылы үнемі түзетіледі (рефлекс сақинасы). Реабилитацияда науқасқа қимылының нәтижесін көруге, сезуге мүмкіндік беру керек: айна, бейнежазба, маманның сөзі.", "<b>Қозғалыс міндеті.<\/b> Бернштейн бойынша қимылды мидағы нәтиженің бейнесі — <b>қажетті болашақтың моделі<\/b> басқарады. Бір нәтижеге әртүрлі қимылмен жетуге болады: адам оң қолмен де, сол қолмен де жаза алады, қолтаңбасы сақталады (Лурия). Демек жаттығуды «қолды 30 градусқа көтер» емес, нақты заттық міндет арқылы құрған тиімді: «кесені ал», «түймені сал». Бұзылған жолдың орнына мақсатқа апаратын жаңа жол қалыптасады.", "<b>Реттеу деңгейлері (A–E).<\/b> Жаңа, күрделі қозғалысты жоғары, саналы деңгей басқарады; ол дағдыға айналған сайын басқару төменгі, бейсаналы деңгейлерге ауысады. Сондықтан алғашқы кезеңде науқас қимылды баяу әрі саналы бақылаумен орындайды, зейіні қатты жұмсалып, тез шаршайды. Сабақты қысқа әрі жиі өткізген дұрыс.", "<b>Дағдының қалыптасу кезеңдері<\/b> (Бернштейн): алдымен адам қимылмен танысып, оны алғаш меңгереді; сосын қимыл автоматтанады; соңында ол тұрақтанып, кедергіге де бұзылмайтын болады. Әр кезеңге өз жаттығуы керек: соңғы кезеңде қимылды әртүрлі жағдайда (отырып, тұрып, шаршаған кезде) қайталау.", "<b>Бұзылыстың түрін ескеру<\/b> (Лурия): постцентральдық аймақ зақымдалса, <b>кинестетикалық апраксия<\/b> пайда болады — қолға керекті қалып беру қиындайды, сондықтан көру арқылы бақылауды күшейтеді. Премоторлық аймақ зақымдалса, <b>кинетикалық апраксия<\/b> туады — қимылдар бір «кинетикалық әуенге» бірікпейді; оны ырғақпен, санап, сөзбен сүйемелдеп біріктіреді.", "<b>Әдістер мен алгоритм:<\/b> 1) нейропсихологиялық тексеру (Лурияның қимыл сынамалары: қол қалпын қайталау, қимылдар тізбегін орындау); 2) науқас үшін маңызды заттық мақсат таңдау; 3) кері байланыс беру; 4) біртіндеп қиындату; 5) нәтижені тіркеп, жоспарды түзету. Жұмыс дәрігермен, реабилитологпен бірге жүргізіледі.", "Қорытынды: Бернштейн теориясы реабилитацияға үш нәрсе береді — кері байланысқа сүйену, жаттығуды мақсат арқылы құру және дағдыны саналы бақылаудан автоматтылыққа біртіндеп өткізу."], "terms": ["кері байланыс (рефлекс сақинасы)", "қажетті болашақтың моделі", "қозғалысты реттеу деңгейлері", "дағдының автоматтануы", "кинестетикалық апраксия", "кинетикалық апраксия"], "tip": "Теорияның әр қағидасынан кейін «реабилитацияда бұл нені білдіреді?» деп бір нақты жаттығу атаңыз — талдау сонда ғана қолданбалы болады.", "src": "Психика, ми, сана сайты, 21-тақырып (Немов, 5.6); Лурия, «Нейропсихология негіздері» (Бернштейн, қимыл бұзылыстары); Бабаев, 6-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#aragatynas", "label": "Психика, ми, сана · Бернштейн бойынша қозғалысты реттеу деңгейлері"}}, "Q80": {"n": 80, "id": "Q80", "level": "hard", "topic": 8, "q": "Экстремалды жағдаяттағы адамның зейін көлемі мен шоғырлануының өзгерістерін сипаттаңыз.", "plan": ["Ұғымдар: <b>зейін көлемі<\/b> — бір мезгілде анық қабылданатын нысандар саны, ересекте ол әдетте 5±2 (Маклаков), Немов бойынша 3–7 нысан. <b>Шоғырлану<\/b> — зейіннің бір нысанға жиналу күші мен дәрежесі; оның екі жағы бар: нысанға ену және қалғанынан бас тарту.", "Экстремалды жағдай (өрт, жол апаты, жер сілкінісі) күшті эмоция мен стресс тудырады. Бабаев ажырататын сергектік күйлері бойынша тиімді зейін тек сабырлы және белсенді сергектікте болады; <b>шектен тыс сергектікте<\/b> зейін қайта төмендейді, сана тарылады.", "<b>Хебб қисығы<\/b> (осы заңдылықты әдетте Йеркс–Додсон заңы деп атайды): тым әлсіз де, тым күшті де қозу әрекеттің нәтижесін төмендетеді, ең тиімдісі — орташа қозу, ал ол «орта» әр адамда әртүрлі (Маклаков). Сондықтан орташа ширығу зейінді өткірлейді, ал шамадан тыс қауіп оны бұзады.", "Шоғырлану өзгерісі: аффект кезінде зейін тарылады — адам тек өз толғанысына қатысты нәрсені көреді, назарын басқаға аудара алмайды (Крысько). Қауіп мидағы күшті ошақ — <b>доминанта<\/b> құрады, ол теріс индукция бойынша өзге аймақтарды тежейді. Шоғырлану тереңдеген сайын зейін қамтитын аумақ тарылады (Немов).", "Көлем өзгерісі: тарылған сана бір-екі нәрсені ғана анық ұстап, қалғанын байқамай қалады. Маклаков жер сілкінісін көрген адамның естелігін келтіреді: жұрт алдымен сілейіп тұрып қалған, сосын бағытсыз жүгірген — саябақтағылар үйге, үйдегілер саябаққа қашқан. Немов бойынша стресс қабылдауды, зейінді, ойлауды баяулатады, адам байқамайтын қателер көбейеді.", "Тәжірибенің әсері: әрекетін әлі жөнді меңгермеген адам ширыққанда қимылы құрысып, айналасындағы көп нәрсені аңғармай қалады (Маклаков). Ал әрекет <b>автоматтанған<\/b> болса, зейін бөліне алады: екі істі қатар атқару үшін біреуі автоматтанған болуы керек (Маклаков, Бабаев). Құтқарушы, ұшқыш, дәрігер үшін жаттығудың маңызы осыда.", "Зерттеу әдістері: көлемді <b>тахистоскоппен<\/b> не нүктелер әдісімен; тұрақтылықты <b>Бурдонның түзету сынамасымен<\/b>; бөліну мен ауысуды Шульте кестесімен не <b>Горбовтың қызыл-қара кестесімен<\/b> өлшейді. Нәтижені тыныш жағдаймен және жүктеме кезімен салыстырады.", "Қорытынды: экстремалды жағдайда шоғырлану бір қауіпке қатты жиналып, зейін өрісі тарылады, ал көлем мен бөліну азаяды. Мұны жеңілдету үшін әрекетті алдын ала автоматтандыратын жаттығу мен оңтайлы қозуды сақтау керек."], "terms": ["зейін көлемі", "шоғырлану", "шектен тыс сергектік", "Хебб қисығы", "аффект", "автоматтану"], "tip": "«Стресте зейін нашарлайды» деп қана айтпаңыз: шоғырлану бір нысанға күшейіп, ал көлем мен бөліну азаятынын, яғни зейіннің тарылатынын көрсетіңіз.", "src": "Зейін сайты, 2, 11, 12 және 15-тараулар; Эмоция және сезім сайты, 8 және 10-тараулар; Маклаков, 14 және 16-тараулар; Немов, I бөлім, 10-тарау; Бабаев, 9-дәрісбаян; Крысько (аффект туралы)", "link": {"url": "https://tazhiyeva.github.io/zeyin-psikhologiyasy/#s11-concentration", "label": "Зейін · 11-тарау: Шоғырлану — зейіннің тереңдігі"}}, "Q81": {"n": 81, "id": "Q81", "level": "hard", "topic": 9, "q": "Логикалық мен шығармашылық ойлаудың нейропсихологиялық негіздерін салыстырыңыз.", "plan": ["Ұғымдар: <b>логикалық ойлау<\/b> — логика ережелерін қолданатын, бірізді жүретін, дұрыстығын тексеруге болатын ойлау (Немов). <b>Шығармашыл ойлау<\/b> — жаңа идея туғызатын, мәселенің соны шешімін табатын ойлау (Бабаев); ол көбіне <b>интуицияға<\/b> сүйенеді: шешім тез келеді, бірақ адам оған қалай келгенін бірден дәлелдей алмайды.", "Лурияның негізгі қағидасы: ойлаудың мида жеке орталығы жоқ, ол — <b>функционалдық жүйе<\/b>, оған мидың үш блогы бірге қатысады. I блок (торлы құрылым, ми бағаны) — тонус пен сергектік; II блок (шүйде, самай, төбе бөліктері) — ақпаратты қабылдау, өңдеу, сақтау; III блок (маңдай бөліктері) — бағдарламалау, реттеу, бақылау.", "Лурия ойлауды кезеңдерге бөледі: шартты бағдарлау, шешім жолын (стратегияны) таңдау, операцияларды қолдану, жауап табу, нәтижені шартпен салыстыру. Ол операцияларды қолдану кезеңін «шығармашылықтан гөрі орындаушы кезең» дейді. Жаңалық <b>эвристика<\/b> кезеңінде туады; эвристика — көп жолдың ішінен ең ықтимал шешімді іздеу.", "<b>Логикалық ойлау<\/b> дайын тілдік, логикалық, сандық <b>кодтарға<\/b> сүйенеді. Сол жақ самай не төбе-шүйде бөлігі зақымданса, ол бұзылады (Лурия); сөйлеу, санау, сөздік-логикалық ойлау негізінен <b>сол жарты шармен<\/b> байланысты (Немов).", "<b>Шығармашыл ойлау<\/b> үшін үйреншікті шешімді тежеп, жаңа жол іздеу керек. Мұны <b>маңдай бөліктері<\/b> ұйымдастырады: асығыс жауапты тежеп, бірнеше жолдың ішінен таңдайды. Маңдай бөліктері зақымданған науқас шартты талдамай, бірден жауап береді.", "<b>Оң жарты шар<\/b> туралы деректер: ол логикалық кодқа енбейтін нақты затты (мысалы, адамның бет-әлпетін) тікелей тануға, тұтас бейнені қабылдауға қатысады (Лурия), эмоция мен интуиция арқылы жағдайға жылдам, тұтас жауап береді (Психика, ми, сана сайты). Сондықтан бейнелі, интуитивтік ойлауда оның үлесі көбірек.", "Ескерту: «логика — сол жарты шарда, шығармашылық — оң жарты шарда» деп кесіп айтуға болмайды. Қай мінез-құлықта қай жарты шар басым екені туралы деректер әрқилы, екі жарты шар бірлесіп жұмыс істейді (қазіргі зерттеулер; Психика, ми, сана сайты). Интуиция да логикадан бөлек жүрмейді: алдымен шешімді топшылайды, сосын логика оны тексереді (Немов).", "Қорытынды: екі ойлауға да сергектік (I блок) пен маңдай бөліктерінің жоспарлау-бақылау жұмысы керек. Айырма — сүйенетін буында: логикалық ойлау дайын тілдік-логикалық кодтарды бірізді қолдануға, шығармашыл ойлау жаңа стратегия іздеуге және тұтас, бейнелі өңдеуге көбірек сүйенеді."], "terms": ["функционалдық блоктар", "маңдай бөліктері", "эвристика", "функционалдық асимметрия", "интуиция", "тілдік-логикалық кодтар"], "tip": "Жарты шарларды «логика — сол, шығармашылық — оң» деп қарапайымдатпаңыз: Лурия бойынша кез келген ойлау бүкіл ми жүйесінің бірлескен жұмысы екенін міндетті түрде айтыңыз.", "src": "Лурия, «Нейропсихология негіздері», I бөлім, III тарау; II бөлім, V–VI тараулар; III бөлім, VI тарау «Ойлау»; Психика, ми, сана сайты, «Асимметрия» және «Локализация» тақырыптары; Ойлау және сөйлеу сайты, 4 және 6-тараулар; Немов, I бөлім, 13-тарау; Бабаев, 13-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#asimmetriya", "label": "Психика, ми, сана · Ми жарты шарларының асимметриясы"}}, "Q82": {"n": 82, "id": "Q82", "level": "hard", "topic": 12, "q": "Инфантилизм бар ересек адамның еріктік сапаларының даму ерекшелігін талдаңыз.", "plan": ["<b>Феномен<\/b>: <b>инфантилизм<\/b> — ересек адамда эмоциялық-еріктік саланың жасына сай жетілмеуі: ол шешім қабылдауды, жауапкершілікті басқаларға артады. Бұл — диагноз емес, тұлғаның ерекшелігі ретінде қарастырылады. Термин біздің оқулықтарда жеке талданбайды, сондықтан оны ерік психологиясы арқылы түсіндіреміз.", "<b>Шығу тегі<\/b> (Бабаев): ерік балалық шақта, іс-әрекетте қалыптасады. Отбасының қатесі — баланың тілегенін бәрін орындап, ұстамдылыққа, тежелуге үйретпеу. Бабаевтың мінез типтерінің бірі дәл осыны сипаттайды: шектен тыс мәпеленген, артық қамқорлықтан дербестікке үйренбеген адам кез келген кедергіден қорқады.", "<b>Ынталылық пен дербестік<\/b>: мұндай адам өз бетімен іске кірісе алмай, сыртқы нұсқауды күтеді (Бабаев). Шешімді өзі емес, ата-анасы не жұбайы қабылдайды.", "<b>Еріктік әрекеттің кезеңдері<\/b>: инфантил адам көбіне «тілек» не «ниет» кезеңінде тоқтайды. Түрткілер күресінде «қалаймын» әрдайым «міндеттіміннен» жеңеді, ал шешім орындалмай, ниет күйінде қалады.", "<b>Табандылық<\/b> әлсіз: Бабаев сипаттаған тип қажеттілігі «күш жұмсамай-ақ бір сәтте» қанағаттануы керек деп санайды, қиындықты абыржумен қабылдайды. Кедергіні қыңырлық пен нәтижесіз армандау сияқты психологиялық қорғаныстармен айналып өтеді.", "<b>Бақылау локусы сыртқы<\/b>: сәтсіздіктің себебін өзінен емес, жағдайдан не басқа адамдардан іздейді. Бабаев бойынша мұндай адам өз қабілетіне сенбейді, ісін кейінге қалдыруға бейім, жауапкершілігі кем.", "<b>Ұсыныстар<\/b>: жауапкершілікті біртіндеп беру (алдымен шағын, аяқталатын тапсырма); әр істі соңына дейін жеткізуді талап ету; өзіндік бақылау күнделігі; нәтижені өзінің еңбегімен байланыстыру — ішкі локусты дамыту. <b>Әдістемелер<\/b>: субъективтік бақылау деңгейі сауалнамасы (Роттердің идеясы негізінде), еріктік сапаларды өзін-өзі бағалау сауалнамалары, бақылау әдісі.", "Қорытынды: инфантилизмдегі әлсіз ерік — туа біткен кемістік емес, тәрбие мен тәжірибенің жетіспеуі. Бабаевтың «ерік — дұрыс ұйымдастырылған еңбек» деген сөзі бойынша, оны ересек жаста да тұрақты, жауапты іс арқылы дамытуға болады."], "terms": ["инфантилизм", "ынталылық", "дербестік", "табандылық", "бақылау локусы", "психологиялық қорғаныс"], "tip": "Инфантилизмді «жалқаулық» деп бағаламаңыз: әр белгісін нақты ерік сапасының (дербестік, табандылық, өзіндік бақылау) әлсіздігімен және тәрбиедегі себебімен байланыстырыңыз.", "src": "Бабаев, 16-дәрісбаян, 4–6-бөлімдер; Бабаев, 19-дәрісбаян (мінез типтері); Маклаков, 15.5", "link": null}, "Q83": {"n": 83, "id": "Q83", "level": "hard", "topic": 5, "q": "Тұлғаның даралық қасиеттерінің соматикалық аурулардың өтуіне тигізетін әсерін негіздеңіз.", "plan": ["Негізгі ой: соматикалық ауру тек дененің ісі емес. Оның ағымына адамның тұрақты психологиялық қасиеттері — темпераменті, эмоциялық ерекшеліктері, Мен-тұжырымдамасы, қиындыққа жауап беру тәсілдері — әсер етеді. Психолог ауруды емдемейді, осы қасиеттердің ем барысына әсерін зерттейді.", "<b>Эмоция мен дененің байланысы.<\/b> Шамадан тыс ұзақ әрі қарқынды толғаныс ағзаның жұмысын бұзып, ауруға әкелуі мүмкін (Бабаев). Стресспен байланысты ауруларды медицина шын ауру деп таниды және оларды психогендік, функционалдық аурулар деп атайды (Немов). Аствацатуровтың «қорқыныш — жүрекке, ашу — бауырға» деген сызбасы — тарихи пікір, оны диагноз үшін қолдануға болмайды.", "<b>Стресс механизмі.<\/b> Селье сипаттаған жалпы бейімделу синдромы үш фазадан тұрады: дабыл, қарсыласу, қалжырау. Ұзақ ауру мен ауруханада жатудың өзі стрессор. Ресурсы аз адамда қалжырау тезірек келіп, ауру ауырлай түсуі мүмкін.", "<b>Темперамент.<\/b> Павлов бойынша оның негізі — жүйке жүйесінің туа біткен қасиеттері: күші, теңгерімділігі, қозғалғыштығы. Әлсіз жүйке жүйесі бар адам (меланхолик) ұзақ жүктемеге аз төзеді, ал ұстамсыз адамға (холерикке) ұзақ әрі бір қалыпты ем тәртібін сақтау қиынырақ болуы мүмкін. Бірақ әр темпераменттің күшті жағы да бар: меланхолик дәрігер кеңесін мұқият орындауы мүмкін.", "<b>Эмоциялық даралық.<\/b> Адамдар басым көңіл-күйімен, эмоциялық қозғыштығымен, сезімінің тереңдігімен ерекшеленеді. Біреуде қуаттандыратын (стеникалық), біреуде әлсірететін (астеникалық) эмоция басым (Немов). Астеникалық эмоция басым адам ауруға бой алдырып, емге белсенді қатыспауы ықтимал.", "<b>Мен-тұжырымдама және қорғаныс.<\/b> Психологиялық қорғаныс тетіктері, әсіресе жоққа шығару, адамды ауруы туралы ақпаратты елемеуге итермелейді: ол дәрігерге кеш барады, емді тастап кетеді. Ал позитивті Мен-тұжырымдама мен барабар өзін-өзі бағалау емге белсенді қатысуға көмектеседі.", "<b>Зерттеу әдістері:<\/b> бақылау және клиникалық әңгіме; Айзенк сауалнамасы (экстраверсия, невротизм); Шмишек сауалнамасы (мінез акцентуациялары); Дембо–Рубинштейн өзін-өзі бағалау әдістемесі. Нәтижелерді емдеуші дәрігермен бірге талдау керек.", "Қорытынды: байланыс екі жақты. Тұлғаның қасиеттері аурудың ағымына әсер етеді, ал ұзақ ауру тұлғаны өзгертеді: адам мазасызданып, тұйықталып, өзін төмен бағалай бастайды. Эмоциялық күй жақсарса, сауығу тездейді: «сөз де емдейді» (Маклаков). Сондықтан науқастың даралық ерекшелігін ескеріп сөйлесу емнің бір бөлігіне айналады."], "terms": ["психогендік аурулар", "стресс (жалпы бейімделу синдромы)", "темперамент", "стеникалық және астеникалық эмоциялар", "психологиялық қорғаныс"], "tip": "Байланыстың екі жақты екенін міндетті түрде айтыңыз: қасиеттер ауруға әсер етеді, бірақ ауру да тұлғаны өзгертеді; психолог диагноз қоймайды.", "src": "Эмоция сайты, 5-тарау («Ұзаққа созылған эмоция және денсаулық»), 10, 12-тарау (Бабаев, Маклаков, Немов); Тұлға сайты, «Темперамент» (Крысько, 150–153 б.); Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s05-health", "label": "Эмоция және сезім · «Ұзаққа созылған эмоция және денсаулық»"}}, "Q84": {"n": 84, "id": "Q84", "level": "hard", "topic": 2, "q": "Амбулаториялық психологиялық консультацияда қолданылатын «кейстер методологиясын» бағалаңыз.", "plan": ["<b>Кейс (клиникалық зерттеу)<\/b> — бір адамды немесе санаулы адамдарды терең әрі ұзақ зерттеу. Амбулаториялық консультацияда психолог клиентпен ауруханадан тыс, бірнеше кездесуде жұмыс істейді, сондықтан әр клиенттің жағдайы жеке кейс ретінде қарастырылады.", "<b>Кейсті құру қадамдары:<\/b> 1) клиенттің өтінішін нақтылау; 2) анамнез, яғни өмір тарихын жинау (өмірбаянды зерттеу әдісі); 3) клиникалық әңгіме және бақылау; 4) қажет болса, психодиагностика; 5) болжам құру; 6) жұмыс жоспары; 7) нәтижені қайта бағалау.", "<b>Әдістемелер:<\/b> мақсатқа қарай нақты әдістемелер алынады. Мысалы, мінез акцентуациясын анықтау үшін Шмишек сауалнамасы, зейінді тексеру үшін Шульте кестелері, есті тексеру үшін Лурияның 10 сөз әдістемесі. Тест нәтижесі кейстің бір бөлігі ғана, ол әңгіме мен бақылау деректерімен салыстырылады.", "<b>Күшті жағы:<\/b> кейс беретін ақпараттың тереңдігі мен байлығын басқа әдіс бере алмайды. Ол клиенттің өмір жағдайын, мінезін, ортасын біртұтас көруге, көмекті соған лайық құруға мүмкіндік береді.", "<b>Әлсіз жағы:<\/b> бір адам туралы қорытындыны басқаларға жалпылау қиын. Кейс себеп-салдарды дәлелдемейді. Психолог өз болжамын растайтын деректі ғана байқап қалуы мүмкін (бақылаушының біржақтылығы). Клиенттің өзі туралы айтқаны да бұрмалануы ықтимал.", "<b>Кемшілікті азайту жолдары:<\/b> әр кездесуді нақты хаттамамен жазу; бірнеше әдіс деректерін салыстыру; күрделі кейсті әріптестермен талқылау (супервизия); болжамды жаңа деректермен тексеріп отыру.", "<b>Этика:<\/b> клиент келісім береді, деректер құпия сақталады. Кейс оқыту не жариялау үшін пайдаланылса, клиенттің аты мен оны танытатын мәліметтер алынып тасталады және оның рұқсаты сұралады.", "<b>Бағалау қорытындысы:<\/b> кейс әдіснамасы амбулаториялық консультацияға өте лайық, өйткені мұнда мақсат — жалпы заң табу емес, нақты адамға көмектесу. Бірақ оның қорытындысын жалпы заңдылық деп санауға болмайды, ол тек болжам ретінде басқа зерттеулерде тексерілуі керек."], "terms": ["кейс (клиникалық зерттеу)", "анамнез", "клиникалық әңгіме", "жалпылау", "бақылаушының біржақтылығы"], "tip": "«Бағалаңыз» деген сұраққа күшті жақ пен әлсіз жақты қатар қойып, соңында нақты пікір айтыңыз: консультацияға лайық, бірақ жалпылауға жарамайды.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.2 (OpenStax, Psychology 2e, 2-тарау); Бабаев, 2-дәрісбаян (эмпирикалық әдістер); Маклаков, 1-тарау (1.4)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s22-case", "label": "Клиникалық зерттеу немесе кейс · сайттың 2.2-бөлімі"}}, "Q85": {"n": 85, "id": "Q85", "level": "hard", "topic": 10, "q": "Қиял процесінің психотерапиялық әдістердегі (арт-терапия, визуализация) орны.", "plan": ["<b>Негізгі идея<\/b>: барлық психикалық процестің ішінде денемен ең тығыз байланысқаны — қиял. Мида туған бейне тыныс ырғағын, жүрек соғысын, қан қысымын өзгертеді: қышқыл құртты елестетсек, сілекей өзі ағады. Психотерапия осы байланысты пайдаға бұрады.", "<b>Теориялық негіз<\/b>: Немов қиялдың <b>психотерапиялық қызметін<\/b> атайды — адам қиял арқылы өзіне әсер етеді. Крысько бойынша қиял эмоциялық күйді реттейді және басқа психикалық процестерді басқарады.", "<b>Визуализация<\/b> — бейнені саналы түрде шақырып, ұстап тұру. Бабаев сипаттаған Эмиль Куэнің саналы өзін-өзі сендіру әдісі мен одан өскен <b>аутогендік жаттығу<\/b> осыған сүйенеді: адам жылуды не ауырлықты елестетіп, бұлшықетін босаңсытуды үйренеді.", "<b>«Қауіпсіз орын» тәсілі<\/b> (дәріс слайды): адам өзін ең тыныш сезінетін орынды егжей-тегжейлі елестетеді — не көрінеді, не естіледі, қандай иіс бар. Үрейдегі бейне шақырусыз келеді, ал бұл бейнені адам өзі басқарады: пассивті бейненің орнына активті қиял бейнесі жасалады.", "<b>Арт-терапия<\/b>: сурет, мүсін, музыка арқылы қиял бейнесі басқа адам көре алатын затқа айналады. Сөзбен айта алмаған қорқынышты адам қағазға салады, сосын оған сырттан қарап, өзгерте алады — түсін ауыстырады, жанына қорғаушы салады.", "Арт-терапияның екінші жағы — <b>психодиагностикалық<\/b> қызмет (Немов): қиялдың өнімі арқылы психиканы тануға болады. Бірақ суретке қарап асығыс қорытынды жасамай, оны салған адаммен бірге талқылау керек.", "<b>Психологтың сақтығы<\/b>: клиент бейнені өзі таңдайды; жарақаты ауыр адамда тыныш бейненің өзі ауыр естелікті оятуы мүмкін, сондықтан мұндай жұмысты дайындығы бар маман жүргізеді; галлюцинацияға ұқсас белгіде адамды дәрігерге жібереді.", "Қорытынды: қиял — екі жүзді құрал, бір тетік адамды қорқытады да, емдейді де. Оқулықтар бұл тәсілдердің теориялық негізін береді, ал нақты әдістемесі психотерапия курсында оқылады."], "terms": ["қиялдың психотерапиялық қызметі", "визуализация", "аутогендік жаттығу", "«қауіпсіз орын»", "арт-терапия", "психодиагностикалық қызмет"], "tip": "Әр тәсілді қиялдың нақты қасиетімен байланыстырыңыз: визуализация — бейненің денеге әсері, арт-терапия — бейненің затқа айналуы; психологтың сақтығын міндетті түрде айтыңыз.", "src": "Бабаев, 14-дәрісбаян; Немов, 12-тарау; Крысько, 2.19–2.21; Маклаков, 11.1; дәріс слайдтары", "link": {"url": "https://tazhiyeva.github.io/qiyal-psikhologiyasy/#s12-therapy", "label": "Қиял · 12-тарау: психотерапиялық жұмыс (ағзаға әсері — 5-тарауда)"}}, "Q86": {"n": 86, "id": "Q86", "level": "hard", "topic": 5, "q": "Адамның қажеттіліктер пирамидасы (А. Маслоу) мен деструктивті мінез-құлық арасындағы байланысты талдаңыз.", "plan": ["Негізгі ой: Маслоу бойынша адамның мінез-құлқын қажеттіліктер қозғайды, ал олар төменнен жоғары қарай реттелген. Деструктивті мінез-құлықтың бір себебі — қандай да бір қажеттіліктің ұзақ уақыт қанағаттанбауы.", "<b>Маслоу пирамидасы.<\/b> Классикалық нұсқада бес саты бар: физиологиялық қажеттіліктер, қауіпсіздік, топқа тиесілі болу мен сүйіспеншілік, сыйластық, өзін-өзі өзектендіру. Немов жеті топты атайды: органикалық, қауіпсіздік, қарым-қатынас, қоғамда орын алу, билік, таным мен шығармашылық, өзін-өзі өзектендіру.", "<b>Байланыстың тетігі — фрустрация.<\/b> Қажеттілікке жетуге кедергі болса, фрустрация туады: адам ренжиді, ашуланады, өшпенділік пен қаһарға бейім болады (Бабаев, Маклаков). Фрустрацияға жауаптың түрлері: мәнсіз қимыл-әрекет, түңілу, ашуға беріліп әрекеттен қалу, стереотипия, регрессия (Василюк, Бабаев келтіреді).", "<b>Әр сатыдағы мысалдар.<\/b> Қауіпсіздік қажеттілігі бұзылған бала (үйде зорлық көрген) өзін қорғау үшін агрессивті болуы мүмкін. Қарым-қатынас пен топқа қабылдану қажеттілігі қанағаттанбаған жасөспірім қабылдану үшін бұзақы топқа қосылады. Сыйластық қажеттілігі қанбаған адам өзін басқаларды басып-жаншу арқылы бекітеді.", "<b>Тәрбиенің әсері.<\/b> Ерте балалықта фрустрация жиі қайталанып, бала оны үнемі бір тәсілмен жеңсе, бұл мінезге айналады: біреуде бастамасыздық, біреуде агрессивтілік пен ызақорлық бекиді. Қатаң жаза агрессивтілікті күшейтеді (Эмоция сайты, 12-тарау).", "<b>Теорияның шегі.<\/b> Бабаев Маслоу сызбасын сынайды: онда адам қоғамдық қатынастардан тыс, оқшау алынған. Ломов бойынша қажеттіліктер адамның басқа адамдармен байланысы арқылы дамиды. Сондықтан деструктивті мінезді тек «қанбаған қажеттілікпен» түсіндіру жеткіліксіз: ортаны, топты, тәрбиені де талдау керек.", "<b>Практикалық қорытынды.<\/b> Психолог алдымен қай саты бұзылғанын анықтайды (әңгіме, бақылау, Розенцвейгтің фрустрациялық суреттер тесті, Басс–Дарки сауалнамасы), сосын сол қажеттілікті қанағаттандырудың зиянсыз жолын іздейді: қауіпсіз орта, топқа қабылдану, сыйластық тудыратын іс.", "Қорытынды: деструктивті мінез-құлық көбіне «қажеттілік → кедергі → фрустрация → агрессия» тізбегінен туады. Маслоу сызбасы қай қажеттілік бұзылғанын табуға көмектеседі, ал түзету үшін адамның әлеуметтік ортасын да өзгерту керек."], "terms": ["қажеттіліктер иерархиясы", "өзін-өзі өзектендіру", "фрустрация", "агрессия", "регрессия"], "tip": "Байланысты бір тізбекпен көрсетіңіз: қажеттілік → кедергі → фрустрация → деструктивті әрекет; соңында Маслоу теориясының шегін (әлеуметтік ортаны ескермейтінін) айтуды ұмытпаңыз.", "src": "Тұлға сайты, «Тұлға құрылымы» (Немов, 105–106 б.); Бабаев, 1, 15-дәрісбаян; Эмоция сайты, 10, 12-тарау (Маклаков)", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-frustr", "label": "Эмоция және сезім · «Фрустрация: мақсат пен кедергі»"}}, "Q87": {"n": 87, "id": "Q87", "level": "hard", "topic": 11, "q": "Депрессивті күйдегі пациенттің танымдық процесстерінің (ес, ойлау, зейін) баяулау механизмін негіздеңіз.", "plan": ["<b>Феномен<\/b>: <b>депрессия<\/b> — ауыр эмоциялық күй: жабығу, ештеңе қаламау, іске ынтаның болмауы, дене мен психика белсенділігінің жалпы төмендеуі (Немов). Психолог диагноз қоймайды, ол дәрігердің (психиатрдың) ісі; психолог танымдық өзгерістердің механизмін сипаттайды.", "<b>Энергетикалық негіз<\/b>: депрессия <b>астеникалық<\/b> күйлерге жақын — ол әрекетке күш қоспай, күшті алады (Маклаков, Бабаев). Лурияның моделінде психикалық процестерге қажетті тонус пен сергектікті мидың бірінші блогы ұстап тұрады. Тонус төмендеген науқастарда Лурия барлық жауаптың баяулауын және көңіл-күйдің түсуін сипаттайды.", "<b>Зейін<\/b>: Немов бойынша адам ең алдымен өзінде эмоция тудыратын нәрсеге зейін аударады. Депрессияда зейінді ауыр толғаныстар «ұстап тұрады», сондықтан оны оқуға, әңгімеге бұру мен шоғырландыру қиындайды, тез шаршайды.", "<b>Ес<\/b>: ырықты есте сақтау мақсат пен ынтаны талап етеді, ал депрессияда ынта әлсіз. Оның үстіне Немовтың эмоция заңы бойынша жағымсыз эмоция аясында материал қиын еске түседі. Адам «есім нашарлады» деп шағымданады.", "<b>Ойлау<\/b>: ұзақ жағымсыз күй танымдық процестерді баяулатып, қатені көбейтеді (Немов). Өзін төмен бағалайтын адам сәтсіздікті күтіп, талабын төмендетеді, мақсаттан күдер үзеді (Маклаков). Шешім қабылдау ауырлайды.", "<b>Әдістемелер<\/b>: зейіннің қарқыны мен шаршағыштықты Шульте кестелерімен, есте сақтау динамикасын Лурияның 10 сөз әдістемесімен бағалауға болады. Көңіл-күйді скринингтік түрде Бектің депрессия шкаласы көрсетеді, бірақ оның нәтижесі диагноз емес.", "<b>Талдау қорытындысы<\/b>: танымдық баяулау — интеллекттің жоғалуы емес, эмоциялық-энергетикалық құлдыраудың салдары. Сондықтан тексеру нәтижесін «қабілеті төмен» деп бағалауға асықпау керек.", "Ұсыныс: адамды маманға (психиатрға) жіберу; тапсырманы шағын бөліктерге бөлу; жазбаша тірек беру; жетістікті белгілеп отыру. Апталап созылған, ұйқыны, тәбетті, оқуды бұзған түсіңкі күй — маманға жүгінуге белгі."], "terms": ["депрессия", "астеникалық эмоция", "тонус пен сергектік (Лурияның бірінші блогы)", "эмоция заңы (ес)", "Шульте кестелері", "Лурияның 10 сөз әдістемесі"], "tip": "Әр танымдық процестің (зейін, ес, ойлау) баяулауын жеке механизммен түсіндіріңіз де, психологтың диагноз қоймайтынын міндетті түрде айтыңыз.", "src": "Немов, 24.1; Маклаков, 16.1, 16.3; Бабаев, 17-дәрісбаян; Лурия, «Нейропсихология негіздері» (тонус және сергектік блогы); Зейін сайты, 5-тарау; Ес сайты, 11-тарау", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-apathy", "label": "Эмоция және сезім · 10-тарау: апатия және депрессия"}}, "Q88": {"n": 88, "id": "Q88", "level": "hard", "topic": 11, "q": "Кәсіби деструкция мен эмоционалдық жанудың (burnout) психологиялық себептерін талдаңыз.", "plan": ["<b>Ұғымдар<\/b>: <b>эмоционалдық жану<\/b> (burnout) — ұзақ кәсіби күйзеліс салдарынан адамның эмоциялық қуаты сарқылып, жұмысқа да, адамдарға да салқын қарай бастауы. <b>Кәсіби деструкция<\/b> (деформация) — ұзақ жылғы кәсіптің әсерінен тұлғаның жағымсыз өзгеруі: мысалы, мұғалімнің үйде де бәрін «сабақ беріп» сөйлеуі.", "Бұл ұғымдар біздің оқулықтарда жеке талданбайды, сондықтан оларды <b>Сельенің стресс теориясы<\/b> арқылы түсіндіреміз. Жану — қалжырау фазасының кәсіби түрі: жүктеме жылдар бойы азаймайды, ағза ресурсын таусады, бұрын күш берген стресс (эустресс) енді әлсіретеді (дистресс).", "Жанудың үш белгісі жиі аталады (Маслач): эмоциялық сарқылу, адамдарға «зат» ретінде салқын қарау, өз жетістігін төмен бағалау. Әсіресе адамдармен жұмыс істейтін мамандықтарда — мұғалім, дәрігер, психолог — кездеседі.", "<b>Себептері 1 — эмоциялық<\/b>: кәсіп эмоцияны үнемі ұстап тұруды талап етеді. Эмоцияны көрсетудің мәдени ережелері бойынша маман ашуын, шаршағанын жасырады, ал дене өзгерістері ерікке бағынбайды. Ұзаққа созылған жағымсыз толғаныс денсаулыққа да зиян (Бабаев).", "<b>Себептері 2 — когнитивтік<\/b>: күткені мен болғанының алшақтығы (Фестингердің когнитивтік диссонансы) — «балаларды өзгертемін» деген үміт іске аспаса, көңіл қалады. Лазарус бойынша жұмысты үнемі «қатер» деп бағалау стресті күшейтеді.", "<b>Себептері 3 — тұлғалық<\/b>: сыртқы бақылау локусы, өзін төмен бағалау, жұмыстан тыс демалыстың жоқтығы. Бір қалыпты, жылдар бойы қайталанатын әрекет деформацияны да тереңдетеді.", "<b>Әдістемелер<\/b>: Маслачтың кәсіби жану сауалнамасы (MBI) және Бойконың эмоциялық жану деңгейін анықтау әдістемесі. <b>Алдын алу<\/b>: жүктемені уақтылы азайту, толық тынығу, бағаны қайта қарау, әріптестермен талқылау, жұмыстан тыс қуаныш көзі.", "Қорытынды: жану мен деформация бір күнде пайда болмайды — олар ұзақ стрестің қалжырау фазасына жетуі. Сондықтан ресурс таусылмай тұрып, қарсыласу фазасында әрекет ету керек."], "terms": ["эмоционалдық жану", "кәсіби деструкция", "қалжырау фазасы", "дистресс", "когнитивтік диссонанс", "бақылау локусы"], "tip": "Жанудың себептерін эмоциялық, когнитивтік, тұлғалық деп үш топқа бөліп айтыңыз және бәрін Сельенің қалжырау фазасымен байланыстырыңыз.", "src": "Немов, 24-тарау (стресс); Маклаков, 16.2–16.3; Бабаев, 17-дәрісбаян; OpenStax, 14.2; эмоционалдық жану туралы ұғымдар (Маслач, Бойко) оқулықтардан тыс", "link": {"url": "https://tazhiyeva.github.io/emotsiya-psikhologiyasy/#s10-stress", "label": "Эмоция және сезім · 10-тарау: стресс және Сельенің үш фазасы"}}, "Q89": {"n": 89, "id": "Q89", "level": "hard", "topic": 5, "q": "Тұлғаның өзін-өзі бағалауы мен реалиттілік сезімінің бұзылу кейсін талдаңыз.", "plan": ["Кейстің мазмұны: адам өзін тым төмен не тым жоғары бағалайды және сонымен қатар өзін, айналасын «шынайы емес» сияқты сезінеді. Бұл жерде өзіндік сананың екі бөлігі бұзылған: <b>өзін-өзі бағалау<\/b> және өз тұлғасы мен дүниенің шынайылығын сезіну. Психолог диагноз қоймайды, феноменді атап, механизмін түсіндіреді.", "<b>Өзін-өзі бағалау<\/b> — Мен-тұжырымдаманың бағалау жағы; ол нақты Мен мен идеалды Менді салыстырудан туады, оған айналадағылардың бағасы сіңеді (Немов). Төмен бағалаған адам жақсы қасиеттерін кемітіп, кемшілігін асырады; жоғары бағалаған адам керісінше. Барабар бағалау — өзін шын мүмкіндігіне сай бағалау.", "<b>Шынайылық сезімі<\/b> Эриксонның <b>бірегейлік<\/b> ұғымымен байланысты: адам өз тұлғасының үздіксіздігі мен тепе-теңдігін сезінеді, өткенін, қазіргісін, болашағын біртұтас қабылдайды. Бұл сезім бұзылғанда адам өзін «өзгеріп кеткендей», «бөгде сияқты» сезінуі мүмкін; клиникалық психологияда мұны <b>деперсонализация<\/b> (өз Менінің бөгделенуі) және <b>дереализация<\/b> (айналаның шынайы емес болып көрінуі) дейді.", "<b>Механизм.<\/b> Мен-тұжырымдама тұтас, сондықтан өзін-өзі бағалаудың күрт өзгеруі (ауыр сәтсіздік, ұзақ стресс) Мен-бейненің тұрақтылығы мен біріздігін бұзады (Розенберг өлшемдері). Ұзаққа созылған стресс танымдық процестерді бұзып, апатия мен түңілуге әкеледі (Немов). Психологиялық қорғаныс (оқшаулау, жоққа шығару) жағымсыз ақпаратты санадан шеттетіп, «бәрі түс сияқты» деген әсерді күшейтуі мүмкін.", "<b>Талдау қадамдары:<\/b> 1) клиникалық әңгіме — шағым қашан басталды, қандай оқиғадан кейін; 2) бақылау — эмоциялық реңк, сөйлеу, қимыл; 3) өзін-өзі бағалауды өлшеу (Дембо–Рубинштейн әдістемесі); 4) Мен-бейнені зерттеу (Кун–Макпартлендтің «Мен кіммін?» тесті); 5) талаптану деңгейін бағалау.", "<b>Бағалау белгілері:<\/b> Розенберг ұсынған өлшемдер бойынша Мен-бейненің айқындығы, ішкі тұтастығы, уақыт бойынша тұрақтылығы және өзіне қатынасы қарастырылады. Нақты және идеалды Меннің арасындағы алшақтық неғұрлым үлкен болса, ішкі жан арпалысы соғұрлым күшті (Бабаев).", "<b>Ұсыныстар:<\/b> шынайылық сезімінің бұзылуы ұзаққа созылса не күшейсе, адамды міндетті түрде психиатрға жіберу; психолог жағынан — қолдаушы әңгіме, шағын нақты табыстар арқылы өзін барабар бағалауға үйрету, күнделікті тәртіп пен денені сезінуге бағытталған жаттығулар.", "Қорытынды: бұл кейсте өзін-өзі бағалау мен шынайылық сезімі бір жүйенің — өзіндік сананың — бөліктері ретінде бірге бұзылады. Психологтың міндеті — феноменді дұрыс сипаттап, оның механизмін түсіндіру және дәрігермен бірге жұмыс істеу."], "terms": ["өзін-өзі бағалау", "өзіндік сана", "бірегейлік", "деперсонализация", "дереализация", "Мен-тұжырымдама"], "tip": "Кейсте «шизофрения», «депрессия» деп диагноз қоймаңыз: феноменді (деперсонализация, дереализация) атап, оның өзін-өзі бағалаумен байланысын түсіндіріңіз.", "src": "Психика, ми, сана сайты, 17-тақырып (Немов, 5.2); Тұлға сайты, «Тұлға құрылымы» (Немов, 107–110 б.); Эмоция сайты, 10-тарау; Бабаев, 15-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana-qurylym", "label": "Психика, ми, сана · «Сананың құрылымы мен деңгейлері» (өзін-өзі бағалау)"}}, "Q90": {"n": 90, "id": "Q90", "level": "hard", "topic": 2, "q": "Клиникалық психология саласындағы зерттеудің теориялық және қолданбалы әдіснамасын негіздеу жобасы.", "plan": ["<b>Жобаның тақырыбы (мысал):<\/b> «Созылмалы аурумен ауыратын ересектердегі зейін мен ес ерекшеліктері». Мақсат — бұл процестердің сау адамдардан айырмасын анықтап, түзету жұмысына ұсыныс жасау.", "<b>Теориялық әдіснама — принциптер:<\/b> <i>детерминизм<\/i> — бұзылыстың себебін аурудан, емнен, өмір жағдайынан іздеу; <i>сана мен іс-әрекет бірлігі<\/i> — психиканы іс-әрекет арқылы зерттеу; <i>даму принципі<\/i> — өзгерісті уақыт бойы қарау. Оған Лурияның жүйелік көзқарасы қосылады: бір процестің бұзылысы бүкіл синдроммен бірге талданады.", "<b>Болжам:<\/b> «Егер ауру ұзаққа созылса, онда зейіннің тұрақтылығы мен есте сақтау көлемі сау адамдарға қарағанда төмен болады». Ұғымдар нақты өлшенетіндей анықталады (операциялық анықтама): мысалы, «зейін тұрақтылығы» — Шульте кестелерін орындау уақыты.", "<b>Ұйымдастыру әдісі:<\/b> <i>салыстыру әдісі<\/i> — науқастар тобы мен жасы, жынысы, білімі бойынша ұқсас сау адамдар тобы салыстырылады. Мүмкіндік болса, <i>лонгитюдтік<\/i> бөлім қосылады: бір топ ем барысында бірнеше рет тексеріледі.", "<b>Қолданбалы (эмпирикалық) әдістер:<\/b> клиникалық әңгіме және анамнез; бақылау; Шульте кестелері (зейін), Лурияның 10 сөз әдістемесі (ес); қажет болса, мінез ерекшелігін анықтау үшін Шмишек сауалнамасы. Деректер сандық (статистикалық) және сапалық әдістермен өңделеді.", "<b>Сапаны қорғау:<\/b> бағалаушы қатысушының қай топта екенін білмейді (соқыр әдіс), бір оқиғаны бірнеше маман бағалайды, әдістемелердің сенімділігі мен валидтілігі тексеріледі. Қорытынды статистикалық талдауға сүйенеді. Топтардың арасында маңызды айырма табылмаса, бұл да нәтиже болып саналады: болжам расталмады.", "<b>Этика:<\/b> жобаны алдымен этика комиссиясы мақұлдайды. Әр қатысушы ақпараттандырылған келісім береді, кез келген уақытта шыға алады, деректер кодпен құпия сақталады, тексеру науқасты шаршатпайтындай бөлінеді.", "<b>Күтілетін нәтиже және қорытынды:<\/b> жобаның теориялық нәтижесі — зейін мен ес бұзылысының құрылымын түсіндіру, ал қолданбалы нәтижесі — түзету жаттығулары мен дәрігер және психологтың бірлескен жұмысына ұсыныс. Теория әдісті таңдауға негіз береді, ал әдіс арқылы алынған дерек теорияны тексереді."], "terms": ["әдіснама", "детерминизм принципі", "болжам (гипотеза)", "салыстыру әдісі", "операциялық анықтама", "ақпараттандырылған келісім"], "tip": "Жобаны «теория → болжам → әдістер → этика → күтілетін нәтиже» ретімен айтсаңыз, ештеңені ұмытпайсыз.", "src": "Бабаев, 2-дәрісбаян (негізгі принциптер, әдістердің төрт тобы); Лурия, «Основы нейропсихологии» (синдромдық талдау); «Психологиялық зерттеу әдістері» сайты, 2.1–2.4", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s21-method", "label": "Ғылыми зерттеу үдерісі · сайттың 2.1-бөлімі"}}}, "tickets": [["Q01", "Q31", "Q76"], ["Q02", "Q37", "Q65"], ["Q03", "Q51", "Q75"], ["Q04", "Q32", "Q67"], ["Q05", "Q46", "Q83"], ["Q06", "Q36", "Q74"], ["Q07", "Q54", "Q72"], ["Q08", "Q57", "Q82"], ["Q09", "Q38", "Q77"], ["Q10", "Q41", "Q80"], ["Q11", "Q52", "Q68"], ["Q12", "Q49", "Q66"], ["Q13", "Q60", "Q90"], ["Q14", "Q48", "Q86"], ["Q15", "Q43", "Q64"], ["Q16", "Q59", "Q88"], ["Q17", "Q53", "Q73"], ["Q18", "Q42", "Q89"], ["Q19", "Q40", "Q71"], ["Q20", "Q45", "Q62"], ["Q21", "Q35", "Q85"], ["Q22", "Q44", "Q61"], ["Q23", "Q47", "Q63"], ["Q24", "Q56", "Q69"], ["Q25", "Q50", "Q78"], ["Q26", "Q55", "Q79"], ["Q27", "Q58", "Q84"], ["Q28", "Q34", "Q81"], ["Q29", "Q39", "Q87"], ["Q30", "Q33", "Q70"]], "topics": {"1": ["Q01", "Q27", "Q28", "Q55", "Q60"], "2": ["Q03", "Q04", "Q26", "Q77", "Q84", "Q90"], "3": ["Q02", "Q05", "Q31", "Q56"], "4": ["Q30", "Q48", "Q50", "Q68", "Q79"], "5": ["Q16", "Q29", "Q47", "Q49", "Q51", "Q70", "Q76", "Q83", "Q86", "Q89"], "6": ["Q06", "Q07", "Q32", "Q33", "Q57", "Q63", "Q66"], "7": ["Q08", "Q23", "Q24", "Q34", "Q35", "Q61"], "8": ["Q09", "Q21", "Q22", "Q36", "Q72", "Q80"], "9": ["Q10", "Q11", "Q25", "Q37", "Q38", "Q59", "Q71", "Q73", "Q81"], "10": ["Q12", "Q39", "Q40", "Q85"], "11": ["Q13", "Q14", "Q41", "Q62", "Q64", "Q69", "Q74", "Q87", "Q88"], "12": ["Q15", "Q42", "Q58", "Q82"], "13": ["Q17", "Q43", "Q44", "Q45", "Q67"], "14": ["Q18", "Q46", "Q52", "Q65", "Q78"], "15": ["Q19", "Q20", "Q53", "Q54", "Q75"]}};</script>
<script>
(()=>{
const E=window.EXAM, Q=E.questions, T=E.tickets, TT=E.titles;
const CATALOG="https://tazhiyeva.github.io/zhalpy-psikhologiya/";
const LV={easy:{n:"Жеңіл",c:"L-easy"},medium:{n:"Орташа",c:"L-medium"},hard:{n:"Күрделі",c:"L-hard"}};
const app=document.getElementById("app");
const st={get(k,d){try{const v=localStorage.getItem("emt:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("emt:"+k,JSON.stringify(v))}catch(e){}}};
let marks=st.get("marks2",{});
const ICON={dice:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',ext:'<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const known=()=>Object.keys(marks).filter(id=>marks[id]==="k"&&Q[id]).length;
const total=Object.keys(Q).length;

function qCard(id,i){
  const q=Q[id],lv=LV[q.level],m=marks[id]||"";
  return `<article class="q" data-id="${id}">
    <div class="qtop"><span class="badge ${lv.c}">№ ${q.n} · ${lv.n}</span><a class="topic" href="#topic/${q.topic}">${q.topic}-тақырып · ${esc(TT[q.topic])}</a></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="ans" hidden>
      <p class="eyebrow">Жауап жоспары</p>
      <ol>${q.plan.map(p=>`<li>${p}</li>`).join("")}</ol>
      ${q.terms&&q.terms.length?`<div class="terms">${q.terms.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
      ${q.tip?`<p class="tip"><b>Кеңес.</b> ${esc(q.tip)}</p>`:""}
      ${q.src?`<p class="src">Дереккөз: ${esc(q.src)}</p>`:""}
    </div>
    <div class="qact">
      <button class="btn tg" type="button" aria-expanded="false">Жауап жоспары</button>
      <button class="btn mk k${m==="k"?" on":""}" type="button" aria-pressed="${m==="k"}">Білемін</button>
      <button class="btn mk r${m==="r"?" on":""}" type="button" aria-pressed="${m==="r"}">Қайталау керек</button>
      ${q.link&&q.link.url?`<a class="btn" href="${esc(q.link.url)}" target="_blank" rel="noopener">${esc(q.link.label||"Сайтта оқу")} ${ICON.ext}</a>`:""}
    </div></article>`;
}
function bindCards(){
  app.querySelectorAll(".q").forEach(c=>{
    const id=c.dataset.id,ans=c.querySelector(".ans"),tg=c.querySelector(".tg");
    tg.addEventListener("click",()=>{ans.hidden=!ans.hidden;tg.setAttribute("aria-expanded",!ans.hidden);tg.textContent=ans.hidden?"Жауап жоспары":"Жасыру"});
    c.querySelectorAll(".mk").forEach(b=>b.addEventListener("click",()=>{
      const v=b.classList.contains("k")?"k":"r";
      if(marks[id]===v)delete marks[id];else marks[id]=v;st.set("marks2",marks);
      c.querySelectorAll(".mk").forEach(x=>{const on=marks[id]===(x.classList.contains("k")?"k":"r");x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});
    }));
  });
}
function dots(ids){return `<span class="dots">${ids.map(id=>`<i class="${marks[id]||""}"></i>`).join("")}</span>`}

function home(){
  const rev=Object.keys(marks).filter(id=>marks[id]==="r"&&Q[id]).length;
  app.innerHTML=`<p class="eyebrow">Жалпы психология · қорытынды емтихан</p>
  <h1>Емтиханға дайындық</h1>
  <p class="lede">Емтиханда бір билетте үш сұрақ болады: жеңіл, орташа және күрделі. Мұнда оқытушы берген ${total} ресми сұрақ бар: 1–30 жеңіл, 31–60 орташа, 61–90 күрделі. Жаттығу үшін олар ${T.length} билетке бөлінді. Әр сұраққа жауап жоспары жазылған: негізгі ойлар, терминдер және кеңес. Алдымен өзіңіз жауап беріп көріңіз, сосын жоспармен салыстырыңыз.</p>
  <div class="row"><button class="btn pri" id="rnd" type="button">${ICON.dice} Кездейсоқ билет тарту</button><a class="btn" href="#list">Барлық 90 сұрақ</a><a class="btn" href="#tickets">Билеттер</a></div>
  <div class="stats">
    <div class="stat"><b>${known()} / ${total}</b><span>«Білемін» деп белгіленген</span></div>
    <div class="stat"><b>${rev}</b><span>«Қайталау керек»</span></div>
    <div class="stat"><b>${T.length}</b><span>билет · 90 сұрақ</span></div>
  </div>
  <h2>Сұрақ деңгейлері</h2>
  <div class="lvls">
    <div class="lv L-easy"><b>Жеңіл</b><span>Анықтама беру, түрлерін атап сипаттау.</span></div>
    <div class="lv L-medium"><b>Орташа</b><span>Түсіндіру, салыстыру, теорияны баяндау.</span></div>
    <div class="lv L-hard"><b>Күрделі</b><span>Жағдаятты теориямен талдап, қорытынды жасау.</span></div>
  </div>
  <h2>Қалай дайындалған дұрыс?</h2>
  <ol>
    <li>Билет тартып, таймерді қосыңыз. Үш сұраққа жауапты қағазға қысқаша жоспар етіп жазыңыз.</li>
    <li>«Жауап жоспары» батырмасын ашып, өз жауабыңызбен салыстырыңыз.</li>
    <li>Сұрақты «Білемін» немесе «Қайталау керек» деп белгілеңіз. Белгілер осы құрылғыда сақталады.</li>
    <li>«Қайталау» бөлімінде әлсіз сұрақтарыңыз жиналады. Оларды тақырыптың сайтынан қайта оқыңыз.</li>
  </ol>
  <p class="foot">Барлық дәрістердің сайттары: <a href="${CATALOG}" target="_blank" rel="noopener">Жалпы психология каталогы</a>.</p>`;
  document.getElementById("rnd").addEventListener("click",()=>{location.hash="#ticket/"+(1+Math.floor(Math.random()*T.length))});
}
function list(){
  const G=[["easy","1–30 сұрақ · Жеңіл деңгей","Базалық ұғымдар мен анықтамалар"],["medium","31–60 сұрақ · Орташа деңгей","Теорияларды салыстыру мен талдау"],["hard","61–90 сұрақ · Күрделі деңгей","Клиникалық және практикалық кейстер, қолданбалы тапсырмалар"]];
  const ids=Object.keys(Q);
  app.innerHTML=`<h1>Емтихан сұрақтары</h1><p class="lede">Оқытушы берген 90 сұрақ, ресми ретімен. Әр сұрақтың астында жауап жоспары бар.</p>
  <div class="row">${G.map(g=>`<a class="btn" href="#list/${g[0]}">${g[1].split(" · ")[1]}</a>`).join("")}</div>
  ${G.map(g=>`<h2 id="lv-${g[0]}">${g[1]}</h2><p class="lede" style="margin-top:-4px">${g[2]}</p>${ids.filter(id=>Q[id].level===g[0]).map(id=>qCard(id,0)).join("")}`).join("")}`;
  bindCards();
}
function tickets(){
  app.innerHTML=`<h1>Билеттер</h1><p class="lede">Жаттығуға арналған билеттер: әрқайсысында бір жеңіл, бір орташа, бір күрделі сұрақ, үшеуі үш түрлі тақырыптан. Нақты емтихандағы билеттердің құрамы басқаша болуы мүмкін. Нүктелер сіздің белгілеріңізді көрсетеді: жасыл — білемін, қызыл — қайталау керек.</p>
  <div class="tgrid">${T.map((ids,i)=>`<a class="tile" href="#ticket/${i+1}"><small>БИЛЕТ</small>${i+1}${dots(ids)}</a>`).join("")}</div>`;
}
let timer=null,left=st.get("tleft",20*60);
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ticket(n){
  n=Math.min(Math.max(1,n|0),T.length);const ids=T[n-1];
  app.innerHTML=`<div class="thead"><div><p class="eyebrow">Билет</p><h1 style="margin:0">№ ${n}</h1></div>
    <div class="timer" role="timer"><b id="tm">${fmt(left)}</b><button type="button" id="tgo">${timer?"Тоқтату":"Бастау"}</button><button type="button" id="trs" aria-label="Таймерді қайта бастау">↺</button></div></div>
  ${ids.map((id,i)=>qCard(id,i+1)).join("")}
  <div class="pager"><a class="btn" href="#ticket/${n>1?n-1:T.length}">${ICON.left} ${n>1?n-1:T.length}</a>
  <button class="btn" type="button" id="rnd">${ICON.dice} Басқа билет</button>
  <a class="btn" href="#ticket/${n<T.length?n+1:1}">${n<T.length?n+1:1} ${ICON.right}</a></div>`;
  bindCards();
  document.getElementById("rnd").addEventListener("click",()=>{let r;do{r=1+Math.floor(Math.random()*T.length)}while(r===n&&T.length>1);location.hash="#ticket/"+r});
  const tm=document.getElementById("tm"),go=document.getElementById("tgo");
  const paint=()=>{tm.textContent=fmt(left);tm.classList.toggle("low",left<=120)};
  go.addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null;go.textContent="Бастау"}else{if(left<=0)left=20*60;timer=setInterval(()=>{left=Math.max(0,left-1);st.set("tleft",left);const el=document.getElementById("tm");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<=120)}if(left<=0){clearInterval(timer);timer=null;const g=document.getElementById("tgo");if(g)g.textContent="Бастау"}},1000);go.textContent="Тоқтату"}});
  document.getElementById("trs").addEventListener("click",()=>{left=20*60;st.set("tleft",left);paint()});
}
function topics(){
  app.innerHTML=`<h1>Тақырыптар</h1><p class="lede">Ресми 90 сұрақ силлабустың 15 тақырыбы бойынша топталды. Жолақ «Білемін» деп белгіленген сұрақтардың үлесін көрсетеді.</p>
  <div class="tlist">${Object.keys(E.topics).map(t=>{const ids=E.topics[t],k=ids.filter(id=>marks[id]==="k").length;
    return `<a class="trow" href="#topic/${t}"><span class="n">${String(t).padStart(2,"0")}</span><span class="tt">${esc(TT[t])}</span><span class="mini"><i style="width:${Math.round(k/ids.length*100)}%"></i></span><span class="pg">${k}/${ids.length}</span></a>`}).join("")}</div>`;
}
function topic(t){
  const ids=E.topics[t];if(!ids){location.hash="#topics";return}
  app.innerHTML=`<p class="eyebrow"><a href="#topics">Тақырыптар</a> · ${t}-тақырып</p><h1>${esc(TT[t])}</h1>
  ${ids.map(id=>qCard(id,0)).join("")}
  <div class="pager">${+t>1?`<a class="btn" href="#topic/${+t-1}">${ICON.left} ${+t-1}-тақырып</a>`:"<span></span>"}${+t<15?`<a class="btn" href="#topic/${+t+1}">${+t+1}-тақырып ${ICON.right}</a>`:""}</div>`;
  bindCards();
}
function review(){
  const ids=Object.keys(marks).filter(id=>marks[id]==="r"&&Q[id]);
  app.innerHTML=`<h1>Қайталау</h1><p class="lede">«Қайталау керек» деп белгілеген сұрақтарыңыз осында жиналады. Сұрақты меңгерген соң «Білемін» деп белгілеңіз, сонда ол тізімнен шығады.</p>
  ${ids.length?ids.map(id=>qCard(id,0)).join(""):`<p class="empty">Әзірге бос. Билеттерді шешкенде қиын сұрақтарды «Қайталау керек» деп белгілеңіз.</p>`}`;
  bindCards();
}
function route(){
  const h=location.hash.slice(1)||"home",[r,arg]=h.split("/");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r||(r==="ticket"&&a.dataset.r==="tickets")||(r==="topic"&&a.dataset.r==="topics")));
  if(r==="list"){list();if(arg){const el=document.getElementById("lv-"+arg);if(el){el.scrollIntoView();return}}}else if(r==="tickets")tickets();else if(r==="ticket")ticket(+arg);else if(r==="topics")topics();else if(r==="topic")topic(arg);else if(r==="review")review();else home();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const h=a.getAttribute("href");if(location.hash===h)route();else location.hash=h});
addEventListener("hashchange",route);route();
(()=>{const r=document.documentElement,b=document.getElementById("themeBtn");
  try{const s=localStorage.getItem("emt:theme");if(s)r.dataset.theme=JSON.parse(s)}catch(e){}
  b.addEventListener("click",()=>{const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";st.set("theme",r.dataset.theme)})})();
})();
</script>
</body>
</html>
