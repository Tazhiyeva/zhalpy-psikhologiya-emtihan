<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қорытынды емтихан</title>
<meta name="description" content="Жалпы психология: қорытынды емтиханға дайындық — 30 билет, 90 сұрақ, жауап жоспарлары">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap">
<style>
:root{
  --page:#F4F3EF; --sheet:#FFFFFF; --ink:#1D1D1B; --ink-2:#55544F; --ink-3:#86847C; --rule:#DEDBD2; --tint:#ECEAE3;
  --acc:#2F5DA8; --acc-ink:#FFFFFF; --acc-tint:#E6EEFA;
  --e-bg:#E1F5EE; --e-bd:#1D9E75; --e-ink:#085041;
  --m-bg:#FAEEDA; --m-bd:#BA7517; --m-ink:#633806;
  --h-bg:#FAECE7; --h-bd:#D85A30; --h-ink:#712B13;
  --ok:#1F7A4C; --ok-tint:#E3F3EA; --bad:#B3261E; --bad-tint:#FBE7E5;
  --f-d:"Montserrat",Arial,system-ui,sans-serif; --f-u:"IBM Plex Sans","PT Sans",system-ui,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#161615; --sheet:#1F1F1D; --ink:#ECEAE3; --ink-2:#B9B7AE; --ink-3:#8C8A82; --rule:#34332F; --tint:#2A2A27;
  --acc:#8FB3F0; --acc-ink:#0E1A2E; --acc-tint:#1C2638;
  --e-bg:#0B3A30; --e-bd:#1D9E75; --e-ink:#BFEEDD; --m-bg:#45290A; --m-bd:#BA7517; --m-ink:#FBE0B0; --h-bg:#4F2212; --h-bd:#D85A30; --h-ink:#FBD5C6;
  --ok:#5FD39B; --ok-tint:#14301F; --bad:#FF8A80; --bad-tint:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#161615; --sheet:#1F1F1D; --ink:#ECEAE3; --ink-2:#B9B7AE; --ink-3:#8C8A82; --rule:#34332F; --tint:#2A2A27;
  --acc:#8FB3F0; --acc-ink:#0E1A2E; --acc-tint:#1C2638;
  --e-bg:#0B3A30; --e-bd:#1D9E75; --e-ink:#BFEEDD; --m-bg:#45290A; --m-bd:#BA7517; --m-ink:#FBE0B0; --h-bg:#4F2212; --h-bd:#D85A30; --h-ink:#FBD5C6;
  --ok:#5FD39B; --ok-tint:#14301F; --bad:#FF8A80; --bad-tint:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.6 var(--f-u)}
a{color:var(--acc)}
button{font:inherit;color:inherit;touch-action:manipulation}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 16px/1.2 var(--f-d);text-decoration:none;color:var(--ink);margin-right:auto}
.brand small{display:block;font:500 11px/1.3 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:4px}
.nav a{min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:500}
.nav a.on{background:var(--acc-tint);color:var(--acc)}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:880px;margin:0 auto;padding:24px 16px 72px}
h1{font:700 clamp(26px,5vw,36px)/1.15 var(--f-d);margin:0 0 10px}
h2{font:600 19px/1.3 var(--f-d);margin:28px 0 12px}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:64ch}
.eyebrow{font:500 12px/1.4 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:600 24px/1.2 var(--f-d)}
.stat span{font-size:13.5px;color:var(--ink-2)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv{border-radius:12px;padding:12px 14px;border:1px solid}
.lv b{display:block;font-weight:600}
.lv span{font-size:14px}
.L-easy{background:var(--e-bg);border-color:var(--e-bd);color:var(--e-ink)}
.L-medium{background:var(--m-bg);border-color:var(--m-bd);color:var(--m-ink)}
.L-hard{background:var(--h-bg);border-color:var(--h-bd);color:var(--h-ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none;color:var(--ink);font:600 17px/1 var(--f-d)}
.tile small{font:500 11px/1 var(--f-m);color:var(--ink-3);letter-spacing:.05em}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.k{background:var(--ok)} .dots i.r{background:var(--bad)}
.tlist{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none;color:var(--ink);min-height:54px}
.trow .n{font:500 12px/1 var(--f-m);color:var(--ink-3);min-width:26px}
.trow .tt{flex:1;font-weight:500}
.trow .pg{font-size:13px;color:var(--ink-2);white-space:nowrap}
.mini{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;width:70px}
.mini i{display:block;height:100%;background:var(--ok)}
.thead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);padding:4px 4px 4px 12px}
.timer b{font:600 18px/1 var(--f-m);min-width:58px}
.timer b.low{color:var(--bad)}
.timer button{min-height:38px;padding:0 12px;border-radius:9px;border:0;background:var(--tint);cursor:pointer;font-size:14px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;margin:0 0 14px}
.qtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.badge{font:500 12px/1 var(--f-m);letter-spacing:.04em;padding:5px 8px;border-radius:7px;border:1px solid}
.topic{font-size:13.5px;color:var(--ink-2);text-decoration:none}
.qtext{font:500 17px/1.5 var(--f-u);margin:0}
.ans{margin-top:12px;border-top:1px dashed var(--rule);padding-top:12px}
.ans ol{margin:0 0 10px;padding-left:22px}
.ans li{margin:0 0 7px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.terms span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--ink-2)}
.tip{background:var(--acc-tint);border-radius:10px;padding:9px 12px;font-size:14.5px;margin:0 0 10px}
.tip b{color:var(--acc)}
.src{font-size:13px;color:var(--ink-3);margin:0}
.qact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qact .btn{min-height:42px;font-size:14.5px;padding:0 14px}
.mk.k.on{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.mk.r.on{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.empty{color:var(--ink-2);background:var(--sheet);border:1px dashed var(--rule);border-radius:12px;padding:14px}
.foot{margin-top:36px;font-size:13px;color:var(--ink-3)}
@media (max-width:620px){.bar-in{flex-wrap:wrap;row-gap:6px;padding:8px 12px}.nav{order:3;width:100%}.nav a{flex:1;justify-content:center;padding:0 6px;font-size:14px}.q{padding:14px}}
</style>
</head>

</div></header>
<main id="app" aria-live="polite"></main>
<script>window.EXAM={"titles": {"1": "Психология ғылым ретінде", "2": "Зерттеу әдістері", "3": "Психика және сана", "4": "Іс-әрекет психологиясы", "5": "Тұлға және қарым-қатынас", "6": "Түйсік және қабылдау", "7": "Ес", "8": "Зейін", "9": "Ойлау және сөйлеу", "10": "Қиял", "11": "Эмоция және сезім", "12": "Ерік", "13": "Темперамент", "14": "Мінез", "15": "Қабілет"}, "questions": {"01-E1": {"id": "01-E1", "level": "easy", "q": "Психологияның пәні не? Психикалық құбылыстардың негізгі топтарын сипаттаңыз.", "plan": ["«Психология» сөзі грек тілінен шыққан: <i>психе<\/i> — жан, <i>логос<\/i> — ілім. Бүгінгі мағынасы — психика мен психикалық құбылыстар туралы ғылым.", "<b>Психологияның пәні<\/b> — психиканың деректері, заңдылықтары және механизмдері. Психология құбылысты сипаттаумен шектелмейді, оны басқаратын заңды ашып, түсіндіреді.", "<b>Психикалық процестер<\/b> мінез-құлықты ең алдымен реттейді. Олардың басы, барысы және соңы бар. Үш тобы бар: танымдық процестер (түйсік, қабылдау, елес, ес, қиял, ойлау, сөйлеу, зейін), эмоциялық процестер және еріктік процестер.", "<b>Психикалық қалыптар (күйлер)<\/b> адамның белгілі бір уақыттағы жалпы психикалық күйін көрсетеді: сергектік, жабырқау, қорқыныш, көңілдің көтерілуі. Олар процестің жүрісіне әсер етіп, іс-әрекетті жеңілдетеді не тежейді.", "<b>Психикалық қасиеттер<\/b> — тұлғаның ең тұрақты ерекшеліктері: бағыттылық, темперамент, қабілет, мінез. Олар адамның қайталанбас даралығын құрайды.", "Топтың да психикалық құбылыстары бар: қарым-қатынас, топтағы ахуал, ұйымшылдық, жанжал. Оларды әлеуметтік психология зерттейді."], "terms": ["психика", "психология пәні", "психикалық процестер", "психикалық қалыптар", "психикалық қасиеттер"], "tip": "Үш топты уақытпен ажыратыңыз: процесс тез өтеді, қалып біраз уақыт сақталады, қасиет тұрақты болады.", "src": "Бабаев, 1-дәрісбаян; Маклаков, 1-тарау (1.3)", "link": null, "topic": 1}, "01-E2": {"id": "01-E2", "level": "easy", "q": "Психологияның негізгі міндеттері қандай? Психология салаларын қандай белгі бойынша топтастырады?", "plan": ["<b>Психологияның негізгі міндеті<\/b> — психикалық іс-әрекеттің заңдарын оның дамуымен бірге зерттеп тану. Бұл заңдар сыртқы дүние адамның миында қалай бейнеленетінін, адам әрекетін қалай реттейтінін, тұлғаның психикалық қасиеттері қалай қалыптасатынын ашады.", "Психология деректер мен заңдылықтарды тауып қана қоймайды, оларды іске асыратын <b>механизмдерді<\/b> де анықтайды. Бұл механизмдер мидың жұмысына байланысты, сондықтан психология оларды физиологиямен бірге зерттейді.", "<b>Практикалық міндеттері<\/b> де көп: білім беру, өндіріс, медицина, спорт, мемлекеттік басқару психологиясыз нәтиже бермейді. Мысалы, психология оқу мен тәрбиенің ең тиімді әдістерін және әр жастағы баланың психикалық даму мүмкіндігін анықтайды.", "Салаларды үш белгі бойынша топтастырады. <b>Іс-әрекет түрі бойынша:<\/b> еңбек психологиясы (инженерлік, авиация, ғарыш психологиясы), педагогикалық, медициналық, заң, әскери, спорт психологиясы.", "<b>Даму бойынша:<\/b> жас сатыларының психологиясы (бала, жасөспірім, ересек, қарттық психологиясы), арнайы психология (олигофрено-, сурдо-, тифлопсихология) және салыстырмалы психология. <b>Адам мен қоғамның қатынасы бойынша:<\/b> әлеуметтік психология.", "Барлық салаға <b>жалпы психология<\/b> негіз береді. Ол психиканың пайда болу және даму заңдылықтарын, ғылымның әдіснамасы мен тарихын зерттейді."], "terms": ["психология міндеттері", "жалпы психология", "педагогикалық психология", "жас сатыларының психологиясы", "арнайы психология", "әлеуметтік психология"], "tip": "Міндетті пәнмен шатастырмаңыз: пән психологияның нені зерттейтінін көрсетеді, ал міндет оның не істеуі керек екенін көрсетеді (заңдылықты ашу, механизмді анықтау, практикаға көмектесу).", "src": "Бабаев, 1-дәрісбаян (1, 2 және 4-бөлімдер); Маклаков, 2-тарау (2.6)", "link": null, "topic": 1}, "01-M1": {"id": "01-M1", "level": "medium", "q": "Психология пәні туралы түсінік тарихта қалай өзгерді? Даму кезеңдерін түсіндіріңіз.", "plan": ["Эббингауз айтқандай, психологияның өткені ұзақ, ал тарихы қысқа. Ол XIX ғасырдың екінші жартысында философиядан бөлініп, өз эксперименттік әдістерін қолдана бастады. Пәні туралы түсінік төрт кезеңде өзгерді.", "<b>1-кезең — жан туралы ғылым.<\/b> Ежелгі адамдар түсініксіз құбылыстың бәрін тәннен бөлек жанмен түсіндірді. Идеалистер жанды мәңгі, материядан тәуелсіз деп санады, материалистер оны материяның туындысы деді. Аристотель жанды тәннен бөлуге болмайды деп есептеді.", "<b>2-кезең — сана туралы ғылым.<\/b> XVII ғасырда ойлау, сезіну, қалау қабілеттерін бір атпен «сана» деп атай бастады. Декарт жан мен тәнді бір-біріне тәуелсіз екі бастау деп қарсы қойды, бұл ілім <b>дуализм<\/b> аталды. Негізгі әдіс — адамның өзін-өзі бақылауы, яғни <b>интроспекция<\/b>.", "Вундт Лейпцигте алғашқы эксперименттік психология зертханасын ашты. Бірақ интроспекция сананы сыртқы дүниеден бөліп тастады, психология практика қойған сұрақтарға жауап бере алмады. Осыдан дағдарыс туды.", "<b>3-кезең — мінез-құлық туралы ғылым.<\/b> XX ғасырдың басында бихевиоризм пайда болды. Уотсон психология сырттан бақыланатын әрекет-қылықты, яғни стимулға берілетін жауапты зерттеуі керек деді. Бабаевтың сөзімен айтсақ, психология алдымен «жансыз», соңында «санасыз» ғылымға айналды.", "<b>4-кезең — психика туралы ғылым.<\/b> XX ғасырдың екінші жартысынан бастап психология психиканың деректерін, заңдылықтарын және механизмдерін зерттейді. Саналы құбылыстарды да, бейсананы да, мінез-құлықты да бір жүйеде қарайды."], "terms": ["жан", "сана", "интроспекция", "дуализм", "бихевиоризм", "психика"], "tip": "Әр кезеңнің пәнін сол кезеңнің әдісімен бірге атаңыз: сана кезеңінде — өзін-өзі бақылау, мінез-құлық кезеңінде — сырттан бақылау мен эксперимент.", "src": "Маклаков, 2-тарау (2.1–2.3); Бабаев, 1-дәрісбаян", "link": null, "topic": 1}, "01-M2": {"id": "01-M2", "level": "medium", "q": "Психология басқа ғылымдармен қалай байланысты? Оны неліктен ғылымдар тоғысында тұр дейді?", "plan": ["Адамды көп ғылым зерттейді, әрқайсысы оның бір қырын қарайды. Психология адам туралы ғылымдардың жетістігін біріктіреді. Оның ғылымдар арасындағы орны тарихта жиі өзгерген.", "Бүгін ғалымдар Кедров ұсынған сызбаны қолданады: ғылымдар үшбұрыш түрінде орналасады, оның шыңдарында — жаратылыстану, әлеуметтік және философиялық ғылымдар. Психология осы үшбұрыштың ортасында тұр, зерттеу міндетіне қарай бір шыңға жақындайды.", "<b>Философиямен:<\/b> психология ұзақ уақыт философияның ішінде дамыды. Материя мен сананың арақатынасы, дүниетаным, өмірдің мәні сияқты мәселелерді екеуі де қарастырады.", "<b>Жаратылыстану ғылымдарымен:<\/b> психика — мидың қызметі, сондықтан психология жоғары жүйке қызметінің физиологиясына сүйенеді. Осы байланыстың арқасында психология эксперимент жасай бастады, ал Сеченов пен Павлов рефлекторлық теорияны ашты. Дарвиннің эволюциялық теориясы психиканың бейімделудегі мәнін түсіндірді.", "<b>Қоғамдық ғылымдармен:<\/b> тарих, әлеуметтану, экономика, құқық адамның топтағы мінез-құлқын, көңіл-күйін, ахуалын білмей, әлеуметтік процестерді толық түсіндіре алмайды. Ал адам психикасының өзі қоғамдық-тарихи жағдайда қалыптасады.", "<b>Педагогикамен<\/b> байланыс ерекше. Ушинский: «Адамды жан-жақты тәрбиелеу үшін оны жан-жақты зерттеу керек» деген. Психологияға сүйенбеген педагогика құр кеңестер жиынтығына айналады.", "Байланысы көп болса да, психология — дербес ғылым: оның өз пәні, өз теориялық қағидалары және өз зерттеу әдістері бар."], "terms": ["ғылымдар үшбұрышы", "философия", "жаратылыстану ғылымдары", "қоғамдық ғылымдар", "педагогика"], "tip": "Әр байланысқа бір нақты мысал келтіріңіз және соңында психологияның дербес ғылым екенін міндетті түрде айтыңыз.", "src": "Бабаев, 1-дәрісбаян (3-бөлім); Маклаков, 2-тарау (2.5)", "link": null, "topic": 1}, "01-H1": {"id": "01-H1", "level": "hard", "q": "Психология мамандығында оқитын Айжанға жатақханадағы бөлмелесі былай дейді: «Психология ғылым емес. Әжем адамды бір көргеннен таниды, оқымаса да сенен жақсы психолог. Сендер кітаптан оқитын нәрсені біз күнде көріп жүрміз». Бөлмелестің пікірін тұрмыстық және ғылыми психологиялық білім ұғымдарымен талдаңыз. Айжан оған не деп жауап бере алады?", "plan": ["<b>Не болып тұр:<\/b> бөлмелес тұрмыстық психологиялық білімді ғылыми біліммен теңестіріп тұр. Әр адам кішкентайынан басқаның көңіл-күйін бет-әлпетінен, даусынан, жүріс-тұрысынан «оқиды». Бұл — өмір тәжірибесінен жиналған тұрмыстық білім.", "<b>Тұрмыстық білімнің белгілері:<\/b> ол нақты жағдайға, нақты адамға байланған; интуицияға, яғни ішкі сезімге сүйенеді және кездейсоқ тәжірибеден туады; оны басқаға беру қиын. Мұндай білім дұрыс болуы мүмкін, бірақ ол жүйесіз, терең емес, дәлелі аз.", "<b>Ғылыми білімнің белгілері:<\/b> ол ұғымдарға сүйеніп, жалпылама қорытынды жасайды; бақылау мен эксперимент арқылы алынады, сондықтан ол саналы әрі дәлелді болады; ұрпақтан ұрпаққа жиналып беріледі; бір адам жинай алмайтын мол деректі қамтиды.", "<b>Талдау:<\/b> әженің «бір көргеннен тануы» тек өзі білетін адамдарға қатысты және тексерілмеген. Ол кейде қателеседі, бірақ қатесін өзі байқамайды, ал басқа ортадан шыққан адамға келгенде жаңылуы мүмкін.", "Ғылым психиканың сыртқы көрінісін сипаттаумен тоқтамайды, оның заңдылықтары мен механизмдерін ашады.", "Тұрмыстық білімді жоққа шығарудың қажеті жоқ: ғылыми психологияның бастаулары халықтың өмір тәжірибесінде, мақал-мәтел мен ертекте жатыр.", "<b>Қорытынды:<\/b> Айжан екі білімнің айырмашылығын түсіндіріп, психологияның өз пәні, әдістері мен заңдары бар дербес ғылым екенін айтады. Тұрмыстық білім бастама береді, ғылыми білім оны тексеріп, жүйеге келтіреді. Сондықтан психологты кітапсыз, тек өмір тәжірибесімен даярлау мүмкін емес."], "terms": ["тұрмыстық психологиялық білім", "ғылыми психологиялық білім", "бақылау", "эксперимент", "психология пәні"], "tip": "Тұрмыстық білімді «қате» деп жоққа шығармаңыз: оның шектеулерін атап, ғылыми білімнің артықшылығын көрсетіңіз.", "src": "Маклаков, 1-тарау (1.3); Бабаев, 1-дәрісбаян", "link": null, "topic": 1}, "01-H2": {"id": "01-H2", "level": "hard", "q": "9-сынып оқушысы Ерасыл соңғы айда жиі төбелеске араласады. Мектепте оны екі психолог қарады. Біріншісі оның сырттан көрінетін әрекетін ғана тіркеп, жақсы мінезі үшін марапат, төбелес үшін жаза жүйесін ұсынды. Екіншісі оның балалық шағындағы басылған сезімдерін, түстерін сұрап, бейсаналы ішкі қақтығысты іздеді. Әр маманның тәсілі психологияның қай бағытына сай келеді? Олардың күшті және әлсіз жағын бағалап, қорытынды жасаңыз.", "plan": ["<b>Не болып тұр:<\/b> бір жасөспірімнің мінез-құлқын екі маман екі түрлі түсіндіреді. Бұл — XX ғасырда пайда болған психологиялық бағыттардың айырмашылығы.", "<b>Бірінші маман — бихевиоризм.<\/b> Бұл бағыт бойынша психология сананы емес, сырттан бақыланатын әрекет-қылықты зерттеуі керек, ал мінез-құлық — сыртқы әсерге берілетін жауаптар жиынтығы. Күшті жағы: нақты әрекетпен жұмыс істейді, объективті әдіске сүйенеді. Әлсіз жағы: сана, ойлау, ерік ұғымдарын психологиядан шығарып тастады, психиканың әлеуметтік жағын ескермеді. Ал әр әрекеттің астында адамның өз ойы, сезімі мен ниеті жатыр.", "<b>Екінші маман — фрейдизм.<\/b> Бұл бағыт бойынша адамның әрекетін санадан гөрі бейсанадағы күштер басқарады: құмарлық пен қоғам тыйымы үнемі қақтығысады. Басылған тілек түс, жаңсақ сөйлеу, невроз белгілері арқылы сыртқа шығады. Күшті жағы: бейсананың бар екенін көрсетті. Әлсіз жағы: сананың күшін жоққа шығарады, қоғамдық дамуды ескермейді.", "<b>Талдау:<\/b> екі тәсіл де Ерасылдың бір қырын ғана көреді. Біреуі тек сыртқы әрекетке, екіншісі тек бейсанаға қарайды. Ал оның төбелесі қазіргі ортасына, сыныптағы қарым-қатынасына, өзіне берген бағасына да байланысты болуы мүмкін.", "Кейінгі бағыттар бұл біржақтылықты түзеуге тырысты. Гуманистік психология сау, өзін дамытуға ұмтылатын тұлғаны зерттейді. Когнитивтік психология адамның ақпаратты қалай қабылдап, өңдейтінін зерттейді.", "<b>Қорытынды:<\/b> ғылыми психология детерминизм, сана мен іс-әрекет бірлігі және даму принциптеріне сүйенеді. Яғни Ерасылдың мінез-құлқын себебімен, іс-әрекетімен және дамуымен бірге қарау керек. Маман оның сыртқы әрекетін де, ішкі толғанысын да, өмір жағдайын да зерттеуі тиіс."], "terms": ["бихевиоризм", "фрейдизм", "бейсана", "гуманистік психология", "когнитивтік психология", "детерминизм принципі"], "tip": "Бағытты атау жеткіліксіз: әр бағыт психологияның пәні деп нені санағанын айтып, оның шектеулерін көрсетіңіз.", "src": "Бабаев, 2-дәрісбаян; Маклаков, 2-тарау (2.3)", "link": null, "topic": 1}, "02-E1": {"id": "02-E1", "level": "easy", "q": "Ғылыми әдіс дегеніміз не? Теория мен болжамның айырмашылығын сипаттаңыз.", "plan": ["Ғылыми білім <b>эмпирикалық<\/b>: ол кім бақыласа да қайта байқауға болатын нақты дәлелге сүйенеді. Зерттеу фактіні жай пікірден осылай ажыратады.", "<b>Ғылыми әдіс<\/b> — идеяны шынайы әлеммен салыстырып тексеру үдерісі. Ғалым болжамын бақылаумен тексереді, бақылау жаңа идеяға жетелейді, ол идеяны да қайта тексереді. Сондықтан бұл үдеріс шеңбер тәрізді.", "Шеңберде пайымдаудың екі түрі бар. <b>Дедуктивтік пайымдау<\/b> жалпыдан жекеге жүреді, ол болжамды тексеру үшін керек. <b>Индуктивтік пайымдау<\/b> жекеден жалпыға жүреді: бақылаулардан жалпы тұжырым жасап, теория құрады.", "<b>Теория<\/b> — байқалған құбылыстарды түсіндіретін, жан-жақты жетілген идеялар жүйесі. Ол тым күрделі, сондықтан оны бірден толық тексеру мүмкін емес.", "<b>Болжам (гипотеза)<\/b> — теорияның бір қырын тексеретін нақты болжау. Ол көбіне «егер…, онда…» түрінде айтылады. Болжам жоққа шығарылатын болуы керек: оның қате екенін көрсетуге мүмкіндік болуы тиіс.", "Нәтиже болжамды растаса, теорияның дұрыстығына дәлел көбейеді. Растамаса, ғалым теорияны өзгертіп, жаңа болжам құрады."], "terms": ["ғылыми әдіс", "теория", "болжам (гипотеза)", "жоққа шығарылатын болжам", "дедуктивтік пайымдау", "индуктивтік пайымдау"], "tip": "Теория мен болжамды шатастырмаңыз: теория — кең түсіндіру жүйесі, болжам — сол теориядан шығатын, тексеруге болатын нақты болжау.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.1 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s21-method", "label": "Ғылыми зерттеу үдерісі · сайттың 2.1-бөлімі"}, "topic": 2}, "02-E2": {"id": "02-E2", "level": "easy", "q": "Психологиялық зерттеу әдістері қалай жіктеледі? Негізгі және қосалқы әдістерді сипаттаңыз.", "plan": ["Бабаев бойынша қазіргі психология әдістердің төрт тобын қолданады: ұйымдастыру, эмпирикалық, деректерді өңдеу және түзету әдістері.", "<b>Ұйымдастыру әдістері<\/b> зерттеудің жалпы жобасын белгілейді. <i>Салыстыру әдісі<\/i> әр жастағы не әр түрлі топтарды салыстырады (көлденең қималы зерттеу). <i>Лонгитюдтік зерттеу<\/i> бір топты ұзақ уақыт бойы қайталап зерттейді. <i>Кешенді әдісте<\/i> бір нысанды түрлі ғылымның өкілдері бірге зерттейді.", "<b>Эмпирикалық әдістер<\/b> дерек жинайды: бақылау мен өзін-өзі бақылау, эксперимент, тест, сауалнама, әңгіме, социометрия, іс-әрекет өнімдерін талдау, өмірбаянды зерттеу. <b>Деректерді өңдеу әдістері<\/b> сандық (статистикалық) және сапалық болады. <b>Түзету әдістеріне<\/b> аутотренинг, топтық тренинг, психотерапия жатады.", "Маклаков әдістерді басқаша, екі топқа бөледі. <b>Субъективті әдістер<\/b> адамның өзі туралы есебіне не зерттеушінің пікіріне сүйенеді: бақылау, өзін-өзі бақылау, сұрау. <b>Объективті әдістерге<\/b> тест, эксперимент және модельдеу жатады.", "<b>Негізгі әдістер<\/b> — бақылау мен эксперимент, өйткені зерттеуші психикалық деректі тікелей солар арқылы алады. Бақылауда ол құбылысқа араласпай, оны табиғи жағдайда тіркейді. Экспериментте жағдайды өзі жасап, бір айнымалыны өзгертеді, сондықтан себеп-салдарды тек эксперимент ашады.", "<b>Қосалқы әдістер<\/b> негізгі әдістің деректерін толықтырып, тексереді: тест, сауалнама, әңгіме, іс-әрекет өнімдерін талдау, өмірбаянды зерттеу. Мысалы, оқушының шығармасын талдау оның қабілеті туралы қосымша дерек береді."], "terms": ["ұйымдастыру әдістері", "эмпирикалық әдістер", "субъективті және объективті әдістер", "бақылау", "эксперимент", "іс-әрекет өнімдерін талдау"], "tip": "Әдістерді жай тізбектемеңіз: алдымен жіктеуді атаңыз, сосын негізгі әдістің неліктен негізгі екенін түсіндіріңіз (деректі тікелей береді, ал эксперимент себепті ашады).", "src": "Бабаев, 2-дәрісбаян (психология әдістері); Маклаков, 1-тарау (1.4, 1.9-сурет); «Психологиялық зерттеу әдістері» сайты, 2.2", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s22-map", "label": "Әдістер картасы · сайттың 2.2-бөлімі"}, "topic": 2}, "02-M1": {"id": "02-M1", "level": "medium", "q": "Корреляциялық зерттеу мен экспериментті салыстырыңыз. Неліктен корреляция себеп-салдарды дәлелдемейді?", "plan": ["<b>Корреляция<\/b> — екі не одан көп айнымалының бірге өзгеруі. Оны −1-ден +1-ге дейінгі <i>r<\/i> коэффициенті көрсетеді: санның 1-ге жақындығы байланыстың күшін, таңбасы бағытын білдіреді. Оң корреляцияда айнымалылар бір бағытта өзгереді (бой мен салмақ), теріс корреляцияда қарама-қарсы бағытта өзгереді (ұйқы азайса, шаршау артады).", "Корреляция себепті көрсетпейді: екі айнымалыны үшінші бір айнымалы — <b>араласушы айнымалы<\/b> — бірге өзгертуі мүмкін. Мысалы, балмұздақ сатылымы мен қылмыс бірге өседі, бірақ екеуін де ыстық ауа райы көбейтеді.", "Адамдар кейде жоқ байланысты бар деп сенеді. Бұл <b>иллюзорлық корреляция<\/b>, мысалы, толған ай адамды оғаш әрекетке итермелейді деген сенім. Оның бір себебі — растауға бейімділік: адам өз ойын растайтын дәлелді іздеп, қайшы дәлелді елемейді.", "<b>Эксперимент<\/b> — себеп-салдарды анықтаудың жалғыз жолы. Ең қарапайым жобада екі топ болады: зерттеуші эксперименттік топқа әсер етеді (мысалы, сабақта компьютерлік бағдарламамен оқытады), ал бақылау тобына бұл әсер берілмейді. Басқа жағынан екі топ бірдей болуы керек.", "Зерттеуші <b>тәуелсіз айнымалыны<\/b> өзі өзгертеді де, оның әсерін <b>тәуелді айнымалы<\/b> арқылы өлшейді. Ол қатысушыларды топтарға <b>кездейсоқ бөледі<\/b>, сондықтан араласушы айнымалылар екі топқа шамамен бірдей тарайды. Корреляциялық зерттеудегі кедергі осылай жойылады.", "<b>Салыстыру:<\/b> корреляциялық зерттеу шынайы өмірдегі байланысты сипаттап, болжауға көмектеседі. Эксперимент айнымалыны қатаң бақылайды, бірақ жағдайы жасанды болады, ал кей сұрақты этика себебімен экспериментпен зерттеуге болмайды."], "terms": ["корреляция коэффициенті", "араласушы айнымалы", "иллюзорлық корреляция", "тәуелсіз айнымалы", "тәуелді айнымалы", "кездейсоқ бөлу"], "tip": "Теріс корреляцияны «байланыс жоқ» деп шатастырмаңыз: теріс таңба байланыстың бағытын ғана көрсетеді.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.3 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s23", "label": "Нәтижелерді талдау · сайттың 2.3-бөлімі"}, "topic": 2}, "02-M2": {"id": "02-M2", "level": "medium", "q": "Сенімділік пен валидтілік деген не? Олардың арақатынасын мысалмен түсіндіріңіз.", "plan": ["Деректер жинаудың кез келген түрінде екі талап ескеріледі: сенімділік және валидтілік.", "<b>Сенімділік<\/b> — өлшеу құралының бір нәтижені тұрақты түрде қайталап беру қабілеті. Оның үш түрі бар: <i>бағалаушылар арасындағы<\/i> сенімділік (бірнеше бақылаушының келісуі), <i>ішкі келісімділік<\/i> (бір нәрсені өлшейтін сұрақтардың өзара сәйкестігі) және <i>тест-ретест<\/i> (қайта өлшегенде нәтиженің тұрақты болуы).", "<b>Валидтілік<\/b> — құралдың өзі өлшеуге тиіс нәрсені шынымен өлшеуі. Түрлері: экологиялық валидтілік (нәтиже шынайы өмірге қаншалықты жалпыланады), конструктілік валидтілік (айнымалы өлшенетін ұғымды шынымен қамти ма), сырттай валидтілік (құрал сырттай қарағанда валидті болып көрінеді) және болжамдық валидтілік (тест болашақ нәтижені болжай ма).", "<b>Мысал:<\/b> дұрыс калибрленбеген ас үй таразысы бір мөлшерді әр жолы бірдей көрсетеді, бірақ үнемі қате көрсетеді. Ол сенімді, бірақ валидті емес.", "<b>Арақатынасы:<\/b> валидті өлшем міндетті түрде сенімді болады, ал сенімді өлшем валидті болмауы мүмкін. Нысанаға теңесек, белгілердің бір жерге тығыз жиналуы — сенімділік, нысананың ортасына түсуі — валидтілік.", "Сондықтан зерттеуші тұрақты нәтижемен шектелмей, құралдың нені өлшеп тұрғанын да тексереді. Мысалы, тест студентке екі аптадан кейін де бірдей нәтиже берсе, ол сенімді (тест-ретест). Ал ол студенттің келесі сессиядағы бағасын дұрыс болжаса, тесттің болжамдық валидтілігі бар."], "terms": ["сенімділік", "валидтілік", "бағалаушылар арасындағы сенімділік", "тест-ретест", "экологиялық валидтілік"], "tip": "«Сенімді болса, валидті де болады» деу — жиі қате: таразы мысалымен мұның керісінше екенін көрсетіңіз.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.3 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s23-rv", "label": "Сенімділік пен валидтілік · сайттың 2.3-бөлімі"}, "topic": 2}, "02-H1": {"id": "02-H1", "level": "hard", "q": "Университет оқытушысы сабақта ноутбукпен конспект жазатын студенттердің бағасы төмен деп байқады: ол өз тобындағы бірнеше студенттің бағасын салыстырып, «ноутбук оқуға зиян» деген қорытынды жасады. Бұл қорытынды ғылыми дәлел бола ма? Осы болжамды тексеретін эксперимент жобасын құрыңыз.", "plan": ["<b>Не болып тұр:<\/b> оқытушы шектеулі бақылаудан болжам құрды. Жеке бақылау болжамға жетелейді, бірақ санаулы мысал мен анекдоттық дәлел қорытынды жасауға жетпейді. Ноутбук пен баға арасында байланыс болса да, бұл — тек корреляция.", "<b>Неге дәлел емес:<\/b> корреляция себепті көрсетпейді. Бағаға араласушы айнымалы әсер етуі мүмкін: ноутбук ұстайтын студенттер басқа жағынан да ерекшеленуі ықтимал. Оқытушы растауға бейімділікке де ұшырауы мүмкін: өз ойына сай мысалдарды ғана байқайды.", "<b>Болжам:<\/b> «Егер студент конспектіні ноутбукпен жазса, онда оның тест нәтижесі қолмен жазғандардан төмен болады».", "<b>Жоба:<\/b> зерттеуші студенттер арасынан кездейсоқ іріктеме алып, қатысушыларды екі топқа <b>кездейсоқ бөледі<\/b>. Эксперименттік топ ноутбукпен, бақылау тобы қолмен жазады; дәріс, уақыт, тест бірдей. <b>Тәуелсіз айнымалы<\/b> — конспект жазу тәсілі. <b>Тәуелді айнымалы<\/b> — сол дәріс бойынша тест нәтижесі; «оқу нәтижесі» осылай нақты анықталады (операциялық анықтама).", "<b>Біржақтылықтан қорғау:<\/b> тестті тексеретін адам кімнің қай топта екенін білмеуі керек, сонда экспериментатордың біржақтылығы азаяды. Зерттеуші деректерді статистикалық талдайды: айырмашылықтың кездейсоқ шығу ықтималдығы 5 пайыздан аз болса, ол маңызды саналады.", "<b>Этика:<\/b> әр студент ақпараттандырылған келісімге қол қояды, қатысу ерікті болады, деректер құпия сақталады.", "<b>Қорытынды:<\/b> оқытушының бақылауы — болжамның бастауы ғана. Ноутбуктің оқуға әсері туралы дұрыс жобаланған эксперименттен кейін ғана айтуға болады."], "terms": ["болжам (гипотеза)", "эксперименттік топ", "бақылау тобы", "тәуелсіз айнымалы", "тәуелді айнымалы", "кездейсоқ бөлу"], "tip": "Кездейсоқ іріктеу мен кездейсоқ бөлуді шатастырмаңыз: біріншісі кімнің қатысатынын, екіншісі кімнің қай топқа түсетінін шешеді.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.3 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s23-exp", "label": "Эксперимент жобалау · сайттың 2.3-бөлімі"}, "topic": 2}, "02-H2": {"id": "02-H2", "level": "hard", "q": "Магистрант 3 жастан 7 жасқа дейінгі балалардың ойын кезінде құрдасын топтан шеттетуі қалай өзгеретінін зерттегісі келеді. Оның бір ғана жылы бар. Ол балабақшаның ойын алаңында балаларды бақыламақ, бірақ ата-аналарға айтпай-ақ жасырын бейнеге түсіргісі келеді. Қандай зерттеу тәсілін таңдау керек? Жоспардағы әдістемелік және этикалық қателерді талдаңыз.", "plan": ["<b>Не болып тұр:<\/b> магистрант жасқа байланысты өзгерісті зерттегісі келеді және мінез-құлықты табиғи ортада бақыламақ. Екі мәселе бар: уақыт бойы өзгерісті қалай өлшеу және бақылауды қалай этикалық түрде жүргізу.", "<b>Тәсілді таңдау:<\/b> лонгитюдтік зерттеу бір топты жылдар бойы қадағалайды, бірақ магистрантта бір жыл ғана бар, ал қатысушылар уақыт өте шығып қалады (аттриция). Сондықтан көлденең қималы зерттеу ыңғайлы: 3, 5 және 7 жастағы топтар бір мезгілде салыстырылады. Бірақ әр жастағы балалар әр түрлі жағдайда өскен болуы мүмкін (когорталық айырмашылық), магистрант мұны ескеруі керек.", "<b>Табиғи бақылау:<\/b> балалар бақылаушыны байқамауы керек, сонда олар әдеттегідей әрекет етеді, ақпараттың валидтілігі жоғары болады. Мысалы, осындай бір зерттеуде бірнеше балаға сымсыз микрофон тағылған, ал зерттеушілер алыстан бақылап, жазба жүргізген.", "<b>Бақылаушының біржақтылығы:<\/b> магистрант өз күткенін көріп қалуы мүмкін. Одан қорғану үшін қандай әрекетті «шеттету» деп тіркейтінін алдын ала нақты белгілейді, ал бір оқиғаны бірнеше бақылаушы жазады. Олардың келісімі — бағалаушылар арасындағы сенімділік.", "<b>Этикалық қате:<\/b> ата-анаға айтпай түсіруге болмайды. Бала 18 жасқа толмаған, сондықтан ақпараттандырылған келісімге ата-анасы не заңды өкілі қол қояды. Келісімде зерттеудің барысы мен қаупі, қатысудың ерікті екені, кез келген уақытта тоқтатуға болатыны жазылады, деректердің құпиялығына кепілдік беріледі. Жобаны алдын ала университеттің этика комиссиясы (сайттағы атауы — институционалдық сараптама кеңесі, IRB) мақұлдауы тиіс.", "<b>Қорытынды:<\/b> магистрант көлденең қималы жобаны таңдаса, нені тіркейтінін алдын ала белгілеп, бірнеше бақылаушымен бірге табиғи бақылау жүргізсе және ата-анадан келісім алса, зерттеу әрі сенімді, әрі этикалық болады."], "terms": ["лонгитюдтік зерттеу", "көлденең қималы зерттеу", "табиғи бақылау", "бақылаушының біржақтылығы", "ақпараттандырылған келісім"], "tip": "Тәсілді атаумен шектелмеңіз: оның осы жағдайдағы кемшілігін және одан қалай қорғанатыныңызды да айтыңыз.", "src": "«Психологиялық зерттеу әдістері» сайты, 2.2 және 2.4 (OpenStax, Psychology 2e, 2-тарау)", "link": {"url": "https://tazhiyeva.github.io/zertteu-adisteri/#s22-long", "label": "Лонгитюдтік және көлденең қималы зерттеу · сайттың 2.2-бөлімі"}, "topic": 2}, "03-E1": {"id": "03-E1", "level": "easy", "q": "Психика деген не? Ми мен психиканың байланысын зерттейтін жолдарды сипаттаңыз.", "plan": ["Тәжібаевтың анықтамасы бойынша, <b>психика<\/b> — ерекше ұйымдасқан материяның, яғни мидың қасиеті. Қарапайым айтсақ, психика кез келген заттан емес, тек ми мен жүйке жүйесінен туады. Ол — сыртқы дүниенің мидағы бейнесі.", "Психиканың екі негізгі қызметі бар: ол сыртқы дүниенің заттары мен құбылыстарын бейнелейді және сол бейне арқылы адамның мінез-құлқы мен іс-әрекетін реттейді.", "Жүйке жүйесі ішкі секреция бездерімен бірге бүкіл тіршілікті басқарады, адам мен сыртқы дүниенің байланысын реттейді, ағзаның әрекетін бір орталыққа бағындырады.", "Жан құбылыстары мимен байланысты деген ойды ежелгі грек ойшылдары айтқан. Бірақ бұл байланыста әлі де түсініксіз нәрсе көп: психикалық құбылыс неғұрлым күрделі болса, оның мидағы негізі соғұрлым аз зерттелген.", "Деректер төрт жолмен алынады. <b>Салыстырмалы физиология<\/b> түрлі жануарлардың жүйке жүйесін салыстырады. <b>Эксперименттік физиология<\/b> мидың бір бөлігін зақымдап, мінез-құлықтың қалай өзгергенін бақылайды. <b>Медициналық клиника<\/b> миы зақымданған науқастарды бақылайды. <b>Эмбриология<\/b> ұрықтың жүйке жүйесі қалай дамитынын зерттейді.", "Бүгін бұларға нейровизуализация әдістері қосылды: олар тірі адамның миын және оның белсенділігін көрсетеді."], "terms": ["психика", "жүйке жүйесі", "салыстырмалы физиология", "эксперименттік физиология", "нейровизуализация"], "tip": "Анықтамадан кейін төрт жолдың әрқайсысына «нені зерттейді» деп бір сөйлеммен жауап беріңіз.", "src": "«Психика, ми, сана» сайты, 1-тақырып (Тәжібаев, III тарау; Немов, 7.1); Бабаев, 1-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#psikhika", "label": "Психика және ми · сайттың 1-тақырыбы"}, "topic": 3}, "03-E2": {"id": "03-E2", "level": "easy", "q": "Сана деген не? Сананың негізгі белгілерін сипаттаңыз.", "plan": ["Немов пен Романова бойынша, <b>сана<\/b> — адамның өзін және қоршаған шындықты танудың ең жоғары деңгейі. Адамның ақылға қонымды және ерікті әрекеттері соған сүйенеді.", "Адамда сана бар екенін мына фактілер көрсетеді: ол өзі және дүние туралы біледі, өткені мен болашағы туралы ойлайды, білімін басқалармен бөліседі, тәжірибесін ұрпағына береді, өзін талдай алады.", "<b>Сананың белгілері:<\/b> адам айналасын қабылдап, оны сөзбен не таңбамен сипаттайды; өзін дүниеден және басқа адамдардан бөліп қарайды; өзіне сипаттама береді. Ол мінез-құлқын бақылап, басқарады, басқалармен білім, ой, толғаныс бөліседі, жағдайға қарай мінез-құлқын өзгертеді. Бұл белгілер неғұрлым көп болса, сол сәттегі сана соғұрлым жоғары.", "Сана — психиканың бір бөлігі ғана: адам оны ерікпен бақылай алады және сөзбен сипаттай алады. Сананың маңызды қасиеті — <b>рефлексия<\/b>, яғни сананың өзіне бағытталып, өзін тануы.", "Сананың түрлері: жеке сана, топтық сана (мысалы, отбасылық сана) және бұқаралық сана."], "terms": ["сана", "рефлексия", "жеке сана", "топтық сана", "бұқаралық сана"], "tip": "Сананы бүкіл психикамен теңестірмеңіз: сана — психиканың адам ерікпен бақылай алатын және сөзбен сипаттай алатын бөлігі.", "src": "«Психика, ми, сана» сайты, 16-тақырып (Немов, 5.1)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana", "label": "Сана ұғымы · сайттың 16-тақырыбы"}, "topic": 3}, "03-M1": {"id": "03-M1", "level": "medium", "q": "Психика филогенезде қандай сатылардан өтті? Психика дамуының сатыларын жануарлар мінез-құлқының түрлерімен салыстырыңыз.", "plan": ["Тірі ағзаның бәрінде <b>тітіркену<\/b> бар: ол тек тіршілікке тікелей қажет әсерге жауап береді, өсімдіктер осы деңгейде қалады. Леонтьевтің болжамы бойынша, психика <b>сезу<\/b> пайда болғанда туды. Сезу — бейтарап әсерге де жауап беру, егер ол қажетті нәрсенің белгісі болса. Мысалы, бір жасушалылар жарықты елемейді, бірақ жарық жылудың белгісіне айналса, оны сезе бастайды.", "<b>Қарапайым сенсорлық психика<\/b> — бірінші саты. Жануар заттың жеке қасиетін ғана бейнелейді: иісін, жылуын, жарығын. Бұл сатыда бір жасушалылар, медуза мен гидра, құрттар мен жәндіктер тұр. Мінез-құлқы негізінен инстинктік.", "<b>Перцептивтік психика<\/b> — екінші саты. Жануарлар құрлыққа шыққанда тіршілік жағдайы күрделенді, ми қыртысы дамыды. Жануар енді затты тұтас бейнелейді. Инстинктпен қатар өз өмірінде үйренген <b>дағды<\/b> басым бола бастайды. Бұл сатыда омыртқалылар тұр.", "<b>Интеллект сатысы<\/b> жоғары сүтқоректілерде, әсіресе адамтектес маймылдарда болады. Жануар заттардың арасындағы байланысты бейнелейді: алдымен шешу жолын іздейді, сосын ғана әрекет етеді. Мысалы, шимпанзе екі таяқты жалғап, жемісті тартып алды.", "Тәжібаев жануарлар мінез-құлқының түрлерін бөледі: <b>тропизм<\/b> (қоздырғышқа бүкіл денесімен бұрылу) → <b>инстинкт<\/b> (тұқым арқылы беріледі; шартсыз рефлекс — жеке мүшенің жауабы, ал инстинкт — бүкіл ағзаның тұтас әрекеті) → <b>дағды<\/b> (жеке өмірде үйреніледі, негізі — шартты рефлекс) → <b>ақыл нышандары<\/b> (маймыл).", "<b>Салыстыру:<\/b> екі жіктеу бір-біріне сәйкес келеді. Сенсорлық психикада инстинкт басым, перцептивтік психикада дағды күшейеді, интеллект сатысында ақыл нышандары көрінеді. Айырмашылығы: Леонтьев жануардың нені бейнелейтініне қарап бөледі (жеке қасиет → тұтас зат → заттар арасындағы байланыс), ал Тәжібаев мінез-құлық түріне қарап бөледі.", "Ең жоғары саты да санаға жетпейді: маймылдың ақылы жеміс пен құрал көз алдында тұрғанда ғана жұмыс істейді. <b>Сана<\/b> — психика дамуының ең жоғары формасы, ол тек адамда еңбек пен тіл арқылы пайда болды."], "terms": ["сезу", "қарапайым сенсорлық психика", "перцептивтік психика", "интеллект сатысы", "инстинкт (соқыр сезім)", "дағды"], "tip": "Екі жіктеуді шатастырмаңыз: Леонтьев сатыларды жануардың нені бейнелейтініне қарап бөледі, ал Тәжібаев мінез-құлық түріне қарап бөледі. Әр сатыға бір жануар мысалын келтіріңіз.", "src": "Бабаев, 3-дәрісбаян; «Психика, ми, сана» сайты, 2–3-тақырыптар (Тәжібаев, IV тарау)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#zhanuar", "label": "Инстинкт, дағды, интеллект · сайттың 3-тақырыбы"}, "topic": 3}, "03-M2": {"id": "03-M2", "level": "medium", "q": "Сана адамзат тарихында қалай пайда болды? Оның алғышарттары мен даму бағыттарын түсіндіріңіз.", "plan": ["Сана құрылымының көп бөлігі туа бітпейді, өмір барысында пайда болады. Бұл сұраққа әлі сенімді жауап жоқ, сондықтан айтылатыны — болжам. Болжам бойынша, сана адамдар тілді ойлап тауып, бірлескен өмір мен еңбекке көшкенде пайда болды.", "<b>Алғышарттары:<\/b> тік жүру қолды босатып, дүниені зерттеуге мүмкіндік берді; еңбек құралдарын жасау қолдың қимылын күрделендірді; тіл мен таңбалар білімді жинап, ұрпаққа беруге жол ашты, осылай ұжымдық сана пайда болды.", "Еңбек бөлінісі әр адамнан өз міндетін ұжымның ортақ мақсатымен байланыстыруды талап етті, сөйтіп жеке сана ұжымдық санадан бөлінді. Ми ұлғайып, күрделенді. Маңдай бөліктері — сананың ми орталықтары: олар адамда қыртыстың шамамен 30%-ын, адамтектес маймылдарда шамамен 15%-ын алады.", "Тәжібаев та осыны айтады: «Сана — еңбектің жемісі». Сөйлеу пайда болған соң алдымен нақты, көрнекі ұғымдар, кейін абстрактілі ұғымдар мен теориялық ойлау дамыды.", "<b>Даму бағыттары:<\/b> рефлексивтік — сана алдымен сыртқы дүниеге, кейін адамның өзіне бағытталды; ұғымдық — тілде ұғым-сөздер пайда болып, ғылыми білімді тасымалдады; тарихи — әр дәуірде сананың мазмұны өзгерді.", "Филогенездегі кезеңдер: алғашқы құралдар, бірлескен еңбек, дін мен өнер, ғылыми білім, машиналар мен аспаптар, ақпаратты сақтайтын жаңа құралдар. Осы кезеңдерден өтіп, сана психика дамуының ең жоғары формасына айналды. Ол тек адамға тән."], "terms": ["сана", "еңбек", "тіл", "ұжымдық сана", "жеке сана", "рефлексия"], "tip": "Алғышарттарды жай тізбектемеңіз: әрқайсысы санаға не бергенін бір сөйлеммен түсіндіріңіз.", "src": "«Психика, ми, сана» сайты, 18-тақырып (Немов, 5.3; Тәжібаев, IV тарау)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana-damu", "label": "Сананың пайда болуы мен дамуы · сайттың 18-тақырыбы"}, "topic": 3}, "03-H1": {"id": "03-H1", "level": "hard", "q": "Айгерім көлік жүргізуді үйреніп жүр. Алғашқы аптада ол әр қимылын ойланып жасайды, нұсқаушы сөз қатса, абдырап қалады. Үш айдан кейін жол бойы әңгімелесіп, радио тыңдап отырады, тежегішті қашан басқанын да аңғармайды. Бір күні жолға кенет бала жүгіріп шыққанда, ол бар назарын жинап, көлікті дер кезінде тоқтатты. Бұл өзгерісті сана мен бейсананың арақатынасымен түсіндіріңіз.", "plan": ["<b>Не болып тұр:<\/b> жаңа қозғалыс алдымен саналы басқарылады, кейін дағдыға айналып, бейсана реттелуге ауысады. Күтпеген, қауіпті жағдайда басқару қайтадан санаға оралады.", "<b>Теория:<\/b> психика мен мінез-құлық бір мезгілде саналы және бейсана реттеледі. Фрейд сана мен бейсананы бір-біріне қарсы күштер деп санады. Бірақ психологтардың көпшілігі мұнымен келіспейді: көп адам мұндай ішкі қақтығысты мүлде сезінбейді. Бернштейннің теориясы бойынша, автоматтанған және жаңа, күрделі қозғалыстар орталық жүйке жүйесінің әр түрлі деңгейлерінде реттеледі, ал басқару саналыдан бейсанаға және керісінше ауыса алады.", "<b>Талдау:<\/b> алғашқы аптада жүргізу — жаңа, күрделі міндет. Оны ең жоғары, саналы деңгей басқарады, сондықтан Айгерім әр қимылын ойлайды, ал нұсқаушының сөзі оны алаңдатады. Үш айда қимыл автоматтанып, төменгі, бейсана деңгейлерге ауысты. Сана босап, әңгіме мен радиоға назар аудара алады.", "Бала жолға шыққанда күтпеген, маңызды міндет туды. Мұндай кезде сана қайта қосылады: жаңа жағдай алдында, әдеттегі мінез-құлық нәтиже бермегенде, шешімді сана қабылдайды.", "Бейсана мұнда «төменгі» не зиянды нәрсе емес: ол жақсы меңгерілген, әдеттегі әрекетті өзіне алып, санаға күрделі міндет үшін орын босатады.", "<b>Қорытынды:<\/b> сана мен бейсана қарсылас емес, бірін-бірі толықтыратын реттеу деңгейлері. Қарапайым процестерді бейсана басқарады, жауапты шешім мен ерікті бақылауды қажет ететін күрделі процестерді сана басқарады. Сондықтан оқытқанда сананы да, бейсананы да ескеру керек. Мысалы, нұсқаушы үйренудің басында Айгерімді артық сөзбен алаңдатпауы керек, өйткені бұл кезде қимылдың бәрін сана басқарады."], "terms": ["сана", "бейсана", "сана мен бейсананың арақатынасы", "қозғалысты көпдеңгейлі реттеу", "дағды"], "tip": "Фрейдтің көзқарасын айтсаңыз, оған қазіргі психологияның қарсы дәлелін де келтіріңіз: сана мен бейсана бірін-бірі толықтырады.", "src": "«Психика, ми, сана» сайты, 19 және 21-тақырыптар (Немов, 5.4, 5.6)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#aragatynas", "label": "Сана мен бейсананың арақатынасы · сайттың 21-тақырыбы"}, "topic": 3}, "03-H2": {"id": "03-H2", "level": "hard", "q": "Бірінші курс студенті Дана семинарда жауап беруге қорқады, тек ең жеңіл тапсырманы таңдайды, бағасы жақсы болса да «менің қолымнан ештеңе келмейді» дейді. Ал топтасы Арман шамасы жетпейтін үш жобаға бірден жазылып, бәрінен сүрінеді, бірақ кінәні оқытушыдан көреді. Екі студенттің мінез-құлқын өзіндік сана ұғымдарымен талдаңыз. Әрқайсысына қандай кеңес бересіз?", "plan": ["<b>Не болып тұр:<\/b> екі студенттің өзі туралы түсінігі шынайы мүмкіндігіне сай емес. Бұл — өзіндік сананың, нақтырақ айтсақ, өзін-өзі бағалау мен талаптану деңгейінің мәселесі.", "<b>Теория:<\/b> жеке сананың адамның өзіне бағытталған бөлігі — <b>өзіндік сана<\/b>. Оның төрт бөлігі бар: өзін-өзі бағалау, талаптану деңгейі, «Мен» бейнесі және «Мен»-тұжырымдама.", "<b>Дана:<\/b> өзін-өзі бағалауы төмендетілген. Ол жақсы қасиеттерін кемітіп, кемшілігін асырып бағалайды. Талаптану деңгейі де төмен: мүмкіндігінен төмен, жеңіл міндетті таңдайды.", "<b>Арман:<\/b> өзін-өзі бағалауы жоғарылатылған. Ол жақсы қасиеттерін асырып, кемшілігін кемітеді. Шамасы жетпейтін міндетке кіріседі және сәтсіздіктен сабақ алмайды.", "Бір адамда бірнеше «Мен» бейнесі болады: «өзім үшін Мен», «басқалар үшін Мен» және басқалардың бағасынан туатын айналық «Мен». Өзін-өзі бағалау ересектер мен құрдастардың бағасы, оқудағы табыс, өзін басқалармен салыстыру арқылы қалыптасады. Дана жақсы бағаны өз «Меніне» өткізбейді, ал Арман сыни бағаны мойындамай, кінәні басқадан іздейді.", "<b>Кеңес:<\/b> мақсат — екеуін де барабар бағаға жақындату, яғни өзін басқалар бағалағандай шынайы бағалап, қиын, бірақ шамасы жететін міндетті алу. Екеуіне де оқытушы мен топтастарының шынайы бағасы көмектеседі, өйткені өзін-өзі бағалау басқалардың бағасы арқылы түзеледі.", "Данаға біртіндеп күрделенетін тапсырма беріп, оның нақты табысын өзіне көрсеткен жөн. Арманға бір жобаны таңдатып, нәтижесін өзімен бірге талдап, сәтсіздіктің себебін өз әрекетінен іздеуге үйреткен жөн."], "terms": ["өзіндік сана", "өзін-өзі бағалау", "талаптану деңгейі", "«Мен» бейнесі", "айналық «Мен»"], "tip": "Өзін-өзі бағалау мен талаптану деңгейін шатастырмаңыз: біріншісі — адамның өзіне берген бағасы, екіншісі — оның қандай табысқа жетуге үміттенетіні.", "src": "«Психика, ми, сана» сайты, 17–18-тақырыптар (Немов, 5.2–5.3)", "link": {"url": "https://tazhiyeva.github.io/psikhika-mi-sana/#sana-qurylym", "label": "Сананың құрылымы мен деңгейлері · сайттың 17-тақырыбы"}, "topic": 3}, "04-E1": {"id": "04-E1", "level": "easy", "q": "Іс-әрекет деген не? Адамның негізгі іс-әрекет түрлерін сипаттаңыз.", "plan": ["<b>Іс-әрекет<\/b> — адамның айналадағы дүниемен белсенді байланысы. Адам бұл байланыста дүниені таниды және оны өз қажетіне қарай өзгертеді. Іс-әрекеттің әрдайым түрткісі мен саналы мақсаты болады.", "Іс-әрекет — қоғамдық-тарихи құбылыс. Адам бір нәрсені тек өзі үшін жасаса да, басқалардан алған білім мен тәжірибені пайдаланады. Саналы мақсат адамның іс-әрекетін жануарлардың белсенділігінен ажыратады.", "Адам өмір бойы бірін-бірі алмастыратын үш негізгі іс-әрекетпен айналысады: <b>ойын, оқу және еңбек<\/b>. Олар соңғы нәтижесі, ұйымдасуы және түрткілері бойынша ерекшеленеді.", "<b>Ойын<\/b> материалдық та, рухани да өнім бермейді. Бала ойынға қызыққаннан кіріседі, ойында дүниені бейнелеп, оны өзгертуге ұмтылады. Ойын жеке және топтық, заттық, сюжеттік, рөлдік және ережелі болады.", "<b>Оқу<\/b> білім, ептілік және дағды игеруге бағытталады. Ол оқу орнында ұйымдасқан түрде де, басқа істің барысында жанама түрде де жүреді. <b>Еңбек<\/b> қоғамға пайдалы өнім жасайды, адамның қабілетін дамытып, мінезін тұрақтандырады.", "Әр жас кезеңінде баланың танымдық процестері мен тұлғалық қасиеттерін ең көп өзгертетін бір іс-әрекет болады. Оны <b>жетекші іс-әрекет<\/b> дейді: мектепке дейін — ойын, мектепте — оқу, ал есейген сайын еңбектің рөлі арта береді."], "terms": ["іс-әрекет", "ойын", "оқу", "еңбек", "жетекші іс-әрекет"], "tip": "Іс-әрекетті кез келген белсенділікпен шатастырмаңыз: оның басты белгісі — саналы мақсат.", "src": "Бабаев, 6-дәрісбаян; Маклаков, 5.1", "link": null, "topic": 4}, "04-E2": {"id": "04-E2", "level": "easy", "q": "Дағды, ептілік және әдет деген не? Әрқайсысына мысал келтіріңіз.", "plan": ["<b>Дағды<\/b> — жаттығу арқылы автоматтанған саналы әрекет. Адам оны әр қимылын ойлап жатпай-ақ орындайды. Мысалы, тәжірибелі жүргізуші тежегішті ойланбай басады, ал назары жолда болады.", "Дағды мазмұны бойынша үш түрлі болады: қимыл дағдысы (спортшының қимылы), сезімдік дағды (түсті ажырату, әріп тану) және интеллектуалды дағды (есептеу, оқу, жаттау). Аралық түрлері де бар: сезімдік-қимыл дағдысы (жазу, сурет салу) және сезімдік-ой дағдысы (математикалық ұғымдармен жұмыс).", "<b>Ептілік<\/b> — бұрын игерген білім мен дағдыны нақты, әсіресе жаңа жағдайда қолдана білу. Ептілік дағдыдан ауқымды: ол әрекеттің бірнеше жолын таңдауға мүмкіндік береді. Мысалы, студент үйренген формуласын бұрын көрмеген есепке қолданады.", "<b>Әдет<\/b> — бір әрекетті орындауға деген қажеттілік. Дағды әрекеттің қалай орындалатынын көрсетсе, әдет адамның оны істемей тұра алмайтынын білдіреді. Мысалы, үйге кіргенде қол жуу, үлкенге сәлем беру.", "Әдет пайдалы да, зиянды да болады. Сондықтан балада пайдалы әдетті ерте бастан, тұрақты талаппен қалыптастыру керек."], "terms": ["дағды", "ептілік", "әдет", "автоматтану"], "tip": "Дағды мен әдетті шатастырмаңыз: дағды — әрекетті орындау тәсілі, ал әдет — сол әрекетті істеуге деген қажеттілік.", "src": "Бабаев, 6-дәрісбаян", "link": null, "topic": 4}, "04-M1": {"id": "04-M1", "level": "medium", "q": "Іс-әрекеттің құрылымын түсіндіріңіз. Әрекет пен операция бір-бірінен немен ерекшеленеді?", "plan": ["Іс-әрекет теориясын кеңес психологтары жасаған, оны ең толық А.Н. Леонтьев баяндаған. Бұл теория бойынша іс-әрекеттің төрт қабаты бар: іс-әрекет — әрекет — операция — психофизиологиялық қызметтер. Әр қабаттың өз тірегі бар: іс-әрекет түрткіге, әрекет мақсатқа, операция шарттарға сүйенеді.", "<b>Іс-әрекет<\/b> — бір түрткі тудыратын әрекеттердің жиынтығы. Мысалы, мамандықты меңгеру — іс-әрекет, оған көптеген жеке әрекеттер кіреді.", "<b>Әрекет<\/b> — саналы мақсатқа бағытталған процесс, іс-әрекеттің негізгі бірлігі. Мақсат — қалаған нәтиженің санадағы бейнесі. Ірі мақсат ұсақ мақсаттарға бөлінеді: алма ағашын отырғызу үшін орын таңдап, шұңқыр қазып, көшетті көму керек.", "<b>Операция<\/b> — әрекетті орындау тәсілі, ол шарттарға байланысты: бір мақсатқа әртүрлі жағдайда әртүрлі тәсілмен жетуге болады. Операциялар аз ұғынылады немесе мүлде ұғынылмайды. Олар екі түрлі: бірі ортаға бейімделуден туады, екіншісі — автоматтанып, дағдыға айналған саналы әрекеттер.", "Әрекет пен операцияны саналылық ажыратады: әрекеттің мақсаты ұғынылады, барысын сана бақылайды. Құймақты ойланбай аударсақ, бұл — операция. Ал «қалай жақсырақ аударамын?» деп ойлана бастасақ, ол әрекетке айналады.", "Ең төменгі қабат — <b>психофизиологиялық қызметтер<\/b>: түйсіну, қимылдау, есте қалдыру сияқты туа біткен мүмкіндіктер. Оларсыз ешбір әрекет орындалмайды."], "terms": ["іс-әрекет", "әрекет", "операция", "мақсат", "психофизиологиялық қызметтер"], "tip": "Құрылымды төрт қабатымен және әр қабаттың неге сүйенетінімен бірге айтыңыз, әйтпесе жауап жай тізімге айналады.", "src": "Маклаков, 5.2; Бабаев, 6-дәрісбаян", "link": null, "topic": 4}, "04-M2": {"id": "04-M2", "level": "medium", "q": "Қажеттілік, түрткі және мақсат қалай байланысқан? Жетекші түрткі мен қосымша түрткілердің айырмашылығын түсіндіріңіз.", "plan": ["<b>Қажеттілік<\/b> — ағзаның тіршілігі мен дамуына керек нәрсеге мұқтаждығы, кернеу күйі. Табиғи қажеттіліктер (тамақ, ұйқы) тіршілікті сақтайды. Мәдени қажеттіліктер қоғамда пайда болады: олар қанағаттанбаса, адам өлмейді, бірақ оның әлеуметтік өмірі бұзылады.", "Қажеттілік өз затын тапқанша бағытсыз болады: адам мазасызданып, бірдеңе іздейді. Қажеттілік өз затымен кездескенде <b>түрткі (мотив)<\/b> туады, яғни түрткі — заты табылған, ұғынылған қажеттілік. Ол адамның не үшін әрекет ететінін анықтайды.", "<b>Мақсат<\/b> — іс-әрекеттің болашақ нәтижесін санада алдын ала болжау. Түрткі жалпы бағытты береді, ал мақсат нақты не істеу керегін белгілейді, сондықтан бір түрткіден әртүрлі мақсат туа береді. Мақсат жақын және алыс болады: есеп шығару — жақын мақсат, білікті маман болу — алыс мақсат.", "Адамның бір ісін әдетте бірнеше түрткі қозғайды. Солардың біреуі — <b>жетекші түрткі<\/b>: ол іс-әрекетті бастайды және адам үшін оның мәнін айқындайды. Қалғандары — <b>қосымша түрткілер<\/b>, оларды мотив-стимул деп те атайды: олар іс-әрекетті бастамайды, тек қосымша қолдайды.", "Мысалы, оқушы білім алу үшін оқиды, бірақ ата-анасының сыйлығы мен жоғары оқу орнына түсу де оны ынталандырады. Жетекші түрткі — білімге құштарлық, ал сыйлық пен оқуға түсу — қосымша түрткілер.", "Жаңа түрткі іс-әрекеттің барысында да пайда болады. Мақсатқа жету жағымды эмоция әкелсе ғана, сол мақсаттың өзі түрткіге айналады. Мұны <b>түрткінің мақсатқа ығысуы<\/b> дейді."], "terms": ["қажеттілік", "түрткі (мотив)", "мақсат", "жетекші түрткі", "қосымша түрткі (мотив-стимул)"], "tip": "Түрткі мен мақсатты шатастырмаңыз: түрткі адамның неге әрекет ететінін, мақсат нақты нені алғысы келетінін көрсетеді.", "src": "Бабаев, 6-дәрісбаян; Маклаков, 5.3", "link": null, "topic": 4}, "04-H1": {"id": "04-H1", "level": "hard", "q": "Бірінші сынып оқушысы Нұрислам есепті тек саусағымен санап шығарады. Әкесі оған «саусақпен санау — ұят, ішіңнен сана» деп ұрысады, енді бала жылап, есептен қашатын болды. Бұл жағдайды іс-әрекет психологиясының қай ұғымымен түсіндіресіз? Әкесіне қандай кеңес бересіз?", "plan": ["Жағдайда бала сыртқы, затпен жасалатын әрекеттен ішкі, ойша әрекетке әлі толық өтпеген. Бұл — <b>интериоризация<\/b> процесінің бір кезеңі.", "<b>Интериоризация<\/b> — сыртқы, затпен жасалатын әрекеттің ішкі, ойша әрекетке айналуы. Ал ішкі жоспардың сыртқы әрекетте көрінуін <b>экстериоризация<\/b> дейді.", "Ішкі әрекеттің құрылымы сыртқымен бірдей, бірақ ол заттармен емес, олардың бейнелерімен жасалады. Ол сыртқы әрекетті алдын ала дайындайды: күш-жігерді үнемдейді, керек әрекетті тез таңдатады, қатеден сақтайды.", "Бабаевтың мысалы бойынша, бала санауды үш кезеңмен үйренеді: алдымен таяқшаларды жылжытып санайды, сосын оларға тек қарап тұрып санайды, соңында заттан қол үзіп, сан мен сөзбен ойша санайды. Әр кезеңде әрекет қысқарып, жинақы бола түседі. Ойша әрекетті сәтті орындау үшін оны алдымен сыртқы түрде толық меңгеріп, нақты нәтиже алу керек.", "Талдау: Нұрислам әлі бірінші кезеңде тұр, саусақ — оның заттық тірегі, ал тірекке тыйым салу баланы бір кезеңнен аттап өтуге мәжбүрлейді. Оның үстіне ұрысу жағымсыз эмоция туғызады. Іс-әрекет теориясы бойынша жаңа түрткі жағымды эмоция болғанда ғана қалыптасады, сондықтан ұрыс оқуға деген ықыласты сөндіреді.", "Кеңес: саусаққа не таяқшаға тыйым салмай, тірекпен еркін санауға мүмкіндік беру. Тапсырманы біртіндеп қиындату: алдымен заттарға қарап санау, сосын көзді жұмып санау, кейін ойша санау. Әр сәтті қадамды мадақтау.", "Қорытынды: ішкі ойша әрекет сыртқы әрекеттен туады. Оны асықтырмай, кезең-кезеңімен дамыту керек."], "terms": ["интериоризация", "экстериоризация", "сыртқы іс-әрекет", "ішкі іс-әрекет", "түрткі (мотив)"], "tip": "Жағдайды «бала жалқау» деп түсіндірмеңіз: интериоризацияның кезеңдерін атап, Нұрисламның қай кезеңде тұрғанын көрсетіңіз.", "src": "Бабаев, 6-дәрісбаян; Маклаков, 5.3", "link": null, "topic": 4}, "04-H2": {"id": "04-H2", "level": "hard", "q": "Ерлан ауылда он жыл бойы механикалық беріліс қорабы бар көлік жүргізген. Қалаға көшіп, автоматты беріліс қорабы бар көлікке ауысқанда, сол аяғымен жоқ педальды іздей береді. Ал оның ұлы велосипед тепкендіктен, мопедті бір күнде меңгерді. Екі жағдайды дағдының заңдылықтарымен түсіндіріңіз. Ерланға қандай кеңес бересіз?", "plan": ["Екі жағдайда да бұрын қалыптасқан дағды жаңа әрекетті меңгеруге әсер етіп тұр. Ерланда бұл әсер кедергі келтіреді, ал ұлына көмектеседі.", "<b>Дағды<\/b> — жаттығу арқылы автоматтанған, сана бақылауынсыз орындалатын әрекет: ол қалыптасқанда артық қимылдар жойылып, қимылды көзбен бақылау бұлшықет сезімімен бақылауға ауысады. Жаңа дағды адамда бұрыннан бар дағдылардың ішінде пайда болады. Сондықтан ескі дағдылар жаңасына не тірек, не кедергі болады.", "<b>Дағды интерференциясы<\/b> — дағдылардың бір-біріне кедергі келтіруі: ескі дағды жаңасын тежейді немесе оның тиімділігін төмендетеді. Ерланның он жыл бойы қайталанған қимылы толық автоматтанған, сондықтан сол аяғы «өзі» педальды іздейді.", "<b>Дағды көшуі<\/b> — бұрын игерген дағдының жаңа әрекетті тез меңгеруге көмектесуі; ол екі әрекетте ортақ ұқсастық болғанда пайда болады. Ұлы велосипедте тепе-теңдік сақтауды, рульді басқаруды үйренген, ал мопедке дәл осы қимылдар керек. Бернштейн де осындай мысал келтіреді: коньки тебу екі дөңгелекті велосипедке үйренуге көмектеседі, өйткені екі қимылдың ішінде ортақ бөліктер бар.", "Талдау: Н.А. Бернштейн бойынша дағды үш кезеңде қалыптасады: алдымен адам қимылмен танысып, оны алғаш меңгереді; сосын қимыл автоматтанады; соңында ол тұрақтанып, кедергіге де бұзылмайтын болады. Сондықтан толық қалыптасқан ескі дағдыны бір сәтте «өшіру» қиын. Ал жаттықпаған дағды біртіндеп әлсірейді.", "Кеңес: алғашқы күндері көлікті баяу әрі саналы бақылаумен жүргізу; адам аз жерде жиі жаттығу; сол аяқты еденге әдейі қойып, соған дағдылану. Жаңа қимыл қайталанған сайын автоматтанып, ескі қимылды ығыстырады."], "terms": ["дағды", "дағды интерференциясы", "дағды көшуі", "автоматтану"], "tip": "Екі жағдайдың қарама-қарсы екенін бірден атаңыз: бірінде интерференция, екіншісінде көшу; әрқайсысының себебін әрекеттердің ұқсастығы мен айырмашылығы арқылы түсіндіріңіз.", "src": "Бабаев, 6-дәрісбаян; Маклаков, 5.4", "link": null, "topic": 4}, "05-E1": {"id": "05-E1", "level": "easy", "q": "Тұлға деген не? Оны «индивид» және «даралық» ұғымдарынан ажыратыңыз.", "plan": ["<b>Тұлға<\/b> — адамды өзгелерден ажырататын, оның әрекеттері мен қылықтарын айқындайтын ең тұрақты психологиялық қасиеттерінің жиынтығы. Тұлға адамның бүкіл психикасы емес: оған танымдық процестер мен психикалық күйлер кірмейді.", "Сөздің шығу тегі — латынның <i>persona<\/i> сөзі. Театрда актердің бетіне киетін маскасы, актердің өзі және ол сомдайтын рөл осылай аталған. Сөздің тарихы тұлғаның «бет», «рөл» деген ұғымдармен байланысты екенін көрсетеді.", "<b>Индивид<\/b> — адамның биологиялық бастауы, яғни туа біткен қасиеттері; индивид ретінде адам — биологиялық түрдің өкілі. Негізгі ой: «Индивид болып туады, тұлға болып қалыптасады».", "Тұлға қоғам ішінде, адамдармен қатынас пен іс-әрекет арқылы қалыптасады. Крысько мұны қысқа айтады: «Адамды табиғат жаратады, ал қалыптастыратын — қоғам».", "<b>Даралық<\/b> — адамның қайталанбас ерекшелігі, оның қасиеттерінің өзіндік үйлесімі. Әр адам дара, бірақ біреудің даралығы айқын, біреудікі байқала бермейді."], "terms": ["тұлға", "индивид", "даралық"], "tip": "«Тұлға» мен «адамды» бір мағынада қолданбаңыз: «адам» ұғымы кеңірек, оған психологиялық емес қасиеттер де кіреді.", "src": "Тұлға сайты, «Тұлға ұғымы» бөлімі (Немов, 97–104 б.; Крысько, 123–133 б.)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#ugym", "label": "Тұлға · «Тұлға ұғымы» бөлімі"}, "topic": 5}, "05-E2": {"id": "05-E2", "level": "easy", "q": "Тұлғаның әлеуметтенуі деген не? Әлеуметтенудің негізгі тетіктерін сипаттаңыз.", "plan": ["<b>Әлеуметтену<\/b> — адамзат жинақтаған әлеуметтік тәжірибені тұлғаның өмір мен іс-әрекет барысында игеруі. Бұл тәжірибе тәрбие мен оқыту арқылы, қоғамдағы рөлдерді игеру арқылы беріледі. Әлеуметтенудің мазмұнын сыртқы ықпалдар да, адамның соларға өз қатынасы да айқындайды.", "<b>Дәстүрлі тетік<\/b> — отбасы мен жақын ортаның нормаларын, көзқарастарын игеру. Ол көбіне бейсаналы түрде, қалыптасқан үлгілерді сынсыз қабылдау арқылы жүреді. <b>Институционалдық тетік<\/b> — мектеп, еңбек ұжымы, бұқаралық коммуникация құралдары сияқты қоғам институттарымен өзара әрекет.", "<b>Стильдендірілген тетік<\/b> субмәдениет арқылы жүреді: адам белгілі бір жастағы немесе кәсіптегі топтың құндылықтары мен мінез-құлық үлгілерін игереді.", "<b>Тұлғааралық тетік<\/b> — адам үшін маңызды адамдармен (ата-ана, сүйікті мұғалім, жақын дос) қарым-қатынас. Адам олардан эмпатия және өзін солармен теңестіру арқылы үлгі алады. <b>Рефлексивтік тетік<\/b> — ішкі диалог: адам түрлі құндылықтарды ойша бағалап, қабылдайды не жоққа шығарады.", "Әлеуметтенудің нәтижесінде тұлғаның әлеуметтік сапалары қалыптасады: азаматтылық, коммуникативтілік, әлеуметтік белсенділік, өмірге төзімділік."], "terms": ["әлеуметтену", "дәстүрлі тетік", "институционалдық тетік", "тұлғааралық тетік", "рефлексивтік тетік"], "tip": "Тетіктерді жай атамаңыз: әрқайсысына өз өміріңізден бір мысал келтіріңіз (отбасы, мектеп, достар тобы).", "src": "Тұлға сайты, «Әлеуметтік сипаттамалар» бөлімі (Крысько, 160–165 б.)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#aleumet", "label": "Тұлға · «Әлеуметтік сипаттамалар» бөлімі"}, "topic": 5}, "05-M1": {"id": "05-M1", "level": "medium", "q": "Тұлғаның құрылымы түрлі теорияларда қалай сипатталады? Кемінде үш көзқарасты салыстырыңыз.", "plan": ["Тұлғаның біртұтас анықтамасы жоқ, сондықтан оның құрылымын әр теория өзінше сипаттайды. Дәстүрлі түсінік бойынша тұлғаға қабілет, темперамент, ерік, мінез, эмоция, мотивтер мен қажеттіліктер кіреді.", "<b>Психоанализде<\/b> (З. Фрейд) тұлға үш бөліктен тұрады. <i>Ид<\/i> — бейсаналы құштарлықтар, <i>Эго<\/i> — адамның өзі туралы шынайы түсінігі, <i>Супер-эго<\/i> — адамның қоғам құндылықтары мен нормаларына сай қандай болуы керектігі туралы идеалды түсінігі, яғни ар-ождан.", "<b>Гуманистік<\/b> бағытта (А. Маслоу) құрылым — қажеттіліктердің иерархиясы: органикалық қажеттіліктерден бастап өзін-өзі өзектендіруге дейін. <b>Қасиеттер теориясында<\/b> (Г. Оллпорт, Р. Кеттелл, Г. Айзенк) құрылым — тұлға қасиеттерінің өзара байланысқан жүйесі.", "Отандық ғалымдар тұлғаның әртүрлі «өзегін» бөледі. В.Н. Мясищевте — адамның қатынастар жүйесі, А.Н. Леонтьевте — іс-әрекеттердің иерархиясы. К.К. Платонов төрт бөлікті атайды: бағыттылық, тәжірибе, психикалық процестердің ерекшеліктері және биопсихологиялық қасиеттер.", "Оқуға ең ыңғайлысы — В.Г. Крысько ұсынған үш жақты құрылым: <b>даралық-психологиялық<\/b> жағы — психикалық процестер, қасиеттер, күйлер. <b>Дүниетанымдық<\/b> жағы: дүниетаным, моральдық және адамгершілік бет-бейне; дүниетаным қалған жақтардың бәріне әсер етеді. <b>Әлеуметтік-психологиялық<\/b> жағы: басқа адамдарға қатынас, әлеуметтік рөлдер, позициялар, ұстанымдар.", "Құрылымның тағы бір бөлігі — <b>Мен-тұжырымдама<\/b>: адамның өзі туралы барлық түсінігі және оларға берген бағасы. Оның бағалау жағы — <b>өзін-өзі бағалау<\/b>. Оған жақын ұғым — <b>бірегейлік<\/b>: жағдай өзгерсе де, өзін «сол баяғы мен» деп сезіну (Э. Эриксон)."], "terms": ["тұлға құрылымы", "Ид, Эго, Супер-эго", "бағыттылық", "дүниетаным", "Мен-тұжырымдама"], "tip": "Теорияларды тек санамаламаңыз: әрқайсысы тұлғаның қай «өзегін» негізгі деп алатынын салыстырыңыз.", "src": "Тұлға сайты, «Тұлға құрылымы» бөлімі (Немов, 105–108 б.; Крысько, 137–141 б.)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qurylym", "label": "Тұлға · «Тұлға құрылымы» бөлімі"}, "topic": 5}, "05-M2": {"id": "05-M2", "level": "medium", "q": "Қарым-қатынастың негізгі жақтары мен түрлерін түсіндіріңіз. Вербалды және вербалды емес қарым-қатынасты салыстырыңыз.", "plan": ["<b>Қарым-қатынас<\/b> (Бабаевта — <i>тілдесу<\/i>) — бірлескен іс-әрекет қажеттілігінен туатын, адамдар арасындағы байланыс. Онда адамдар білімін, ойын, ниетін, сезімін бір-бірімен бөліседі. Оның нәтижесі — зат емес, адамдар арасында орнаған қатынас, сондықтан оған кемінде екі белсенді адам керек.", "Қарым-қатынастың үш жағы бар. <b>Коммуникативтік<\/b> жағы — ақпарат алмасу: хабар бір жақты берілмейді, екі адам кезек-кезек жауап қатады. <b>Интерактивтік<\/b> жағы — бір-біріне ықпал етіп, әрекеттерін үйлестіру не өзгерту.", "<b>Перцептивтік<\/b> жағы — адамдардың бірін-бірі қабылдап, түсінуі. Үшеуі — бір процестің қырлары: сөйлесіп отырып, біз бір мезгілде хабар береміз, әңгімелесушіге ықпал етеміз және оны «оқимыз».", "Қызметіне қарай қарым-қатынас <b>ақпараттық<\/b>, <b>реттеуші<\/b> (ықпал ететін) және <b>сезім білдіретін<\/b> болады. Адамдар арасындағы қатынастар жеке және қызметтік (ресми), дара және топтық, тең құқықты және тәуелді болып бөлінеді. Сипатына қарай олар үйлесімді, қарама-қарсылықты және дау-дамайлы болады.", "<b>Вербалды<\/b> қарым-қатынаста таңба — сөз. Сөйлеу — ең әмбебап құрал: ол ақпараттың мағынасын толық жеткізеді. Сөйлеу сыртқы және ішкі болады; сыртқы сөйлеу ауызша және жазбаша, ал ауызша сөйлеу диалог және монолог түрінде жүреді.", "<b>Вербалды емес<\/b> қарым-қатынаста таңба — сөзден тыс белгілер: ым, ишара, дене қимылы. Сөзге дауыс ырғағы мен әуені, іркіліс, күлкі, жылау да қосылады. Олар сөздің мәнін күшейтеді не әлсіретеді, адамның ниеті мен көңіл-күйін білдіреді.", "Ишараның мағынасы әр халықта әртүрлі: қазақ келіспегенде басын шайқайды, ал болгарлар басын изейді. Сондықтан вербалды емес белгілерді сол халықтың мәдениетімен бірге түсіну керек."], "terms": ["қарым-қатынас (тілдесу)", "коммуникативтік жағы", "интерактивтік жағы", "перцептивтік жағы", "вербалды қарым-қатынас", "вербалды емес қарым-қатынас"], "tip": "Үш жақты жай атамаңыз: бір әңгіменің мысалында әр жағы қалай көрінетінін көрсетіңіз.", "src": "Бабаев, 7-дәрісбаян (қатынастар түрлері), 8-дәрісбаян (тілдесу)", "link": null, "topic": 5}, "05-H1": {"id": "05-H1", "level": "hard", "q": "Жатақханаға жаңа келген Аружан алғашқы күні бөлмеге түнде кірді де, ешкімге сәлем бермей төсегіне жатып қалды. Бөлмелестері оны «тәкаппар» деп шешіп, бір ай бойы онымен араласпады. Кейін сол күні оның атасы қайтыс болғаны белгілі болды. Бөлмелестердің қатесін тұлғааралық қабылдаудың заңдылықтарымен түсіндіріңіз. Мұндай қателікті болдырмау үшін не істеу керек?", "plan": ["Жағдайда бөлмелестер Аружанның бейнесін бір ғана кешке қарап құрды. Аз ғана белгіден адамның тұтас «мінезі» құрастырылды, ал белсенді адамның бір жағдайдағы қылығы оның тұрақты мінезін көрсете бермейді. Бұл — қарым-қатынастың перцептивтік жағында, яғни адамдардың бірін-бірі қабылдауында кеткен қате.", "<b>Алғашқылық әсері<\/b> (Бабаевта — <i>алғашқы әсерлену<\/i>): адамды алғаш көргенде және ол туралы тез шешім керек болғанда, бірінші алынған ақпарат бейнеге ең күшті әсер етеді. Бөлмелестердің «тәкаппар» деген бағасы осы алғашқы кештен шықты.", "<b>Гало әсері<\/b> (Бабаевта — <i>асыра сілтей әсерлену<\/i>): бейне қалыптасып болған соң «сүзгіге» айналады, адам сол бейнеге сай нәрсені ғана көреді. Сондықтан бөлмелестер бір ай бойы Аружанның басқа қылықтарын да «тәкаппарлық» деп түсінді.", "Бұған <b>тұлғаның имплициттік теориясы<\/b> да қосылуы мүмкін. Бұл — сыртқы белгі мен мінезді байланыстыратын, өмір бойы жиналған түсінік, мысалы, «сәлемдеспеген адам — менмен». Ол қате болса, қабылдауды бұрмалайды.", "Бөлмелестер <b>асығыс қорытынды<\/b> жасады: толық ақпарат жиналмай тұрып пікір түйді. Оған <b>ситуативтік қате<\/b> қосылды: олар Аружанның сол кештегі ерекше жағдайын ескермеді. Ал баға уақыт өте өзгермей, «қатып қалды».", "Кеңес: адамды бір сәттік жағдайда емес, әртүрлі жағдайда біраз уақыт бақылап барып бағалау, оның не айтатынына және қалай айтатынына назар аудару. Өз пікіріңізді басқалардың пікірімен салыстыру. Түсініксіз қылықтың себебін адамның өзінен ашық сұрау."], "terms": ["алғашқылық әсері", "гало әсері", "тұлғаның имплициттік теориясы", "асығыс қорытынды", "ситуативтік қате", "тұлғааралық қабылдау"], "tip": "Тек «бөлмелестер қате ойлады» деп қоймаңыз: механизмді атап (алғашқылық, гало), оны жағдаяттағы нақты әрекетпен байланыстырыңыз.", "src": "Түйсік және қабылдау сайты, 20-тарау; Бабаев, 7-дәрісбаян", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s20", "label": "Түйсік және қабылдау · 20-тарау «Адамның адамды қабылдауы»"}, "topic": 5}, "05-H2": {"id": "05-H2", "level": "hard", "q": "Тоғызыншы сынып оқушысы Данияр бала кезінен үйде «сенен ештеңе шықпайды» дегенді жиі естіп өскен. Математикадан жақсы оқыса да, мұғалімі олимпиадаға шақырғанда «мен қабілетсізбін» деп бас тартты. Бұл жағдайды тұлға құрылымының қай бөлігімен түсіндіресіз? Мұғалім мен ата-анаға қандай кеңес бересіз?", "plan": ["Жағдайда Даниярдың өзі туралы түсінігі мен оның нақты мүмкіндігі сәйкес келмей тұр. Бұл — негативті <b>Мен-тұжырымдама<\/b> мен төмен <b>өзін-өзі бағалаудың<\/b> көрінісі.", "<b>Мен-тұжырымдама<\/b> — адамның өзі туралы барлық түсінігі және оларға берген бағасы. Оның үш құрамдасы бар: когнитивтік (өзі туралы білімі), эмоциялық (өзіне қатынасы), мінез-құлықтық (өзіне қатысты әрекеті). Ол позитивті немесе негативті болады.", "<b>Өзін-өзі бағалау<\/b> — Мен-тұжырымдаманың бағалау жағы. Ол адамның қазір кім екенін (нақты Мен) және кім болғысы келетінін (идеалды Мен) салыстырудан туады, оған айналасындағылардың берген бағасы да сіңеді. Данияр ата-анасының сөзін өзі туралы «шындық» деп қабылдаған.", "Талдау: Данияр «қабілетсізбін» деп ойлайды (когнитивтік жағы), өзін төмен бағалайды (эмоциялық жағы), сынақтан қашады (мінез-құлықтық жағы). Роджерс бойынша адам өз әрекетін де, өзгелердің бағасын да Мен-тұжырымдамасы арқылы қабылдайды, сондықтан нақты табыстары «қабілетсізбін» деген пікірін өздігінен өзгертпейді. Бірақ Мен-тұжырымдама тұтас: бір жағы өзгерсе (мысалы, шағын табыстан кейін әрекеті), қалғандары да біртіндеп өзгереді.", "Кеңес: ата-анаға — баланы кемсітпеу, оның нақты еңбегі мен жетістігін атап мақтау. Мұғалімге — Даниярға қиындығы біртіндеп өсетін тапсырмалар беріп, табысын өзіне көрсету; олимпиадаға дайындықты шағын қадамдардан бастау.", "Қорытынды: адам қалыпты өмір сүріп, тұлға ретінде дамуы үшін оған позитивті Мен-тұжырымдама керек. Ол адамның айналасындағылармен өзара әрекетінде қалыптасады, сондықтан оны өзгерту де қарым-қатынастан басталады."], "terms": ["Мен-тұжырымдама", "өзін-өзі бағалау", "нақты Мен және идеалды Мен", "негативті Мен-тұжырымдама"], "tip": "Мен-тұжырымдаманың үш құрамдасын жағдаяттағы нақты көріністермен байланыстырыңыз: жауаптың ең құнды бөлігі — осы.", "src": "Тұлға сайты, «Тұлға құрылымы» бөлімі (Немов, 107–109 б.)", "link": {"url": "https://tazhiyeva.github.io/tulga-psikhologiyasy/#qurylym", "label": "Тұлға · «Тұлға құрылымы» бөлімі (Мен-тұжырымдама)"}, "topic": 5}, "06-E1": {"id": "06-E1", "level": "easy", "q": "Түйсік деген не? Түйсіктердің негізгі түрлерін атап, сипаттаңыз.", "plan": ["<b>Түйсік<\/b> — сезім мүшелерімізге дәл қазір әсер етіп тұрған заттың немесе құбылыстың жеке қасиетін санада бейнелейтін психикалық процесс. Мысалы, шәйнектің ыстығы, дыбыстың қаттылығы, раушанның иісі.", "Ең белгілі жіктеуді Ч. Шеррингтон ұсынған. Оның белгісі — сигнал қайдан келеді және рецептор қайда орналасқан. Бұл жіктеу бойынша түйсіктің үш тобы бар.", "<b>Экстероцептивті<\/b> түйсіктер сыртқы дүниеден хабар береді. Олар <b>дистантты<\/b> (көру, есту, иіс сезу) және <b>контактілі<\/b> (дәм, температура, жанасу, сипап сезу) болып бөлінеді. Маклаков иіс сезуді осы екі топтың аралығына қояды.", "<b>Интероцептивті<\/b> түйсіктер ішкі мүшелердің күйі туралы хабар береді: аштық, шөлдеу, жүректің қысылуы. Бұл — ең көне, ең аз ұғынылатын әрі бұлыңғыр түйсіктер.", "<b>Проприоцептивті<\/b> түйсіктер дененің кеңістіктегі қалпы мен қозғалысы туралы хабар береді. Олардың рецепторлары бұлшықеттер мен буындарда орналасқан.", "Түйсіктерді басқа белгілер бойынша да бөледі: сезім мүшелері бойынша (көру, есту, сипап сезу, иіс, дәм т.б.) және шығу тегі бойынша (протопатиялық және эпикритикалық)."], "terms": ["түйсік", "экстероцептивті түйсіктер", "интероцептивті түйсіктер", "проприоцептивті түйсіктер", "дистантты және контактілі түйсіктер"], "tip": "Түйсікті қабылдаумен шатастырмаңыз: түйсік заттың бір ғана қасиетін бейнелейді, затты тұтас бейнелемейді.", "src": "Түйсік және қабылдау сайты, 2- және 4-тараулар", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s04", "label": "Түйсік және қабылдау · 4-тарау «Түйсік түрлері (жіктелуі)»"}, "topic": 6}, "06-E2": {"id": "06-E2", "level": "easy", "q": "Қабылдау деген не? Қабылдаудың негізгі қасиеттерін сипаттаңыз.", "plan": ["<b>Қабылдау<\/b> — сезім мүшелеріне тікелей әсер ететін заттар мен құбылыстардың санада тұтас бейнеленуі. Түйсікте зат жеке қасиеттері арқылы, ал қабылдауда тұтас күйінде бейнеленеді.", "<b>Заттылық<\/b> — бейненің нақты бір сыртқы затқа қатысты болуы. <b>Тұтастық<\/b> — заттың бір бөлігі ғана көрініп тұрса да, оны тұтас қабылдау.", "<b>Құрылымдылық<\/b> — бейненің бөліктері белгілі бір тәртіппен байланысады: біз жеке ноталарды емес, әуенді естиміз. <b>Константтылық<\/b> — қабылдау жағдайлары өзгерсе де, заттың шамасын, пішінін, түсін тұрақты қабылдау. Алыстағы жүк көлігін біз бәрібір үлкен деп қабылдаймыз.", "<b>Мағыналылық<\/b> — заттың не екенін ұғыну, оған атау беру. <b>Категориялылық<\/b> — затты белгілі бір топқа жатқызу.", "<b>Апперцепция<\/b> — қабылдаудың адамның бұрынғы тәжірибесіне тәуелділігі. <b>Белсенділік (таңдамалылық)<\/b> — көп заттың ішінен біреуін бөліп қабылдау: алаңдағы жүздеген адамның ішінен досымызды ғана көреміз."], "terms": ["қабылдау", "заттылық", "тұтастық", "константтылық", "апперцепция", "мағыналылық"], "tip": "Әр қасиетке бір қысқа мысал келтіріңіз: мысалсыз тізім жаттанды жауап сияқты естіледі.", "src": "Түйсік және қабылдау сайты, 13- және 14-тараулар", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s14", "label": "Түйсік және қабылдау · 14-тарау «Қабылдаудың қасиеттері»"}, "topic": 6}, "06-M1": {"id": "06-M1", "level": "medium", "q": "Түйсіктің физиологиялық негізін түсіндіріңіз. Қабылдаудың физиологиялық тетігі түйсіктікінен немен ерекшеленеді?", "plan": ["Түйсіктің физиологиялық негізі — <b>анализатор<\/b>; бұл ұғымды И.П. Павлов енгізген. Анализатордың үш бөлігі бар: <b>рецептор<\/b> (шеткі бөлім), <b>өткізгіш жүйке жолдары<\/b> және ми қыртысындағы <b>орталық бөлім<\/b>.", "Рецептор тітіркендіргіштің энергиясын жүйке импульсіне айналдырады. Қозу афференттік жолдармен ми қыртысының тиісті аймағына жетеді, түйсік сол жерде пайда болады. Бір бөлігі бұзылса, түйсік болмайды: көзі сау адам ми қыртысының көру аймағы зақымданса, соқыр болып қалады.", "Анализатор — енжар «сым» емес: эфференттік жолдар мен бұлшықеттер сезім мүшесін тітіркендіргішке бейімдейді. Павлов анализаторды ашық рефлекторлық доға ретінде сипаттаған, ал Н.А. Бернштейн кері байланысты қосып, оны тұйық <b>рефлекторлық сақина<\/b> ретінде көрсетті. Сондықтан түйсіктің сипаты белсенді, рефлекторлық.", "Қабылдау бір анализатордың жұмысымен шектелмейді. Оның негізі — мидың <b>талдау-жинақтау<\/b> әрекеті: талдау нысанды ортадан бөліп алады, жинақтау оның қасиеттерін тұтас бейнеге біріктіреді.", "Қабылдау уақытша жүйке байланыстарына сүйенеді: <b>анализаторішілік байланыстар<\/b> бір анализатордың ішінде (мысалы, әуенді қабылдағанда), <b>анализаторааралық байланыстар<\/b> әртүрлі анализаторлардың арасында түзіледі. Соңғыларының арқасында біз арнайы анализаторы жоқ қасиеттерді де қабылдаймыз: заттың шамасын, меншікті салмағын.", "Ми қыртысының проекциялық аймағы бұзылса, адам «көрмейді», ал интегративтік аймағы бұзылса, «көреді, бірақ танымайды». Соңғысын <b>агнозия<\/b> дейді. Демек түйсік пен қабылдаудың ми тетіктері әртүрлі."], "terms": ["анализатор", "рецептор", "рефлекторлық сақина", "анализаторааралық байланыстар", "агнозия"], "tip": "Анализатордың үш бөлігін атап, бір бөлігі бұзылса не болатынын мысалмен көрсетіңіз.", "src": "Түйсік және қабылдау сайты, 3- және 13-тараулар", "link": {"url": "https://tazhiyeva.github.io/tuisik-qabyldau/#s03", "label": "Түйсік және қабылдау · 3-тарау «Анализатор — түйсіктің физиологиялық негізі»"}, "topic": 6}, "06-M2": {"id": "06-M2", "level": "medium", "q": "Сезгіштік пен түйсік табалдырықтарының арақатынасын түсіндіріңіз. Сезгіштік қандай жағдайларда өзгереді?", "plan": ["<b>Сезгіштік<\/b> — адамның түйсіне алу және сол арқылы ортаның қасиеттері туралы ақпарат алу қабілеті. Оны тікелей өлшеу мүмкін емес, сондықтан табалдырықтар арқылы өлшейді.", "<b>Абсолютті төменгі табалдырық<\/b> — түйсік тудыратын тітіркендіргіштің ең кіші шамасы. <b>Абсолютті жоғарғы табалдырық<\/b> — түйсік өз сапасын әлі сақтайтын ең үлкен шамасы; одан асса, ауыру сезіледі. <b>Айырым табалдырығы<\/b> — екі тітіркендіргіштің біз сезе алатын ең кіші айырмасы.", "Табалдырық пен сезгіштік кері байланысты: табалдырық неғұрлым төмен болса, сезгіштік соғұрлым жоғары. <b>Бугер–Вебер заңы<\/b> бойынша айырым табалдырығы — бастапқы тітіркендіргіштің тұрақты бөлігі, яғни тітіркендіргішпен бірге пропорционал өседі: 100 люкс жарыққа 1 люкс қосу жетеді, ал 1000 люкске кемінде 10 люкс қосу керек.", "<b>Сенсорлық бейімделу<\/b> — тітіркендіргіштің ұзақ әсерінен сезгіштіктің өзгеруі. Күшті тітіркендіргіш сезгіштікті төмендетеді, әлсіз тітіркендіргіш арттырады. Қараңғыда көздің сезгіштігі жарты сағатта 200 000 есе артады.", "<b>Түйсіктердің өзара әрекеттесуі<\/b>: бір анализатордың тітіркенуі екіншісінің сезгіштігін өзгертеді. Мұнда да әлсіз тітіркендіргіш сезгіштікті арттырады, күштісі төмендетеді. Бір түрдегі түйсіктердің өзара әрекеттесуі <b>контраст<\/b> деп аталады: сұр түс ақ фонда күңгірт, қара фонда ашық көрінеді.", "<b>Сенсибилизация<\/b> — анализаторлардың өзара әрекеттесуі немесе жаттығу нәтижесінде сезгіштіктің артуы. Тәжірибелі кілем тоқушы қызылдың басқалар байқамайтын реңктерін ажыратады, домбырашы ішектің сәл бұзылғанын бірден естиді."], "terms": ["сезгіштік", "абсолютті төменгі табалдырық", "айырым табалдырығы", "сенсорлық бейімделу", "сенсибилизация"], "tip": "Табалдырық пен сезгіштіктің кері байланысын міндетті түрде айтыңыз: табалдырық төмен болса, сезгіштік жоғары.", "src": "Түйсік және қабылдау са
